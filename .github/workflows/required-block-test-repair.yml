name: One-time Required Block Test Repair

on:
  push:
    branches:
      - fix/ci-quality-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: required-block-test-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair stale signature-title assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('crates/dokkomplekt-core/src/required_blocks.rs'): (
                  'assert!(unmet.iter().any(|t| t.contains("подписи")));',
                  'assert!(unmet\n            .iter()\n            .any(|t| t.contains("Подпись лечащего врача")));',
              ),
              Path('crates/dokkomplekt-core/src/created_documents.rs'): (
                  'assert!(missing.iter().any(|m| m.contains("подписи")));',
                  'assert!(missing\n                    .iter()\n                    .any(|m| m.contains("Подпись лечащего врача")));',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one stale assertion, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit repaired tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/required_blocks.rs crates/dokkomplekt-core/src/created_documents.rs
          git commit -m "test: align required signature block assertions"
          git push origin HEAD:fix/ci-quality-gate
