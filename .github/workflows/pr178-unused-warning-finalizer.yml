name: PR178 unused warning finalizer
on:
  push:
    branches:
      - ops/pr178-unused-warning-fix-20260908-v2
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fix warning and validate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a645fae867f55a16fda43f0510c852a44b83d827'
          python - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/subsystems/profile_sources.rs')
          s=p.read_text(encoding='utf-8')
          old='Err(error) if medical_diary_template_is_usable(path) => {'
          new='Err(_) if medical_diary_template_is_usable(path) => {'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          python -m pytest -q tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py tests/test_learning_privacy_retention_contract.py
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q tests/test_source_manifest_integrity.py tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py tests/test_learning_privacy_retention_contract.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/profile_sources.rs
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'Fix diary publication warning'
          git push origin HEAD:fix/real-user-workflow-20260907
