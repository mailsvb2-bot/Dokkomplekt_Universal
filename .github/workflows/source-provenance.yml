name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply one-time E2 installed-input hardening
        if: github.event_name == 'pull_request' && github.head_ref == 'canon-v2/e2-template-learning-proof'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/installer/windows_installer_contract.ps1')
          text = path.read_text(encoding='utf-8-sig')

          analyze_start = "try {\n  Invoke-UiActionWithObservedTransition `\n    -Description 'Проверить пары и предложить карту' `"
          analyze_end = "\n\n$currentAppWindow = Find-LiveAppWindow"
          start = text.find(analyze_start)
          if start < 0:
              raise SystemExit('analyze block start not found exactly once')
          end = text.find(analyze_end, start)
          if end < 0:
              raise SystemExit('analyze block end not found')
          if text.find(analyze_start, start + 1) >= 0:
              raise SystemExit('duplicate analyze block marker')
          analyze_replacement = r'''try {
  # Hosted WebView2 can report a successful InvokePattern/mouse action without
  # dispatching the DOM click. Exercise the actual focused button with a real
  # foreground Enter key exactly once, then require the product transition.
  $e2AnalyzeAction = Wait-UiElement -Description 'Проверить пары и предложить карту button' -TimeoutSeconds 30 -Probe {
    $currentAppWindow = Find-LiveAppWindow
    if ($null -eq $currentAppWindow) { return $null }
    Find-ReadyButtonByNames -Root $currentAppWindow -Names @('Проверить пары и предложить карту')
  }
  $currentAppWindow = Find-LiveAppWindow
  if ($null -eq $currentAppWindow) { throw 'Installed application window disappeared before E2 analysis.' }
  Activate-LiveAppWindow -Window $currentAppWindow
  if ($e2AnalyzeAction.Current.IsOffscreen -and $e2AnalyzeAction.Current.IsScrollItemPatternAvailable) {
    $scroll = $e2AnalyzeAction.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern)
    $scroll.ScrollIntoView()
    Start-Sleep -Milliseconds 100
  }
  $e2AnalyzeAction.SetFocus()
  Start-Sleep -Milliseconds 100
  [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
  Wait-UiElement -Description 'publishable held-out learning result after real keyboard action' -TimeoutSeconds 60 -Probe {
    $currentAppWindow = Find-LiveAppWindow
    if ($null -eq $currentAppWindow) { return $null }
    Find-ButtonByNames -Root $currentAppWindow -Names @('Подтвердить проверенную карту и создать копию')
  } | Out-Null
} catch {
  $learningFailure = $_
  $currentAppWindow = Find-LiveAppWindow
  if ($null -ne $currentAppWindow) {
    Write-E2LearningUiDiagnostic -Root $currentAppWindow
  }
  throw $learningFailure
}'''
          text = text[:start] + analyze_replacement + text[end:]

          create_start = "  Invoke-UiActionFromProbe -Description 'E2 Создать документы' -ActionProbe {"
          create_end = "  $e2Archive = [System.IO.Compression.ZipFile]::OpenRead($e2Created.FullName)"
          start = text.find(create_start)
          if start < 0:
              raise SystemExit('E2 create block start not found exactly once')
          end = text.find(create_end, start)
          if end < 0:
              raise SystemExit('E2 create block end not found')
          if text.find(create_start, start + 1) >= 0:
              raise SystemExit('duplicate E2 create block marker')
          create_replacement = r'''  # Use one real foreground keyboard action for the final E2 publication too.
  # UIA InvokePattern alone is not evidence that WebView2 dispatched the click.
  $e2CreateAction = Wait-UiElement -Description 'E2 Создать документы button' -TimeoutSeconds 30 -Probe {
    $currentAppWindow = Find-LiveAppWindow
    if ($null -eq $currentAppWindow) { return $null }
    Find-ReadyButtonByNames -Root $currentAppWindow -Names @('Создать документы')
  }
  $currentAppWindow = Find-LiveAppWindow
  if ($null -eq $currentAppWindow) { throw 'Installed application window disappeared before E2 document generation.' }
  Activate-LiveAppWindow -Window $currentAppWindow
  if ($e2CreateAction.Current.IsOffscreen -and $e2CreateAction.Current.IsScrollItemPatternAvailable) {
    $scroll = $e2CreateAction.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern)
    $scroll.ScrollIntoView()
    Start-Sleep -Milliseconds 100
  }
  $e2CreateAction.SetFocus()
  Start-Sleep -Milliseconds 100
  [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')

  $e2ExpectedFile = "$e2ButtonLabel.docx"
  $e2Deadline = [DateTime]::UtcNow.AddSeconds(60)
  $e2Created = $null
  $e2GenerationFailure = $null
  do {
    $e2Created = Get-ChildItem -LiteralPath $defaultOutputRoot -Recurse -File -Filter $e2ExpectedFile -ErrorAction SilentlyContinue |
      Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
    if ($null -ne $e2Created) { break }

    $currentAppWindow = Find-LiveAppWindow
    if ($null -eq $currentAppWindow) { throw 'Installed application window disappeared during E2 generation.' }
    try {
      $allNodes = $currentAppWindow.FindAll(
        [System.Windows.Automation.TreeScope]::Descendants,
        [System.Windows.Automation.Condition]::TrueCondition
      )
      foreach ($node in $allNodes) {
        try {
          $name = [string]$node.Current.Name
          if (-not [string]::IsNullOrWhiteSpace($name) -and $name.StartsWith('Документы не созданы')) {
            $e2GenerationFailure = $name
            break
          }
        } catch {}
      }
    } catch {
      if (-not (Test-UiaTransientTimeout -ErrorRecord $_)) { throw }
    }
    if ($null -ne $e2GenerationFailure) { break }
    Start-Sleep -Milliseconds 250
  } while ([DateTime]::UtcNow -lt $e2Deadline)

  if ($null -ne $e2GenerationFailure) {
    $currentAppWindow = Find-LiveAppWindow
    if ($null -ne $currentAppWindow) { Write-E2LearningUiDiagnostic -Root $currentAppWindow }
    throw "E2 offline installed generation was rejected by the product: $e2GenerationFailure"
  }
  if ($null -eq $e2Created) {
    $currentAppWindow = Find-LiveAppWindow
    if ($null -ne $currentAppWindow) { Write-E2LearningUiDiagnostic -Root $currentAppWindow }
    throw 'E2 real keyboard generation action produced neither a physical DOCX nor a visible product error.'
  }
'''
          text = text[:start] + create_replacement + text[end:]
          path.write_text(text, encoding='utf-8-sig', newline='\n')
          PY

          # Restore both workflows to the exact last clean candidate bytes. The
          # temporary diagnostic/bootstrap plumbing must not survive in the tree.
          git checkout 94f71497fce4165fdfa75357dd339cdd2300b4c4 -- \
            .github/workflows/source-provenance.yml \
            .github/workflows/unsigned-preview.yml

          mkdir -p verification/ci
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report-before.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.after.txt \
            --json-report verification/ci/source-manifest-report-after.json
          git diff --check HEAD

          mapfile -t final_delta < <(git diff --name-only 94f71497fce4165fdfa75357dd339cdd2300b4c4 | sort)
          printf 'Final clean-tree delta from prior exact candidate: %s\n' "${final_delta[*]}"
          test "${#final_delta[@]}" -eq 2
          test "${final_delta[0]}" = 'SOURCE_MANIFEST_SHA256.txt'
          test "${final_delta[1]}" = 'tests/installer/windows_installer_contract.ps1'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/source-provenance.yml .github/workflows/unsigned-preview.yml \
            tests/installer/windows_installer_contract.ps1 SOURCE_MANIFEST_SHA256.txt
          git commit -m 'test: use real keyboard input for critical E2 actions'
          git push origin HEAD:canon-v2/e2-template-learning-proof
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat verification/ci/source-manifest-report.json
          echo "SOURCE_MANIFEST_SHA256.txt is stale." >&2
          exit 1
