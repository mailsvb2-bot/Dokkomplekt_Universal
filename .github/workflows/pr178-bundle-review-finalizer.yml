name: PR178 bundle review finalizer
on:
  push:
    branches:
      - ops/pr178-bundle-review-fix-20260908
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply bundle review fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8403d023209b5c8e4437c568447a133a9c874b38'
          python - <<'PY'
          from pathlib import Path

          p = Path('src-tauri/src/subsystems/source_intake_commands.rs')
          s = p.read_text(encoding='utf-8')
          old = 'const SPECIALIST_KIT_RULES_STATE_KEY: &str = "specialist_kit_rules.v1";\n'
          new = old + 'static SPECIALIST_KIT_RULES_LOCK: std::sync::OnceLock<std::sync::Mutex<()>> = std::sync::OnceLock::new();\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''fn load_specialist_kit_decision(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n) -> Result<Option<KitLearningDecision>, String> {\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          new = '''fn load_specialist_kit_decision(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n) -> Result<Option<KitLearningDecision>, String> {\n    let _rules_guard = SPECIALIST_KIT_RULES_LOCK\n        .get_or_init(|| std::sync::Mutex::new(()))\n        .lock()\n        .map_err(|_| "Блокировка подтверждённых комплектов повреждена.".to_string())?;\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''fn persist_specialist_kit_rule(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n    confirmed_document_ids: &[String],\n) -> Result<(), String> {\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          new = '''fn persist_specialist_kit_rule(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n    confirmed_document_ids: &[String],\n) -> Result<(), String> {\n    let _rules_guard = SPECIALIST_KIT_RULES_LOCK\n        .get_or_init(|| std::sync::Mutex::new(()))\n        .lock()\n        .map_err(|_| "Блокировка подтверждённых комплектов повреждена.".to_string())?;\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = ') -> Result<(DocumentRoutingRecommendation, BundleDecision), String> {'
          new = ') -> Result<(DocumentRoutingRecommendation, BundleDecision, Option<KitRuleKey>), String> {'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '    Ok((routing, decision))\n'
          new = '    Ok((routing, decision, key))\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src-tauri/src/subsystems/automation_runtime.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    let (routing_recommendation, bundle_decision) = resolve_document_bundle_for_case(\n'''
          new = '''    let (routing_recommendation, bundle_decision, bundle_rule_key) = resolve_document_bundle_for_case(\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''            "cluster_id": &routing_recommendation.cluster_id,\n            "domain": &routing_recommendation.domain,\n            "confidence": bundle_decision.confidence,\n'''
          new = '''            "cluster_id": &routing_recommendation.cluster_id,\n            "domain": &routing_recommendation.domain,\n            "rule_key": &bundle_rule_key,\n            "confidence": bundle_decision.confidence,\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          start = s.index('    let cluster_id = details\n        .get("cluster_id")', s.index('fn confirm_bundle_exception_and_retry'))
          end_marker = '        persist_specialist_kit_rule(&app, &key, &pack, &selected)?;\n    }\n'
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '''    let rule_key = details\n        .get("rule_key")\n        .filter(|value| !value.is_null())\n        .cloned()\n        .map(serde_json::from_value::<KitRuleKey>)\n        .transpose()\n        .map_err(|error| format!("Ключ подтверждённого комплекта повреждён: {error}"))?;\n    if let Some(key) = rule_key.as_ref() {\n        // Persist exactly the effective key used by the original decision. Never\n        // recompute the learning domain while resolving an exception.\n        persist_specialist_kit_rule(&app, key, &pack, &selected)?;\n    }\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_learning_privacy_retention_contract.py')
          s = p.read_text(encoding='utf-8')
          addition = '''\n\ndef test_specialist_bundle_memory_uses_one_effective_key_and_serialized_updates() -> None:\n    intake = read("src-tauri/src/subsystems/source_intake_commands.rs")\n    runtime = read("src-tauri/src/subsystems/automation_runtime.rs")\n    assert "static SPECIALIST_KIT_RULES_LOCK" in intake\n    assert intake.count("SPECIALIST_KIT_RULES_LOCK") >= 3\n    assert "Ok((routing, decision, key))" in intake\n    assert "BundleDecision, Option<KitRuleKey>" in intake\n    assert '"rule_key": &bundle_rule_key' in runtime\n    confirm = runtime[runtime.index("fn confirm_bundle_exception_and_retry"):]
    assert '.get("rule_key")' in confirm\n    assert "serde_json::from_value::<KitRuleKey>" in confirm\n    assert "persist_specialist_kit_rule(&app, key, &pack, &selected)?;" in confirm\n'''
          assert 'def test_specialist_bundle_memory_uses_one_effective_key_and_serialized_updates' not in s
          p.write_text(s + addition, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          python -m pytest -q tests/test_learning_privacy_retention_contract.py tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q tests/test_source_manifest_integrity.py tests/test_learning_privacy_retention_contract.py tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py
          python scripts/static_quality_gate.py --source-only
          bash scripts/prepackage_rust_gate.sh
          git diff --check
          test "$(wc -l < src-tauri/src/subsystems/automation_runtime.rs)" -lt 3000
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/source_intake_commands.rs src-tauri/src/subsystems/automation_runtime.rs tests/test_learning_privacy_retention_contract.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Make confirmed bundle memory race-safe'
          git push origin HEAD:fix/real-user-workflow-20260907
