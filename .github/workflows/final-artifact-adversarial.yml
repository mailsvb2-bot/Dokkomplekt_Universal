name: Final Windows Artifact Adversarial

on:
  workflow_dispatch:
  push:
    branches: ['agent/final-adversarial-windows-hardening']

permissions:
  contents: read
  actions: read

jobs:
  smash-exact-main-artifact:
    name: Smash exact main Windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Download exact installer previously delivered to user
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Dokkomplekt-Windows-UNSIGNED-PREVIEW-1640
          path: exact-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mailsvb2-bot/Dokkomplekt_Universal
          run-id: 32995084982
      - name: Prove byte identity and stage exact installer
        shell: pwsh
        run: |
          $expected = '12fef49c27712878e76882a136b2504cbad82de53c8406d3c48cd367818edcd7'
          $installer = Get-ChildItem exact-artifact -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Exact main installer artifact is missing.' }
          $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Exact artifact hash mismatch: expected $expected, got $actual" }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected NotSigned preview, got $($signature.Status)" }
          New-Item -ItemType Directory -Force 'target/release/bundle/nsis' | Out-Null
          Copy-Item $installer.FullName 'target/release/bundle/nsis/Dokkomplekt Universal_18.4.3_x64-setup.exe' -Force
          Write-Host "EXACT USER ARTIFACT CONFIRMED: $actual"
      - name: Smash installed exact artifact
        shell: pwsh
        env:
          DOKKOMPLEKT_REQUIRE_AUTHENTICODE: '0'
          DOKKOMPLEKT_ADVERSARIAL: '1'
        run: tests/installer/windows_installer_contract.ps1 -TauriConfig src-tauri/tauri.thin.conf.json -ExpectedWebViewMode downloadBootstrapper
