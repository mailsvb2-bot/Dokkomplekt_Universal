fn validate_minute_interval(minutes: u32) -> Result<(), SeriesPlanError> {
    if minutes == 0 || minutes > 24 * 60 {
        return Err(SeriesPlanError::InvalidCadence(
            "интервал должен быть от 1 до 1440 минут".into(),
        ));
    }
    Ok(())
}

fn validate_time_window(start: NaiveTime, end: NaiveTime) -> Result<(), SeriesPlanError> {
    if end < start {
        return Err(SeriesPlanError::InvalidCadence(
            "время окончания дня раньше времени начала".into(),
        ));
    }
    Ok(())
}

fn push_minute_entries(
    entries: &mut Vec<SeriesEntryPlan>,
    origin: NaiveDate,
    date: NaiveDate,
    start_time: NaiveTime,
    end_time: NaiveTime,
    minutes: u32,
) -> Result<(), SeriesPlanError> {
    let mut current_time = start_time;
    while current_time <= end_time {
        push_entry(entries, origin, date, Some(current_time))?;
        let next = NaiveDateTime::new(date, current_time) + Duration::minutes(i64::from(minutes));
        if next.date() != date {
            break;
        }
        current_time = next.time();
    }
    Ok(())
}

