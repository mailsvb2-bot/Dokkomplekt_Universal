name: Bootstrap Seven Critical Fixes

on:
  push:
    branches:
      - agent/fundamental-seven-critical-fixes-temp5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Rebuild clean critical-fix commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/bootstrap/patch.part* > /tmp/seven-clean.patch.gz.b64
          base64 -d /tmp/seven-clean.patch.gz.b64 | gzip -d > /tmp/seven-clean.patch
          git reset --hard 3c151864084d48d15b1d192abdd6d890ecaf2a9c
          git clean -fdx
          git apply --index /tmp/seven-clean.patch
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_p0_trust_boundaries.py tests/test_release_environment_preflight.py
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name mailsvb2-bot
          git config user.email 254540704+mailsvb2-bot@users.noreply.github.com
          git add -A
          git commit -m "Fundamentally close seven critical trust-boundary defects"
          git push --force origin HEAD:refs/heads/agent/fundamental-seven-critical-fixes
      - name: Remove bootstrap branches
        if: success()
        shell: bash
        run: |
          git push origin --delete \
            agent/fundamental-seven-critical-fixes-temp \
            agent/fundamental-seven-critical-fixes-temp2 \
            agent/fundamental-seven-critical-fixes-temp3 \
            agent/fundamental-seven-critical-fixes-temp4 \
            agent/fundamental-seven-critical-fixes-temp5 || true
