name: Inspect Native Picker Archive

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: read
  issues: write

jobs:
  inspect-archive:
    if: ${{ github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SERVICE_ISSUE: '48'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-native-template-picker
          fetch-depth: 1
      - name: Inspect staged archive encodings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, tarfile, urllib.request, zipfile
          from pathlib import Path

          chunk_paths = sorted(Path('.github/native-picker-archive').glob('chunk-*'))
          encoded_chunks = [''.join(path.read_text(encoding='ascii').split()) for path in chunk_paths]
          candidates = {}
          joined = ''.join(encoded_chunks)
          try:
              candidates['joined-base64'] = base64.b64decode(joined + '=' * (-len(joined) % 4), validate=True)
          except Exception as error:
              candidates['joined-base64-error'] = repr(error).encode()
          try:
              candidates['per-chunk-base64'] = b''.join(
                  base64.b64decode(chunk + '=' * (-len(chunk) % 4), validate=True)
                  for chunk in encoded_chunks
              )
          except Exception as error:
              candidates['per-chunk-base64-error'] = repr(error).encode()

          report = [f'Native picker archive diagnostic run {os.environ["RUN_ID"]}.', f'chunks={len(chunk_paths)}']
          for name, payload in candidates.items():
              report.append(f'\n{name}: bytes={len(payload)} sha256={hashlib.sha256(payload).hexdigest()} magic={payload[:16].hex()}')
              if name.endswith('-error'):
                  report.append(payload.decode(errors='replace'))
                  continue
              listed = False
              try:
                  with tarfile.open(fileobj=io.BytesIO(payload), mode='r:*') as archive:
                      members = archive.getnames()
                  report.append('tar members:\n' + '\n'.join(members[:120]))
                  listed = True
              except Exception as error:
                  report.append(f'tar error: {error!r}')
              if not listed:
                  try:
                      with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                          members = archive.namelist()
                      report.append('zip members:\n' + '\n'.join(members[:120]))
                  except Exception as error:
                      report.append(f'zip error: {error!r}')

          body = '```text\n' + '\n'.join(report)[:60000] + '\n```'
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
