[package]
name = "dokkomplekt-tauri"
version = "18.4.3"
description = "Dokkomplekt Universal desktop shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
dokkomplekt-core = { path = "../crates/dokkomplekt-core" }
dokkomplekt-docx = { path = "../crates/dokkomplekt-docx" }
dokkomplekt-refdata = { path = "../crates/dokkomplekt-refdata" }
dokkomplekt-storage = { path = "../crates/dokkomplekt-storage" }
dokkomplekt-license-core = { path = "../crates/dokkomplekt-license-core" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
notify.workspace = true
getrandom.workspace = true
sha2.workspace = true
semver.workspace = true
hex.workspace = true
reqwest.workspace = true
rustls.workspace = true
ed25519-dalek.workspace = true
zip = "2"
# Constrain zip's transitive codec to the Rust 1.85-compatible release.
deflate64.workspace = true
quick-xml = "0.41.0"
msg_parser = "=0.3.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
