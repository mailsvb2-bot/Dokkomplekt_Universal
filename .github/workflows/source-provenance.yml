name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replace-obsolete-macro-contract:
    name: Replace obsolete macro preservation contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2
          restore-keys: |
            rust-compile-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Replace contract, run all Rust tests and publish
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
          REPLACEMENT_B64: ""
        run: |
          set -euo pipefail
          mkdir -p verification/ci
          exec > >(tee verification/ci/macro-contract.log) 2>&1
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('crates/dokkomplekt-docx/src/lib.rs')
          text = path.read_text('utf-8')
          marker = '    #[test]\n    fn macro_binary_parts_are_preserved_byte_for_byte_when_rendering_docm() {'
          start = text.index(marker)
          end = text.index('    #[test]\n    fn license_watermark_is_written_into_the_resulting_docx()', start)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          if '&[("org.name", "Ромашка")]' not in replacement:
              raise RuntimeError('decoded macro rejection fixture is corrupt')
          path.write_text(text[:start] + replacement + text[end:], 'utf-8')
          PY
          cargo fmt --all
          cargo test --workspace --all-targets
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('build_source_archive', root / 'scripts' / 'build_source_archive.py')
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load build_source_archive')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          (root / module.SOURCE_MANIFEST).write_bytes(module.source_manifest_payload())
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dokkomplekt-docx/src/lib.rs SOURCE_MANIFEST_SHA256.txt
          git commit -m 'test(security): reject macro-bearing DOCM fixtures'
          git push origin "HEAD:${BRANCH}"
      - name: Upload macro-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-contract-diagnostics
          path: verification/ci/macro-contract.log
          if-no-files-found: warn
