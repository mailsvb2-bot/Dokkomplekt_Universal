name: Agent apply UI selection parity once

on:
  push:
    branches:
      - agent/legacy-user-parity
    paths:
      - '.github/workflows/agent-apply-ui-selection-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply verified UI selection patch, test, and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch origin "${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          git apply --check .agent-ui-selection.patch
          git apply .agent-ui-selection.patch
          npm ci
          npm run typecheck
          npx vitest run --config vitest.config.ts src/lib/appSupport.selection.test.ts src/App.test.tsx
          git rm .agent-ui-selection.patch
          git rm .github/workflows/agent-apply-ui-selection-once.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve safe default document selection"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          exit 1
