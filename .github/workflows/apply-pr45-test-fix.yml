name: Apply PR 45 test alignment

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-pr45-test-fix-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 45 && github.head_ref == 'agent/restore-proven-first-run-and-buttons'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Apply reviewed test patch and remove transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .github/pr45-test-fix.patch.gz.b64
          base64 --decode .github/pr45-test-fix.patch.gz.b64 | gzip -dc > /tmp/pr45-test-fix.patch
          test -s /tmp/pr45-test-fix.patch
          git apply --check /tmp/pr45-test-fix.patch
          git apply /tmp/pr45-test-fix.patch
          rm -f .github/pr45-test-fix.patch.gz.b64
          rm -f .github/workflows/apply-pr45-test-fix.yml
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          module_path = Path('scripts/build_source_archive.py')
          spec = importlib.util.spec_from_file_location('build_source_archive', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.write_source_manifest(module.source_files())
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align tests with restored first-run flow"
          git push origin "HEAD:${BRANCH}"
