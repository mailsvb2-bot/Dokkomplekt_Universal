name: Temporary Windows evidence finalizer

on:
  workflow_run:
    workflows: ["Quality Gate", "Source Provenance", "Delete Merged Working Branch"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.id == 31077885576 ||
      github.event.workflow_run.id == 31077885650 ||
      github.event.workflow_run.id == 31079849807
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/require-windows-gui-evidence-main
          fetch-depth: 0
      - name: Record trusted run start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/67/comments"
          body = {"body": f"Trusted Windows evidence finalizer started (Actions run {os.environ['RUN_ID']})."}
          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          urllib.request.urlopen(request).read()
          PY
      - name: Apply hardening and regenerate source manifest
        run: python .github/patches/finalize-windows-evidence.py
      - name: Run focused regression gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q \
            tests/test_windows_hardware_evidence_index.py \
            tests/test_v18_3_2_windows_regression_wall_contract.py \
            tests/test_windows_reboot_evidence_binding.py
          git diff --check
          python scripts/verify_source_manifest.py
      - name: Commit finalized PR tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          python - <<'PY'
          import subprocess
          expected = {
              '.github/patches/finalize-windows-evidence.py',
              '.github/patches/refresh-gui-manifest.trigger',
              '.github/workflows/refresh-gui-evidence-manifest.yml',
              'SOURCE_MANIFEST_SHA256.txt',
              'scripts/write_windows_hardware_evidence_index.ps1',
              'tests/test_windows_hardware_evidence_index.py',
              'tests/test_windows_reboot_evidence_binding.py',
              'tests/windows/verify_reboot_evidence.ps1',
              'tests/windows/windows_hardware_e2e.ps1',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected finalized paths: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}')
          PY
          git commit -m "Synchronize consolidated Windows evidence hardening"
          git push origin HEAD:agent/require-windows-gui-evidence-main
      - name: Remove temporary default-branch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" cleanup
          cd cleanup
          rm -f .github/workflows/temporary-refresh-gui-manifest.yml
          python scripts/verify_source_manifest.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temporary-refresh-gui-manifest.yml
          git commit -m "Remove temporary Windows evidence finalizer"
          git push origin HEAD:main
