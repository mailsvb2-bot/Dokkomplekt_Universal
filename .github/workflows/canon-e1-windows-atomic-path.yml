name: Canon E1 Windows atomic path hardening one-shot

on:
  push:
    branches:
      - canon-v2/e1-accounting-pipeline

permissions:
  contents: write

jobs:
  harden-windows-atomic-path:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact Windows atomic long-path patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/subsystems/process_blueprints.rs')
          text = path.read_text(encoding='utf-8')

          marker = '''pub(crate) fn commit_atomic_temp_file(temp: &Path, destination: &Path) -> Result<(), String> {\n'''
          helper = '''#[cfg(target_os = "windows")]
          fn windows_verbatim_wide_path(path: &Path) -> Result<Vec<u16>, String> {
              use std::os::windows::ffi::OsStrExt as _;

              let absolute = std::path::absolute(path).map_err(|error| {
                  format!("Не удалось получить абсолютный Windows-путь {}: {error}", path.display())
              })?;
              let raw = absolute.as_os_str().encode_wide().collect::<Vec<_>>();
              const VERBATIM_PREFIX: [u16; 4] = [92, 92, 63, 92];
              const DEVICE_PREFIX: [u16; 4] = [92, 92, 46, 92];
              const UNC_PREFIX: [u16; 2] = [92, 92];
              const VERBATIM_UNC_PREFIX: [u16; 8] = [92, 92, 63, 92, 85, 78, 67, 92];

              let mut wide = Vec::with_capacity(raw.len() + VERBATIM_UNC_PREFIX.len() + 1);
              if raw.starts_with(&VERBATIM_PREFIX) || raw.starts_with(&DEVICE_PREFIX) {
                  wide.extend_from_slice(&raw);
              } else if raw.starts_with(&UNC_PREFIX) {
                  wide.extend_from_slice(&VERBATIM_UNC_PREFIX);
                  wide.extend_from_slice(&raw[UNC_PREFIX.len()..]);
              } else {
                  wide.extend_from_slice(&VERBATIM_PREFIX);
                  wide.extend_from_slice(&raw);
              }
              wide.push(0);
              Ok(wide)
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one commit_atomic_temp_file marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          old_paths = '''        use std::os::windows::ffi::OsStrExt as _;
                  use windows_sys::Win32::Storage::FileSystem::{
                      MoveFileExW, MOVEFILE_REPLACE_EXISTING, MOVEFILE_WRITE_THROUGH,
                  };
                  let source = temp
                      .as_os_str()
                      .encode_wide()
                      .chain(std::iter::once(0))
                      .collect::<Vec<_>>();
                  let target = destination
                      .as_os_str()
                      .encode_wide()
                      .chain(std::iter::once(0))
                      .collect::<Vec<_>>();
          '''
          new_paths = '''        use windows_sys::Win32::Storage::FileSystem::{
                      MoveFileExW, MOVEFILE_REPLACE_EXISTING, MOVEFILE_WRITE_THROUGH,
                  };
                  let source = windows_verbatim_wide_path(temp)?;
                  let target = windows_verbatim_wide_path(destination)?;
          '''
          if text.count(old_paths) != 1:
              raise SystemExit(f'expected one raw MoveFileExW path block, found {text.count(old_paths)}')
          text = text.replace(old_paths, new_paths, 1)

          old_temp = '''    let temporary = parent.join(format!(
                  ".{}.{}.tmp",
                  destination
                      .file_name()
                      .and_then(|value| value.to_str())
                      .unwrap_or("dokkomplekt"),
                  Uuid::new_v4()
              ));
          '''
          new_temp = '''    // Keep the temporary basename opaque and short. Repeating the destination
              // basename here can push an otherwise valid Windows destination beyond MAX_PATH
              // before the atomic MoveFileExW boundary.
              let temporary = parent.join(format!(".dok-{}.tmp", Uuid::new_v4().simple()));
          '''
          if text.count(old_temp) != 1:
              raise SystemExit(f'expected one legacy long temp-name block, found {text.count(old_temp)}')
          text = text.replace(old_temp, new_temp, 1)

          test_module = '''

          #[cfg(all(test, target_os = "windows"))]
          mod atomic_write_windows_contract_tests {
              use super::*;
              use std::os::windows::ffi::OsStrExt as _;

              #[test]
              fn atomic_write_supports_windows_path_where_legacy_temp_name_exceeded_max_path() {
                  let temp_root = std::env::temp_dir();
                  let service_dir = "generation-completion-receipts";
                  let destination_name = format!("{}.json", "f".repeat(64));
                  let temp_root_len = temp_root.as_os_str().encode_wide().count();
                  let service_len = service_dir.encode_utf16().count();
                  let desired_parent_len = 185usize;
                  let fixed_parent_len = temp_root_len + 2 + service_len;
                  let component_len = desired_parent_len
                      .saturating_sub(fixed_parent_len)
                      .clamp(48, 180);
                  let uuid = Uuid::new_v4().simple().to_string();
                  let root_component = format!(
                      "{}{}",
                      "x".repeat(component_len.saturating_sub(uuid.len())),
                      uuid
                  );
                  let parent = temp_root.join(root_component).join(service_dir);
                  std::fs::create_dir_all(&parent).unwrap();
                  let destination = parent.join(&destination_name);
                  let legacy_temporary = parent.join(format!(
                      ".{}.{}.tmp",
                      destination_name,
                      Uuid::new_v4()
                  ));
                  let legacy_len = legacy_temporary.as_os_str().encode_wide().count();
                  assert!(
                      legacy_len > 260,
                      "fixture must reproduce the old MAX_PATH failure, got {legacy_len} UTF-16 units"
                  );

                  atomic_write_file(&destination, b"atomic-long-path-proof")
                      .expect("short opaque temp + verbatim MoveFileExW paths must publish");
                  assert_eq!(
                      std::fs::read(&destination).unwrap(),
                      b"atomic-long-path-proof"
                  );
                  let leftovers = std::fs::read_dir(&parent)
                      .unwrap()
                      .filter_map(Result::ok)
                      .filter(|entry| entry.file_name().to_string_lossy().starts_with(".dok-"))
                      .count();
                  assert_eq!(leftovers, 0, "atomic temp file must not survive commit");

                  let root = parent.parent().unwrap().to_path_buf();
                  let _ = std::fs::remove_dir_all(root);
              }
          }
          '''
          if 'mod atomic_write_windows_contract_tests' in text:
              raise SystemExit('Windows atomic path test module already exists')
          text += test_module
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Run Windows long-path atomic regression
        shell: bash
        run: cargo test --locked -p dokkomplekt-tauri atomic_write_supports_windows_path_where_legacy_temp_name_exceeded_max_path -- --test-threads=1
      - name: Canonicalize source manifest and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/canon-e1-windows-atomic-path.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          git diff --name-only | sort > /tmp/changed-files.txt
          printf '%s\n' '.github/workflows/canon-e1-windows-atomic-path.yml' 'SOURCE_MANIFEST_SHA256.txt' 'src-tauri/src/subsystems/process_blueprints.rs' | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/canon-e1-windows-atomic-path.yml SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/process_blueprints.rs
          git commit -m 'E1: harden Windows atomic long-path publication'
          git push origin HEAD:canon-v2/e1-accounting-pipeline