name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Self-heal E2 map confirmation harness
        if: github.event_name == 'pull_request' && github.head_ref == 'canon-v2/e2-template-learning-proof'
        shell: bash
        env:
          CANONICAL_SHA: 9ac5f4ab0ac836fca3bb9582bf96a44d310d37c7
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/installer/windows_installer_contract.ps1')
          text = p.read_text(encoding='utf-8-sig')
          old = r'''Invoke-UiActionPhysicallyFromProbe `
            -Description 'Подтвердить проверенную карту и создать копию' `
            -ActionProbe {
              $currentAppWindow = Find-LiveAppWindow
              if ($null -eq $currentAppWindow) { return $null }
              Find-ReadyButtonByNames -Root $currentAppWindow -Names @('Подтвердить проверенную карту и создать копию')
            }
          '''
          new = r'''# Hosted WebView2 can expose this publishable button below the viewport while
          # accepting UIA Invoke/physical mouse without dispatching a DOM click. Bring the
          # actual button into view, activate the installed native window, focus the real
          # HTML button and send one keyboard Enter. Publication is still proven only by
          # the appearance of the real publication fields below.
          $currentAppWindow = Find-LiveAppWindow
          if ($null -eq $currentAppWindow) { throw 'E2 publishable learning window disappeared before map confirmation.' }
          $publishableLearningAction = Find-ReadyButtonByNames -Root $currentAppWindow -Names @('Подтвердить проверенную карту и создать копию')
          if ($null -eq $publishableLearningAction) { throw 'E2 publishable learning action disappeared before map confirmation.' }
          if ($publishableLearningAction.Current.IsOffscreen -and $publishableLearningAction.Current.IsScrollItemPatternAvailable) {
            $scroll = $publishableLearningAction.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern)
            $scroll.ScrollIntoView()
            Start-Sleep -Milliseconds 150
          }
          Activate-LiveAppWindow -Window $currentAppWindow
          $publishableLearningAction.SetFocus()
          Start-Sleep -Milliseconds 100
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          '''
          if old not in text:
              raise SystemExit('expected E2 map confirmation block not found exactly')
          if text.count(old) != 1:
              raise SystemExit(f'expected one E2 map confirmation block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git show "${CANONICAL_SHA}:.github/workflows/source-provenance.yml" > .github/workflows/source-provenance.yml
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.before.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json
          python - <<'PY'
          import json
          r=json.load(open('verification/ci/source-manifest-report.json', encoding='utf-8'))
          assert r.get('matches') is True, r
          print('SELF_HEAL_MANIFEST_OK', r.get('tracked_files'), r.get('matches'))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/installer/windows_installer_contract.ps1 SOURCE_MANIFEST_SHA256.txt .github/workflows/source-provenance.yml
          git commit -m "test: prove E2 map confirmation by foreground keyboard action"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat verification/ci/source-manifest-report.json
          echo "SOURCE_MANIFEST_SHA256.txt is stale. Download source-provenance-evidence, replace it with SOURCE_MANIFEST_SHA256.generated.txt, and commit that change from the PR branch." >&2
          exit 1
