name: Apply source identity runtime split

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/apply-source-identity-split.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/exhaustive-donor-parity-20260819'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/exhaustive-donor-parity-20260819
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install pinned Python test runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==9.0.2

      - name: Apply audited source-identity split
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/source-identity-split.patch
          git apply .github/source-identity-split.patch
          rm -f .github/source-identity-split.patch
          rm -f .github/workflows/apply-source-identity-split.yml
          cargo fmt --all
          python scripts/static_quality_gate.py --source-only
          python -m pytest -q \
            tests/test_v18_4_7_source_finalization_identity.py \
            tests/test_donor_patient_folder_watcher_parity.py \
            tests/test_agent_hardening_contracts.py
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          test ! -e .github/source-identity-split.patch
          test ! -e .github/workflows/apply-source-identity-split.yml

      - name: Commit final clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dokkomplekt-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Split shared source identity from automation runtime"
          git push origin HEAD:agent/exhaustive-donor-parity-20260819
