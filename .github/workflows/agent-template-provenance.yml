name: Active Template Provenance Validator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-template-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Published template identity validator
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/bind-active-template-version'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/bind-active-template-version
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply published-template provenance patch
        run: python .github/patches/agent-template-provenance.py
      - name: Normalize crash-consistency markdown EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CRASH_CONSISTENCY.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Check patch whitespace
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee /tmp/template-provenance-diff-check.log
      - name: Upload diff-check diagnostic
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: template-provenance-diff-check
          path: /tmp/template-provenance-diff-check.log
          if-no-files-found: error
      - name: Run published-template binding regressions
        run: cargo test -p dokkomplekt-tauri published_template_binding_tests -- --nocapture
      - name: Run immutable template snapshot regressions
        run: cargo test -p dokkomplekt-tauri template_snapshot -- --nocapture
      - name: Run source contract
        run: python -m pytest -q tests/test_published_template_provenance_contract.py
      - name: Compile all Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests
      - name: Clippy Tauri tests
        run: cargo clippy -p dokkomplekt-tauri --tests -- -D warnings
      - name: Run source architecture gate
        run: python scripts/static_quality_gate.py --source-only
      - name: Publish validated product changes and self-clean validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main agent/bind-active-template-version
          rm -f .github/patches/agent-template-provenance.py
          rm -f .github/workflows/agent-template-provenance.yml
          rm -f .github/diagnostics/template-provenance-diff-check.log
          git add -A
          git commit -m "Bind active templates to published archive versions"
          git pull --rebase origin agent/bind-active-template-version
          git push origin HEAD:agent/bind-active-template-version
