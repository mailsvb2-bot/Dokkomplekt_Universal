name: Build Free Unsigned Windows Preview

on:
  workflow_dispatch:
  # This job is a required branch-protection context, so every PR must emit it.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unsigned-preview.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/installer/windows_installer_contract.ps1'

permissions:
  contents: read

concurrency:
  group: unsigned-preview-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  windows-unsigned-preview:
    name: Windows NSIS unsigned preview
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate frontend
        run: |
          npm run typecheck
          npm run test
          npm run build
      - name: Build thin unsigned NSIS preview
        shell: pwsh
        run: |
          $licenseKey = '${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}'
          if (-not [string]::IsNullOrWhiteSpace($licenseKey)) {
            $env:DOKKOMPLEKT_LICENSE_PUBKEY_B64 = $licenseKey
            Write-Host 'Preview uses the configured production license verification public key.'
          } else {
            Write-Host 'No license verification key is configured; preview remains local-trial only.'
          }
          npx tauri build --bundles nsis --config src-tauri/tauri.thin.conf.json
      - name: Enforce unsigned-preview boundary
        shell: pwsh
        run: |
          $app = Resolve-Path 'target/release/dokkomplekt-tauri.exe'
          $installer = Get-ChildItem 'target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not created.' }
          foreach ($target in @($app.Path, $installer.FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne 'NotSigned') {
              throw "Unsigned preview unexpectedly has signature status $($signature.Status): $target"
            }
            Write-Host "UNSIGNED PREVIEW CONFIRMED: $target"
          }
      - name: Install, adversarially smash and uninstall preview
        shell: pwsh
        env:
          DOKKOMPLEKT_REQUIRE_AUTHENTICODE: '0'
          DOKKOMPLEKT_ADVERSARIAL: '1'
        run: tests/installer/windows_installer_contract.ps1 -TauriConfig src-tauri/tauri.thin.conf.json -ExpectedWebViewMode downloadBootstrapper
      - name: Stage clearly labelled preview artifact
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $installer = Get-ChildItem 'target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not found for staging.' }
          New-Item -ItemType Directory -Force 'release-preview' | Out-Null
          $previewName = "Dokkomplekt_Universal_$($config.version)_UNSIGNED_PREVIEW_setup.exe"
          Copy-Item $installer.FullName (Join-Path 'release-preview' $previewName) -Force
          @'
          DOKKOMPLEKT UNIVERSAL — UNSIGNED PREVIEW

          This installer is free to build and test, but it is not digitally signed.
          Windows may show "Unknown publisher" or a SmartScreen warning.
          This artifact is not the signed production release.

          Установщик бесплатный и пригоден для тестирования, но не имеет доверенной цифровой подписи.
          Windows может показать «Неизвестный издатель» или предупреждение SmartScreen.
          Это не подписанный production-релиз.
          '@ | Set-Content 'release-preview/README-UNSIGNED-PREVIEW.txt' -Encoding UTF8
          $licenseKey = '${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}'
          if ([string]::IsNullOrWhiteSpace($licenseKey)) {
            @'

          License mode: LOCAL TRIAL ONLY (production license verification key is not configured).
          Режим лицензии: ТОЛЬКО ЛОКАЛЬНЫЙ TRIAL (production-ключ проверки лицензии не настроен).
          '@ | Add-Content 'release-preview/README-UNSIGNED-PREVIEW.txt' -Encoding UTF8
          } else {
            @'

          License mode: production license verification public key embedded.
          Режим лицензии: встроен production public key проверки лицензии.
          '@ | Add-Content 'release-preview/README-UNSIGNED-PREVIEW.txt' -Encoding UTF8
          }
          $hash = Get-FileHash (Join-Path 'release-preview' $previewName) -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $previewName" | Set-Content 'release-preview/SHA256SUMS.txt' -Encoding ASCII
          "## Free unsigned Windows preview`n`n- Installer: ``$previewName```n- Signature: **NotSigned** (expected)`n- Installer adversarial smoke: passed before upload`n- SHA-256: ``$($hash.Hash.ToLowerInvariant())``" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload unsigned preview
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-UNSIGNED-PREVIEW-${{ github.run_number }}
          path: release-preview/**
          if-no-files-found: error
          retention-days: 14

  windows-unsigned-core-offline:
    name: Windows NSIS autonomous core offline preview
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64 }}
      DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64 }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_URL }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require immutable runtime verification inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64',
            'DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64',
            'DOKKOMPLEKT_RUNTIME_BUNDLE_URL',
            'DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL',
            'DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL',
            'DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Autonomous offline preview is fail-closed: required repository variable is missing: $name"
            }
          }
      - name: Install build and verification dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Fetch immutable independently approved runtime
        shell: pwsh
        run: |
          python scripts/fetch_hosted_runtime_bundle.py `
            --bundle-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_URL `
            --payload-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL `
            --signature-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL `
            --approval-signature-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL `
            --out release-runtime `
            --json-report verification/preview/OFFLINE_RUNTIME_FETCH.json
          if ($LASTEXITCODE -ne 0) { throw 'approved runtime fetch failed' }
      - name: Verify both runtime signatures and stage exact core tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-preview-{0}.pem" -f [guid]::NewGuid())
          $approvalKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-approval-preview-{0}.pem" -f [guid]::NewGuid())
          try {
            [IO.File]::WriteAllBytes($runtimeKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            [IO.File]::WriteAllBytes($approvalKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64))
            $bundle = (Resolve-Path release-runtime/Dokkomplekt-offline-runtime-windows-x86_64.zip).Path
            $payload = "$bundle.signing.json"
            python scripts/stage_signed_runtime_bundle.py $bundle `
              --payload $payload `
              --signature "$payload.sig" `
              --trusted-runtime-public-key $runtimeKey `
              --approval-signature "$payload.approval.sig" `
              --trusted-approval-public-key $approvalKey `
              --profile core `
              --clean `
              --json-report verification/preview/OFFLINE_RUNTIME_STAGE.json
            if ($LASTEXITCODE -ne 0) { throw 'approved core runtime staging failed' }
          } finally {
            Remove-Item -LiteralPath $runtimeKey -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $approvalKey -Force -ErrorAction SilentlyContinue
          }
      - name: Prove all document-processing tools are locally available
        shell: pwsh
        run: |
          python scripts/assert_offline_runtime_ready.py --target windows-x86_64 --profile core --require-supply-chain
          if ($LASTEXITCODE -ne 0) { throw 'core offline runtime readiness failed' }
          python scripts/verify_windows_runtime_app_parity.py --target windows-x86_64 --profile core
          if ($LASTEXITCODE -ne 0) { throw 'desktop/runtime resolver parity failed' }
          python scripts/probe_offline_runtime.py --target windows-x86_64 --profile core
          if ($LASTEXITCODE -ne 0) { throw 'core runtime executable probe failed' }
      - name: Validate frontend
        run: |
          npm run typecheck
          npm run test
          npm run build
      - name: Build autonomous unsigned core offline NSIS
        shell: pwsh
        run: |
          $licenseKey = '${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}'
          if (-not [string]::IsNullOrWhiteSpace($licenseKey)) {
            $env:DOKKOMPLEKT_LICENSE_PUBKEY_B64 = $licenseKey
          }
          npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'autonomous offline NSIS build failed' }
      - name: Enforce unsigned and offline installer boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path 'target/release/dokkomplekt-tauri.exe'
          $installer = Get-ChildItem 'target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'offline NSIS installer was not created' }
          foreach ($target in @($app.Path, $installer.FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne 'NotSigned') {
              throw "Unsigned offline preview unexpectedly has signature status $($signature.Status): $target"
            }
          }
          if ($installer.Length -lt 100MB) {
            throw "Offline installer is implausibly small ($($installer.Length) bytes); bundled runtime was not embedded"
          }
      - name: Install, adversarially test and uninstall autonomous offline preview
        shell: pwsh
        env:
          DOKKOMPLEKT_REQUIRE_AUTHENTICODE: '0'
          DOKKOMPLEKT_ADVERSARIAL: '1'
        run: tests/installer/windows_installer_contract.ps1 -TauriConfig src-tauri/tauri.offline.conf.json -ExpectedWebViewMode offlineInstaller
      - name: Stage autonomous offline installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $installer = Get-ChildItem 'target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'offline NSIS installer was not found for staging' }
          New-Item -ItemType Directory -Force 'release-offline-preview' | Out-Null
          $name = "Dokkomplekt_Universal_$($config.version)_CORE_OFFLINE_UNSIGNED_setup.exe"
          Copy-Item $installer.FullName (Join-Path 'release-offline-preview' $name) -Force
          @'
          DOKKOMPLEKT UNIVERSAL — AUTONOMOUS CORE OFFLINE UNSIGNED BUILD

          One installer contains the core document runtime required for OCR, PDF processing,
          DOCX/Office conversion, PDF printing and supported archive extraction.
          The semantic LLM/model is intentionally not embedded in this bounded core installer.
          No runtime component download is required for the normal core document workflow.

          This build is intentionally not Authenticode-signed. Windows may show Unknown publisher
          or SmartScreen. Production signing governance is unchanged and is not bypassed by this job.
          '@ | Set-Content 'release-offline-preview/README-CORE-OFFLINE-UNSIGNED.txt' -Encoding UTF8
          $hash = Get-FileHash (Join-Path 'release-offline-preview' $name) -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $name" | Set-Content 'release-offline-preview/SHA256SUMS.txt' -Encoding ASCII
          Copy-Item 'verification/preview/OFFLINE_RUNTIME_FETCH.json' 'release-offline-preview/' -Force
          Copy-Item 'verification/preview/OFFLINE_RUNTIME_STAGE.json' 'release-offline-preview/' -Force
          "## Autonomous unsigned core offline Windows build`n`n- Installer: ``$name```n- Runtime profile: **core**`n- WebView2 mode: **offlineInstaller**`n- Authenticode: **NotSigned** (expected)`n- Installer smoke: passed before upload`n- SHA-256: ``$($hash.Hash.ToLowerInvariant())```n- Bytes: $($installer.Length)" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload autonomous unsigned core offline installer
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-CORE-OFFLINE-UNSIGNED-${{ github.run_number }}
          path: release-offline-preview/**
          if-no-files-found: error
          retention-days: 14
