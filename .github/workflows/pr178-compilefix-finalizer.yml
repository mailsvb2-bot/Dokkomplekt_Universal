name: PR178 compile-fix finalizer

on:
  push:
    branches:
      - ops/pr178-compilefix-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply exact compile fix, regenerate provenance and validate
        env:
          EXPECTED_HEAD: a645fae867f55a16fda43f0510c852a44b83d827
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/subsystems/profile_sources.rs')
          text = path.read_text(encoding='utf-8')
          old = 'Err(error) if medical_diary_template_is_usable(path) => {'
          new = 'Err(_) if medical_diary_template_is_usable(path) => {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one compile-fix target, got {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all -- --check
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          bash scripts/prepackage_rust_gate.sh
          cargo test -p dokkomplekt-tauri concurrent_diary_template_creation_atomically_publishes_complete_docx -- --exact
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/profile_sources.rs
          git diff --cached --check
          git commit -m 'Keep atomic diary publication warning-free'
          git push origin HEAD:fix/real-user-workflow-20260907
