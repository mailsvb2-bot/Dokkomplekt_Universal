name: Apply final donor lifecycle parity

on:
  push:
    branches:
      - agent/exhaustive-donor-parity-20260819
    paths:
      - .github/workflows/apply-donor-lifecycle-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply audited donor lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/donor-lifecycle-final.patch
          git apply .github/donor-lifecycle-final.patch
          rm -f .github/donor-lifecycle-final.patch
          rm -f .github/workflows/apply-donor-lifecycle-final.yml
          cargo fmt --all
          python -m pytest -q \
            tests/test_agent_hardening_contracts.py \
            tests/test_v18_0_6_scanner_watcher_print_contracts.py \
            tests/test_donor_patient_folder_watcher_parity.py
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          test ! -e .github/donor-lifecycle-final.patch
          test ! -e .github/workflows/apply-donor-lifecycle-final.yml

      - name: Commit final clean tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dokkomplekt-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete donor patient-folder and watcher lifecycle parity"
          git push origin HEAD:${GITHUB_REF_NAME}
