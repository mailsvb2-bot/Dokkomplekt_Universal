name: E2 Learning Evidence Diagnose Once

on:
  push:
    branches:
      - canon-v2/e2-learning-evidence
    paths:
      - .github/workflows/e2-learning-evidence-diagnose-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-e2-learning-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Guard exact product inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/dokkomplekt-core/src/template_wizard.rs)" = "b778fbcb4eb74929d25a4e228d023515267243b8"
          test "$(git hash-object src/lib/types.ts)" = "669bc8ab9ff547f14c20196f60120e6321d583db"
          test "$(git hash-object src/lib/pendingTemplateIntelligence.ts)" = "88d35cec3ac61d61ba114abfe99403cd08674b9c"
          test "$(git hash-object src/components/TemplateSetupModal.tsx)" = "c174db40fdb8d9704fec90c8848247a5b048e56a"
      - name: Apply proposed product diff except guarded modal
        shell: bash
        run: |
          set -euo pipefail
          git apply --recount --exclude=src/components/TemplateSetupModal.tsx --check .e2/learning-evidence.patch
          git apply --recount --exclude=src/components/TemplateSetupModal.tsx .e2/learning-evidence.patch
      - name: Apply modal changes with exact replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/TemplateSetupModal.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one guarded modal fragment, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "  onLearnPendingTemplate(documentId: string, files: File[]): Promise<void>;",
              "  onLearnPendingTemplate(documentId: string, completedFiles: File[], sourceFiles: File[]): Promise<void>;",
          )
          replace_once(
              "  const [marking, setMarking] = useState(false);\n",
              "  const [marking, setMarking] = useState(false);\n  const [learningSourceFiles, setLearningSourceFiles] = useState<File[]>([]);\n  const [learningOutputFiles, setLearningOutputFiles] = useState<File[]>([]);\n",
          )
          replace_once(
              "  }, [activePendingId, props.pendingTemplates]);\n\n  useEffect(() => {\n    for (const item of props.pendingTemplates) {",
              "  }, [activePendingId, props.pendingTemplates]);\n\n  useEffect(() => {\n    setLearningSourceFiles([]);\n    setLearningOutputFiles([]);\n  }, [activePendingId]);\n\n  useEffect(() => {\n    for (const item of props.pendingTemplates) {",
          )
          old_learning = "\n".join([
              "                    <label className=\"softBtn fileBtn\">",
              "                      <i className=\"ti ti-school\" aria-hidden=\"true\" /> Обучить по 3–10 примерам",
              "                      <input",
              "                        type=\"file\"",
              "                        multiple",
              "                        accept=\".docx,.docm,.pdf,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp\"",
              "                        onChange={(event) => {",
              "                          const files = Array.from(event.currentTarget.files ?? []);",
              "                          event.currentTarget.value = '';",
              "                          if (files.length) void props.onLearnPendingTemplate(activePending.document_id, files);",
              "                        }}",
              "                        style={{ display: 'none' }}",
              "                      />",
              "                    </label>",
          ])
          new_learning = "\n".join([
              "                    <label className=\"softBtn fileBtn\">",
              "                      <i className=\"ti ti-file-import\" aria-hidden=\"true\" /> 1. Источники ({learningSourceFiles.length})",
              "                      <input",
              "                        type=\"file\"",
              "                        multiple",
              "                        accept=\".docx,.docm,.pdf,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp\"",
              "                        onChange={(event) => {",
              "                          const files = Array.from(event.currentTarget.files ?? []);",
              "                          event.currentTarget.value = '';",
              "                          setLearningSourceFiles(files);",
              "                        }}",
              "                        style={{ display: 'none' }}",
              "                      />",
              "                    </label>",
              "                    <label className=\"softBtn fileBtn\">",
              "                      <i className=\"ti ti-file-check\" aria-hidden=\"true\" /> 2. Правильные DOCX/DOCM ({learningOutputFiles.length})",
              "                      <input",
              "                        type=\"file\"",
              "                        multiple",
              "                        accept=\".docx,.docm\"",
              "                        onChange={(event) => {",
              "                          const files = Array.from(event.currentTarget.files ?? []);",
              "                          event.currentTarget.value = '';",
              "                          setLearningOutputFiles(files);",
              "                        }}",
              "                        style={{ display: 'none' }}",
              "                      />",
              "                    </label>",
              "                    <button",
              "                      className=\"softBtn\"",
              "                      type=\"button\"",
              "                      disabled={learningSourceFiles.length < 4 || learningSourceFiles.length > 10 || learningSourceFiles.length !== learningOutputFiles.length}",
              "                      onClick={() => void props.onLearnPendingTemplate(activePending.document_id, learningOutputFiles, learningSourceFiles)}",
              "                    >",
              "                      <i className=\"ti ti-school\" aria-hidden=\"true\" /> Проверить пары и обучить",
              "                    </button>",
              "                    <small>",
              "                      Выберите 4–10 пар в одинаковом порядке: источник №1 соответствует правильному документу №1. Последняя пара проверяется отдельно и не участвует в обучении доказательной карты.",
              "                    </small>",
          ])
          replace_once(old_learning, new_learning)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Rust format and E2 focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p dokkomplekt-core paired_learning_passes_only_after_held_out_and_source_intervention_proof
          cargo test -p dokkomplekt-core confidence_without_matched_source_pairs_stays_draft_only
      - name: Full core regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dokkomplekt-core
      - name: TypeScript and focused Vitest proof
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test -- src/lib/pendingTemplateIntelligence.test.ts
