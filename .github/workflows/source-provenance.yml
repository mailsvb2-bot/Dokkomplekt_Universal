name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || { echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Apply guarded completion receipt integrity patch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          patch='.github/deep-audit-receipt-integrity.patch'
          if [[ ! -f "$patch" ]]; then exit 0; fi
          if git apply --check "$patch"; then git apply "$patch";
          elif git apply --reverse --check "$patch"; then echo 'PATCH ALREADY APPLIED';
          else echo 'Guarded receipt-integrity patch no longer matches audited source.' >&2; exit 1; fi
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py --output verification/ci/Dokkomplekt_Universal-source.zip --top-level Dokkomplekt_Universal --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/automation_runtime.rs tests/test_publication_completion_exactly_once_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): validate completion receipt and regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
