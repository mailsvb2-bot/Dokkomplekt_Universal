name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Apply native OpenFileDialog text fallback
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-installed-button-creation'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          smoke_path = Path('tests/installer/windows_installer_contract.ps1')
          smoke = smoke_path.read_text(encoding='utf-8')
          old_native = '''public static class DokkomplektNativeMouse {
            [DllImport("user32.dll", SetLastError = true)]
            public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
          }
          '''
          new_native = '''public static class DokkomplektNativeMouse {
            [DllImport("user32.dll", SetLastError = true)]
            public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
            [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr SendMessage(IntPtr hWnd, uint msg, IntPtr wParam, string lParam);
          }
          '''
          old_setter = '''function Set-UiValue {
            param(
              [Parameter(Mandatory = $true)]$Element,
              [Parameter(Mandatory = $true)][string]$Value
            )
            $supportsValue = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::IsValuePatternAvailableProperty,
              $true
            )
            $valueElement = $Element.FindFirst(
              [System.Windows.Automation.TreeScope]::Subtree,
              $supportsValue
            )
            if ($null -eq $valueElement) {
              throw 'UI element and its descendants do not expose ValuePattern.'
            }
            $pattern = $valueElement.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $pattern.SetValue($Value)
          }
          '''
          new_setter = '''function Set-UiValue {
            param(
              [Parameter(Mandatory = $true)]$Element,
              [Parameter(Mandatory = $true)][string]$Value
            )
            $supportsValue = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::IsValuePatternAvailableProperty,
              $true
            )
            $valueElement = $Element.FindFirst(
              [System.Windows.Automation.TreeScope]::Subtree,
              $supportsValue
            )
            if ($null -ne $valueElement) {
              $pattern = $valueElement.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              $pattern.SetValue($Value)
              return
            }

            # The modern Windows OpenFileDialog exposes the file-name ComboBox without
            # UIA ValuePattern on hosted runners. Set its native window text directly.
            $nativeHandle = [IntPtr]$Element.Current.NativeWindowHandle
            if ($nativeHandle -eq [IntPtr]::Zero) {
              throw 'OpenFileDialog file-name control exposes neither ValuePattern nor a native HWND.'
            }
            $null = [DokkomplektNativeMouse]::SendMessage($nativeHandle, 0x000C, [IntPtr]::Zero, $Value)
            $Element.SetFocus()
            Start-Sleep -Milliseconds 200
          }
          '''
          if old_native not in smoke:
              raise SystemExit('Expected native mouse block was not found.')
          if old_setter not in smoke:
              raise SystemExit('Expected Set-UiValue block was not found.')
          smoke = smoke.replace(old_native, new_native, 1).replace(old_setter, new_setter, 1)
          smoke_path.write_text(smoke, encoding='utf-8')

          test_path = Path('tests/test_v18_4_5_installed_button_creation.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    assert "function Set-UiValue" in smoke\n'
          addition = anchor + '    assert "SendMessage" in smoke\n    assert "0x000C" in smoke\n'
          if 'assert "SendMessage" in smoke' not in test:
              if anchor not in test:
                  raise SystemExit('Expected regression-test anchor was not found.')
              test = test.replace(anchor, addition, 1)
              test_path.write_text(test, encoding='utf-8')
          PY
          rm verification/ci/open-dialog-wm-settext.patch
          git checkout origin/main -- .github/workflows/source-provenance.yml
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q tests/test_v18_4_5_installed_button_creation.py
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Test OpenFileDialog through native WM_SETTEXT fallback"
          git push origin "HEAD:${BRANCH}"
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
