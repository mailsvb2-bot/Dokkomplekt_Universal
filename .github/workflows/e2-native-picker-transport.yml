name: E2 Native Picker Exact Transport
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b58dd4f3730e9f50a24a54e9451e09fb7e98860
          fetch-depth: 0
      - name: Materialize exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6b58dd4f3730e9f50a24a54e9451e09fb7e98860"
          curl --fail --silent --show-error --location --max-time 30 \
            'http://185.104.114.163:38473/MoOGUEqoNORduA7f6ZGX7MP973IpLPVmVATPQ260i1Q.patch' \
            -o /tmp/change.patch
          echo "ef25b0d99e44346416d31f7795d6078e58537b834b57e913462545a90cf5c567  /tmp/change.patch" | sha256sum -c -
          git apply --index /tmp/change.patch
          tree=$(git write-tree)
          echo "materialized tree=$tree"
          test "$tree" = "025b8a0ad1cc3705c2aa191011e2d20405e4b122"
          git -c user.name='Dokkomplekt CI' -c user.email='dokkomplekt-ci@users.noreply.github.com' commit -m 'fix: use native picker for template learning'
          git push origin HEAD:canon-v2/e2-template-learning-proof
