name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-hardening:
    name: Format catastrophic hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format, verify scope and publish
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cargo fmt --all
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('build_source_archive', root / 'scripts' / 'build_source_archive.py')
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load build_source_archive')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          (root / module.SOURCE_MANIFEST).write_bytes(module.source_manifest_payload())
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/dokkomplekt-docx/src/lib.rs \
            crates/dokkomplekt-storage/src/lib.rs \
            src-tauri/src/main.rs \
            src-tauri/src/subsystems/automation_runtime.rs \
            src-tauri/src/subsystems/document_commands.rs \
            src-tauri/src/subsystems/watcher_commands.rs \
            src-tauri/src/universal_intake.rs \
            SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'style(rust): format catastrophic hardening'
          git push origin "HEAD:${BRANCH}"
