name: E1 Source State Owner Recovery Once

on:
  push:
    branches: [canon-v2/e1-accounting-pipeline]

permissions:
  contents: write

concurrency:
  group: e1-source-state-owner-recovery-once
  cancel-in-progress: false

jobs:
  fix-and-prove:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover proof, keep parsed source canonical, sync manifest, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          clean_parent='30aa0fa1aa2064f2d3b41cf97c96be66bd94608e'
          failed_probe='f4329fef5ced327f76d9ece36c417649ebb37638'
          first_workflow='.github/workflows/e1-source-state-owner-fix-once.yml'
          recovery_workflow='.github/workflows/e1-source-state-owner-recovery-once.yml'
          app='src/App.tsx'
          support='src/lib/appSupport.ts'
          support_test='src/lib/appSupport.selection.test.ts'
          e1_contract='tests/test_e1_windows_installed_accounting_contract.py'

          test "$(git rev-parse HEAD^)" = "$failed_probe"
          test "$(git rev-parse HEAD^^)" = "$clean_parent"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$first_workflow"
          test "$(git diff --name-only HEAD^ HEAD)" = "$recovery_workflow"

          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old_import = '''  loadPrintCopyPreferences, newDocumentId, normalizeCopyCount, preserveSelectedDocumentIds, promptToPopupField, readFileBytes,\n  replaceAllLiteral, withPendingTemplateDomain, type GuidedScannerState, type PendingTemplate,\n'''
          new_import = '''  loadPrintCopyPreferences, newDocumentId, normalizeCopyCount, preserveSelectedDocumentIds, promptToPopupField, readFileBytes,\n  replaceAllLiteral, semanticPreviewFromParsedSource, withPendingTemplateDomain, type GuidedScannerState, type PendingTemplate,\n'''
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          manual_extract = '''    const semanticResult = await run('semantic_extract', () => semanticExtract(sourceText, currentDefaultYear()));\n    setSemantic(semanticResult ?? null);\n'''
          parsed_extract = '''    const semanticResult = await run('semantic_extract', () => semanticExtract(res.source_text, currentDefaultYear()));\n    setSemantic(semanticResult ?? null);\n'''
          replacement = '''    setSemantic(semanticPreviewFromParsedSource(res));\n'''
          assert text.count(manual_extract) == 1
          assert text.count(parsed_extract) == 2
          text = text.replace(manual_extract, replacement, 1)
          text = text.replace(parsed_extract, replacement, 2)
          assert text.count('semanticExtract(') == 1
          assert text.count('semanticPreviewFromParsedSource(res)') == 3
          app.write_text(text)

          support = Path('src/lib/appSupport.ts')
          stext = support.read_text()
          old_types = "import type { BundleDecision, CreatedDocumentOutput, DocumentRoutingRecommendation, DocumentTemplateSpec, FolderNamePartDto, GeneratedPrintItem, PrintJobDto, GuidedScannerMarkupAction, PopupFieldConfig, PromptSpec, WordScannerCapture, WordScannerSession, DomainKind } from './types';"
          new_types = "import type { BundleDecision, CreatedDocumentOutput, DocumentRoutingRecommendation, DocumentTemplateSpec, FolderNamePartDto, GeneratedPrintItem, PrintJobDto, GuidedScannerMarkupAction, PopupFieldConfig, PromptSpec, WordScannerCapture, WordScannerSession, DomainKind, ParseSourceResponse, SemanticExtractResult } from './types';"
          assert stext.count(old_types) == 1
          stext = stext.replace(old_types, new_types, 1)
          anchor = "export function currentDefaultYear(): number { return new Date().getFullYear(); }\n"
          helper = '''export function currentDefaultYear(): number { return new Date().getFullYear(); }\n\n/**\n * Source intake already parsed and durably installed the canonical SemanticCase.\n * Build the UI preview from that exact case instead of invoking semantic_extract\n * a second time and giving another command a chance to replace source-owned facts.\n */\nexport function semanticPreviewFromParsedSource(parsed: ParseSourceResponse): SemanticExtractResult {\n  const fields = Object.values(parsed.semantic_case?.values ?? {})\n    .map((value) => ({\n      field_id: value.field_id,\n      value: value.value,\n      confidence: value.confidence,\n      method: value.source,\n      source: value.source,\n      evidence: (value.evidence ?? []).map((item) => item.excerpt).filter(Boolean),\n    }))\n    .sort((left, right) => left.field_id.localeCompare(right.field_id));\n  return {\n    fields,\n    warnings: [...(parsed.report?.warnings ?? [])],\n    model_applied: false,\n    prompt: '',\n  };\n}\n'''
          assert stext.count(anchor) == 1
          stext = stext.replace(anchor, helper, 1)
          support.write_text(stext)

          test = Path('src/lib/appSupport.selection.test.ts')
          ttext = test.read_text()
          old_type_import = "import type { BundleDecision, DocumentRoutingRecommendation, DocumentTemplateSpec, DomainKind } from './types';"
          new_type_import = "import type { BundleDecision, DocumentRoutingRecommendation, DocumentTemplateSpec, DomainKind, ParseSourceResponse } from './types';"
          assert ttext.count(old_type_import) == 1
          ttext = ttext.replace(old_type_import, new_type_import, 1)
          old_support_import = "import { bundleSelectionFromDecision, currentDefaultYear, defaultSelectedDocumentIds, loadOutputFolderParts, loadOutputRoot, OUTPUT_NAMING_CONFIRMED_KEY, OUTPUT_PREFS_KEY, OUTPUT_ROOT_KEY, preserveSelectedDocumentIds, saveOutputFolderParts, saveOutputRoot, shouldSelectDocumentByDefault } from './appSupport';"
          new_support_import = "import { bundleSelectionFromDecision, currentDefaultYear, defaultSelectedDocumentIds, loadOutputFolderParts, loadOutputRoot, OUTPUT_NAMING_CONFIRMED_KEY, OUTPUT_PREFS_KEY, OUTPUT_ROOT_KEY, preserveSelectedDocumentIds, saveOutputFolderParts, saveOutputRoot, semanticPreviewFromParsedSource, shouldSelectDocumentByDefault } from './appSupport';"
          assert ttext.count(old_support_import) == 1
          ttext = ttext.replace(old_support_import, new_support_import, 1)
          insertion = '''\ndescribe('parsed source semantic preview', () => {\n  it('keeps the canonical source-owned accounting facts without a second extraction pass', () => {\n    const parsed: ParseSourceResponse = {\n      semantic_case: {\n        values: {\n          'org.name': { field_id: 'org.name', value: 'ООО «Альфа»', source: 'Scanner', confidence: 0.99, evidence: [{ source_kind: 'source', excerpt: 'Исполнитель: ООО «Альфа»', extractor: 'label', confidence: 0.99 }] },\n          'counterparty.name': { field_id: 'counterparty.name', value: 'ООО «Бета»', source: 'Scanner', confidence: 0.99 },\n          'amount.total': { field_id: 'amount.total', value: '125 000,00', source: 'Scanner', confidence: 0.99 },\n        },\n      },\n      report: { warnings: ['fixture warning'] },\n      routing: { domain: 'Accounting', domain_confidence: 1, predicted_role: 'service_act', cluster_id: 'accounting.service_act', cluster_confidence: 1, recommended_document_ids: [], matches: [], auto_select: false, review_required: false, reasons: [] },\n      bundle_decision: { document_ids: [], source: 'deterministic_route', confidence: 1, auto_apply: false, review_required: false, reasons: [] },\n    };\n    const preview = semanticPreviewFromParsedSource(parsed);\n    expect(Object.fromEntries(preview.fields.map((field) => [field.field_id, field.value]))).toEqual({\n      'amount.total': '125 000,00',\n      'counterparty.name': 'ООО «Бета»',\n      'org.name': 'ООО «Альфа»',\n    });\n    expect(preview.fields.find((field) => field.field_id === 'org.name')?.evidence).toEqual(['Исполнитель: ООО «Альфа»']);\n    expect(preview.warnings).toEqual(['fixture warning']);\n    expect(preview.model_applied).toBe(false);\n  });\n});\n'''
          assert "describe('parsed source semantic preview'" not in ttext
          test.write_text(ttext.rstrip() + '\n' + insertion)

          contract = Path('tests/test_e1_windows_installed_accounting_contract.py')
          ctext = contract.read_text()
          anchor = '''    workflow = WORKFLOW.read_text(encoding="utf-8")\n'''
          addition = '''    app_source = (ROOT / "src" / "App.tsx").read_text(encoding="utf-8")\n    assert app_source.count("semanticExtract(") == 1, "automatic source intake must not run a second state-owning semantic extraction"\n    assert app_source.count("semanticPreviewFromParsedSource(res)") == 3\n'''
          assert ctext.count(anchor) == 1
          contract.write_text(ctext.replace(anchor, anchor + addition, 1))
          PY

          git diff --check
          npm ci
          npm run typecheck
          npx vitest run src/lib/appSupport.selection.test.ts src/App.test.tsx
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pytest -q tests/test_e1_windows_installed_accounting_contract.py

          git rm "$first_workflow" "$recovery_workflow"
          changed_before_manifest="$(git diff HEAD --name-only | sort)"
          expected_before_manifest="$(printf '%s\n' "$app" "$support" "$support_test" "$e1_contract" "$first_workflow" "$recovery_workflow" | sort)"
          test "$changed_before_manifest" = "$expected_before_manifest"

          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add "$app" "$support" "$support_test" "$e1_contract" SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt --json-report /tmp/source-manifest-recheck.json
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.recheck.txt

          git config user.name 'Dokkomplekt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep parsed source as canonical UI case'
          git push origin HEAD:refs/heads/canon-v2/e1-accounting-pipeline
