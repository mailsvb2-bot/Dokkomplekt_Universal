name: PR181 publish pending compiler fix

on:
  push:
    branches:
      - fix/18.4.7-profile-status-real-path

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified pending patch
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          expected_parent='642d9467cf640cd9e68104bf85586958fc9dc644'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/pr181-final.patch
          git apply --check /tmp/pr181-final.patch
          git apply /tmp/pr181-final.patch
          test "$(git hash-object src-tauri/src/subsystems/legacy_template_runtime.rs)" = 'cf7bb84a3e3153e0d64a28ef9acdbff0592887a0'
          test "$(git hash-object SOURCE_MANIFEST_SHA256.txt)" = 'e2f1923583db1bc7c038527cb4f8cc32c29961da'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/legacy_template_runtime.rs
          git commit -m 'fix: finish compiler ownership migration'
          git push origin HEAD:${GITHUB_REF_NAME}
