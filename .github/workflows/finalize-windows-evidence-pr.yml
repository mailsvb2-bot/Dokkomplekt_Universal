name: Finalize Windows evidence PR

on:
  push:
    branches:
      - agent/require-windows-gui-evidence-main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-windows-evidence-pr
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[final-windows-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/require-windows-gui-evidence-main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply consolidated fail-closed fixes
        run: |
          python .github/patches/finalize-windows-evidence.py
          python .github/patches/finalize-windows-evidence-after-ci.py
      - name: Run full Python regression wall
        run: python -m pytest -q
      - name: Run source gates
        run: |
          python scripts/verify_source_manifest.py
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_starter_content_packs.py
          python scripts/check_reference_data_freshness.py
          python -m compileall -q scripts tests
          git diff --check
      - name: Commit finalized branch without racing provenance sync
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/require-windows-gui-evidence-main'
          base_commit="$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          verify_staged() {
            python - <<'PY'
          import subprocess
          allowed = {
              '.github/patches/finalize-windows-evidence.py',
              '.github/patches/finalize-windows-evidence-after-ci.py',
              '.github/patches/refresh-gui-manifest.trigger',
              '.github/workflows/finalize-windows-evidence-pr.yml',
              'SOURCE_MANIFEST_SHA256.txt',
              'scripts/write_windows_hardware_evidence_index.ps1',
              'tests/test_windows_hardware_evidence_index.py',
              'tests/test_windows_reboot_evidence_binding.py',
              'tests/windows/verify_reboot_evidence.ps1',
              'tests/windows/windows_hardware_e2e.ps1',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          unexpected = actual - allowed
          if unexpected:
              raise SystemExit(f'unexpected finalizer paths: {sorted(unexpected)}')
          for temporary in (
              '.github/patches/finalize-windows-evidence.py',
              '.github/patches/finalize-windows-evidence-after-ci.py',
              '.github/patches/refresh-gui-manifest.trigger',
              '.github/workflows/finalize-windows-evidence-pr.yml',
          ):
              if temporary not in actual:
                  raise SystemExit(f'temporary path was not removed: {temporary}')
          PY
          }

          reapply_latest() {
            python .github/patches/finalize-windows-evidence.py
            python .github/patches/finalize-windows-evidence-after-ci.py
            python -m pytest -q \
              tests/test_source_manifest_integrity.py \
              tests/test_windows_hardware_evidence_index.py \
              tests/test_windows_reboot_evidence_binding.py \
              tests/test_windows_reboot_evidence_execution.py
            python scripts/verify_source_manifest.py
            python scripts/static_quality_gate.py --source-only
            git diff --check
            git add -A
            verify_staged
          }

          git add -A
          verify_staged

          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/$branch")"
            if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
              mapfile -t remote_changes < <(git diff --name-only "$base_commit" "$remote_sha")
              for path in "${remote_changes[@]}"; do
                if [ "$path" != 'SOURCE_MANIFEST_SHA256.txt' ]; then
                  echo "Remote branch changed outside provenance manifest while finalizing: $path" >&2
                  exit 1
                fi
              done
              git reset --hard "$remote_sha"
              reapply_latest
            fi

            git commit -m "Finalize Windows production evidence hardening [final-windows-evidence]"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Branch advanced during final push; retrying from latest trusted head ($attempt/4)." >&2
          done
          echo 'Unable to publish finalized branch without overwriting concurrent changes.' >&2
          exit 1
