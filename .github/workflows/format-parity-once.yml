name: Format parity once
on:
  push:
    branches:
      - agent/universal-legacy-ux-parity-20260816
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply canonical rustfmt and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          rm -f .github/workflows/format-parity-once.yml
          git diff --check
          python scripts/static_quality_gate.py --source-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply canonical Rust formatting'
          git push origin HEAD:agent/universal-legacy-ux-parity-20260816
