name: Canon E1 Diagnostic Cleanup

on:
  push:
    branches:
      - canon-v2/e1-accounting-pipeline
    paths:
      - .github/workflows/canon-e1-windows-parser-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Remove temporary diagnostic and resync source identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/canon-e1-windows-parser-diagnostic.yml
          python scripts/verify_source_manifest.py --candidate /tmp/source-manifest.txt || true
          cp /tmp/source-manifest.txt SOURCE_MANIFEST_SHA256.txt
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_source_manifest_integrity.py \
            tests/test_p0_trust_boundaries.py \
            tests/test_e1_windows_installed_accounting_contract.py
          git diff --check

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes to commit'; exit 1; }
          git commit -m 'ci: remove temporary E1 parser diagnostic'
          git push origin HEAD:canon-v2/e1-accounting-pipeline
