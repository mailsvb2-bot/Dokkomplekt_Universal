name: Validate focused source snapshot module

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-source-snapshot-split
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-source-snapshot-race
          fetch-depth: 0
      - run: python .github/patches/agent-split-source-snapshot.py
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all
      - name: Run source snapshot module tests
        run: cargo test -p dokkomplekt-tauri universal_intake::source_snapshot -- --nocapture
      - name: Compile Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests
      - name: Clippy Tauri tests
        run: cargo clippy -p dokkomplekt-tauri --tests -- -D warnings
      - name: Enforce module-size governance
        run: python -m pytest -q tests/test_v18_4_3_generation_plan_governance.py::test_oversized_modules_are_split_into_focused_submodules
      - run: git diff --check
      - name: Commit validated module split
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/agent-split-source-snapshot.py .github/workflows/agent-split-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split stable source snapshot module"
          git fetch origin agent/fix-source-snapshot-race
          git rebase origin/agent/fix-source-snapshot-race
          git push origin HEAD:agent/fix-source-snapshot-race
