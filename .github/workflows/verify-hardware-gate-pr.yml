name: Verify Hardware Gate PR

on:
  pull_request_target:
    types: [reopened, edited]
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.number == 49 && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issues' && github.event.issue.number == 50) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/49/comments"
          request = urllib.request.Request(url, data=json.dumps({'body': f"Trusted hardware-gate verification run {os.environ['RUN_ID']} started."}).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}, method='POST')
          urllib.request.urlopen(request).read()
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-windows-hardware-release-gate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify source tree and release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_source_manifest.py
          python scripts/run_python_contracts_sharded.py --report verification/ci/hardware-gate-pr-python.json
          python scripts/static_quality_gate.py --source-only
          python scripts/check_reference_data_freshness.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/windows-hardware-e2e.yml').read_text(encoding='utf-8'))
          assert workflow['name'] == 'Windows Hardware E2E'
          print('workflow YAML parsed')
          PY
          pwsh -NoProfile -Command "$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tests/windows/windows_hardware_e2e.ps1'), [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }; Write-Host 'PowerShell AST parsed'"
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: hardware-gate-pr-verification
          path: verification/ci/hardware-gate-pr-python.json
          if-no-files-found: error
      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/49/comments"
          request = urllib.request.Request(url, data=json.dumps({'body': f"Trusted hardware-gate verification run {os.environ['RUN_ID']} failed; inspect the Actions log."}).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}, method='POST')
          urllib.request.urlopen(request).read()
          PY
