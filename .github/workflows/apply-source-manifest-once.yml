name: Apply source manifest once

on:
  push:
    branches:
      - agent/core-offline-windows-installer
    paths:
      - '.github/workflows/apply-source-manifest-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: source-manifest-candidate-33768008534
          path: manifest-candidate
          github-token: ${{ github.token }}
          repository: mailsvb2-bot/Dokkomplekt_Universal
          run-id: 33768008534
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply candidate to the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          cp manifest-candidate/generated-SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          rm -rf manifest-candidate
          rm -f .github/workflows/apply-source-manifest-once.yml
          python scripts/verify_source_manifest.py --candidate /tmp/source-manifest-check.txt
      - name: Commit manifest and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mailsvb2-bot'
          git config user.email 'mailsvb2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Lock autonomous core offline preview provenance'
          git push origin HEAD:agent/core-offline-windows-installer
