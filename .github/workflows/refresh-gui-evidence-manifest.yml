name: Refresh GUI evidence source manifest

on:
  push:
    branches:
      - agent/require-windows-gui-evidence-main

permissions:
  contents: write

jobs:
  refresh-manifest:
    if: ${{ !contains(github.event.head_commit.message, '[manifest-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Regenerate manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-gui-evidence-manifest.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.txt || true
          mv /tmp/SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_MANIFEST_SHA256.txt .github/workflows/refresh-gui-evidence-manifest.yml
          git commit -m "Synchronize GUI evidence source manifest [manifest-refresh]"
          git push origin HEAD:${GITHUB_REF_NAME}
# Second push intentionally triggers this temporary workflow.
