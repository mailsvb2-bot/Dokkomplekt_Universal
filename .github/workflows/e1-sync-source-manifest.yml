name: E1 One-shot Source Manifest Sync

on:
  push:
    branches:
      - canon-v2/e1-accounting-pipeline

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E1 branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e1-accounting-pipeline
          fetch-depth: 0
      - name: Generate exact final source manifest and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/e1-sync-source-manifest.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          test "$(wc -l < SOURCE_MANIFEST_SHA256.txt)" -eq 681
          git diff --check
      - name: Commit exact CI-generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST_SHA256.txt .github/workflows/e1-sync-source-manifest.yml
          git commit -m 'ci: sync E1 source manifest from canonical generator'
          git push origin HEAD:canon-v2/e1-accounting-pipeline
