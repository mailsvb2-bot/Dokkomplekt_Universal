name: Fix audit rustfmt

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-audit-rustfmt-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/fix-all-audit-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply rustfmt and regenerate final manifest
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/agent/fix-all-audit-defects | awk '{print $1}')"
          if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
            echo "Stale rustfmt run; branch already advanced."
            exit 0
          fi
          cargo fmt --all
          cargo fmt --all -- --check
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_v18_4_3_audit_closure.py')
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith('test_') and callable(value)
          )
          for name, function in tests:
              function()
              print(f'PASSED {name}')
          assert len(tests) == 7, len(tests)
          PY
          python3 scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          awk '$2 != ".github/workflows/fix-audit-rustfmt.yml"' \
            /tmp/SOURCE_MANIFEST_SHA256.generated.txt > SOURCE_MANIFEST_SHA256.txt
          git add crates/dokkomplekt-core/src/validators.rs SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply rustfmt to audit validators"
          git push origin HEAD:agent/fix-all-audit-defects
