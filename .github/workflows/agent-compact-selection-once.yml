name: Agent compact selection wiring once

on:
  push:
    branches:
      - agent/legacy-user-parity
    paths:
      - '.github/workflows/agent-compact-selection-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Compact wiring without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch origin "${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """          setSelectedDocIds(res.pack.documents\n            .filter(shouldSelectDocumentByDefault)\n            .map((document) => document.id));\n"""
          new = "          setSelectedDocIds(res.pack.documents.filter(shouldSelectDocumentByDefault).map((document) => document.id));\n"
          if text.count(old) != 1:
              raise SystemExit('selection wiring anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          lines = len(path.read_text(encoding='utf-8').splitlines())
          if lines >= 1550:
              raise SystemExit(f'App.tsx remains oversized: {lines}')
          print(f'App.tsx lines: {lines}')
          PY
          npm ci
          npm run typecheck
          npx vitest run --config vitest.config.ts src/lib/appSupport.selection.test.ts src/App.test.tsx
          git rm .github/workflows/agent-compact-selection-once.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep App selection wiring within module boundary"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          exit 1
