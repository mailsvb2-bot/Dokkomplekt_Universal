name: Source Provenance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr154-watcher-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr154-watcher-handoff-port:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/exhaustive-donor-parity-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply the staged donor handoff patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          python - <<.PY.$/ { active=1; print "python - <<'\''PY'\''"; next }
            active && /^          PY$/ { print "PY"; exit }
            active { sub(/^          /, ""); print }
          ' .github/workflows/pr154-final-watcher-handoff.yml > /tmp/apply-handoff.sh
          test -s /tmp/apply-handoff.sh
          bash /tmp/apply-handoff.sh

      - name: Restore canonical workflow and verify the exact resulting tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr154-final-watcher-handoff.yml
          git show HEAD^:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          cargo fmt --all
          cargo test --workspace watcher_update_handoff -- --nocapture
          cargo check --workspace --all-targets
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          cargo fmt --all -- --check
          git diff --check

      - name: Commit only the verified canonical result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore donor watcher update handoff'
          git push origin HEAD:${{ github.head_ref }}
