name: E2 Harness Self Patch

on:
  push:
    branches:
      - canon-v2/e2-template-learning-proof
    paths:
      - .github/workflows/e2-harness-self-patch.yml

permissions:
  contents: write

concurrency:
  group: e2-harness-self-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 0

      - name: Patch only the non-focusable WebView2 root call
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          harness = Path("tests/installer/windows_installer_contract.ps1")
          raw = harness.read_bytes()
          bom = raw.startswith(b"\xef\xbb\xbf")
          text = raw.decode("utf-8-sig")
          old = """  Activate-LiveAppWindow -Window $currentAppWindow\n  $currentAppWindow.SetFocus()\n  [System.Windows.Forms.SendKeys]::SendWait('{PGDN}')\n"""
          new = """  Activate-LiveAppWindow -Window $currentAppWindow\n  # The top-level WebView2 UIA root may be non-focusable. Foreground activation of\n  # its native HWND is sufficient for real keyboard routing and avoids a false UIA failure.\n  Start-Sleep -Milliseconds 100\n  [System.Windows.Forms.SendKeys]::SendWait('{PGDN}')\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one E2 PageDown focus sequence, found {count}")
          text = text.replace(old, new, 1)
          encoded = text.encode("utf-8")
          if bom:
              encoded = b"\xef\xbb\xbf" + encoded
          harness.write_bytes(encoded)

          digest = hashlib.sha256(encoded).hexdigest()
          manifest = Path("SOURCE_MANIFEST_SHA256.txt")
          manifest_text = manifest.read_text(encoding="utf-8")
          path = "tests/installer/windows_installer_contract.ps1"
          lines = manifest_text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith("  " + path)]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one manifest entry for {path}, found {len(matches)}")
          lines[matches[0]] = f"{digest}  {path}"
          newline = "\r\n" if "\r\n" in manifest_text else "\n"
          manifest.write_text(newline.join(lines) + newline, encoding="utf-8", newline="")
          print(f"updated harness sha256={digest}")

      - name: Remove bootstrap workflow from final tree
        shell: bash
        run: rm -f .github/workflows/e2-harness-self-patch.yml

      - name: Prove and publish the surgical patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -F 'SOURCE_MANIFEST_SHA256.txt'
          printf '%s\n' "$changed" | grep -F 'tests/installer/windows_installer_contract.ps1'
          printf '%s\n' "$changed" | grep -F '.github/workflows/e2-harness-self-patch.yml'
          git config user.name 'mailsvb2-bot'
          git config user.email '254540704+mailsvb2-bot@users.noreply.github.com'
          git add SOURCE_MANIFEST_SHA256.txt tests/installer/windows_installer_contract.ps1 .github/workflows/e2-harness-self-patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'test: avoid focusing non-focusable WebView2 root'
          git push origin HEAD:canon-v2/e2-template-learning-proof
