name: Agent format PR142

on:
  push:
    branches:
      - agent/donor-medical-source-parity-20260817
    paths:
      - .github/workflows/agent-format-pr142.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-medical-source-parity-20260817
          fetch-depth: 0
      - name: Apply rustfmt and remove one-shot workflow
        shell: bash
        run: |
          cargo fmt --all
          rm .github/workflows/agent-format-pr142.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/source_parser.rs .github/workflows/agent-format-pr142.yml
          git diff --cached --check
          git commit -m "Format donor medical parser"
          git push origin HEAD:agent/donor-medical-source-parity-20260817
