name: Agent materialize PR167 output bootstrap diagnostics
on:
  push:
    paths:
      - '.agent-pr167-diag-trigger'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-template-publication-18.4.4
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .agent-pr167-diag.patch.gz | awk '{print $1}')" = '0edde3bf90d5e02d1d6efa278a14f7d0b540a2565afde9c3dce5948a5b747d7f'
          gzip -dc .agent-pr167-diag.patch.gz > /tmp/pr167-diag.patch
          test "$(sha256sum /tmp/pr167-diag.patch | awk '{print $1}')" = 'fb0fe96d4d2d97147330b9d8d8f87750f48c466aedbd57b69252f9f155ace90e'
      - name: Materialize exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .agent-pr167-diag.patch.gz .agent-pr167-diag-trigger .github/workflows/agent-materialize-pr167-diag.yml
          git apply --index /tmp/pr167-diag.patch
          git diff --check --cached
          python3 scripts/verify_source_manifest.py
          tree="$(git write-tree)"
          test "$tree" = '032351fee47f91dc7cf8cf8a5837dc505f86cb6f'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expose installed-app output bootstrap failures'
          test "$(git rev-parse HEAD^{tree})" = '032351fee47f91dc7cf8cf8a5837dc505f86cb6f'
          git push origin HEAD:agent/fix-template-publication-18.4.4
