name: Apply complete audit fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-complete-audit-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-all-audit-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the locally validated complete patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/audit-fix.patch.gz.b64.part1 .github/audit-fix.patch.gz.b64.part2 \
            | base64 --decode \
            | gzip --decompress > /tmp/audit.patch
          test "$(sha256sum /tmp/audit.patch | awk '{print $1}')" = "9b5203b88487a78d29570059b1689559420278849a19ec358ff8b5b9b5a457e0"
          git apply --binary --index --exclude=SOURCE_MANIFEST_SHA256.txt /tmp/audit.patch
          python3 scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt
          git rm \
            .github/audit-fix.patch.gz.b64.part1 \
            .github/audit-fix.patch.gz.b64.part2 \
            .github/workflows/apply-audit-fix.yml
          python3 -m pytest -q tests/test_v18_4_3_audit_closure.py
          python3 scripts/verify_source_manifest.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close audit-critical payment, validation and release gaps"
          git push origin HEAD:agent/fix-all-audit-defects
