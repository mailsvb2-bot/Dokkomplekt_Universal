name: Fix nanoid audit blocker

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: agent-fix-nanoid-audit
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-processing-guard-fencing
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply compatible npm security lockfile update
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before
          npm audit fix --package-lock-only
          cmp --silent package.json /tmp/package.json.before || {
            echo 'package.json changed unexpectedly' >&2
            git diff -- package.json >&2
            exit 1
          }
      - name: Install exact updated dependency graph
        run: npm ci
      - name: Require clean npm audit
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Production frontend build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated lockfile fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-nanoid-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update transitive nanoid security fix"
          git fetch origin agent/fix-processing-guard-fencing
          git rebase origin/agent/fix-processing-guard-fencing
          git push origin HEAD:agent/fix-processing-guard-fencing
