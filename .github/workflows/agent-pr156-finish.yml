name: PR156 one-shot strict gate fix

on:
  push:
    branches:
      - agent/universal-donor-user-flow-20260819

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/universal-donor-user-flow-20260819
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Fix strict Rust gate and regenerate exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          file='src-tauri/src/universal_intake/archive.rs'
          test "$(grep -c '^use std::io::Write as _;$' "$file")" = 1
          sed -i '/^use std::io::Write as _;$/d' "$file"
          ! grep -q '^use std::io::Write as _;$' "$file"

          # The helper must not participate in the final source tree or manifest.
          rm -f .github/workflows/agent-pr156-finish.yml

          cargo fmt --all -- --check

          candidate="$(mktemp)"
          python scripts/verify_source_manifest.py --candidate "$candidate" >/tmp/source-manifest-before.json || true
          test -s "$candidate"
          cp "$candidate" SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py >/tmp/source-manifest-after.json

          git diff --check

      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'Fix strict Rust compile gate'
          git push origin HEAD:agent/universal-donor-user-flow-20260819
