name: Deep donor parity fix once

on:
  push:
    branches: [fix/medical-diary-source-parity-20260815]

permissions:
  contents: write

concurrency:
  group: deep-donor-parity-fix-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/medical-diary-source-parity-20260815
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply audited parity fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Domain router: only Medical may project medical legacy aliases. A legal/HR/custom
          # document cannot acquire medical behavior even if a role id happens to collide.
          path = 'crates/dokkomplekt-core/src/domains/mod.rs'
          marker = 'pub mod medical_semantics;\n'
          addition = dedent('''

          /// Prepare an ephemeral case for one document render.
          ///
          /// Profession-specific compatibility belongs behind this domain boundary. Persistent
          /// semantic storage is never rewritten, and non-medical domains are returned unchanged.
          pub fn case_for_document_render(
              case: &crate::SemanticCase,
              category: &crate::DomainKind,
              role_id: &str,
          ) -> crate::SemanticCase {
              match category {
                  crate::DomainKind::Medical => {
                      medical_semantics::case_for_medical_document_render(case, role_id)
                  }
                  _ => case.clone(),
              }
          }

          #[cfg(test)]
          mod render_case_tests {
              use super::*;
              use crate::{SemanticCase, SemanticValue, ValueSource};

              fn put(case: &mut SemanticCase, field_id: &str, value: &str) {
                  case.values.insert(
                      field_id.to_string(),
                      SemanticValue::new(field_id, value, ValueSource::UserConfirmed, 1.0),
                  );
              }

              #[test]
              fn document_render_scopes_medical_role_without_medicalizing_other_domains() {
                  let mut case = SemanticCase::default();
                  put(
                      &mut case,
                      medical_semantics::VK_MSE_PROTOCOL_NUMBER,
                      "MSE-10",
                  );

                  let medical = case_for_document_render(&case, &crate::DomainKind::Medical, "vk_mse");
                  let legal = case_for_document_render(&case, &crate::DomainKind::Legal, "vk_mse");

                  assert_eq!(medical.get("medical.protocol_number"), Some("MSE-10"));
                  assert_eq!(legal.get("medical.protocol_number"), None);
                  assert_eq!(case.get("medical.protocol_number"), None);
              }
          }
          ''').lstrip('\n')
          replace_once(path, marker, marker + addition)

          # Manual single render: stable document role/category, not template wording, drives aliases.
          path = 'src-tauri/src/subsystems/document_commands.rs'
          old = dedent('''
              let render_result = render_docx_with_assets(
                  &app,
                  template_snapshot.path(),
                  &reservation.path,
                  &hydrated.case,
                  req.strict,
                  permit.watermark.as_deref(),
              );
          ''').lstrip('\n')
          new = dedent('''
              let render_case = dokkomplekt_core::domains::case_for_document_render(
                  &hydrated.case,
                  &doc.category,
                  &doc.role_id,
              );
              let render_result = render_docx_with_assets(
                  &app,
                  template_snapshot.path(),
                  &reservation.path,
                  &render_case,
                  req.strict,
                  permit.watermark.as_deref(),
              );
          ''').lstrip('\n')
          replace_once(path, old, new)

          # Manual batch render: each selected document gets its own role-scoped ephemeral case.
          old = dedent('''
                      if let Err(error) = render_docx_with_assets(
                          &app,
                          template_snapshot.path(),
                          &reservation.path,
                          &hydrated.case,
                          req.strict,
                          permit.watermark.as_deref(),
                      ) {
          ''').lstrip('\n')
          new = dedent('''
                      let render_case = dokkomplekt_core::domains::case_for_document_render(
                          &hydrated.case,
                          &document.category,
                          &document.role_id,
                      );
                      if let Err(error) = render_docx_with_assets(
                          &app,
                          template_snapshot.path(),
                          &reservation.path,
                          &render_case,
                          req.strict,
                          permit.watermark.as_deref(),
                      ) {
          ''').lstrip('\n')
          replace_once(path, old, new)

          # Make the post-render verifier reusable by sibling zero-touch runtime.
          replace_once(
              path,
              'fn ensure_rendered_document_complete(\n',
              'pub(super) fn ensure_rendered_document_complete(\n',
          )

          # Zero-touch/background render: same stable role projection AND same verification of
          # the actual generated DOCX before it can be counted/published.
          path = 'src-tauri/src/subsystems/automation_runtime.rs'
          old = dedent('''
                                  render_docx_with_assets(
                                      app,
                                      template_snapshot.path(),
                                      &out_path,
                                      &hydrated.case,
                                      true,
                                      permit.watermark.as_deref(),
                                  )
                                  .map_err(|e| format!("Не создан «{}»: {e}", doc.button_label))?;
                                  rerendered_documents = rerendered_documents.saturating_add(1);
          ''').lstrip('\n')
          new = dedent('''
                                  let render_case = dokkomplekt_core::domains::case_for_document_render(
                                      &hydrated.case,
                                      &doc.category,
                                      &doc.role_id,
                                  );
                                  render_docx_with_assets(
                                      app,
                                      template_snapshot.path(),
                                      &out_path,
                                      &render_case,
                                      true,
                                      permit.watermark.as_deref(),
                                  )
                                  .map_err(|e| format!("Не создан «{}»: {e}", doc.button_label))?;
                                  super::document_commands::ensure_rendered_document_complete(
                                      doc,
                                      &template_text,
                                      &hydrated.case,
                                      &out_path,
                                  )?;
                                  rerendered_documents = rerendered_documents.saturating_add(1);
          ''').lstrip('\n')
          replace_once(path, old, new)

          # Persist the profession-neutral output root as a user preference.
          path = 'src/lib/appSupport.ts'
          replace_once(
              path,
              "export const OUTPUT_PREFS_KEY = 'dokkomplekt.output-folder-parts.v1';\n",
              "export const OUTPUT_PREFS_KEY = 'dokkomplekt.output-folder-parts.v1';\nexport const OUTPUT_ROOT_KEY = 'dokkomplekt.output-root.v1';\n",
          )
          marker = 'export function loadOutputFolderParts(): FolderNamePartDto[] {'
          helper = dedent('''
          export function loadOutputRoot(): string {
            try {
              const value = localStorage.getItem(OUTPUT_ROOT_KEY)?.trim();
              if (value) return value;
            } catch { /* use generic local default */ }
            return 'output/Готовые документы';
          }

          export function saveOutputRoot(value: string): void {
            const normalized = value.trim();
            if (!normalized) return;
            try { localStorage.setItem(OUTPUT_ROOT_KEY, normalized); } catch { /* storage may be unavailable */ }
          }

          ''').lstrip('\n')
          replace_once(path, marker, helper + marker)

          path = 'src/App.tsx'
          replace_once(
              path,
              '  errorMessage, fileLabel, inferGuidedMarkupAction, loadAutoPrintPreference, loadOutputFolderParts,\n',
              '  errorMessage, fileLabel, inferGuidedMarkupAction, loadAutoPrintPreference, loadOutputFolderParts, loadOutputRoot,\n',
          )
          replace_once(
              path,
              '  loadPrintCopyPreferences, newDocumentId, normalizeCopyCount, promptToPopupField, readFileBytes,\n',
              '  loadPrintCopyPreferences, newDocumentId, normalizeCopyCount, promptToPopupField, readFileBytes, saveOutputRoot,\n',
          )
          replace_once(
              path,
              "  const [outputRoot, setOutputRoot] = useState('output/Готовые документы');\n",
              '  const [outputRoot, setOutputRoot] = useState(loadOutputRoot);\n',
          )
          marker = dedent('''
            useEffect(() => {
              void updateBackgroundWatcherPreferences(autoPrint, printCopies).catch(() => {
          ''').lstrip('\n')
          insertion = dedent('''
            useEffect(() => {
              saveOutputRoot(outputRoot);
            }, [outputRoot]);

          ''').lstrip('\n')
          replace_once(path, marker, insertion + marker)

          path = 'src/lib/appSupport.selection.test.ts'
          replace_once(
              path,
              "import { shouldSelectDocumentByDefault } from './appSupport';\n",
              "import { loadOutputRoot, OUTPUT_ROOT_KEY, saveOutputRoot, shouldSelectDocumentByDefault } from './appSupport';\n",
          )
          marker = "describe('default document selection', () => {"
          tests = dedent('''
          describe('output root persistence', () => {
            it('remembers the user-selected generic output folder across restarts', () => {
              localStorage.removeItem(OUTPUT_ROOT_KEY);
              expect(loadOutputRoot()).toBe('output/Готовые документы');
              saveOutputRoot('  D:/Работа/Готовые документы  ');
              expect(loadOutputRoot()).toBe('D:/Работа/Готовые документы');
            });

            it('does not replace a remembered folder with an empty edit', () => {
              localStorage.setItem(OUTPUT_ROOT_KEY, 'C:/Documents/Ready');
              saveOutputRoot('   ');
              expect(loadOutputRoot()).toBe('C:/Documents/Ready');
            });
          });

          ''').lstrip('\n')
          replace_once(path, marker, tests + marker)
          PY

          cargo fmt --all
          rm .github/workflows/deep-donor-parity-fix-once.yml

      - name: Targeted Rust regression
        run: cargo test -p dokkomplekt-core document_render_scopes_medical_role_without_medicalizing_other_domains
      - name: Targeted UI regression
        run: |
          npm ci
          npx vitest run --config vitest.config.ts src/lib/appSupport.selection.test.ts
      - name: Compile Tauri runtime paths
        run: cargo check -p dokkomplekt-tauri
      - name: Commit audited fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dokkomplekt-core/src/domains/mod.rs \
                  src-tauri/src/subsystems/document_commands.rs \
                  src-tauri/src/subsystems/automation_runtime.rs \
                  src/lib/appSupport.ts src/lib/appSupport.selection.test.ts src/App.tsx \
                  .github/workflows/deep-donor-parity-fix-once.yml
          git diff --cached --check
          git commit -m "fix: preserve donor document completion contracts"
          git push origin HEAD:fix/medical-diary-source-parity-20260815
