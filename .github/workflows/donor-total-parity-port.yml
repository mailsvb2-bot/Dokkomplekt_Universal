      - name: Format and test changed canonical owners
        run: |
          cargo fmt --all -- --check
          cargo test -p dokkomplekt-core --test donor_labs_legacy_parity
          cargo test -p dokkomplekt-core field_aliases
          cargo test --manifest-path src-tauri/Cargo.toml plain_text_decoder_preserves_utf8_bom_and_windows_1251
          cargo check --workspace --all-targets
      - name: Remove helper and refresh exact source manifest
        run: |
          rm .github/workflows/donor-total-parity-port.yml
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json || true
          test -s verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          rm -f verification/ci/SOURCE_MANIFEST_SHA256.generated.txt verification/ci/source-manifest-report.json
          git status --short
      - name: Commit clean canonical port
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Port remaining laboratory and CP1251 donor contracts"
          git push origin HEAD:agent/donor-total-parity-20260819
