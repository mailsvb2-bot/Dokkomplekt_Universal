name: PR 154 one-shot repair

on:
  push:
    branches:
      - agent/exhaustive-donor-parity-20260819

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/exhaustive-donor-parity-20260819
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Repair formatting and provenance atomically
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --all
          rm -f .github/workflows/pr154-one-shot-repair.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          cargo +1.97.1 fmt --all -- --check
          python scripts/verify_source_manifest.py
          git diff --check

      - name: Commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'ci: normalize rustfmt and source provenance'
          git push origin HEAD:agent/exhaustive-donor-parity-20260819
