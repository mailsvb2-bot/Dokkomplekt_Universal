name: Windows Hardware E2E

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact protected main commit SHA approved for production hardware validation
        required: true
        type: string
      reboot_phase:
        description: Prepare real reboot evidence first, then verify it after reboot
        required: false
        default: verify
        type: choice
        options:
          - prepare
          - verify
      request_id:
        description: Reuse the correlation UUID returned by prepare; required for verify
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # Match the private repository's single production-hardware concurrency domain.
  # Prepare and verify must never dispatch overlapping private runs, otherwise a
  # healthy runner can look offline while the newer run is legitimately queued.
  group: windows-hardware-e2e
  cancel-in-progress: false

jobs:
  dispatch-private-hardware-validation:
    name: Dispatch private Windows hardware validation
    if: github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    environment: windows-hardware-dispatch
    timeout-minutes: 250
    env:
      DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY: mailsvb2-bot/Dokkomplekt_Hardware_Validation
      DOKKOMPLEKT_HARDWARE_VALIDATION_WORKFLOW: windows-hardware-e2e.yml
      DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN: ${{ secrets.DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove exact public source identity and private target configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.release_sha }}' != "$(git rev-parse HEAD)" ]]; then
            echo 'checkout does not match approved release_sha' >&2
            exit 1
          fi
          if [[ ! "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY" =~ ^[^/]+/[^/]+$ ]]; then
            echo 'DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY must be owner/private-repository' >&2
            exit 1
          fi
          if [[ "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            echo 'hardware validation must not execute in the public source repository' >&2
            exit 1
          fi
          if [[ -z "$DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN" ]]; then
            echo 'DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN is required in protected environment windows-hardware-dispatch' >&2
            exit 1
          fi
      - name: Dispatch, wait and enforce private hardware verdict
        shell: bash
        run: >-
          python scripts/dispatch_private_hardware_validation.py
          --source-repository "$GITHUB_REPOSITORY"
          --target-repository "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY"
          --workflow "$DOKKOMPLEKT_HARDWARE_VALIDATION_WORKFLOW"
          --target-ref main
          --release-sha "${{ inputs.release_sha }}"
          --reboot-phase "${{ inputs.reboot_phase }}"
          --request-id "${{ inputs.request_id }}"
          --json-report verification/release/PRIVATE_HARDWARE_DISPATCH.json
      - name: Publish reboot correlation identity
        if: always()
        shell: bash
        run: |
          if [[ ! -f verification/release/PRIVATE_HARDWARE_DISPATCH.json ]]; then
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path('verification/release/PRIVATE_HARDWARE_DISPATCH.json').read_text(encoding='utf-8'))
          print('### Windows hardware correlation')
          print(f"- phase: `{report.get('reboot_phase', '')}`")
          print(f"- release SHA: `{report.get('release_sha', '')}`")
          print(f"- request ID: `{report.get('request_id', '')}`")
          if report.get('reboot_phase') == 'prepare' and report.get('request_id'):
              print('- Reuse this exact request ID for the `verify` phase after the real Windows reboot.')
          PY
      - name: Upload private hardware dispatch evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Private-Hardware-Dispatch-${{ inputs.reboot_phase }}
          path: verification/release/PRIVATE_HARDWARE_DISPATCH.json
          if-no-files-found: warn
