name: E1 Installed UI Transition Fix Once

on:
  push:
    branches: [canon-v2/e1-accounting-pipeline]

permissions:
  contents: write

concurrency:
  group: e1-installed-ui-transition-fix-once
  cancel-in-progress: false

jobs:
  fix-and-prove:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse baseline installed UI transition driver, prove it, sync manifest, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='e5f740f8ad0f68f94a5e7595b8e62f43bfe33310'
          workflow='.github/workflows/e1-installed-ui-transition-fix-once.yml'
          e1='tests/installer/windows_e1_accounting_contract.ps1'
          contract='tests/test_e1_windows_installed_accounting_contract.py'

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/installer/windows_e1_accounting_contract.ps1')
          raw = path.read_bytes()
          assert raw.startswith(b'\xef\xbb\xbf')
          text = raw[3:].decode('utf-8')

          anchor = '''function Invoke-UiElementPhysically {\n'''
          helper = r'''function Invoke-UiElement {
            param([Parameter(Mandatory = $true)]$Element, [string]$Description = 'UI element')
            try {
              if (-not $Element.Current.IsEnabled) { throw "$Description is disabled" }
              if ($Element.Current.IsOffscreen -and $Element.Current.IsScrollItemPatternAvailable) {
                $Element.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView()
                Start-Sleep -Milliseconds 100
              }
              if ($Element.Current.IsInvokePatternAvailable) {
                $Element.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                return
              }
              if ($Element.Current.IsLegacyIAccessiblePatternAvailable) {
                $Element.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern).DoDefaultAction()
                return
              }
              Invoke-UiElementPhysically -Element $Element -Description $Description
            } catch {
              throw "Live E1 UI action failed for '$Description': $($_.Exception.Message)"
            }
          }

          function Invoke-UiActionFromProbe {
            param([Parameter(Mandatory = $true)][scriptblock]$ActionProbe, [Parameter(Mandatory = $true)][string]$Description)
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              try { $action = & $ActionProbe } catch {
                if (-not (Test-UiaTransientTimeout -ErrorRecord $_)) { throw }
                $action = $null
              }
              if ($null -eq $action) { Start-Sleep -Milliseconds 100; continue }
              try {
                Invoke-UiElement -Element $action -Description $Description
                return
              } catch {
                if ([DateTime]::UtcNow -ge $deadline) {
                  throw "E1 UI timeout invoking live action: $Description. Last error: $($_.Exception.Message)"
                }
                Start-Sleep -Milliseconds 100
              }
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "E1 UI timeout invoking live action: $Description"
          }

          function Invoke-UiActionWithObservedTransition {
            param(
              [Parameter(Mandatory = $true)][scriptblock]$ActionProbe,
              [Parameter(Mandatory = $true)][scriptblock]$TransitionProbe,
              [Parameter(Mandatory = $true)][string]$Description,
              [Parameter(Mandatory = $true)][string]$TransitionDescription,
              [int]$TransitionSeconds = 5
            )
            Invoke-UiActionFromProbe -ActionProbe $ActionProbe -Description $Description

            $deadline = [DateTime]::UtcNow.AddSeconds($TransitionSeconds)
            do {
              try { $transition = & $TransitionProbe } catch {
                if (-not (Test-UiaTransientTimeout -ErrorRecord $_)) { throw }
                $transition = $null
              }
              if ($null -ne $transition) { return $transition }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $deadline)

            $retryAction = $null
            $actionStateDeadline = [DateTime]::UtcNow.AddSeconds(2)
            do {
              try { $retryAction = & $ActionProbe } catch {
                if (-not (Test-UiaTransientTimeout -ErrorRecord $_)) { throw }
                $retryAction = $null
              }
              if ($null -ne $retryAction) { break }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $actionStateDeadline)

            if ($null -eq $retryAction) {
              Write-Host "E1 UI action '$Description' is already in-flight; waiting for '$TransitionDescription' without a duplicate click."
              return Wait-UiElement -Description $TransitionDescription -TimeoutSeconds 30 -Probe $TransitionProbe
            }

            Write-Host "E1 UI action '$Description' produced no observable transition and remains actionable; retrying once with physical input."
            Invoke-UiActionPhysicallyFromProbe -ActionProbe $ActionProbe -Description "$Description physical retry"
            return Wait-UiElement -Description $TransitionDescription -TimeoutSeconds 30 -Probe $TransitionProbe
          }

          '''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper + anchor, 1)

          old_template = r'''Invoke-UiActionPhysicallyFromProbe -Description 'Добавить шаблоны for E1 Accounting' -ActionProbe {
            $window = Find-LiveAppWindow
            if ($null -eq $window) { return $null }
            Find-ReadyButtonByNames -Root $window -Names @('Добавить шаблоны')
          }
          $templateDialog = Wait-UiElement -Description 'native template picker for E1 Accounting' -Probe { Find-FileDialog }
          '''
          new_template = r'''$templateDialog = Invoke-UiActionWithObservedTransition `
            -Description 'Добавить шаблоны for E1 Accounting' `
            -TransitionDescription 'native template picker for E1 Accounting' `
            -ActionProbe {
              $window = Find-LiveAppWindow
              if ($null -eq $window) { return $null }
              Find-ReadyButtonByNames -Root $window -Names @('Добавить шаблоны')
            } `
            -TransitionProbe { Find-FileDialog }
          '''
          assert text.count(old_template) == 1
          text = text.replace(old_template, new_template, 1)

          old_source = r'''Invoke-UiActionPhysicallyFromProbe -Description 'Replace source with E1 Accounting source' -ActionProbe {
            $window = Find-LiveAppWindow
            if ($null -eq $window) { return $null }
            Find-ReadyButtonByNames -Root $window -Names @('Заменить исходный файл', 'Выбрать исходный файл')
          }
          $sourceDialog = Wait-UiElement -Description 'native source picker for E1 Accounting' -Probe { Find-FileDialog }
          '''
          new_source = r'''$sourceDialog = Invoke-UiActionWithObservedTransition `
            -Description 'Replace source with E1 Accounting source' `
            -TransitionDescription 'native source picker for E1 Accounting' `
            -ActionProbe {
              $window = Find-LiveAppWindow
              if ($null -eq $window) { return $null }
              Find-ReadyButtonByNames -Root $window -Names @('Заменить исходный файл', 'Выбрать исходный файл')
            } `
            -TransitionProbe { Find-FileDialog }
          '''
          assert text.count(old_source) == 1
          text = text.replace(old_source, new_source, 1)
          path.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))

          contract = Path('tests/test_e1_windows_installed_accounting_contract.py')
          ctext = contract.read_text()
          contract_anchor = '''    assert "neither ValuePattern, LegacyIAccessible value, nor a native HWND" in source\n'''
          additions = '''    assert "function Invoke-UiActionWithObservedTransition" in source\n    assert "produced no observable transition and remains actionable; retrying once with physical input" in source\n    assert "$templateDialog = Invoke-UiActionWithObservedTransition" in source\n    assert "$sourceDialog = Invoke-UiActionWithObservedTransition" in source\n    assert "-TransitionProbe { Find-FileDialog }" in source\n'''
          assert ctext.count(contract_anchor) == 1
          contract.write_text(ctext.replace(contract_anchor, contract_anchor + additions, 1))
          PY

          git diff --check
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pytest -q tests/test_e1_windows_installed_accounting_contract.py
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath '$e1' -Raw -Encoding UTF8))"
          fi

          git rm "$workflow"
          changed_before_manifest="$(git diff HEAD --name-only | sort)"
          expected_before_manifest="$(printf '%s\n' "$e1" "$contract" "$workflow" | sort)"
          test "$changed_before_manifest" = "$expected_before_manifest"

          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add "$e1" "$contract" SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt \
            --json-report /tmp/source-manifest-recheck.json
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.recheck.txt

          git config user.name 'Dokkomplekt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test: reuse proven installed UI transition driver for E1'
          git push origin HEAD:refs/heads/canon-v2/e1-accounting-pipeline
