name: CI Unify Diary Signatures Once

on:
  push:
    branches: [fix/ci-quality-gate-20260726]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
      - name: Unify department-head signature wording and duplicate detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = Path('crates/dokkomplekt-core/tests/legacy_behavior_contracts.rs')
          text = legacy.read_text(encoding='utf-8')
          old = 'assert!(text.contains("Зав. отделением"));'
          new = 'assert!(text.contains("Заведующий отделением"));'
          if text.count(old) != 1:
              raise SystemExit('legacy assertion count mismatch')
          legacy.write_text(text.replace(old, new), encoding='utf-8')

          port = Path('crates/dokkomplekt-core/src/functional_port.rs')
          text = port.read_text(encoding='utf-8')
          old_condition = 'if !lower.contains("зав. отдел") && !lower.contains("зав отдел") {'
          new_condition = 'if !lower.contains("заведующий отдел")\n        && !lower.contains("зав. отдел")\n        && !lower.contains("зав отдел")\n    {'
          if text.count(old_condition) != 1:
              raise SystemExit('functional signature condition count mismatch')
          text = text.replace(old_condition, new_condition)
          old_output = 'out.push_str("\\nЗав. отделением _______________");'
          new_output = 'out.push_str("\\nЗаведующий отделением _______________");'
          if text.count(old_output) != 1:
              raise SystemExit('functional signature output count mismatch')
          text = text.replace(old_output, new_output)
          old_test = 'assert!(text.contains("Зав. отделением"));'
          new_test = 'assert!(text.contains("Заведующий отделением"));'
          if text.count(old_test) != 1:
              raise SystemExit('functional signature test count mismatch')
          port.write_text(text.replace(old_test, new_test), encoding='utf-8')
          PY
          cargo fmt --all
          rm -f .github/workflows/ci-unify-diary-signatures-once.yml
      - name: Commit focused repair and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/functional_port.rs crates/dokkomplekt-core/tests/legacy_behavior_contracts.rs .github/workflows/ci-unify-diary-signatures-once.yml
          git commit -m "fix(diaries): unify department-head signatures"
          git push origin HEAD:fix/ci-quality-gate-20260726
