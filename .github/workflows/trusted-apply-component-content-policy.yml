name: Trusted apply component content policy

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-component-content-pack-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-component-content-pack-policy
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          transport='.github/patches/component-content-policy.patch.gz.b64'
          gzip_path="$RUNNER_TEMP/component-content-policy.patch.gz"
          patch_path="$RUNNER_TEMP/component-content-policy.patch"
          base64 --decode "$transport" > "$gzip_path"
          echo '358ad995187ebfbd693f2cb6d48c8dd93ba7353ccf2259a0ec386a474d7e2f86  '"$gzip_path" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_path" > "$patch_path"
          echo '7530c2dead15dc0876490563187fcfc756a001c10fc8077a7ca98833d7577788  '"$patch_path" | sha256sum --check --strict
          git apply --check --whitespace=error-all "$patch_path"
          git apply --whitespace=error-all "$patch_path"
          git rm \
            .github/patches/component-content-policy.patch.gz.b64 \
            .github/patches/component-content-policy.trigger
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt scripts tests
      - name: Verify targeted and source regression wall
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m py_compile \
            scripts/build_component_packs.py \
            scripts/validate_content_pack.py
          python -m pytest -q \
            tests/test_component_content_policy.py \
            tests/test_v18_1_0_content_pack_sdk.py \
            tests/test_v18_2_0_component_delivery_contracts.py
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Commit verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Harden component and content-pack release policy'
          git push origin HEAD:agent/harden-component-content-pack-policy
