name: Finalize Native Template Picker Fix

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write
  issues: write

jobs:
  finalize-fix:
    if: ${{ github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SERVICE_ISSUE: '48'
    steps:
      - name: Mark finalizer start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': f"Native picker finalizer run {os.environ['RUN_ID']} started."}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-native-template-picker
          fetch-depth: 0
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Rebuild clean branch on current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          old_head="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD origin/main)"
          echo "OLD_HEAD=$old_head" >> "$GITHUB_ENV"

          if [[ "$merge_base" == "$main_head" ]]; then
            echo "NEEDS_PUSH=0" >> "$GITHUB_ENV"
            python scripts/verify_source_manifest.py
            python -m pytest -q tests/test_v18_4_4_native_template_picker.py tests/test_v18_3_0_hardening_contracts.py
            exit 0
          fi

          git diff --binary "$merge_base" HEAD -- \
            src-tauri/src/main.rs \
            src-tauri/src/subsystems/update_runtime.rs \
            src-tauri/src/subsystems/template_picker.rs \
            src/App.scenarios.test.tsx \
            src/App.test.tsx \
            src/App.tsx \
            src/components/DocumentRail.tsx \
            src/lib/api.contract.test.ts \
            src/lib/api.ts \
            src/lib/runtimeValidation.ts \
            tests/e2e/first_run.spec.ts \
            tests/installer/windows_installer_contract.ps1 \
            tests/test_v18_3_0_hardening_contracts.py \
            tests/test_v18_4_4_native_template_picker.py \
            > /tmp/native-picker-product.patch
          test -s /tmp/native-picker-product.patch

          git reset --hard origin/main
          git clean -fd
          git apply --check /tmp/native-picker-product.patch
          git apply /tmp/native-picker-product.patch
          rm -f .github/workflows/apply-native-template-picker-fix.yml
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
          python -m pytest -q tests/test_v18_4_4_native_template_picker.py tests/test_v18_3_0_hardening_contracts.py
          echo "NEEDS_PUSH=1" >> "$GITHUB_ENV"
      - name: Publish finalized branch
        if: ${{ env.NEEDS_PUSH == '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix native first-run template picker"
          git push --force-with-lease=refs/heads/agent/fix-native-template-picker:${OLD_HEAD} origin HEAD:agent/fix-native-template-picker
      - name: Mark finalizer failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = f"Native picker finalizer run {os.environ['RUN_ID']} failed; inspect its Actions log."
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
