name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Compose verified deep-audit runtime fixes
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'agent/deep-audit-runtime-integration'
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          base='c4b7c1bc966d7e473cf9426f3356555de4835b5b'
          git fetch origin \
            agent/print-fail-closed \
            agent/transactional-state-persistence \
            agent/learning-privacy-retention

          git diff --binary "$base" origin/agent/print-fail-closed -- . ':(exclude)SOURCE_MANIFEST_SHA256.txt' > /tmp/print.patch
          git diff --binary "$base" origin/agent/transactional-state-persistence -- . ':(exclude)SOURCE_MANIFEST_SHA256.txt' > /tmp/state.patch
          git diff --binary "$base" origin/agent/learning-privacy-retention -- . ':(exclude)SOURCE_MANIFEST_SHA256.txt' > /tmp/privacy.patch

          test -s /tmp/print.patch
          test -s /tmp/state.patch
          test -s /tmp/privacy.patch
          git apply --3way /tmp/print.patch
          git apply --3way /tmp/state.patch
          git apply --3way /tmp/privacy.patch

          cargo fmt --all --check
          PYTHONPATH=tests python - <<'PY'
          import runpy
          for file_name in (
              'tests/test_print_fail_closed_contract.py',
              'tests/test_transactional_state_persistence_contract.py',
              'tests/test_learning_privacy_retention_contract.py',
          ):
              ns = runpy.run_path(file_name)
              for name in sorted(ns):
                  if name.startswith('test_'):
                      ns[name]()
          p0 = runpy.run_path('tests/test_p0_trust_boundaries.py')
          p0['test_desktop_state_is_loaded_then_applied_and_saved_as_one_snapshot']()
          popup = runpy.run_path('tests/test_v18_0_4_professional_popup_contracts.py')
          for name in sorted(popup):
              if name.startswith('test_'):
                  popup[name]()
          PY
          python scripts/static_quality_gate.py --source-only

          git show 60359ee19a4924f344c9ea0d3e03db69b35213f6:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(runtime): integrate deep-audit state print and privacy hardening"
          git push origin "HEAD:${BRANCH}"
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
