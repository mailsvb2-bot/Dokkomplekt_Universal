name: Apply installed button creation fix

on:
  push:
    branches:
      - agent/fix-installed-button-creation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-installed-button-creation-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-installed-button-creation' || github.ref_name == 'agent/fix-installed-button-creation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-installed-button-creation
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the audited patch
        run: |
          set -euo pipefail
          git apply --check .github/button_creation_fix.patch
          git apply .github/button_creation_fix.patch
          rm .github/button_creation_fix.patch
          rm .github/workflows/apply-installed-button-creation-fix.yml
      - name: Run focused regression contracts
        run: |
          python -m pytest -q \
            tests/test_v18_4_5_installed_button_creation.py \
            tests/test_v18_4_3_proven_first_run_button_flow.py \
            tests/test_v18_4_4_native_template_picker.py
      - name: Regenerate and verify source manifest
        run: |
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
      - name: Commit the clean product change
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt \
            src-tauri/src/subsystems/document_commands.rs \
            tests/installer/windows_installer_contract.ps1 \
            tests/test_v18_4_5_installed_button_creation.py \
            .github/button_creation_fix.patch \
            .github/workflows/apply-installed-button-creation-fix.yml
          git commit -m "Fix installed plain DOCX button creation"
          git push origin HEAD:agent/fix-installed-button-creation
