name: Apply Linux AppImage Runtime Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-linux-appimage-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-linux-appimage-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-linux-appimage-runtime
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply fail-closed AppImage runtime staging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          config_path = Path('src-tauri/tauri.conf.json')
          config = json.loads(config_path.read_text('utf-8'))
          config['bundle']['linux'] = {
              'appimage': {
                  'files': {
                      '/usr/lib/libGLESv2.so.2': 'linux-runtime/libGLESv2.so.2',
                      '/usr/lib/libEGL.so.1': 'linux-runtime/libEGL.so.1',
                      '/usr/lib/libGLdispatch.so.0': 'linux-runtime/libGLdispatch.so.0',
                  }
              }
          }
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', 'utf-8')

          Path('src-tauri/build.rs').write_text(r'''use std::collections::BTreeMap;
          use std::env;
          use std::fs;
          use std::path::PathBuf;
          use std::process::Command;

          const APPIMAGE_GRAPHICS_LIBRARIES: [&str; 3] = [
              "libGLESv2.so.2",
              "libEGL.so.1",
              "libGLdispatch.so.0",
          ];

          fn discover_linux_libraries() -> Result<BTreeMap<String, PathBuf>, String> {
              let output = Command::new("ldconfig")
                  .arg("-p")
                  .output()
                  .map_err(|error| format!("failed to run ldconfig -p: {error}"))?;
              if !output.status.success() {
                  return Err(format!(
                      "ldconfig -p failed with status {}: {}",
                      output.status,
                      String::from_utf8_lossy(&output.stderr)
                  ));
              }
              let mut found = BTreeMap::new();
              for line in String::from_utf8_lossy(&output.stdout).lines() {
                  let Some((left, right)) = line.split_once("=>") else {
                      continue;
                  };
                  let Some(name) = left.split_whitespace().next() else {
                      continue;
                  };
                  if !APPIMAGE_GRAPHICS_LIBRARIES.contains(&name) {
                      continue;
                  }
                  let candidate = PathBuf::from(right.trim());
                  if candidate.is_file() {
                      found.entry(name.to_string()).or_insert(candidate);
                  }
              }
              Ok(found)
          }

          fn stage_appimage_graphics_runtime() -> Result<(), String> {
              if env::var_os("CARGO_CFG_TARGET_OS").as_deref()
                  != Some(std::ffi::OsStr::new("linux"))
              {
                  return Ok(());
              }
              let manifest_dir = PathBuf::from(
                  env::var_os("CARGO_MANIFEST_DIR").ok_or("CARGO_MANIFEST_DIR is missing")?,
              );
              let destination = manifest_dir.join("linux-runtime");
              let discovered = discover_linux_libraries()?;
              let missing = APPIMAGE_GRAPHICS_LIBRARIES
                  .iter()
                  .filter(|name| !discovered.contains_key(**name))
                  .copied()
                  .collect::<Vec<_>>();
              if !missing.is_empty() {
                  return Err(format!(
                      "required AppImage graphics libraries are missing: {}. Install libegl1, libgles2 and libglvnd0.",
                      missing.join(", ")
                  ));
              }
              if destination.exists() {
                  fs::remove_dir_all(&destination).map_err(|error| {
                      format!("failed to clear {}: {error}", destination.display())
                  })?;
              }
              fs::create_dir_all(&destination).map_err(|error| {
                  format!("failed to create {}: {error}", destination.display())
              })?;
              for name in APPIMAGE_GRAPHICS_LIBRARIES {
                  let source = discovered
                      .get(name)
                      .ok_or_else(|| format!("library disappeared during staging: {name}"))?;
                  let target = destination.join(name);
                  fs::copy(source, &target).map_err(|error| {
                      format!(
                          "failed to stage {} as {}: {error}",
                          source.display(),
                          target.display()
                      )
                  })?;
                  let header = fs::read(&target)
                      .map_err(|error| format!("failed to verify {}: {error}", target.display()))?;
                  if !header.starts_with(b"\x7fELF") {
                      return Err(format!(
                          "staged library is not an ELF binary: {}",
                          target.display()
                      ));
                  }
                  println!(
                      "cargo:warning=staged AppImage runtime {name} from {}",
                      source.display()
                  );
              }
              Ok(())
          }

          fn main() {
              if let Err(error) = stage_appimage_graphics_runtime() {
                  panic!("Linux AppImage runtime staging failed: {error}");
              }
              tauri_build::build();
          }
          ''', 'utf-8')

          contract_path = Path('tests/installer/linux_installer_contract.sh')
          contract = contract_path.read_text('utf-8')
          marker = '''  [ -f "$extract_dir/squashfs-root/AppRun" ] || {
            echo "AppImage extraction did not produce AppRun" >&2
            exit 1
          }
          '''
          addition = marker + '''  for required_graphics_lib in libGLESv2.so.2 libEGL.so.1 libGLdispatch.so.0; do
            find "$extract_dir/squashfs-root/usr/lib" -type f -name "$required_graphics_lib" -print -quit | grep -q . || {
              echo "AppImage is missing required graphics runtime: $required_graphics_lib" >&2
              exit 1
            }
          done
          '''
          if marker not in contract:
              raise SystemExit('AppImage contract insertion marker is missing')
          contract_path.write_text(contract.replace(marker, addition), 'utf-8')

          fixture_path = Path('tests/test_linux_installer_smoke_contract.py')
          fixture = fixture_path.read_text('utf-8')
          fixture = fixture.replace(
              'mkdir -p squashfs-root/usr/bin\nprintf',
              'mkdir -p squashfs-root/usr/bin squashfs-root/usr/lib\nfor lib in libGLESv2.so.2 libEGL.so.1 libGLdispatch.so.0; do : > "squashfs-root/usr/lib/$lib"; done\nprintf',
          )
          fixture = fixture.replace(
              'mkdir -p squashfs-root\nprintf',
              'mkdir -p squashfs-root/usr/lib\nfor lib in libGLESv2.so.2 libEGL.so.1 libGLdispatch.so.0; do : > "squashfs-root/usr/lib/$lib"; done\nprintf',
          )
          fixture_path.write_text(fixture, 'utf-8')

          Path('tests/test_linux_appimage_runtime_contract.py').write_text(r'''from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def test_appimage_explicitly_bundles_dlopen_graphics_runtime() -> None:
              config = json.loads((ROOT / "src-tauri/tauri.conf.json").read_text("utf-8"))
              assert config["bundle"]["linux"]["appimage"]["files"] == {
                  "/usr/lib/libGLESv2.so.2": "linux-runtime/libGLESv2.so.2",
                  "/usr/lib/libEGL.so.1": "linux-runtime/libEGL.so.1",
                  "/usr/lib/libGLdispatch.so.0": "linux-runtime/libGLdispatch.so.0",
              }


          def test_build_script_stages_dlopen_only_graphics_libraries_fail_closed() -> None:
              text = (ROOT / "src-tauri/build.rs").read_text("utf-8")
              for name in ("libGLESv2.so.2", "libEGL.so.1", "libGLdispatch.so.0"):
                  assert name in text
              assert 'Command::new("ldconfig")' in text
              assert "required AppImage graphics libraries are missing" in text
              assert 'starts_with(b"\\x7fELF")' in text


          def test_installer_smoke_rejects_host_dependent_appimage() -> None:
              text = (ROOT / "tests/installer/linux_installer_contract.sh").read_text("utf-8")
              for name in ("libGLESv2.so.2", "libEGL.so.1", "libGLdispatch.so.0"):
                  assert name in text
          ''', 'utf-8')
          PY
          python -m pytest -q tests/test_linux_appimage_runtime_contract.py tests/test_linux_installer_smoke_contract.py
          python scripts/build_source_archive.py --output /tmp/dokkomplekt-source.zip --top-level Dokkomplekt_Universal --manifest-json /tmp/source-report.json
          rm -f .github/appimage-fix-trigger .github/workflows/fix-linux-appimage-runtime.yml
      - name: Commit clean product fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Linux AppImage graphics runtime portability"
          git push origin HEAD:agent/fix-linux-appimage-runtime
