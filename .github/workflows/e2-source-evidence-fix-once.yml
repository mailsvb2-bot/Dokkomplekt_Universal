name: E2 Source Evidence Fix Once

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]
    paths: [.github/workflows/e2-source-evidence-fix-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Make source evidence source-owned
        run: python .github/scripts/e2_source_evidence_fix_once.py
      - name: Format
        run: cargo fmt --all
      - name: Compile core
        run: cargo check -p dokkomplekt-core --locked
      - name: Prove source-evidence regressions
        run: |
          cargo test -p dokkomplekt-core --locked completed_only_learning_does_not_claim_source_evidence
          cargo test -p dokkomplekt-core --locked matched_source_examples_own_source_evidence
          cargo test -p dokkomplekt-core --locked learns_variable_field_from_multiple_completed_examples
      - name: Self-clean and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/e2-source-evidence-fix-once.yml
          rm .github/scripts/e2_source_evidence_fix_once.py
          git diff --check
          git config user.name "Dokkomplekt CI"
          git config user.email "dokkomplekt-ci@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/template_wizard.rs .github/workflows/e2-source-evidence-fix-once.yml .github/scripts/e2_source_evidence_fix_once.py
          git commit -m "fix: make template learning evidence source-owned"
          git push origin HEAD:canon-v2/e2-template-learning-proof
