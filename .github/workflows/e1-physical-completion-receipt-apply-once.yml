name: E1 Physical Completion Receipt Apply Once

on:
  push:
    branches: [canon-v2/e1-accounting-pipeline]

permissions:
  contents: write

concurrency:
  group: e1-physical-completion-receipt-apply-once
  cancel-in-progress: false

jobs:
  apply-prove-and-clean:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact proven receipt patches, prove, sync manifest, self-clean
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='06766c964a9f0458b9025b655986bfd101d1cc9a'
          apply_workflow='.github/workflows/e1-physical-completion-receipt-apply-once.yml'
          semantic_patch='.github/e1-physical-completion-receipt.patch'
          rustfmt_patch='.github/e1-physical-completion-receipt-rustfmt.patch'
          callsite_patch='.github/e1-physical-completion-receipt-callsite.patch'
          fix_workflow='.github/workflows/e1-physical-completion-receipt-fix-once.yml'
          recovery_workflow='.github/workflows/e1-physical-completion-receipt-recovery-once.yml'
          diagnose_workflow='.github/workflows/e1-physical-receipt-diagnose-once.yml'
          publication='src-tauri/src/generation_publication.rs'
          commands='src-tauri/src/subsystems/document_commands.rs'
          mail_merge='src-tauri/src/subsystems/automation_mail_merge.rs'
          runtime='src-tauri/src/subsystems/automation_runtime.rs'
          receipt_contract='tests/test_e1_generation_completion_receipt_contract.py'
          installed_contract='tests/installer/windows_e1_accounting_contract.ps1'
          installed_static='tests/test_e1_windows_installed_accounting_contract.py'

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = "$apply_workflow"
          test "$(git hash-object "$semantic_patch")" = '0b07822dcf307052487dbbe385d0c6c283523363'
          test "$(sha256sum "$semantic_patch" | awk '{print $1}')" = '7d1f81e5dba4a209ca5ccbf40a91bc4845f79282635eb2253ca07ade8941fd2b'
          test "$(git hash-object "$rustfmt_patch")" = '1092b0a582e74b5f5e8319169e39c56b40ac65ed'
          test "$(sha256sum "$rustfmt_patch" | awk '{print $1}')" = '99ea19e973922766360ccb6addb04239472561b82ba2c09b5881afe812ab86c9'
          test "$(git hash-object "$callsite_patch")" = '159f53d49bebb167dcd28bd6b7794e8b35d93cec'
          test "$(sha256sum "$callsite_patch" | awk '{print $1}')" = '2bc10ef249e4324f52d7774bf5c4fea82a40103fdfaf3ce1f303653eceff574d'
          test "$(git hash-object "$publication")" = '6bd3ff2cc2bcf4bb913771248c7fb1c598fc64f6'
          test "$(git hash-object "$commands")" = '5b4776a589391cb7124293617f579d88889ebbd7'
          test "$(git hash-object "$mail_merge")" = '533398e06d1b238c8205b9e535c2492a91d5a8fa'
          test "$(git hash-object "$runtime")" = '63f73ccadd2e0e030c0c7df90651c16afbd931c0'

          git apply --check "$semantic_patch"
          git apply "$semantic_patch"
          git apply --check "$rustfmt_patch"
          git apply "$rustfmt_patch"
          git apply --check "$callsite_patch"
          git apply "$callsite_patch"
          git diff --check
          cargo fmt --all -- --check

          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml physical_completion_proof_uses_raw_sha256_not_bundle_digest -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml committed_generation_receipt_is_non_pii_and_bound_to_physical_output -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml committed_generation_receipt_is_idempotent_and_conflict_safe -- --nocapture

          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_e1_generation_completion_receipt_contract.py tests/test_e1_windows_installed_accounting_contract.py
          python scripts/static_quality_gate.py --source-only

          git rm "$semantic_patch" "$rustfmt_patch" "$callsite_patch" \
            "$fix_workflow" "$recovery_workflow" "$diagnose_workflow" "$apply_workflow"

          changed_before_manifest="$(git diff HEAD --name-only | sort)"
          expected_before_manifest="$(printf '%s\n' \
            "$semantic_patch" "$rustfmt_patch" "$callsite_patch" \
            "$fix_workflow" "$recovery_workflow" "$diagnose_workflow" "$apply_workflow" \
            "$publication" "$commands" "$mail_merge" "$runtime" \
            "$receipt_contract" "$installed_contract" "$installed_static" | sort)"
          test "$changed_before_manifest" = "$expected_before_manifest"

          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add -A
          git diff --cached --check
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt \
            --json-report /tmp/source-manifest-recheck.json
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.recheck.txt

          git config user.name 'Dokkomplekt CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: bind completion receipts to physical outputs'
          git push origin HEAD:refs/heads/canon-v2/e1-accounting-pipeline
