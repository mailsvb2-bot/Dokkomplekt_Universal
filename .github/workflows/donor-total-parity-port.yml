              '        "medical.treatment" => 120,\n        "medical.labs" => 121,\n        "medical.labs_without" => 122,\n        DIARY_SCHEDULE_STYLE => 123,'
          )
          replace(
              'crates/dokkomplekt-core/src/popup_profiles.rs',
              '        DIARY_INTRADAY_RHYTHM => 122,\n        DIARY_DAY_START_TIME => 123,\n        DIARY_DAY_END_TIME => 124,',
