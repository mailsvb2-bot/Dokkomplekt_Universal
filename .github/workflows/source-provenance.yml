name: One-time PowerShell syntax repair

on:
  push:
    branches:
      - canon-v2/e2-template-learning-proof

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Repair one missing brace and validate PowerShell AST
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/installer/windows_installer_contract.ps1')
          s = p.read_text(encoding='utf-8-sig')
          old = "    if ($null -ne $currentAppWindow) { Write-E2LearningUiDiagnostic -Root $currentAppWindow\n    throw 'E2 real keyboard generation action produced neither a physical DOCX nor a visible product error.'"
          new = "    if ($null -ne $currentAppWindow) { Write-E2LearningUiDiagnostic -Root $currentAppWindow }\n    throw 'E2 real keyboard generation action produced neither a physical DOCX nor a visible product error.'"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one missing-brace pattern, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8-sig', newline='\n')
          PY
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("tests/installer/windows_installer_contract.ps1", [ref]$tokens, [ref]$errors); if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git checkout bba3a4e94242ee92755399ae5ba561a5f4d78d81 -- .github/workflows/source-provenance.yml
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report-before.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.after.txt --json-report verification/ci/source-manifest-report-after.json
          git diff --check HEAD
          mapfile -t delta < <(git diff --name-only bba3a4e94242ee92755399ae5ba561a5f4d78d81 | sort)
          printf 'Clean delta: %s\n' "${delta[*]}"
          test "${#delta[@]}" -eq 2
          test "${delta[0]}" = 'SOURCE_MANIFEST_SHA256.txt'
          test "${delta[1]}" = 'tests/installer/windows_installer_contract.ps1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/source-provenance.yml tests/installer/windows_installer_contract.ps1 SOURCE_MANIFEST_SHA256.txt
          git commit -m 'test: repair E2 harness PowerShell syntax'
          git push origin HEAD:canon-v2/e2-template-learning-proof