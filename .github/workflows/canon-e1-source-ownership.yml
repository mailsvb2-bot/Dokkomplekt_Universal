name: Canon E1 source ownership one-shot

on:
  push:
    branches:
      - canon-v2/e1-accounting-pipeline
    paths:
      - .github/workflows/canon-e1-source-ownership.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact E1 source-ownership patch
        shell: bash
        run: |
          set -euo pipefail
          echo '4a3740cb9af5e6d7dedd5d27a6aeda740706108196da259c1c0263649ebaa1b7  .github/e1-source-ownership.patch' | sha256sum -c -
          git apply --check .github/e1-source-ownership.patch
          git apply .github/e1-source-ownership.patch
          cargo fmt --all
          git diff --check
      - name: Run exact parser regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dokkomplekt-core accounting_service_act_source_keeps_registered_labels_out_of_multiline_subject
      - name: Run installed Accounting static contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_e1_windows_installed_accounting_contract.py')
          ns['test_e1_accounting_installed_lane_is_real_and_fail_closed']()
          print('E1 installed Accounting static contract PASS')
          PY
      - name: Canonicalize source manifest, self-delete, and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/e1-source-ownership.patch .github/workflows/canon-e1-source-ownership.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-before.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.check.txt --json-report /tmp/source-manifest-check.json
          python - <<'PY'
          import subprocess
          allowed = {
              'SOURCE_MANIFEST_SHA256.txt',
              'crates/dokkomplekt-core/src/source_parser.rs',
              'tests/installer/windows_e1_accounting_contract.ps1',
              'tests/test_e1_windows_installed_accounting_contract.py',
              '.github/e1-source-ownership.patch',
              '.github/workflows/canon-e1-source-ownership.yml',
          }
          changed = {line[3:] for line in subprocess.check_output(['git','status','--short'], text=True).splitlines() if line.strip()}
          extra = changed - allowed
          assert not extra, f'unexpected files changed: {sorted(extra)}'
          required = {
              'SOURCE_MANIFEST_SHA256.txt',
              'crates/dokkomplekt-core/src/source_parser.rs',
              'tests/installer/windows_e1_accounting_contract.ps1',
              'tests/test_e1_windows_installed_accounting_contract.py',
              '.github/e1-source-ownership.patch',
              '.github/workflows/canon-e1-source-ownership.yml',
          }
          missing = required - changed
          assert not missing, f'expected changes missing: {sorted(missing)}'
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E1: prove Accounting source ownership end to end'
          git push origin HEAD:canon-v2/e1-accounting-pipeline
