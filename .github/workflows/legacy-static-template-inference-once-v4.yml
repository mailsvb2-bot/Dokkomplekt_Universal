name: Legacy static template integration v5 (one-shot)

on:
  push:
    branches: [fix/legacy-static-template-intelligence-20260815]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Implement legacy static template intelligence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/legacy-static-template-intelligence-20260815
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply audited v3 source patch and donor parity generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output([
              'git', 'show',
              '22dc8172cd7e1f8264c1ce941f68ae8c7b8da55f:.github/workflows/legacy-static-template-inference-once-v3.yml'
          ], text=True)

          def extract_run(step_name: str) -> str:
              marker = f'      - name: {step_name}\n'
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'missing historical step: {step_name}')
              run_marker = '        run: |\n'
              run_start = source.find(run_marker, start)
              if run_start < 0:
                  raise SystemExit(f'missing run block: {step_name}')
              run_start += len(run_marker)
              next_step = source.find('\n      - name: ', run_start)
              if next_step < 0:
                  raise SystemExit(f'missing next step boundary: {step_name}')
              block = source[run_start:next_step]
              lines = []
              for raw in block.splitlines():
                  if raw.startswith('          '):
                      lines.append(raw[10:])
                  elif not raw.strip():
                      lines.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {step_name}: {raw!r}')
              return '\n'.join(lines) + '\n'

          for index, name in enumerate((
              'Patch audited runtime and UI seams',
              'Prove exact donor F-code parity and create offline lock',
          )):
              script = Path(f'/tmp/legacy-step-{index}.sh')
              script.write_text('set -Eeuo pipefail\n' + extract_run(name), encoding='utf-8')
              subprocess.run(['bash', str(script)], check=True)
          PY

      - name: Make static inference explicit and non-blocking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          text = app_path.read_text(encoding='utf-8')

          state_anchor = "  const [draftDomainOverride, setDraftDomainOverride] = useState<DomainKind | null>(null);\n"
          if 'const [autoInferStaticTemplates, setAutoInferStaticTemplates]' not in text:
              if state_anchor not in text:
                  raise SystemExit('template inference state anchor not found')
              text = text.replace(
                  state_anchor,
                  state_anchor + "  const [autoInferStaticTemplates, setAutoInferStaticTemplates] = useState(false);\n",
                  1,
              )

          for marker in (
              "  async function openTemplateSetup() {\n",
              "  function openTextTemplateSetup() {\n",
          ):
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'missing setup marker: {marker.strip()}')
              insert = pos + len(marker)
              if not text[insert:insert + 120].lstrip().startswith('setAutoInferStaticTemplates(false);'):
                  text = text[:insert] + "    setAutoInferStaticTemplates(false);\n" + text[insert:]

          old_start = "    const confirmedRows = buildTemplateConfirmationRows(rows, pendingTemplates, buttonLabel, draftPopupFields, draftDomainOverride);\n    const staticRows = confirmedRows.filter((row) => row.is_static_copy);\n    let autoInferStaticTemplates = false;\n"
          start = text.find(old_start)
          if start < 0:
              raise SystemExit('generated static inference block start not found')
          end_marker = "    const pack = await run('confirm_template_setup', () => confirmTemplateSetup(confirmedRows, autoInferStaticTemplates));"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('generated static inference block end not found')
          end += len(end_marker)
          replacement = """    const confirmedRows = buildTemplateConfirmationRows(rows, pendingTemplates, buttonLabel, draftPopupFields, draftDomainOverride);
    const staticRows = confirmedRows.filter((row) => row.is_static_copy);
    if (staticRows.length) {
      setStatus(autoInferStaticTemplates
        ? `Безопасная авторазметка включена для ${staticRows.length} статического шаблона(ов): изменяться будут только производные копии с однозначными пустыми зонами.`
        : `Кнопки будут созданы сразу. Неразмеченные шаблоны останутся точными статическими копиями: ${staticRows.map((row) => row.detected_title).join(', ')}.`);
    }
    const pack = await run('confirm_template_setup', () => confirmTemplateSetup(confirmedRows, autoInferStaticTemplates));"""
          text = text[:start] + replacement + text[end:]

          success_anchor = "    setDraftDomainOverride(null);\n    setSetupOpen(false);\n    setStatus(`Кнопки созданы: ${confirmedRows.length}. Теперь добавьте исходный документ.`);\n"
          if success_anchor in text and 'setAutoInferStaticTemplates(false);\n    setSetupOpen(false);\n    setStatus(`Кнопки созданы:' not in text:
              text = text.replace(
                  success_anchor,
                  "    setDraftDomainOverride(null);\n    setAutoInferStaticTemplates(false);\n    setSetupOpen(false);\n    setStatus(`Кнопки созданы: ${confirmedRows.length}. Теперь добавьте исходный документ.`);\n",
                  1,
              )

          prop_anchor = "          draftDomainOverride={draftDomainOverride}\n"
          if 'autoInferStaticTemplates={autoInferStaticTemplates}' not in text:
              if prop_anchor not in text:
                  raise SystemExit('TemplateSetupModal inference prop anchor not found')
              text = text.replace(
                  prop_anchor,
                  prop_anchor + "          autoInferStaticTemplates={autoInferStaticTemplates}\n",
                  1,
              )
          callback_anchor = "          onDraftDomainOverrideChange={setDraftDomainOverride}\n"
          if 'onAutoInferStaticTemplatesChange={setAutoInferStaticTemplates}' not in text:
              if callback_anchor not in text:
                  raise SystemExit('TemplateSetupModal inference callback anchor not found')
              text = text.replace(
                  callback_anchor,
                  callback_anchor + "          onAutoInferStaticTemplatesChange={setAutoInferStaticTemplates}\n",
                  1,
              )
          app_path.write_text(text, encoding='utf-8')

          modal_path = Path('src/components/TemplateSetupModal.tsx')
          text = modal_path.read_text(encoding='utf-8')
          prop_anchor = "  draftDomainOverride?: DomainKind | null;\n"
          if 'autoInferStaticTemplates?: boolean;' not in text:
              if prop_anchor not in text:
                  raise SystemExit('modal inference value prop anchor not found')
              text = text.replace(prop_anchor, prop_anchor + "  autoInferStaticTemplates?: boolean;\n", 1)
          callback_anchor = "  onDraftDomainOverrideChange?(value: DomainKind | null): void;\n"
          if 'onAutoInferStaticTemplatesChange?(value: boolean): void;' not in text:
              if callback_anchor not in text:
                  raise SystemExit('modal inference callback prop anchor not found')
              text = text.replace(
                  callback_anchor,
                  callback_anchor + "  onAutoInferStaticTemplatesChange?(value: boolean): void;\n",
                  1,
              )

          ui_anchor = "        <p className=\"hint\">Сначала создайте кнопки и начните работать. Автоматические поля, вопросы и разметку можно добавить позже для каждой кнопки.</p>\n"
          if 'Безопасно попробовать авторазметку старых шаблонов' not in text:
              if ui_anchor not in text:
                  raise SystemExit('modal inference UI anchor not found')
              addition = """
        <label className="templateInferenceOption">
          <input
            type="checkbox"
            checked={Boolean(props.autoInferStaticTemplates)}
            onChange={(event) => props.onAutoInferStaticTemplatesChange?.(event.target.checked)}
          />
          <span>
            <strong>Безопасно попробовать авторазметку старых шаблонов</strong>
            <small>Необязательно. Только однозначные подписи и уникальные пустые зоны; исходные Word-файлы не изменяются.</small>
          </span>
        </label>
"""
              text = text.replace(ui_anchor, ui_anchor + addition, 1)
          modal_path.write_text(text, encoding='utf-8')

          test_path = Path('src/components/TemplateSetupModal.test.tsx')
          text = test_path.read_text(encoding='utf-8')
          if "it('offers safe legacy inference as an explicit optional choice'" not in text:
              insert = """

  it('offers safe legacy inference as an explicit optional choice', () => {
    const onAutoInferStaticTemplatesChange = vi.fn();
    render(<TemplateSetupModal {...base} onAutoInferStaticTemplatesChange={onAutoInferStaticTemplatesChange} />);
    const checkbox = screen.getByRole('checkbox', { name: /Безопасно попробовать авторазметку старых шаблонов/ });
    expect((checkbox as HTMLInputElement).checked).toBe(false);
    fireEvent.click(checkbox);
    expect(onAutoInferStaticTemplatesChange).toHaveBeenCalledWith(true);
  });
"""
              close = text.rfind('\n});')
              if close < 0:
                  raise SystemExit('TemplateSetupModal test suite end not found')
              text = text[:close] + insert + text[close:]
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: Format Rust then verify format
        run: |
          cargo fmt --all
          cargo fmt --all --check

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Core regression wall
        run: cargo test -p dokkomplekt-core

      - name: Tauri compile seam
        run: cargo check -p dokkomplekt-tauri

      - name: Frontend tests and typecheck
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Offline donor parity regression
        run: python -m pytest -q tests/test_icd10_f_donor_parity.py

      - name: Remove one-shot workflow and commit verified sources
        shell: bash
        run: |
          git rm .github/workflows/legacy-static-template-inference-once-v4.yml
          git status --short
          git config user.name "mailsvb2-bot"
          git config user.email "mailsvb2@gmail.com"
          git add crates/dokkomplekt-core/src/legacy_template_inference.rs \
                  crates/dokkomplekt-core/src/lib.rs \
                  src-tauri/src/subsystems/legacy_template_runtime.rs \
                  src-tauri/src/subsystems/document_commands.rs \
                  src-tauri/src/main.rs \
                  src/lib/api.ts \
                  src/App.tsx \
                  src/components/TemplateSetupModal.tsx \
                  src/components/TemplateSetupModal.test.tsx \
                  tests/test_icd10_f_donor_parity.py
          git diff --cached --check
          git commit -m "Implement legacy static template intelligence"
          git push origin HEAD:fix/legacy-static-template-intelligence-20260815