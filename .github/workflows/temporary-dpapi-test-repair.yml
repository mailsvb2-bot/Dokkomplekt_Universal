name: Temporary DPAPI test repair

on:
  push:
    branches: [fix/ci-quality-gate-20260726]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Replace invalid plaintext assertion with DPAPI contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        let stored = std::fs::read(root.join("state.sqlite.key")).expect("stored key");
                  assert_eq!(stored, first);
          '''
          new = '''        let key_path = root.join("state.sqlite.key");
                  let stored = std::fs::read(&key_path).expect("stored key");
                  #[cfg(windows)]
                  {
                      assert!(
                          stored.starts_with(super::DPAPI_KEY_FILE_MAGIC),
                          "Windows key file must use the DPAPI envelope"
                      );
                      assert_ne!(stored.as_slice(), first.as_slice());
                      let decoded = super::decode_or_migrate_local_key(&key_path, &stored)
                          .expect("decode stored key");
                      assert_eq!(decoded, first);
                  }
                  #[cfg(not(windows))]
                  assert_eq!(stored, first);
          '''
          if old not in text:
              raise SystemExit("Expected DPAPI test snippet was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Format, remove temporary workflow, and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/main.rs
          git rm .github/workflows/temporary-dpapi-test-repair.yml
          git commit -m "test: validate DPAPI-protected local key persistence"
          git push origin HEAD:fix/ci-quality-gate-20260726
