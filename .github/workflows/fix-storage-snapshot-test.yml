name: Fix Storage Snapshot Contract

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fundamental-seven-critical-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Make case and pack storage keys explicit
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          storage = Path('crates/dokkomplekt-storage/src/lib.rs')
          replace_once(
              storage,
              '    pub fn save_case_and_pack_atomic(\n        &self,\n        case_id: &str,\n        case: &SemanticCase,',
              '    pub fn save_case_and_pack_atomic(\n        &self,\n        case_id: &str,\n        pack_id: &str,\n        case: &SemanticCase,',
          )
          replace_once(
              storage,
              '    pub fn save_desktop_snapshot<T: serde::Serialize + ?Sized>(\n        &self,\n        case_id: &str,\n        case: &SemanticCase,',
              '    pub fn save_desktop_snapshot<T: serde::Serialize + ?Sized>(\n        &self,\n        case_id: &str,\n        pack_id: &str,\n        case: &SemanticCase,',
          )
          text = storage.read_text(encoding='utf-8')
          old = 'params![pack.pack_id.as_str(), pack_stored],'
          if text.count(old) != 2:
              raise SystemExit(f'{storage}: expected two implicit pack keys, found {text.count(old)}')
          storage.write_text(text.replace(old, 'params![pack_id, pack_stored],'), encoding='utf-8')
          replace_once(
              storage,
              'repo.save_desktop_snapshot(&case, &pack, "license_document", &commercial)',
              'repo.save_desktop_snapshot(\n            "current",\n            "default",\n            &case,\n            &pack,\n            "license_document",\n            &commercial,\n        )',
          )

          main = Path('src-tauri/src/main.rs')
          replace_once(
              main,
              '.save_case_and_pack_atomic("current", &case, &pack)',
              '.save_case_and_pack_atomic("current", "default", &case, &pack)',
          )
          replace_once(
              main,
              '.save_desktop_snapshot("current", &case, &pack, "license_document", &license)',
              '.save_desktop_snapshot(\n            "current",\n            "default",\n            &case,\n            &pack,\n            "license_document",\n            &license,\n        )',
          )
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p dokkomplekt-storage
          rm .github/workflows/fix-storage-snapshot-test.yml
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name mailsvb2-bot
          git config user.email 254540704+mailsvb2-bot@users.noreply.github.com
          git add -A
          git commit -m "Make transactional snapshot storage keys explicit"
          git push --force origin HEAD:refs/heads/agent/fundamental-seven-critical-fixes
