name: One-time Rust diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: one-time-rust-diagnostic-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/full-functional-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Restore Rust build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2
          restore-keys: |
            rust-compile-${{ runner.os }}-
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Diagnose workspace tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked > /tmp/cargo-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '::group::cargo test diagnostic'
            tail -n 260 /tmp/cargo-test.log
            echo '::endgroup::'
            diagnostic=$(grep -E -B 8 -A 18 "FAILED|panicked at|assertion .* failed|failures:|test result: FAILED|error: test failed" /tmp/cargo-test.log | tail -n 120 || true)
            if [ -z "$diagnostic" ]; then
              diagnostic=$(tail -n 80 /tmp/cargo-test.log)
            fi
            safe=${diagnostic//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error title=workspace test failure::$safe"
            exit "$code"
          fi
          echo 'workspace tests passed'
