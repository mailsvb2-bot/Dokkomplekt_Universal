name: E1 Physical Completion Receipt Apply Once

on:
  push:
    branches: [canon-v2/e1-accounting-pipeline]

permissions:
  contents: write

concurrency:
  group: e1-physical-completion-receipt-apply-once
  cancel-in-progress: false

jobs:
  apply-prove-and-clean:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact physical-output receipt diff, prove it, sync manifest, self-clean
        shell: bash
        run: |
          set -euo pipefail
          clean_parent='ea190f743ec983382bef9e7d222e8a1341e6121c'
          failed_probe='4fd43be909dfcc40f9a22ba24b46f6c5e522d362'
          recovery_probe='106d625cc94bafb8cb3db202233b1245cd96f6dc'
          patch_commit='90528de5740d197bde49f442c55901e25ad27137'
          old_workflow='.github/workflows/e1-physical-completion-receipt-fix-once.yml'
          recovery_workflow='.github/workflows/e1-physical-completion-receipt-recovery-once.yml'
          patch_file='.github/e1-physical-completion-receipt.patch'
          apply_workflow='.github/workflows/e1-physical-completion-receipt-apply-once.yml'
          publication='src-tauri/src/generation_publication.rs'
          commands='src-tauri/src/subsystems/document_commands.rs'
          receipt_contract='tests/test_e1_generation_completion_receipt_contract.py'
          installed_contract='tests/installer/windows_e1_accounting_contract.ps1'
          installed_static='tests/test_e1_windows_installed_accounting_contract.py'

          test "$(git rev-parse HEAD^)" = "$patch_commit"
          test "$(git rev-parse HEAD^^)" = "$recovery_probe"
          test "$(git rev-parse HEAD^^^)" = "$failed_probe"
          test "$(git rev-parse HEAD^^^^)" = "$clean_parent"
          test "$(git diff --name-only HEAD^^^^ HEAD^^^)" = "$old_workflow"
          test "$(git diff --name-only HEAD^^^ HEAD^^)" = "$recovery_workflow"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$patch_file"
          test "$(git diff --name-only HEAD^ HEAD)" = "$apply_workflow"
          test "$(git hash-object "$patch_file")" = '0b07822dcf307052487dbbe385d0c6c283523363'
          test "$(sha256sum "$patch_file" | awk '{print $1}')" = '7d1f81e5dba4a209ca5ccbf40a91bc4845f79282635eb2253ca07ade8941fd2b'
          test "$(git hash-object "$publication")" = '6bd3ff2cc2bcf4bb913771248c7fb1c598fc64f6'
          test "$(git hash-object "$commands")" = '5b4776a589391cb7124293617f579d88889ebbd7'

          git apply --check "$patch_file"
          git apply "$patch_file"
          cargo fmt --all
          git diff --check

          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml physical_completion_proof_uses_raw_sha256_not_bundle_digest -- --exact
          cargo test --manifest-path src-tauri/Cargo.toml committed_generation_receipt_is_non_pii_and_bound_to_physical_output -- --exact
          cargo test --manifest-path src-tauri/Cargo.toml committed_generation_receipt_is_idempotent_and_conflict_safe -- --exact

          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_e1_generation_completion_receipt_contract.py \
            tests/test_e1_windows_installed_accounting_contract.py
          python scripts/static_quality_gate.py --source-only

          git rm "$old_workflow" "$recovery_workflow" "$patch_file" "$apply_workflow"
          changed_before_manifest="$(git diff HEAD --name-only | sort)"
          expected_before_manifest="$(printf '%s\n' "$old_workflow" "$recovery_workflow" "$patch_file" "$apply_workflow" "$publication" "$commands" "$receipt_contract" "$installed_contract" "$installed_static" | sort)"
          test "$changed_before_manifest" = "$expected_before_manifest"

          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add "$publication" "$commands" "$receipt_contract" "$installed_contract" "$installed_static" SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt \
            --json-report /tmp/source-manifest-recheck.json
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.recheck.txt

          git config user.name 'Dokkomplekt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind completion receipts to physical outputs'
          git push origin HEAD:refs/heads/canon-v2/e1-accounting-pipeline
