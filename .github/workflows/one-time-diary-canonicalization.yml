name: One-time diary canonicalization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-time-diary-canonical-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/full-functional-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Canonicalize diary signatures and source visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          engine = Path('crates/dokkomplekt-core/src/diary_engine.rs')
          text = engine.read_text(encoding='utf-8')
          text, count = re.subn(
              r'"Лечащий врач"\.to_string\(\),\s*"Заведующий отделением"\.to_string\(\),',
              '"Лечащий врач __________________ /____________/".to_string(),\n                "Заведующий отделением __________ /____________/".to_string(),',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('diary engine signature pattern not found exactly once')
          engine.write_text(text, encoding='utf-8')

          pro = Path('crates/dokkomplekt-core/src/professional_records.rs')
          text = pro.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\s*row\.insert\(\s*"treating_physician_signature"\.into\(\),\s*SemanticAtom::Text\("Лечащий врач __________________ /____________/"\.into\(\)\),\s*\);\s*'
              r'row\.insert\(\s*"department_head_signature"\.into\(\),\s*SemanticAtom::Text\("Заведующий отделением __________ /____________/"\.into\(\)\),\s*\);',
              re.S,
          )
          replacement = '''
            if let Some(signature) = entry.signatures.first() {
                row.insert(
                    "treating_physician_signature".into(),
                    SemanticAtom::Text(signature.clone()),
                );
            }
            if let Some(signature) = entry.signatures.get(1) {
                row.insert(
                    "department_head_signature".into(),
                    SemanticAtom::Text(signature.clone()),
                );
            }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('professional signature pattern not found exactly once')
          pro.write_text(text, encoding='utf-8')

          ui = Path('src/components/AdvancedToolsPanel.tsx')
          text = ui.read_text(encoding='utf-8')
          if 'const medicalSelected = selectedDocuments.some' not in text:
              raise SystemExit('medical visibility declaration not found')
          text = text.replace(
              "  const medicalSelected = selectedDocuments.some((document) => document.category === 'Medical');",
              "  const medicalAvailable = documents.some((document) => document.category === 'Medical');",
              1,
          )
          if '{medicalSelected && (' not in text:
              raise SystemExit('medical visibility use not found')
          text = text.replace('{medicalSelected && (', '{medicalAvailable && (', 1)
          ui.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p dokkomplekt-core diary_engine --lib
          cargo test -p dokkomplekt-core professional_records --lib
          npm ci
          npm run test -- --run src/components/AdvancedToolsPanel.test.tsx
          npm run build
          git diff --check
      - name: Commit canonical product code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/dokkomplekt-core/src/diary_engine.rs crates/dokkomplekt-core/src/professional_records.rs src/components/AdvancedToolsPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Canonicalize diary signatures and professional source visibility'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.head_ref }}; then exit 0; fi
            git pull --rebase origin ${{ github.head_ref }}
          done
          git push origin HEAD:${{ github.head_ref }}
