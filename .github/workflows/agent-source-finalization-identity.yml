name: Agent source finalization identity validator

on:
  push:
    branches:
      - agent/fix-source-finalization-identity

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

concurrency:
  group: agent-source-finalization-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-source-finalization-identity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply identity-safe source finalization patch
        run: python .github/patches/agent-source-finalization-identity.py
      - name: Format Rust
        run: cargo fmt --all -- --check
      - name: Run workspace hygiene identity regressions
        run: cargo test -p dokkomplekt-tauri workspace_hygiene::tests -- --nocapture
      - name: Run source finalization contract
        run: python -m pytest -q tests/test_v18_4_7_source_finalization_identity.py
      - name: Compile all Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests
      - name: Clippy Tauri tests
        run: cargo clippy -p dokkomplekt-tauri --tests -- -D warnings
      - name: Run source architecture gate
        run: python scripts/static_quality_gate.py --source-only
      - name: Check patch whitespace
        run: git diff --check
      - name: Publish validated product changes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/agent-source-finalization-identity.py
          rm -f .github/workflows/agent-source-finalization-identity.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to publish"
            exit 1
          fi
          git commit -m "Bind source finalization to atomic file identity"
          git push origin HEAD:agent/fix-source-finalization-identity

# Connector-authored retrigger after provenance synchronization.
