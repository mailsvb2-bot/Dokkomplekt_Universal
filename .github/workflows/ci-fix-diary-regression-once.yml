name: CI Fix Diary Regression Once

on:
  push:
    branches: [fix/ci-quality-gate-20260726]

permissions:
  contents: write

jobs:
  repair-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
      - name: Align diary signature regression with the canonical full title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/dokkomplekt-core/tests/behavior_regressions.rs')
          text = path.read_text(encoding='utf-8')
          old = 'assert!(out.contains("Зав. отделением"));'
          new = 'assert!(out.contains("Заведующий отделением"));'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy diary-signature assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/ci-fix-diary-regression-once.yml
      - name: Commit focused test repair and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/tests/behavior_regressions.rs .github/workflows/ci-fix-diary-regression-once.yml
          git commit -m "test(rust): expect canonical department-head signature"
          git push origin HEAD:fix/ci-quality-gate-20260726
