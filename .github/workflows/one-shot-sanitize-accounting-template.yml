name: One-shot sanitize accounting template

on:
  push:
    branches: [e2e/live-windows-user-scenarios]
    paths:
      - '.github/workflows/one-shot-sanitize-accounting-template.yml'
      - 'scripts/sanitize_docx_hidden_carriers.py'
      - 'content-packs/tier1-accounting-ru/templates/service_act.docx'

permissions:
  contents: write

jobs:
  sanitize:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: e2e/live-windows-user-scenarios
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Sanitize bundled accounting reference
        run: |
          python scripts/sanitize_docx_hidden_carriers.py content-packs/tier1-accounting-ru/templates/service_act.docx --in-place
          python -m pytest -q tests/test_docx_hidden_carrier_sanitizer.py
      - name: Refresh checked-in source manifest
        run: |
          python - <<'PY'
          from scripts.build_source_archive import source_files, write_source_manifest
          write_source_manifest(source_files())
          PY
      - name: Commit sanitized binary once
        shell: bash
        run: |
          if git diff --quiet -- content-packs/tier1-accounting-ru/templates/service_act.docx SOURCE_MANIFEST_SHA256.txt; then
            echo "Template is already sanitized."
            exit 0
          fi
          git config user.name "dokkomplekt-ci"
          git config user.email "actions@users.noreply.github.com"
          git add content-packs/tier1-accounting-ru/templates/service_act.docx SOURCE_MANIFEST_SHA256.txt
          git commit -m "fix: sanitize bundled accounting DOCX hidden carrier"
          git push origin HEAD:e2e/live-windows-user-scenarios
