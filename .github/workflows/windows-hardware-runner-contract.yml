name: Windows Hardware Runner Contract

on:
  pull_request:
    paths:
      - '.github/workflows/windows-hardware-e2e.yml'
      - '.github/workflows/windows-hardware-runner-contract.yml'
      - '.github/workflows/quality-gate.yml'
      - 'ops/private-hardware-validation/**'
      - 'scripts/bootstrap_windows_hardware_runner.ps1'
      - 'scripts/register_windows_hardware_runner.ps1'
      - 'scripts/bootstrap_private_windows_runner.ps1'
      - 'scripts/register_windows_runtime_runner.ps1'
      - 'scripts/register_windows_hardware_evidence_runner.ps1'
      - 'scripts/grant_windows_runtime_service_access.ps1'
      - 'scripts/release_environment_preflight.py'
      - 'scripts/verify_windows_hardware_runner.ps1'
      - 'scripts/verify_windows_hardware_evidence_host.ps1'
      - 'scripts/cleanup_windows_reboot_preparation.ps1'
      - 'scripts/dispatch_private_hardware_validation.py'
      - 'scripts/windows_signed_handoff.py'
      - 'scripts/build_windows_runtime_kit.py'
      - 'scripts/prepare_windows_production_runtime.ps1'
      - 'scripts/windows_runtime_lock_approval.py'
      - 'scripts/create_runtime_lock.py'
      - 'scripts/prepare_sidecars.py'
      - 'scripts/assert_offline_runtime_ready.py'
      - 'scripts/probe_offline_runtime.py'
      - 'scripts/prepackage_rust_gate.sh'
      - 'scripts/prepackage_rust_gate.bat'
      - 'scripts/run_rustsec_audit.py'
      - 'scripts/verify_rustsec_advisory_pin.py'
      - 'verification/security/rustsec-advisory-db.json'
      - 'tests/windows/windows_hardware_e2e.ps1'
      - 'tests/windows/prepare_reboot_evidence.ps1'
      - 'tests/windows/verify_reboot_evidence.ps1'
      - 'tests/test_two_runner_trust_boundary.py'
      - 'tests/test_two_runner_bootstrap_roles.py'
      - 'tests/test_windows_runtime_service_boundary.py'
      - 'tests/test_windows_hardware_runner_bootstrap_contract.py'
      - 'tests/test_windows_signed_handoff.py'
      - 'tests/test_windows_runtime_kit.py'
      - 'tests/test_windows_runtime_lock_approval.py'
      - 'tests/test_msgconvert_runtime_probe.py'
      - 'tests/test_rustsec_advisory_pin.py'
      - 'tests/test_v18_1_1_offline_runtime.py'
      - 'docs/TWO_RUNNER_TRUST_BOUNDARY.md'
      - 'docs/WINDOWS_HARDWARE_RUNNER.md'
      - 'docs/WINDOWS_RUNTIME_KIT.md'
      - 'docs/WINDOWS_RUNTIME_LOCK_APPROVAL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-contract:
    name: Parse hardware PowerShell and governance contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Parse every hardware-runner PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/bootstrap_windows_hardware_runner.ps1',
            'scripts/register_windows_hardware_runner.ps1',
            'scripts/bootstrap_private_windows_runner.ps1',
            'scripts/register_windows_runtime_runner.ps1',
            'scripts/register_windows_hardware_evidence_runner.ps1',
            'scripts/grant_windows_runtime_service_access.ps1',
            'scripts/verify_windows_hardware_runner.ps1',
            'scripts/verify_windows_hardware_evidence_host.ps1',
            'scripts/cleanup_windows_reboot_preparation.ps1',
            'scripts/prepare_windows_production_runtime.ps1',
            'tests/windows/windows_hardware_e2e.ps1',
            'tests/windows/prepare_reboot_evidence.ps1',
            'tests/windows/verify_reboot_evidence.ps1'
          )
          $failed = $false
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $path" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            } else {
              Write-Host "PowerShell parse PASS: $path"
            }
          }
          if ($failed) { throw 'Hardware runner PowerShell parser contract failed.' }
      - name: Parse public bridge and private hardware workflow YAML
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import yaml
          for path in (
              Path('.github/workflows/windows-hardware-e2e.yml'),
              Path('ops/private-hardware-validation/windows-hardware-e2e.yml'),
          ):
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              assert isinstance(data, dict) and data.get('jobs'), path
              print(f'YAML parse PASS: {path}')
          '@ | python -
      - name: Run hardware runner, service-boundary, signed-handoff, runtime-kit, approval and RustSec governance regressions
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_two_runner_trust_boundary.py
          tests/test_two_runner_bootstrap_roles.py
          tests/test_windows_runtime_service_boundary.py
          tests/test_windows_hardware_runner_bootstrap_contract.py
          tests/test_windows_signed_handoff.py
          tests/test_windows_runtime_kit.py
          tests/test_windows_runtime_lock_approval.py
          tests/test_msgconvert_runtime_probe.py
          tests/test_rustsec_advisory_pin.py
          tests/test_v18_1_1_offline_runtime.py
