name: Agent apply PR143 donor migration

on:
  push:
    branches:
      - agent/donor-medical-template-noise-20260817
    paths:
      - .github/workflows/agent-apply-pr143.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-medical-template-noise-20260817
          fetch-depth: 0
      - name: Apply canonical donor sanitizer
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/agent_apply_pr143.py
          rm scripts/agent_apply_pr143.py
          rm .github/workflows/agent-apply-pr143.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/source_parser.rs docs/LEGACY_MIGRATION_INVENTORY.json scripts/agent_apply_pr143.py .github/workflows/agent-apply-pr143.yml
          git diff --cached --check
          git commit -m "Reject medical template instructions as patient data"
          git push origin HEAD:agent/donor-medical-template-noise-20260817
