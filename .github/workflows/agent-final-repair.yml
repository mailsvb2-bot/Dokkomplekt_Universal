name: One-time final CI repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: final-repair-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'agent/fix-plan-ui-postgres-maintainability'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply focused compile repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/universal_intake.rs')
          source = path.read_text(encoding='utf-8')
          old = 'use archive::{normalize_external_archive, normalize_zip};'
          new = 'use archive::{normalize_external_archive, normalize_zip, prefix_layout_source};'
          if new not in source:
              if old not in source:
                  raise SystemExit('expected archive import not found')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY
          cargo fmt --all
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt || true
          python scripts/verify_source_manifest.py
          git diff --check
          cargo check --workspace --all-targets --locked
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/universal_intake.rs SOURCE_MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          TREE_SHA="$(git write-tree)"
          git commit -m 'Fix final universal intake compile' -m "tree-sha: ${TREE_SHA}"
          git push origin "HEAD:${{ github.head_ref }}"
