name: Temporary self-cleaning manifest refresh

on:
  push:
    branches:
      - agent/offline-runtime-import

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offline-runtime-import
          fetch-depth: 0
      - name: Generate manifest for the clean future tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-manifest-refresh.yml
          rm -f SOURCE_MANIFEST_SHA256.generated.txt
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-report.json || true
          test -s SOURCE_MANIFEST_SHA256.generated.txt
          test "$(wc -l < SOURCE_MANIFEST_SHA256.generated.txt)" -eq 660
          mv SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temporary-manifest-refresh.yml' 'SOURCE_MANIFEST_SHA256.txt' | sort)"
          test "$changed" = "$expected"
      - name: Commit clean tree and refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh source manifest after Clippy fix'
          git push origin HEAD:agent/offline-runtime-import
