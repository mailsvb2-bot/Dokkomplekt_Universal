name: PR178 key and serialization finalizer

on:
  push:
    branches:
      - ops/pr178-bundle-memory-finalize-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact key and serialization fixes
        shell: bash
        run: |
          set -euo pipefail
          expected_head='8fa0d5196aefac5cf4e43732e3134c11db959414'
          test "$(git rev-parse HEAD)" = "$expected_head"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('src-tauri/src/subsystems/source_intake_commands.rs')
          source = source_path.read_text(encoding='utf-8')

          load_sig = '''fn load_specialist_kit_decision(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n) -> Result<Option<KitLearningDecision>, String> {\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          assert source.count(load_sig) == 1
          source = source.replace(load_sig, load_sig.replace(
              '    let repo =',
              '    let state = app.state::<AppState>();\n    let _persistence_guard = state\n        .persistence_gate\n        .lock()\n        .map_err(|_| "persistence gate lock failed")?;\n    let repo =',
          ), 1)

          persist_sig = '''fn persist_specialist_kit_rule(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n    confirmed_document_ids: &[String],\n) -> Result<(), String> {\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          assert source.count(persist_sig) == 1
          source = source.replace(persist_sig, persist_sig.replace(
              '    let repo =',
              '    let state = app.state::<AppState>();\n    let _persistence_guard = state\n        .persistence_gate\n        .lock()\n        .map_err(|_| "persistence gate lock failed")?;\n    let repo =',
          ), 1)

          helper_anchor = 'fn claim_bundle_exception_confirmation(\n'
          assert source.count(helper_anchor) == 1
          helper = '''fn specialist_rule_key_from_exception_details(\n    details: &serde_json::Value,\n    pack: &DocumentPack,\n) -> Result<Option<KitRuleKey>, String> {\n    if let Some(value) = details.get("specialist_rule_key") {\n        if !value.is_null() {\n            return serde_json::from_value::<KitRuleKey>(value.clone())\n                .map(Some)\n                .map_err(|error| format!("Ключ подтверждённого комплекта повреждён: {error}"));\n        }\n    }\n    let cluster_id = details\n        .get("cluster_id")\n        .and_then(serde_json::Value::as_str)\n        .map(str::trim)\n        .filter(|value| !value.is_empty())\n        .ok_or_else(|| "В подтверждении отсутствует структурный тип дела.".to_string())?;\n    if cluster_id == "unclassified" {\n        return Ok(None);\n    }\n    let domain = details\n        .get("domain")\n        .cloned()\n        .ok_or_else(|| "В подтверждении отсутствует профессиональная область.".to_string())\n        .and_then(|value| {\n            serde_json::from_value::<DomainKind>(value)\n                .map_err(|error| format!("Профессиональная область подтверждения повреждена: {error}"))\n        })?;\n    Ok(Some(KitRuleKey {\n        domain,\n        cluster_id: cluster_id.to_string(),\n        pack_id: (!pack.pack_id.trim().is_empty()).then(|| pack.pack_id.clone()),\n    }))\n}\n\n'''
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          claim_old_start = '''    let cluster_id = details\n        .get("cluster_id")'''
          start = source.index(claim_old_start, source.index('fn claim_bundle_exception_confirmation('))
          end = source.index('    let record = repo', start)
          old_key_block = source[start:end]
          assert 'let rule_update = if cluster_id != "unclassified"' in old_key_block
          source = source[:start] + '''    let specialist_rule_key = specialist_rule_key_from_exception_details(&details, &pack)?;\n    let rule_update = match specialist_rule_key.as_ref() {\n        Some(key) => Some(updated_specialist_kit_rules(&repo, key, &pack, &selected)?),\n        None => None,\n    };\n''' + source[end:]

          old_ret = ') -> Result<(DocumentRoutingRecommendation, BundleDecision), String> {'
          new_ret = ') -> Result<(DocumentRoutingRecommendation, BundleDecision, Option<KitRuleKey>), String> {'
          assert source.count(old_ret) == 1
          source = source.replace(old_ret, new_ret, 1)
          assert source.count('    Ok((routing, decision))\n') == 1
          source = source.replace('    Ok((routing, decision))\n', '    Ok((routing, decision, key))\n', 1)
          caller = 'let (routing, bundle_decision) = resolve_document_bundle_for_case('
          assert source.count(caller) == 3
          source = source.replace(caller, 'let (routing, bundle_decision, _specialist_rule_key) = resolve_document_bundle_for_case(')
          source_path.write_text(source, encoding='utf-8')

          automation_path = Path('src-tauri/src/subsystems/automation_runtime.rs')
          automation = automation_path.read_text(encoding='utf-8')
          old = 'let (routing_recommendation, bundle_decision) = resolve_document_bundle_for_case('
          assert automation.count(old) == 1
          automation = automation.replace(
              old,
              'let (routing_recommendation, bundle_decision, specialist_rule_key) = resolve_document_bundle_for_case(',
              1,
          )
          details = '''            "cluster_id": &routing_recommendation.cluster_id,\n            "domain": &routing_recommendation.domain,\n            "confidence": bundle_decision.confidence,\n'''
          assert automation.count(details) == 1
          automation = automation.replace(details, '''            "cluster_id": &routing_recommendation.cluster_id,\n            "domain": &routing_recommendation.domain,\n            "specialist_rule_key": &specialist_rule_key,\n            "confidence": bundle_decision.confidence,\n''', 1)
          automation_path.write_text(automation, encoding='utf-8')

          test_path = Path('tests/test_learning_privacy_retention_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_specialist_rule_uses_exact_decision_key_and_one_persistence_gate() -> None:'
          assert marker not in tests
          tests += '''\n\n\ndef test_specialist_rule_uses_exact_decision_key_and_one_persistence_gate() -> None:\n    source = read("src-tauri/src/subsystems/source_intake_commands.rs")\n    automation = read("src-tauri/src/subsystems/automation_runtime.rs")\n\n    load_start = source.index("fn load_specialist_kit_decision(")\n    persist_start = source.index("fn persist_specialist_kit_rule(")\n    claim_start = source.index("fn claim_bundle_exception_confirmation(")\n    resolver_start = source.index("fn resolve_document_bundle_for_case(")\n    assert "persistence_gate" in source[load_start:persist_start]\n    assert "persistence_gate" in source[persist_start:claim_start]\n    assert "persistence_gate" in source[claim_start:resolver_start]\n    assert "specialist_rule_key_from_exception_details" in source\n    assert "Option<KitRuleKey>), String>" in source\n    assert '"specialist_rule_key": &specialist_rule_key' in automation\n    assert "resolve_exception_and_save_state_value" in source\n''' 
          test_path.write_text(tests, encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q \
            tests/test_donor_diary_output_parity.py \
            tests/test_donor_patient_folder_watcher_parity.py \
            tests/test_source_manifest_integrity.py \
            tests/test_learning_privacy_retention_contract.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          test "$(wc -l < src-tauri/src/subsystems/automation_runtime.rs)" -lt 3000

          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add SOURCE_MANIFEST_SHA256.txt \
            src-tauri/src/subsystems/source_intake_commands.rs \
            src-tauri/src/subsystems/automation_runtime.rs \
            tests/test_learning_privacy_retention_contract.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Persist specialist bundles under exact decision key'
          git push origin HEAD:fix/real-user-workflow-20260907
