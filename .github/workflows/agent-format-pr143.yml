name: Agent format PR143

on:
  push:
    branches:
      - agent/donor-medical-template-noise-20260817
    paths:
      - .github/workflows/agent-format-pr143.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/donor-medical-template-noise-20260817
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format and commit canonical Rust
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          rm .github/workflows/agent-format-pr143.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/source_parser.rs .github/workflows/agent-format-pr143.yml
          git diff --cached --check
          git commit -m "Format PR143 medical sanitizer"
          git push origin HEAD:agent/donor-medical-template-noise-20260817
