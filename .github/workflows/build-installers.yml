name: Build Signed Offline Installers

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['FULL DOKKOMPLEKT AUTOPILOT']
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: Resolve exact production release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Decide whether this exact source needs a production release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse --verify HEAD)"
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          tag="v${version}"
          should_release=true

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              should_release=false
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              should_release=false
            fi
          elif [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
            test -n "$tag"
            if [[ "$RELEASE_BODY" == *'<!-- dokkomplekt-validated-release -->'* ]]; then
              should_release=false
            fi
          fi

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Production release plan: event=$EVENT_NAME sha=$release_sha tag=$tag should_release=$should_release"

  release-gate:
    name: REQUIRED Rust / dependency / contract gate
    needs: release-plan
    if: needs.release-plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    environment: windows-production-signing
    timeout-minutes: 65
    env:
      DOKKOMPLEKT_GATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_GATE_PUBKEY_B64 }}
      DOKKOMPLEKT_LICENSE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_UPDATE_PUBKEY_B64 }}
      DOKKOMPLEKT_THRESHOLD_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_THRESHOLD_PUBKEY_B64 }}
      DOKKOMPLEKT_REFDATA_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_REFDATA_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_MANIFEST_URL: ${{ vars.DOKKOMPLEKT_UPDATE_MANIFEST_URL }}
      DOKKOMPLEKT_REFDATA_URL: ${{ vars.DOKKOMPLEKT_REFDATA_URL }}
      DOKKOMPLEKT_COMPONENTS_CATALOG_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_CATALOG_URL }}
      DOKKOMPLEKT_COMPONENTS_BASE_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_BASE_URL }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate production compile-time trust anchors
        run: python scripts/release_environment_preflight.py --mode production-build --json-report verification/release/production-build-preflight.json
      - run: test -f Cargo.lock
      - run: python -m pip install -r requirements-dev.txt
      - name: Install controlled DOCX visual regression renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
      - run: python scripts/verify_docx_visual_goldens.py
      - run: python scripts/run_python_contracts_sharded.py --report verification/release/python-contracts.json
      - run: python scripts/static_quality_gate.py --source-only
      - run: python scripts/check_reference_data_freshness.py
      - name: Install current CVSS-4-compatible cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
      - name: Run signed Rust gate
        env:
          DOKKOMPLEKT_GATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_GATE_PRIVATE_KEY_B64 }}
        run: bash scripts/prepackage_rust_gate.sh
      - run: python scripts/assert_release_ready.py

  windows-hardware-e2e:
    name: REQUIRED exact private Windows release / hardware verdict
    needs: [release-plan, release-gate]
    if: needs.release-plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    environment: windows-hardware-dispatch
    timeout-minutes: 250
    env:
      DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY: mailsvb2-bot/Dokkomplekt_Hardware_Validation
      DOKKOMPLEKT_HARDWARE_VALIDATION_WORKFLOW: windows-hardware-e2e.yml
      DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN: ${{ secrets.DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN }}
      DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64 }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ needs.release-plan.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prove private hardware dispatch boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN"
          test -n "$DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64"
          test "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY" != "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = '${{ needs.release-plan.outputs.release_sha }}'
      - name: Reuse successful prepare and require private verify verdict
        shell: bash
        run: >-
          python scripts/dispatch_private_hardware_validation.py
          --source-repository "$GITHUB_REPOSITORY"
          --target-repository "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY"
          --workflow "$DOKKOMPLEKT_HARDWARE_VALIDATION_WORKFLOW"
          --target-ref main
          --release-sha "${{ needs.release-plan.outputs.release_sha }}"
          --reboot-phase verify
          --reuse-latest-prepare
          --json-report verification/release/PRIVATE_HARDWARE_RELEASE_VERDICT.json
      - name: Download the exact private handoff and hardware evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOKKOMPLEKT_HARDWARE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          report=verification/release/PRIVATE_HARDWARE_RELEASE_VERDICT.json
          request_id="$(jq -r '.request_id' "$report")"
          prepare_run_id="$(jq -r '.prepare_run_id' "$report")"
          verify_run_id="$(jq -r '.run_id' "$report")"
          test "$request_id" != null && test -n "$request_id"
          [[ "$prepare_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$verify_run_id" =~ ^[1-9][0-9]*$ ]]
          mkdir -p private-release/handoff private-release/evidence
          gh run download "$prepare_run_id"             --repo "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY"             --name "Dokkomplekt-Windows-Signed-Handoff-${{ needs.release-plan.outputs.release_sha }}-$request_id"             --dir private-release/handoff
          gh run download "$verify_run_id"             --repo "$DOKKOMPLEKT_HARDWARE_VALIDATION_REPOSITORY"             --name "Dokkomplekt-Windows-Hardware-E2E-verify-$request_id"             --dir private-release/evidence
          echo "DOKKOMPLEKT_RELEASE_REQUEST_ID=$request_id" >> "$GITHUB_ENV"
      - name: Cryptographically bind publication to the hardware-tested handoff
        shell: bash
        run: |
          set -euo pipefail
          trusted_key="$RUNNER_TEMP/dokkomplekt-handoff-public.pem"
          python - <<'PYKEY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'dokkomplekt-handoff-public.pem').write_bytes(
              base64.b64decode(os.environ['DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64'], validate=True)
          )
          PYKEY
          consumer_host_id="$(printf '%s' "public-release-publisher:$GITHUB_RUN_ID:$GITHUB_JOB" | sha256sum | awk '{print $1}')"
          python scripts/windows_signed_handoff.py verify private-release/handoff             --release-sha "${{ needs.release-plan.outputs.release_sha }}"             --request-id "$DOKKOMPLEKT_RELEASE_REQUEST_ID"             --trusted-public-key "$trusted_key"             --consumer-host-id "$consumer_host_id"             --json-report verification/release/PUBLICATION_HANDOFF_VERIFICATION.json
          mapfile -t evidence_manifests < <(find private-release/evidence -type f -name SIGNED_HANDOFF.json -print)
          mapfile -t evidence_signatures < <(find private-release/evidence -type f -name SIGNED_HANDOFF.json.sig -print)
          test "${#evidence_manifests[@]}" -eq 1
          test "${#evidence_signatures[@]}" -eq 1
          cmp private-release/handoff/SIGNED_HANDOFF.json "${evidence_manifests[0]}"
          cmp private-release/handoff/SIGNED_HANDOFF.json.sig "${evidence_signatures[0]}"
          test "$(find private-release/handoff/release-installers/thin -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find private-release/handoff/release-installers/offline -type f -name '*.exe' | wc -l)" -eq 1
          test -d private-release/handoff/release-components
          test -d private-release/handoff/release-runtime
      - name: Upload exact privately validated Windows release
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-Private-Validated
          path: |
            private-release/**
            verification/release/PRIVATE_HARDWARE_RELEASE_VERDICT.json
            verification/release/PUBLICATION_HANDOFF_VERIFICATION.json
          if-no-files-found: error

  linux-bundles:
    name: Linux AppImage / deb / rpm
    needs: release-gate
    runs-on: ubuntu-24.04
    environment: windows-production-signing
    timeout-minutes: 90
    env:
      DOKKOMPLEKT_GATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_GATE_PUBKEY_B64 }}
      DOKKOMPLEKT_LICENSE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_UPDATE_PUBKEY_B64 }}
      DOKKOMPLEKT_THRESHOLD_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_THRESHOLD_PUBKEY_B64 }}
      DOKKOMPLEKT_REFDATA_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_REFDATA_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_MANIFEST_URL: ${{ vars.DOKKOMPLEKT_UPDATE_MANIFEST_URL }}
      DOKKOMPLEKT_REFDATA_URL: ${{ vars.DOKKOMPLEKT_REFDATA_URL }}
      DOKKOMPLEKT_COMPONENTS_CATALOG_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_CATALOG_URL }}
      DOKKOMPLEKT_COMPONENTS_BASE_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_BASE_URL }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate production compile-time trust anchors
        run: python scripts/release_environment_preflight.py --mode production-build --json-report verification/release/linux-production-build-preflight.json
      - name: Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb dbus-x11
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Run signed Rust gate
        env:
          DOKKOMPLEKT_GATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_GATE_PRIVATE_KEY_B64 }}
        run: bash scripts/prepackage_rust_gate.sh
      - run: python scripts/assert_release_ready.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx tauri build --bundles appimage,deb,rpm
      - run: bash tests/installer/linux_installer_contract.sh
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Linux-AppImage-deb-rpm
          path: target/release/bundle/**
          if-no-files-found: error

  publish-release-assets:
    name: Publish only verified signed release assets
    if: >-
      always() &&
      needs.windows-hardware-e2e.result == 'success' &&
      needs.linux-bundles.result == 'success' &&
      (github.event_name == 'workflow_run' ||
       (github.event_name == 'release' && github.event.action == 'published'))
    needs: [windows-hardware-e2e, linux-bundles]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Dokkomplekt-Windows-Private-Validated
          path: private-windows
      - name: Materialize only the exact hardware-validated Windows payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/windows release/components release/runtime release/evidence/build release/evidence/hardware release/evidence/handoff
          cp -a private-windows/private-release/handoff/release-installers/. release/windows/
          cp -a private-windows/private-release/handoff/release-components/. release/components/
          cp -a private-windows/private-release/handoff/release-runtime/. release/runtime/
          cp -a private-windows/private-release/handoff/build-evidence/. release/evidence/build/
          cp -a private-windows/private-release/evidence/. release/evidence/hardware/
          cp private-windows/private-release/handoff/SIGNED_HANDOFF.json release/evidence/handoff/
          cp private-windows/private-release/handoff/SIGNED_HANDOFF.json.sig release/evidence/handoff/
          cp private-windows/verification/release/PRIVATE_HARDWARE_RELEASE_VERDICT.json release/evidence/
          cp private-windows/verification/release/PUBLICATION_HANDOFF_VERIFICATION.json release/evidence/
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Dokkomplekt-Linux-AppImage-deb-rpm
          path: release/linux
      - name: Create complete release checksum register
        shell: bash
        run: |
          cd release
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Attach artifacts only after signing and hardware E2E
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release -type f -print0)
          test "${#files[@]}" -gt 0

          release_sha="$(git rev-parse --verify HEAD)"
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
            test -n "$tag"
            gh release upload "$tag" "${files[@]}" --clobber
            exit 0
          fi

          tag="v${version}"
          marker='<!-- dokkomplekt-validated-release -->'
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_target="$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')"
            if [ "$existing_target" != "$release_sha" ]; then
              echo "Release $tag already targets $existing_target, expected $release_sha" >&2
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
          else
            notes="$marker"$'\n'"Production-validated release for commit $release_sha. Signed Windows installers, hardware E2E evidence, Linux bundles and SHA256SUMS.txt were produced before publication."
            gh release create "$tag" "${files[@]}" \
              --target "$release_sha" \
              --title "Dokkomplekt Universal $version" \
              --notes "$notes"
          fi
