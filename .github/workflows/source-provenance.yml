name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest matches tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Finish client-language cleanup
        if: github.head_ref == 'ui/client-first-neutral'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/AutomationControlCenter.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "Имя JSON-файла обезличенного корпуса": "Имя файла с обезличенной историей проверок",
              "`dokkomplekt-corpus-${date}.json`": "`dokkomplekt-check-history-${date}.json`",
              "execute('экспорт обезличенного корпуса'": "execute('экспорт истории проверок'",
              "Экспортировано записей корпуса: ${result.entry_count}. Файл: ${result.output_path}": "Экспортировано записей проверки: ${result.entry_count}. Файл: ${result.output_path}",
              "<strong>Автоматизация → Зависимости</strong>": "<strong>Дополнительные возможности</strong>",
              " · разблокирует: {item.unlocks.join(', ')}": " · добавляет: {item.unlocks.join(', ')}",
              "ручной duplex Word": "ручная двусторонняя печать",
              "Удалять осиротевшие processed-маркеры через, дней": "Удалять устаревшие служебные отметки через, дней",
              "'центральная mTLS'": "'защищённая центральная'",
              "Для многомашинного режима используйте HTTPS-сервис очереди с обязательным клиентским сертификатом.": "Для нескольких компьютеров используйте защищённую центральную очередь с отдельным доступом для каждого устройства.",
              "<span><b>{item.category}</b> · {item.message}": "<span><b>{exceptionCategoryLabel(item.category)}</b> · {item.message}",
              "<small>Данные считаются локально по завершённым делам и событиям печати за {daily?.date_utc ?? 'текущую дату UTC'}.</small>": "<small>Данные считаются локально по завершённым задачам и событиям печати за {daily?.date_utc ?? 'сегодня'}.</small>",
              "<strong>Метрики автоматизации и ROI</strong>": "<strong>Результаты автоматизации</strong>",
              "Оценка задаётся организацией и не считается доказанным временем без замера пилота.": "Оценка задаётся организацией и становится точной после замера на реальной работе.",
              "Закрыто attention": "Проверено вручную",
              "Отклонено LLM-grounding": "Отклонено сомнительных предложений",
              "Shadow-прогонов": "Проверок в режиме наблюдения",
              "Совпадений shadow": "Совпадений результатов",
              "Доля attention": "Доля требующих проверки",
              "Переиспользовано при resume": "Использовано повторно",
              "Пересоздано при resume": "Создано заново",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing cleanup phrase: {old}')
              text = text.replace(old, new)
          anchor = "function calendarHorizon(years:number[])"
          helper = "function exceptionCategoryLabel(category:string){if(category==='risk_gate')return 'Проверка данных';if(category==='bundle_decision')return 'Состав комплекта';return 'Требует внимания';}\n\n"
          if helper.strip() not in text:
              if anchor not in text:
                  raise SystemExit('calendar helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_v18_2_1_resume_queue_modularization_contracts.py')
          text = test.read_text(encoding='utf-8')
          old = 'self.assertIn("Переиспользовано при resume", ui)'
          new = 'self.assertIn("Использовано повторно", ui)'
          if old not in text:
              raise SystemExit('resume UI contract not found')
          test.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_v18_2_0_component_delivery_contracts.py')
          text = test.read_text(encoding='utf-8')
          old = '"Автоматизация → Зависимости",'
          new = '"Дополнительные возможности",'
          if old not in text:
              raise SystemExit('component UI contract not found')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git show origin/main:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish client-language cleanup in advanced settings'
          git push origin HEAD:ui/client-first-neutral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Upload source-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-candidate
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
