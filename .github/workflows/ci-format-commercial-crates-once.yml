name: CI Format Commercial Crates Once

on:
  push:
    branches: [fix/ci-quality-gate-20260726]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply canonical formatting to excluded commercial crates
        run: |
          cargo fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml --all
          cargo fmt --manifest-path crates/dokkomplekt-license-python/Cargo.toml --all
          rm -f .github/workflows/ci-format-commercial-crates-once.yml
      - name: Commit formatting and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-license-server crates/dokkomplekt-license-python .github/workflows/ci-format-commercial-crates-once.yml
          git commit -m "style(rust): format commercial license crates"
          git push origin HEAD:fix/ci-quality-gate-20260726
