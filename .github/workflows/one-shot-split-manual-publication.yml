name: One-shot split manual publication module

on:
  push:
    branches:
      - agent/fix-real-docx-publication-20260818
    paths:
      - .github/workflows/one-shot-split-manual-publication.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-real-docx-publication-20260818
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply module split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          main = root / "src-tauri/src/main.rs"
          text = main.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "mod generation_publication;\nmod privacy_runtime;",
              "mod generation_publication;\nmod manual_publication;\nmod privacy_runtime;",
              "register manual publication module",
          )
          main.write_text(text, encoding="utf-8")

          commands_path = root / "src-tauri/src/subsystems/document_commands.rs"
          commands = commands_path.read_text(encoding="utf-8")
          commands = replace_once(
              commands,
              '''    // Render beside the final output root instead of creating the user-visible
              // output directory before the batch has actually succeeded. Publication
              // creates the visible root only at the atomic visibility boundary below.
              let stage_parent = output_root
                  .parent()
                  .map(Path::to_path_buf)
                  .unwrap_or_else(|| output_root.clone());
              ''',
              '''    let stage_parent = manual_publication::stage_parent(&output_root);
              ''',
              "use stage-parent helper",
          )
          commands = replace_once(
              commands,
              '''    if staged_paths.len() != documents.len() {
                  let _ = std::fs::remove_dir_all(&stage);
                  rollback_counter_reservations(&app, &counter_reservations);
                  rollback_generation_access(&app, &state, &permit);
                  return Err(format!(
                      "Комплект не опубликован: запрошено {} документ(ов), физически подготовлено {}.",
                      documents.len(),
                      staged_paths.len()
                  ));
              }
              for path in &staged_paths {
                  let metadata = match std::fs::metadata(path) {
                      Ok(metadata) => metadata,
                      Err(error) => {
                          let _ = std::fs::remove_dir_all(&stage);
                          rollback_counter_reservations(&app, &counter_reservations);
                          rollback_generation_access(&app, &state, &permit);
                          return Err(format!(
                              "Комплект не опубликован: подготовленный DOCX исчез до публикации ({}): {error}",
                              path.display()
                          ));
                      }
                  };
                  if !metadata.is_file() || metadata.len() == 0 {
                      let _ = std::fs::remove_dir_all(&stage);
                      rollback_counter_reservations(&app, &counter_reservations);
                      rollback_generation_access(&app, &state, &permit);
                      return Err(format!(
                          "Комплект не опубликован: подготовленный DOCX пуст или не является файлом: {}",
                          path.display()
                      ));
                  }
              }
              ''',
              '''    if let Err(error) =
                  manual_publication::verify_staged_docx(&staged_paths, documents.len())
              {
                  let _ = std::fs::remove_dir_all(&stage);
                  rollback_counter_reservations(&app, &counter_reservations);
                  rollback_generation_access(&app, &state, &permit);
                  return Err(error);
              }
              ''',
              "delegate staged verification",
          )
          commands = replace_once(
              commands,
              '''    let created_files = staged_paths
                  .iter()
                  .map(|path| {
                      path.file_name()
                          .ok_or_else(|| format!("Созданный файл не имеет имени: {}", path.display()))
                          .map(|name| output_folder.join(name))
                  })
                  .collect::<Result<Vec<_>, _>>()?;
              if created_files.len() != documents.len() {
                  return Err(format!(
                      "КРИТИЧЕСКАЯ ОШИБКА публикации: ожидалось {} DOCX, получено {} в {}.",
                      documents.len(),
                      created_files.len(),
                      output_folder.display()
                  ));
              }
              for path in &created_files {
                  let metadata = std::fs::metadata(path).map_err(|error| {
                      format!(
                          "КРИТИЧЕСКАЯ ОШИБКА публикации: файл отсутствует на диске после публикации ({}): {error}",
                          path.display()
                      )
                  })?;
                  if !metadata.is_file() || metadata.len() == 0 {
                      return Err(format!(
                          "КРИТИЧЕСКАЯ ОШИБКА публикации: опубликованный DOCX пуст или не является файлом: {}",
                          path.display()
                      ));
                  }
                  extract_docx_text(path).map_err(|error| {
                      format!(
                          "КРИТИЧЕСКАЯ ОШИБКА публикации: опубликованный DOCX не читается как Word-документ ({}): {error}",
                          path.display()
                      )
                  })?;
              }
              ''',
              '''    let created_files = manual_publication::verify_published_docx(
                  &staged_paths,
                  &output_folder,
                  documents.len(),
              )?;
              ''',
              "delegate published verification",
          )
          commands_path.write_text(commands, encoding="utf-8")

          test_path = root / "tests/test_manual_generation_physical_publication_contract.py"
          test_path.write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
COMMANDS = (ROOT / "src-tauri/src/subsystems/document_commands.rs").read_text(encoding="utf-8")
PUBLICATION = (ROOT / "src-tauri/src/manual_publication.rs").read_text(encoding="utf-8")
MAIN = (ROOT / "src-tauri/src/main.rs").read_text(encoding="utf-8")


def body() -> str:
    start = COMMANDS.index("fn render_docx_batch(")
    end = COMMANDS.index("#[derive(Debug, Deserialize)]\\nstruct ScannerRequest", start)
    return COMMANDS[start:end]


def test_visible_output_root_is_not_created_before_success():
    batch = body()
    assert "manual_publication::stage_parent(&output_root)" in batch
    assert "let stage = stage_parent.join(format!(" in batch
    assert "std::fs::create_dir_all(&output_root)" not in batch
    assert "mod manual_publication;" in MAIN


def test_one_physical_file_is_required_for_every_requested_document():
    batch = body()
    assert "manual_publication::verify_staged_docx(&staged_paths, documents.len())" in batch
    assert "manual_publication::verify_published_docx(" in batch
    assert "staged_paths.len() != expected_count" in PUBLICATION
    assert "created_files.len() != expected_count" in PUBLICATION
    assert "std::fs::metadata(path)" in PUBLICATION
    assert "extract_docx_text(path)" in PUBLICATION
    assert "КРИТИЧЕСКАЯ ОШИБКА публикации" in PUBLICATION


def test_trust_report_is_ancillary_and_cannot_delete_docx():
    batch = body()
    report_start = batch.index("if privacy.write_trust_report")
    report_end = batch.index("Ok(paths)", report_start)
    report = batch[report_start:report_end]
    assert "write_trust_report(" in report
    assert "render_warnings.push" in report
    assert "Для проверяемого отчёта сначала загрузите файл" not in report


def test_success_opens_exact_verified_publication_folder():
    batch = body()
    assert batch.index("manual_publication::verify_published_docx(") < batch.index("open_in_file_manager(")
    assert "path: output_folder.display().to_string()" in batch
''', encoding="utf-8")

          line_count = len(commands_path.read_text(encoding="utf-8").splitlines())
          print(f"document_commands.rs lines={line_count}")
          if line_count > 3000:
              raise SystemExit("document_commands.rs remains above 3000-line canon")
          PY
      - name: Verify focused contracts and source quality
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q \
            tests/test_manual_generation_physical_publication_contract.py \
            tests/test_generation_publication_accounting_contract.py \
            tests/test_publication_completion_exactly_once_contract.py \
            tests/test_runtime_user_scenario_hardening.py
          python scripts/static_quality_gate.py --source-only
      - name: Remove one-shot workflow and commit permanent refactor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-split-manual-publication.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: isolate manual publication verification'
          git pull --rebase origin agent/fix-real-docx-publication-20260818
          git push origin HEAD:agent/fix-real-docx-publication-20260818
