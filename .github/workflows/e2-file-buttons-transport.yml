name: E2 file buttons exact-tree transport

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 2
      - name: Materialize exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='05f7c3b4c8e31f4050b3067d58a627078cdf85d3'
          expected_tree='a9f035d11b8defa640e8b2d7bd2ab94199d2d941'
          expected_payload_sha='a6837cd707530b6c58914a4029e9ed8c7ab92b1b20dcd486752a7bff823d3c55'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          printf '%s' '' | base64 -d > /tmp/e2-file-buttons.patch.gz
          echo "$expected_payload_sha  /tmp/e2-file-buttons.patch.gz" | sha256sum -c -
          gzip -dc /tmp/e2-file-buttons.patch.gz > /tmp/e2-file-buttons.patch
          git rm .github/workflows/e2-file-buttons-transport.yml
          git apply --index /tmp/e2-file-buttons.patch
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          git config user.name 'Dokkomplekt CI'
          git config user.email 'dokkomplekt-ci@users.noreply.github.com'
          git commit -m 'fix: make E2 file pickers accessible'
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git push origin HEAD:canon-v2/e2-template-learning-proof
