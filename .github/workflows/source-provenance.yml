name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify-rust:
    name: Fix and verify Rust hardening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2
          restore-keys: |
            rust-compile-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Fix ownership, format, check and publish
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/universal_intake.rs')
          text = path.read_text('utf-8')
          start = text.index('fn preflight_external_archive(')
          end = text.index('\nfn ', start + 1)
          section = text[start:end]
          old = 'for entry in entries {'
          if section.count(old) != 1:
              raise RuntimeError(f'expected one owned archive loop, found {section.count(old)}')
          section = section.replace(old, 'for entry in &entries {', 1)
          text = text[:start] + section + text[end:]
          old_response = 'let mut response = response.ok_or_else(|| "HTTPS-источник не получен.".to_string())?;'
          if text.count(old_response) != 1:
              raise RuntimeError('expected one mutable response binding')
          text = text.replace(old_response, 'let response = response.ok_or_else(|| "HTTPS-источник не получен.".to_string())?;', 1)
          path.write_text(text, 'utf-8')
          PY
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('build_source_archive', root / 'scripts' / 'build_source_archive.py')
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load build_source_archive')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          (root / module.SOURCE_MANIFEST).write_bytes(module.source_manifest_payload())
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/universal_intake.rs SOURCE_MANIFEST_SHA256.txt
          git commit -m 'fix(rust): preserve archive entries through preflight'
          git push origin "HEAD:${BRANCH}"
