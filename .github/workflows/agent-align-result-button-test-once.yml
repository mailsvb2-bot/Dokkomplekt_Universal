name: Align result button scenario once

on:
  push:
    branches:
      - agent/restore-diary-output-parity

permissions:
  contents: write

concurrency:
  group: align-result-button-scenario-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/restore-diary-output-parity
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Align the scenario with the explicit result-folder button
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.scenarios.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = '    await click(/Открыть комплект/);'
          new = '    await click(/Открыть папку с документами/);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale result-button assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-align-result-button-test-once.yml
      - name: Commit the aligned scenario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align result folder scenario label"
          git push origin HEAD:agent/restore-diary-output-parity
