name: Finalize Hardware Gate Fix

on:
  pull_request_target:
    types: [edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.number == 49 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark finalizer start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/49/comments"
          request = urllib.request.Request(url, data=json.dumps({'body': f"Hardware-gate finalizer run {os.environ['RUN_ID']} started."}).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}, method='POST')
          urllib.request.urlopen(request).read()
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-windows-hardware-release-gate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refresh manifest and validate workflow contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
          python -m pytest -q tests/test_v18_4_3_audit_closure.py tests/test_release_environment_preflight.py tests/test_source_manifest_integrity.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/windows-hardware-e2e.yml').read_text(encoding='utf-8'))
          print('workflow YAML parsed')
          PY
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content 'tests/windows/windows_hardware_e2e.ps1' -Raw)) | Out-Null; Write-Host 'PowerShell parsed'"
      - name: Publish finalized branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git commit -m "Refresh hardware gate source manifest"
          git push origin HEAD:agent/fix-windows-hardware-release-gate
      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/49/comments"
          request = urllib.request.Request(url, data=json.dumps({'body': f"Hardware-gate finalizer run {os.environ['RUN_ID']} failed; inspect the Actions log."}).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}, method='POST')
          urllib.request.urlopen(request).read()
          PY
