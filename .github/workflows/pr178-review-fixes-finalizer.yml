name: PR178 review fixes finalizer
on:
  push:
    branches:
      - ops/pr178-review-fixes-finalize-20260908
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact review fixes and validate
        env:
          PATCH_B64: ""
          EXPECTED_HEAD: "c16d9de0a05f141d0f34102a06366acdd6250da3"
          PATCH_SHA256: "6d35da596d3167b5511af7fa372494f6ca28ab60eaa1fdff518191503abe8f4b"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/review-fixes.patch
          echo "$PATCH_SHA256  /tmp/review-fixes.patch" | sha256sum -c -
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch
          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          cargo test --manifest-path src-tauri/Cargo.toml profile_sources_tests -- --nocapture
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py tests/test_source_manifest_integrity.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add src-tauri/src/subsystems/profile_sources.rs SOURCE_MANIFEST_SHA256.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Close diary template review races'
          git push origin HEAD:fix/real-user-workflow-20260907
