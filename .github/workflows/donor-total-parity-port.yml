          )

          # The explicit donor choice is semantic data: persist the choice and
          # materialize the required lab block as "Нет анализов" in the same case.
          replace(
              'crates/dokkomplekt-core/src/popup_engine.rs',
              '''    let by_id = answers
        .iter()
        .map(|answer| (answer.field_id.trim(), answer))
        .collect::<BTreeMap<_, _>>();
    let mut next = case.clone();
    let mut still_missing = Vec::new();

    for prompt in &plan.prompts {''',
              '''    let by_id = answers
        .iter()
        .map(|answer| (answer.field_id.trim(), answer))
        .collect::<BTreeMap<_, _>>();
    let explicit_without_labs = by_id
        .get("medical.labs_without")
        .is_some_and(|answer| matches!(answer.value.trim().to_lowercase().as_str(), "да" | "yes" | "true"));
    let mut next = case.clone();
