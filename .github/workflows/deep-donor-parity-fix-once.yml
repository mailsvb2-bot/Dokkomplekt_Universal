name: Deep donor parity fix once

on:
  push:
    branches: [fix/medical-diary-source-parity-20260815]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/medical-diary-source-parity-20260815
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply audited parity fixes
        run: |
          set -euo pipefail
          python scripts/apply_donor_parity_fix_once.py
          cargo fmt --all
          rm scripts/apply_donor_parity_fix_once.py
          rm .github/workflows/deep-donor-parity-fix-once.yml

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Targeted role-boundary regression
        run: cargo test -p dokkomplekt-core document_render_scopes_medical_role_without_medicalizing_other_domains

      - name: Full core regression
        run: cargo test -p dokkomplekt-core

      - name: Frontend regression and typecheck
        run: |
          npm run test
          npm run typecheck

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Compile Tauri runtime paths
        run: cargo check -p dokkomplekt-tauri

      - name: Synchronize source manifest
        run: python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt

      - name: Verify patch hygiene
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --stat
          test ! -e scripts/apply_donor_parity_fix_once.py
          test ! -e .github/workflows/deep-donor-parity-fix-once.yml

      - name: Commit audited fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: preserve donor document completion contracts"
          git push origin HEAD:fix/medical-diary-source-parity-20260815
