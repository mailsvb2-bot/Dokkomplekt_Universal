name: One-time E2 harness patch

on:
  push:
    branches:
      - canon-v2/e2-template-learning-proof

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch critical E2 actions and restore canonical workflows
        shell: bash
        run: |
          set -euo pipefail
          export ANALYZE_B64=''
          export CREATE_B64=''
          python - <<'PY'
          from pathlib import Path
          import base64, os
          path = Path('tests/installer/windows_installer_contract.ps1')
          text = path.read_text(encoding='utf-8-sig')
          analyze_start = "try {\n  Invoke-UiActionWithObservedTransition `\n    -Description 'Проверить пары и предложить карту' `"
          analyze_end = "\n\n$currentAppWindow = Find-LiveAppWindow"
          start = text.find(analyze_start)
          if start < 0 or text.find(analyze_start, start + 1) >= 0:
              raise SystemExit('analyze marker mismatch')
          end = text.find(analyze_end, start)
          if end < 0:
              raise SystemExit('analyze end marker missing')
          analyze = base64.b64decode(os.environ['ANALYZE_B64']).decode('utf-8')
          text = text[:start] + analyze + text[end:]
          create_start = "  Invoke-UiActionFromProbe -Description 'E2 Создать документы' -ActionProbe {"
          create_end = "  $e2Archive = [System.IO.Compression.ZipFile]::OpenRead($e2Created.FullName)"
          start = text.find(create_start)
          if start < 0 or text.find(create_start, start + 1) >= 0:
              raise SystemExit('create marker mismatch')
          end = text.find(create_end, start)
          if end < 0:
              raise SystemExit('create end marker missing')
          create = base64.b64decode(os.environ['CREATE_B64']).decode('utf-8')
          text = text[:start] + create + text[end:]
          path.write_text(text, encoding='utf-8-sig', newline='\n')
          PY
          git checkout 94f71497fce4165fdfa75357dd339cdd2300b4c4 -- .github/workflows/source-provenance.yml .github/workflows/unsigned-preview.yml
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report-before.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.after.txt --json-report verification/ci/source-manifest-report-after.json
          git diff --check HEAD
          mapfile -t delta < <(git diff --name-only 94f71497fce4165fdfa75357dd339cdd2300b4c4 | sort)
          printf 'Clean delta: %s\n' "${delta[*]}"
          test "${#delta[@]}" -eq 2
          test "${delta[0]}" = 'SOURCE_MANIFEST_SHA256.txt'
          test "${delta[1]}" = 'tests/installer/windows_installer_contract.ps1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/source-provenance.yml .github/workflows/unsigned-preview.yml tests/installer/windows_installer_contract.ps1 SOURCE_MANIFEST_SHA256.txt
          git commit -m 'test: use real keyboard input for critical E2 actions'
          git push origin HEAD:canon-v2/e2-template-learning-proof