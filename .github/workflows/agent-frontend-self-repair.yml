name: Self-cleaning frontend repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: frontend-self-repair-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'agent/fix-plan-ui-postgres-maintainability'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply focused frontend and scenario repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          source = app.read_text(encoding='utf-8')
          old_import = "import { ensurePopupField } from './components/PopupFieldEditor';"
          new_import = "import { ensurePopupField, newPopupField } from './components/PopupFieldEditor';"
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit('expected PopupFieldEditor import not found')
              app.write_text(source.replace(old_import, new_import, 1), encoding='utf-8')

          test = Path('src/App.scenarios.test.tsx')
          source = test.read_text(encoding='utf-8')
          old_block = """    // select document -> workflow plan + actual template text, fields render
    fireEvent.click(screen.getByRole('button', { name: 'Счёт на оплату' }));
    await screen.findByDisplayValue('7701234567');
    await waitFor(() => expect(calls.some((c) => c.command === 'get_document_template_text')).toBe(true));"""
          new_block = """    // Opening a document and selecting documents for the final kit are separate actions.
    // Force an explicit single -> batch transition so this scenario verifies both plans and
    // cannot accidentally rely on the initial selection restored by first_run_state.
    fireEvent.click(screen.getByRole('button', { name: 'Счёт на оплату' }));
    await waitFor(() => expect(calls.some((c) => c.command === 'get_document_template_text')).toBe(true));
    fireEvent.click(screen.getByRole('button', { name: 'Снять выбор' }));
    fireEvent.click(screen.getByRole('checkbox', { name: 'Добавить Счёт на оплату в комплект' }));
    await screen.findByDisplayValue('7701234567');
    fireEvent.click(screen.getByRole('checkbox', { name: 'Добавить Сопроводительное письмо в комплект' }));
    await waitFor(() => expect(calls.some((c) => {
      if (c.command !== 'get_workflow_plan_batch') return false;
      const request = (c.payload as { req?: { document_ids?: string[] } } | undefined)?.req;
      return request?.document_ids?.join(',') === 'acc_1,doc_2';
    })).toBe(true));
    await screen.findByDisplayValue('7701234567');"""
          if new_block not in source:
              if old_block not in source:
                  raise SystemExit('expected scenario selection block not found')
              test.write_text(source.replace(old_block, new_block, 1), encoding='utf-8')
          PY
          git rm .github/workflows/agent-frontend-self-repair.yml
          git rm .github/workflows/agent-frontend-final-repair.yml
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          npm run typecheck
          npm run test
          npm run build
      - name: Commit clean verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          TREE_SHA="$(git write-tree)"
          git commit -m 'Fix frontend plan scenario verification' -m "tree-sha: ${TREE_SHA}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.head_ref }}"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
