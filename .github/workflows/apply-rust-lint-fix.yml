name: Apply Strict Rust Lint Fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/rust-lint-fix/**'
      - '.github/workflows/apply-rust-lint-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-strict-rust-lint-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/fix-critical-security-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-security-privacy
          fetch-depth: 0
      - name: Record starting branch head
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Authenticate and apply lint fix
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(sha256sum .github/rust-lint-fix/remove-dead-api.patch | awk '{print $1}')"
          expected='579756e9cc5489c4e6d94d8343ae2347a462799a4012aea9cb602ff81d8914df'
          test "$actual" = "$expected"
          git apply --check .github/rust-lint-fix/remove-dead-api.patch
          git apply .github/rust-lint-fix/remove-dead-api.patch
          rm -rf .github/rust-lint-fix
          rm -f .github/workflows/apply-rust-lint-fix.yml
      - name: Format and run strict Rust gate
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Regenerate manifest and rerun contract wall
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python scripts/verify_starter_content_packs.py
          python scripts/check_reference_data_freshness.py
          python scripts/audit_rust_production_panics.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
      - name: Commit and publish clean tree safely
        shell: bash
        env:
          BRANCH: agent/fix-critical-security-privacy
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: remove dead cross-platform intake API'
          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse "origin/$BRANCH")"
          if [[ "$remote_sha" != "$START_SHA" ]]; then
            mapfile -t changed < <(git diff --name-only "$START_SHA..$remote_sha")
            if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != 'SOURCE_MANIFEST_SHA256.txt' ]]; then
              printf 'Refusing to overwrite concurrent product changes:\n%s\n' "${changed[*]}"
              exit 1
            fi
            tree="$(git rev-parse 'HEAD^{tree}')"
            replacement="$(printf '%s\n' 'fix: remove dead cross-platform intake API' | git commit-tree "$tree" -p "$remote_sha")"
            git reset --hard "$replacement"
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
