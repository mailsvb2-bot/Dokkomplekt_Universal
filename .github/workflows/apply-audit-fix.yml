name: Apply Accounting Popup Audit Fix

on:
  push:
    branches: [agent/fix-accounting-popup-canonicalization]
    paths:
      - '.github/workflows/apply-audit-fix.yml'

permissions:
  contents: write

concurrency:
  group: accounting-popup-audit-fix
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-accounting-popup-canonicalization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply verified local audit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/audit-fix/part-* | base64 --decode > /tmp/accounting-popup-fix.patch
          git apply --check /tmp/accounting-popup-fix.patch
          git apply /tmp/accounting-popup-fix.patch
      - name: Format and run focused Rust regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          cargo fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml
          cargo fmt --manifest-path crates/dokkomplekt-license-python/Cargo.toml
          cargo test -p dokkomplekt-core popup_profiles --lib
          cargo test -p dokkomplekt-core field_aliases --lib
      - name: Run focused Python contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_v18_4_3_repair_contracts.py tests/test_linux_installer_smoke_contract.py
      - name: Remove one-use transport and rebuild source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/audit-fix
          rm -f .github/workflows/apply-audit-fix.yml
          python scripts/verify_source_manifest.py --candidate /tmp/source-manifest.txt || true
          test -s /tmp/source-manifest.txt
          cp /tmp/source-manifest.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Publish clean audit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix accounting popup canonicalization and input types'
          git push origin HEAD:agent/fix-accounting-popup-canonicalization
