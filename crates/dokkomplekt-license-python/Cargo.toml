[package]
name = "dokkomplekt-license-python"
version = "18.4.3"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "dokkomplekt_license_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
dokkomplekt-license-core = { path = "../dokkomplekt-license-core" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
serde_json = "1"
time = { version = ">=0.3.47, <0.4", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
