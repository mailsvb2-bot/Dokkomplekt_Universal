name: Source Provenance

on:
  push:
    branches: [main, ui/client-first-neutral]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest matches tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply staged client-first UI
        if: github.head_ref == 'ui/client-first-neutral' || github.ref_name == 'ui/client-first-neutral'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f verification/ui-patch/chunk-00.txt
          cat verification/ui-patch/chunk-01-parts/part-*.txt > /tmp/chunk-01.txt
          test "$(git hash-object /tmp/chunk-01.txt)" = "b5a1925dad9e0b2f02fcc149e165c982cd08c08d"
          {
            cat verification/ui-patch/chunk-00.txt
            cat /tmp/chunk-01.txt
            cat verification/ui-patch/chunk-02.txt
            cat verification/ui-patch/chunk-03.txt
            cat verification/ui-patch/chunk-04.txt
            cat verification/ui-patch/chunk-05.txt
          } | base64 -d | gzip -d > /tmp/ui-client-first.patch
          test "$(sha256sum /tmp/ui-client-first.patch | awk '{print $1}')" = "9f692027673467d49d948526118d555b74968d37e1cd7845a24637737acf038c"
          git apply --check /tmp/ui-client-first.patch
          git apply /tmp/ui-client-first.patch
          rm -rf verification/ui-patch
          rm -f .github/workflows/apply-ui-client-first.yml
          git show origin/main:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign UI around a neutral client workflow'
          git push origin HEAD:ui/client-first-neutral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Upload source-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-candidate
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
