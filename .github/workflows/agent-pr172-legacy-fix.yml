name: Agent PR172 legacy fix bootstrap

on:
  push:
    branches:
      - agent/donor-medical-preflight-parity

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          echo '4f85b8fb2012d37f33fe60f1a6e1a7c5e2cd39a46622013f4be88b4537d7215a  scripts/agent_pr172_legacy_fix.patch' | sha256sum -c -
          git apply --check scripts/agent_pr172_legacy_fix.patch

      - name: Apply review fix and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply scripts/agent_pr172_legacy_fix.patch
          git rm scripts/agent_pr172_legacy_fix.patch .github/workflows/agent-pr172-legacy-fix.yml
          cargo fmt --all

      - name: Regenerate source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_source_archive.py \
            --output /tmp/Dokkomplekt_Universal-pr172-review-fix.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json /tmp/pr172-review-fix-manifest.json

      - name: Verify review regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dokkomplekt-core legacy_vk_scoped_work_values_satisfy_shared_donor_prompts -- --nocapture
          cargo test -p dokkomplekt-core legacy_vk_scoped_skip_is_preserved_for_skippable_shared_prompt -- --nocapture
          git diff --check

      - name: Commit clean follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'Preserve legacy scoped work values during planning'
          git push origin HEAD:agent/donor-medical-preflight-parity
