name: Fix legacy domain fallback regression once

on:
  push:
    branches: [fix/legacy-static-template-intelligence-20260815]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/legacy-static-template-intelligence-20260815
          fetch-depth: 0
      - name: Pin generic fallback without cross-domain leakage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/dokkomplekt-core/src/legacy_template_inference.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        assert!(
              legal.is_empty(),
              "a label that belongs to other domains must remain unresolved in Legal"
          );'''
          new = '''        assert_eq!(legal.len(), 1);
          assert_eq!(legal[0].field_id, "subject.position");
          assert_ne!(legal[0].field_id, "employee.position");
          assert_ne!(legal[0].field_id, "medical.position");'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Legal fallback assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-legacy-domain-test-once.yml
          git config user.name "mailsvb2-bot"
          git config user.email "mailsvb2@gmail.com"
          git add crates/dokkomplekt-core/src/legacy_template_inference.rs
          git diff --cached --check
          git commit -m "Pin safe generic fallback for legacy template inference"
          git push origin HEAD:fix/legacy-static-template-intelligence-20260815
