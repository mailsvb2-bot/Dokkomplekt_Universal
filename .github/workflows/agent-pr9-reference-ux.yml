          new_package = ".packageItem { appearance: none; width: 100%; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; min-height: 56px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel2); color: inherit; text-align: left; transition: border-color .16s, background .16s, transform .16s, box-shadow .16s; }\n.packageItem:hover { border-color: var(--accent-line); transform: translateY(-1px); }\n.packageItem:focus-visible { outline: 3px solid var(--accent-bg); border-color: var(--accent); }\n.packageItem.selected { border-color: color-mix(in srgb, var(--accent) 58%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--panel2)); }\n.packageItem.active { box-shadow: inset 3px 0 0 var(--accent); }\n.packageTileIcon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-bg); color: var(--accent); font-size: 18px; }\n.packageTileText { min-width: 0; display: grid; gap: 3px; }\n.packageTileText strong { overflow: hidden; color: var(--text); font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }\n.packageTileText small { color: var(--muted); font-size: 9px; }\n.packageTileState { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid var(--field-line); border-radius: 8px; color: var(--muted); background: var(--panel2); font-size: 12px; }\n.packageItem.selected .packageTileState { border-color: var(--accent); background: var(--accent); color: white; }"
