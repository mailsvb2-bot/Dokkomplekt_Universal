name: E2 Harness Exact Tree Transport

on:
  push:
    branches:
      - canon-v2/e2-template-learning-proof

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 2
      - name: Materialize exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "19c02f480135b5cb8185c8b18b47c5bf8bc169a1"
          cat > /tmp/e2.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/e2.patch.gz.b64 > /tmp/e2.patch.gz
          test "$(sha256sum /tmp/e2.patch.gz | awk '{print $1}')" = "05053789eae8f9835d22e1c01ed75465774415a02f2dd5693600e7f659f86c18"
          gzip -dc /tmp/e2.patch.gz > /tmp/e2.patch
          rm .github/workflows/e2-harness-exact-tree.yml
          git apply --check /tmp/e2.patch
          git apply /tmp/e2.patch
          git add -A
          test "$(git write-tree)" = "175e3b8b1f0d4174d91d04e9b7befadfcbcfdf81"
          git config user.name "Dokkomplekt CI"
          git config user.email "dokkomplekt-ci@users.noreply.github.com"
          git commit -m "test: allow blank E2 learning fixture"
          git push origin HEAD:canon-v2/e2-template-learning-proof
