name: Apply Linux AppImage Runtime Fix

on:
  push:
    branches: [agent/fix-linux-appimage-runtime]

permissions:
  contents: write

concurrency:
  group: fix-linux-appimage-runtime
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-linux-appimage-runtime
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply fundamental AppImage portability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          Path('src-tauri/tauri.linux.conf.json').write_text(json.dumps({
            '$schema': 'https://schema.tauri.app/config/2',
            'bundle': {'linux': {'appimage': {'files': {
              '/usr/lib/libGLESv2.so.2': 'linux-runtime/libGLESv2.so.2',
              '/usr/lib/libEGL.so.1': 'linux-runtime/libEGL.so.1',
              '/usr/lib/libGLdispatch.so.0': 'linux-runtime/libGLdispatch.so.0'
            }}}}
          }, indent=2) + '\n', encoding='utf-8')

          Path('scripts/stage_linux_appimage_runtime.py').write_text(r'''#!/usr/bin/env python3
          """Stage dlopen-only graphics libraries that linuxdeploy cannot discover."""
          from __future__ import annotations
          import os
          import shutil
          import subprocess
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          DEST = ROOT / "src-tauri" / "linux-runtime"
          REQUIRED = ("libGLESv2.so.2", "libEGL.so.1", "libGLdispatch.so.0")

          def ldconfig_map() -> dict[str, Path]:
              result = subprocess.run(["ldconfig", "-p"], text=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, check=True)
              found: dict[str, Path] = {}
              for line in result.stdout.splitlines():
                  if "=>" not in line:
                      continue
                  name, path = line.split("=>", 1)
                  key = name.strip().split()[0]
                  candidate = Path(path.strip())
                  if key in REQUIRED and candidate.is_file():
                      found.setdefault(key, candidate.resolve())
              return found

          def main() -> int:
              if os.name != "posix":
                  raise SystemExit("Linux AppImage runtime staging must run on Linux")
              discovered = ldconfig_map()
              missing = [name for name in REQUIRED if name not in discovered]
              if missing:
                  raise SystemExit("missing required AppImage graphics libraries: " + ", ".join(missing))
              if DEST.exists():
                  shutil.rmtree(DEST)
              DEST.mkdir(parents=True)
              for name in REQUIRED:
                  source = discovered[name]
                  target = DEST / name
                  shutil.copy2(source, target)
                  if target.read_bytes()[:4] != b"\x7fELF":
                      raise SystemExit(f"staged runtime library is not ELF: {target}")
                  print(f"staged {name}: {source} -> {target}")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          ''', encoding='utf-8')

          contract = Path('tests/installer/linux_installer_contract.sh')
          text = contract.read_text('utf-8')
          marker = '''  [ -f "$extract_dir/squashfs-root/AppRun" ] || {
            echo "AppImage extraction did not produce AppRun" >&2
            exit 1
          }
          '''
          addition = marker + '''  for required_graphics_lib in libGLESv2.so.2 libEGL.so.1 libGLdispatch.so.0; do
            find "$extract_dir/squashfs-root/usr/lib" -type f -name "$required_graphics_lib" -print -quit | grep -q . || {
              echo "AppImage is missing required graphics runtime: $required_graphics_lib" >&2
              exit 1
            }
          done
          '''
          if marker not in text:
              raise SystemExit('installer contract marker not found')
          contract.write_text(text.replace(marker, addition), encoding='utf-8')

          test = Path('tests/test_linux_installer_smoke_contract.py')
          text = test.read_text('utf-8')
          text = text.replace('mkdir -p squashfs-root/usr/bin\nprintf',
                              'mkdir -p squashfs-root/usr/bin squashfs-root/usr/lib\nfor lib in libGLESv2.so.2 libEGL.so.1 libGLdispatch.so.0; do : > "squashfs-root/usr/lib/$lib"; done\nprintf')
          text = text.replace('mkdir -p squashfs-root\nprintf',
                              'mkdir -p squashfs-root/usr/lib\nfor lib in libGLESv2.so.2 libEGL.so.1 libGLdispatch.so.0; do : > "squashfs-root/usr/lib/$lib"; done\nprintf')
          test.write_text(text, encoding='utf-8')

          for name in ('.github/workflows/quality-gate.yml', '.github/workflows/build-installers.yml'):
              path = Path(name)
              text = path.read_text('utf-8')
              text = text.replace(
                  'libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb dbus-x11',
                  'libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb dbus-x11 libegl1 libgles2 libglvnd0')
              text = text.replace(
                  'npx tauri build --bundles appimage,deb,rpm',
                  'python scripts/stage_linux_appimage_runtime.py\n          npx tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.linux.conf.json')
              path.write_text(text, encoding='utf-8')

          Path('tests/test_linux_appimage_runtime_contract.py').write_text(r'''from __future__ import annotations
          import json
          from pathlib import Path
          ROOT = Path(__file__).resolve().parents[1]

          def test_appimage_explicitly_bundles_dlopen_graphics_runtime() -> None:
              config = json.loads((ROOT / "src-tauri/tauri.linux.conf.json").read_text("utf-8"))
              assert config["bundle"]["linux"]["appimage"]["files"] == {
                  "/usr/lib/libGLESv2.so.2": "linux-runtime/libGLESv2.so.2",
                  "/usr/lib/libEGL.so.1": "linux-runtime/libEGL.so.1",
                  "/usr/lib/libGLdispatch.so.0": "linux-runtime/libGLdispatch.so.0",
              }

          def test_all_linux_bundle_workflows_stage_and_use_overlay() -> None:
              for path in (ROOT / ".github/workflows/quality-gate.yml", ROOT / ".github/workflows/build-installers.yml"):
                  text = path.read_text("utf-8")
                  assert "python scripts/stage_linux_appimage_runtime.py" in text
                  assert "--config src-tauri/tauri.linux.conf.json" in text
                  assert "libegl1 libgles2 libglvnd0" in text

          def test_installer_smoke_rejects_host_dependent_appimage() -> None:
              text = (ROOT / "tests/installer/linux_installer_contract.sh").read_text("utf-8")
              for name in ("libGLESv2.so.2", "libEGL.so.1", "libGLdispatch.so.0"):
                  assert name in text
          ''', encoding='utf-8')
          PY
          chmod +x scripts/stage_linux_appimage_runtime.py
          python -m pytest -q tests/test_linux_appimage_runtime_contract.py tests/test_linux_installer_smoke_contract.py
          python scripts/build_source_archive.py --output /tmp/dokkomplekt-source.zip --top-level Dokkomplekt_Universal --manifest-json /tmp/source-report.json
          rm .github/workflows/fix-linux-appimage-runtime.yml
      - name: Commit clean product fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Linux AppImage graphics runtime portability"
          git push origin HEAD:agent/fix-linux-appimage-runtime
