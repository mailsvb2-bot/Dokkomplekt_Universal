name: PR178 unused-warning guarded fix

on:
  push:
    branches:
      - ops/pr178-unused-warning-fix-20260908

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact warning fix and validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_head='a645fae867f55a16fda43f0510c852a44b83d827'
          test "$(git rev-parse HEAD)" = "$expected_head"

          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/subsystems/profile_sources.rs')
          s = p.read_text(encoding='utf-8')
          old = 'Err(error) if medical_diary_template_is_usable(path) => {'
          new = 'Err(_) if medical_diary_template_is_usable(path) => {'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          cargo fmt --all -- --check
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          bash scripts/prepackage_rust_gate.sh
          git diff --check

          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add src-tauri/src/subsystems/profile_sources.rs SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Fix atomic diary publication warning'
          git push origin HEAD:fix/real-user-workflow-20260907
