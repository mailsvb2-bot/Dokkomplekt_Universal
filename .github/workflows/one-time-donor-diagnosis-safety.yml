name: One-time donor diagnosis safety

on:
  push:
    branches:
      - agent/donor-medical-source-parity-20260817

permissions:
  contents: write

concurrency:
  group: donor-diagnosis-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-medical-source-parity-20260817
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply donor diagnosis safety migration
        run: python .github/agent-fixes/restore_donor_diagnosis_safety.py
      - name: Format and verify donor diagnosis safety
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p dokkomplekt-core source_parser::tests
          cargo test --locked -p dokkomplekt-core --test donor_medical_source_parity
          python scripts/static_quality_gate.py --source-only
      - name: Commit canonical implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-donor-diagnosis-safety.yml
          rm -f .github/agent-fixes/restore_donor_diagnosis_safety.py
          git config user.name "BusinesMetro"
          git config user.email "mailsvb2@gmail.com"
          git add -A
          git commit -m "Harden donor medical diagnosis extraction"
          git push origin HEAD:agent/donor-medical-source-parity-20260817
