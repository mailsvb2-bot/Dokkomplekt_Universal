name: Apply simple UI test adjustments

on:
  push:
    branches: [fix/simple-ui-button-creation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-ui-button-creation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align the broad scenario with the simplified labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.scenarios.test.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "screen.getByText('Настройка документов')": "screen.getByText('Управление кнопками')",
              "screen.getByText('Экземпляры для печати')": "screen.getByText('Количество экземпляров')",
              "screen.getByRole('button', { name: 'Очистить' })": "screen.getByRole('button', { name: 'Снять выбор' })",
              "await click(/Удалить из набора/);": "await click(/Убрать из набора/);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected scenario text not found: {old}')
              text = text.replace(old, new, 1)

          old = """    const dialog = screen.getByRole('dialog', { name: 'Добавление шаблонов' });
              fireEvent.click(within(dialog).getByRole('button', { name: 'Анализировать' }));"""
          new = """    const dialog = screen.getByRole('dialog', { name: 'Добавление шаблонов' });
              fireEvent.click(within(dialog).getByText('Создать шаблон из вставленного текста'));
              fireEvent.click(within(dialog).getByRole('button', { name: 'Анализировать' }));"""
          if old not in text:
              raise SystemExit('template dialog scenario block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-simple-ui-test-adjustments.yml').unlink()
          PY
      - name: Commit adjusted regression scenario
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.scenarios.test.tsx .github/workflows/apply-simple-ui-test-adjustments.yml
          git commit -m "test(ui): align full scenario with simple controls"
          git push origin HEAD:fix/simple-ui-button-creation
