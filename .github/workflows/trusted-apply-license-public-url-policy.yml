name: Trusted apply license public URL policy

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trusted-license-public-url-policy
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-license-public-url'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-license-public-url
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          transport='.github/patches/license-public-url-policy.patch.gz.b64'
          gzip_path="$RUNNER_TEMP/license-public-url-policy.patch.gz"
          patch_path="$RUNNER_TEMP/license-public-url-policy.patch"
          base64 --decode "$transport" > "$gzip_path"
          echo 'ea32e2e8732df224964bd8748b27e3149426334cd57bf7399118275d57a70c06  '"$gzip_path" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_path" > "$patch_path"
          echo '834f731e2577f3ee55ec48097a94d3489719960137d253f0d09b82ab0fcc0630  '"$patch_path" | sha256sum --check --strict
          git apply --check --whitespace=error-all "$patch_path"
          git apply --whitespace=error-all "$patch_path"
          git rm \
            .github/patches/license-public-url-policy.patch.gz.b64 \
            .github/patches/license-public-url-policy.trigger
      - name: Format and verify license-server policy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          cargo +1.97.1 fmt --all
          cargo +1.97.1 generate-lockfile --manifest-path crates/dokkomplekt-license-server/Cargo.toml
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt crates tests
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 test --locked --manifest-path crates/dokkomplekt-license-server/Cargo.toml -- --test-threads=1
          python -m pytest -q \
            tests/test_v18_0_7_security_update_popup_license_contracts.py \
            tests/test_v18_3_0_license_database_transport.py \
            tests/test_source_manifest_integrity.py \
            tests/test_source_fingerprint.py
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Publish verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Harden license-server production public URL policy'
          git push --force origin HEAD:agent/harden-license-public-url
