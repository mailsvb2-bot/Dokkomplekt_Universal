name: One-shot real DOCX publication patch

on:
  push:
    branches:
      - agent/fix-real-docx-publication-20260818
    paths:
      - .github/workflows/one-shot-real-docx-publication.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-real-docx-publication-20260818
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact source patch
        run: python .github/scripts/apply_real_docx_publication_patch.py

      - name: Run focused publication contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_manual_generation_physical_publication_contract.py \
            tests/test_generation_publication_accounting_contract.py \
            tests/test_publication_completion_exactly_once_contract.py \
            tests/test_runtime_user_scenario_hardening.py

      - name: Remove one-shot machinery
        shell: bash
        run: |
          rm -f .github/scripts/apply_real_docx_publication_patch.py
          rm -f .github/workflows/one-shot-real-docx-publication.yml

      - name: Commit only product code and permanent tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: require physical DOCX publication'
          git pull --rebase origin agent/fix-real-docx-publication-20260818
          git push origin HEAD:agent/fix-real-docx-publication-20260818
