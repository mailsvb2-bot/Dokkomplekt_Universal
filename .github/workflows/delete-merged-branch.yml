name: Delete Merged Working Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-working-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Delete conventional merged branch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$BRANCH" =~ ^(agent|fix|chore)/[A-Za-z0-9._/-]+$ ]]; then
            echo "Branch is outside the guarded working-branch namespaces; leaving it untouched: $BRANCH"
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch is already absent: $BRANCH"
            exit 0
          fi
          git push origin --delete "$BRANCH"
