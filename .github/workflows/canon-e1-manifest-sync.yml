name: Canon E1 source manifest sync one-shot

on:
  push:
    branches:
      - canon-v2/e1-accounting-pipeline

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate canonical manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "canon-v2/e1-accounting-pipeline"
          rm .github/workflows/canon-e1-manifest-sync.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --name-only | sort > /tmp/changed-files.txt
          printf '%s\n' '.github/workflows/canon-e1-manifest-sync.yml' 'SOURCE_MANIFEST_SHA256.txt' | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/canon-e1-manifest-sync.yml SOURCE_MANIFEST_SHA256.txt
          git commit -m 'Sync source manifest after Windows atomic write fix'
          git push origin HEAD:canon-v2/e1-accounting-pipeline
