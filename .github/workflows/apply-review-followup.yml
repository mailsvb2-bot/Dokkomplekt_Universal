name: Apply Security Review Follow-up

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/review-followup/**'
      - '.github/workflows/apply-review-followup.yml'

permissions:
  contents: write

concurrency:
  group: apply-security-review-followup
  cancel-in-progress: false

jobs:
  apply-format-and-verify:
    if: github.head_ref == 'agent/fix-critical-security-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-security-privacy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Authenticate and apply incremental patch
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode .github/review-followup/review-followup.patch.gz.b64 | gzip --decompress > /tmp/review-followup.patch
          actual="$(sha256sum /tmp/review-followup.patch | awk '{print $1}')"
          expected='709f66d1b0e2d298fbd82a3f2a3c47aecbbe03b64a953d5749b4afd11d0918b2'
          test "$actual" = "$expected"
          git apply --check /tmp/review-followup.patch
          git apply /tmp/review-followup.patch
      - name: Remove one-use transport and format Rust sources
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/review-followup
          rm -f .github/workflows/apply-review-followup.yml
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Regenerate source manifest before contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
      - name: Run complete local contract wall
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python scripts/verify_starter_content_packs.py
          python scripts/check_reference_data_freshness.py
          python scripts/audit_rust_production_panics.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
      - name: Commit clean review follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close legacy recovery and proxy trust gaps'
          git push origin HEAD:agent/fix-critical-security-privacy
