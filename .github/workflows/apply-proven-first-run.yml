name: Apply proven first-run and button flow

on:
  push:
    branches:
      - agent/restore-proven-first-run-and-buttons

permissions:
  contents: write

concurrency:
  group: apply-proven-first-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed patch and remove transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .github/proven-first-run.patch.gz.b64
          base64 --decode .github/proven-first-run.patch.gz.b64 | gzip -dc > /tmp/proven-first-run.patch
          test -s /tmp/proven-first-run.patch
          git apply --check /tmp/proven-first-run.patch
          git apply /tmp/proven-first-run.patch
          rm -f .github/proven-first-run.patch.gz.b64
          rm -f .github/workflows/apply-proven-first-run.yml
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          module_path = Path('scripts/build_source_archive.py')
          spec = importlib.util.spec_from_file_location('build_source_archive', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.write_source_manifest(module.source_files())
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore proven first-run and button creation flow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
