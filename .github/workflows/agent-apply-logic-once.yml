name: Agent apply scoped popup patch once

on:
  push:
    branches:
      - agent/legacy-user-parity
    paths:
      - '.github/workflows/agent-apply-logic-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply verified patch, test, and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch origin "${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          git apply --check .agent-logic.patch
          git apply .agent-logic.patch
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test -p dokkomplekt-core --lib
          python -m unittest discover -s tests -p 'test_v18_0_3_regression_contracts.py'
          python -m unittest discover -s tests -p 'test_v18_0_4_professional_popup_contracts.py'
          git rm .agent-logic.patch
          git rm .github/workflows/agent-apply-logic-once.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix scoped medical popup parity"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          exit 1
