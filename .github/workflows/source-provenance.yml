name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replace-obsolete-macro-contract:
    name: Replace obsolete macro preservation contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2
          restore-keys: |
            rust-compile-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace contract, run all Rust tests and publish
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/dokkomplekt-docx/src/lib.rs')
          text = path.read_text('utf-8')
          marker = '    #[test]\n    fn macro_binary_parts_are_preserved_byte_for_byte_when_rendering_docm() {'
          start = text.index(marker)
          end = text.index('    #[test]\n    fn license_watermark_is_written_into_the_resulting_docx()', start)
          replacement = '''    #[test]
    fn macro_binary_parts_are_rejected_before_rendering_docm() {
        let dir = std::env::temp_dir().join("dokkomplekt-docm-rejection-test");
        let tpl = dir.join("macro-template.docm");
        let out = dir.join("macro-rendered.docm");
        std::fs::create_dir_all(&dir).expect("create test dir");
        {
            let file = File::create(&tpl).expect("create docm");
            let mut writer = ZipWriter::new(file);
            let options = SimpleFileOptions::default();
            writer
                .start_file("[Content_Types].xml", options)
                .expect("content types");
            writer.write_all(b"<Types/>").expect("content types bytes");
            writer
                .start_file("word/document.xml", options)
                .expect("document");
            writer
                .write_all(b"<w:document><w:body><w:p><w:r><w:t>{{org.name}}</w:t></w:r></w:p></w:body></w:document>")
                .expect("document bytes");
            writer
                .start_file("word/vbaProject.bin", options)
                .expect("macro part");
            writer
                .write_all(b"synthetic-vba-project")
                .expect("macro bytes");
            writer.finish().expect("finish docm");
        }

        let error = render_docx_file(&tpl, &out, &case_with(&[("org.name", "Ромашка")]), true)
            .expect_err("active content must be rejected");
        assert!(matches!(
            error,
            DocxError::UnsafeActiveContent(ref part) if part == "word/vbaProject.bin"
        ));
        assert!(!out.exists(), "rejected DOCM must not create an output file");
        let _ = std::fs::remove_dir_all(&dir);
    }

'''
          path.write_text(text[:start] + replacement + text[end:], 'utf-8')
          PY
          cargo fmt --all
          cargo test --workspace --all-targets
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('build_source_archive', root / 'scripts' / 'build_source_archive.py')
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load build_source_archive')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          (root / module.SOURCE_MANIFEST).write_bytes(module.source_manifest_payload())
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dokkomplekt-docx/src/lib.rs SOURCE_MANIFEST_SHA256.txt
          git commit -m 'test(security): reject macro-bearing DOCM fixtures'
          git push origin "HEAD:${BRANCH}"
