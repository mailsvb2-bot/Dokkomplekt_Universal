name: Validate processing guard fencing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: agent-processing-guard-fencing
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-processing-guard-fencing
          fetch-depth: 0
      - name: Apply processing guard fencing patch
        run: python .github/patches/agent-processing-guard-fencing.py
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python contract dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all
      - name: Run processing guard fencing regression tests
        run: cargo test -p dokkomplekt-tauri processing_guard_ -- --nocapture
      - name: Compile Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests
      - name: Clippy Tauri tests
        shell: bash
        run: |
          set +e
          cargo clippy -p dokkomplekt-tauri --tests -- -D warnings 2>&1 | tee /tmp/processing-guard-clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .github/diagnostics
            cp /tmp/processing-guard-clippy.log .github/diagnostics/processing-guard-clippy.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/diagnostics/processing-guard-clippy.txt
            git commit -m "Capture processing guard clippy diagnostic"
            git fetch origin agent/fix-processing-guard-fencing
            git rebase --autostash origin/agent/fix-processing-guard-fencing
            git push origin HEAD:agent/fix-processing-guard-fencing
          fi
          exit "$status"
      - name: Run exactly-once and governance contracts
        run: >-
          python -m pytest -q
          tests/test_v18_3_2_central_queue_exactly_once.py
          tests/test_v18_4_0_reliability_contracts.py
          tests/test_v18_4_3_generation_plan_governance.py
          tests/test_agent_hardening_contracts.py
      - run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/agent-processing-guard-fencing.py .github/workflows/agent-processing-guard-fencing.yml .github/diagnostics/processing-guard-clippy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fence distributed processing guard ownership"
          git fetch origin agent/fix-processing-guard-fencing
          git rebase origin/agent/fix-processing-guard-fencing
          git push origin HEAD:agent/fix-processing-guard-fencing
