name: Repair Native Picker Product

on:
  pull_request_target:
    types: [edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  repair-product:
    if: ${{ github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SERVICE_ISSUE: '48'
    steps:
      - name: Mark repair start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = f"Native picker product repair run {os.environ['RUN_ID']} started."
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}, method='POST')
          urllib.request.urlopen(request).read()
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          path: control
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-native-template-picker
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Install dependencies
        working-directory: work
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply deterministic product repair
        working-directory: work
        run: python ../control/scripts/repair_native_picker_product_v2.py
      - name: Verify full frontend and targeted backend contracts
        working-directory: work
        run: |
          npm run test
          npm run typecheck
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
          python -m pytest -q tests/test_v18_4_4_native_template_picker.py tests/test_v18_3_0_hardening_contracts.py
      - name: Publish repaired branch
        working-directory: work
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore text-template fallback and test picker contracts"
          git push origin HEAD:agent/fix-native-template-picker
      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = f"Native picker product repair run {os.environ['RUN_ID']} failed; inspect its Actions log."
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}, method='POST')
          urllib.request.urlopen(request).read()
          PY
