name: Apply client-first UI patch

on:
  push:
    branches:
      - ui/client-first-neutral
    paths:
      - verification/ui-patch/**
      - .github/workflows/apply-ui-client-first.yml

permissions:
  contents: write

concurrency:
  group: apply-client-first-ui
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/client-first-neutral
          fetch-depth: 0

      - name: Apply staged UI patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat verification/ui-patch/chunk-*.txt | base64 -d | gzip -d > /tmp/ui-client-first.patch
          git apply --check /tmp/ui-client-first.patch
          git apply /tmp/ui-client-first.patch
          rm -rf verification/ui-patch
          rm -f .github/workflows/apply-ui-client-first.yml

      - name: Commit redesigned UI
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign UI around a neutral client workflow'
          git push origin HEAD:ui/client-first-neutral
