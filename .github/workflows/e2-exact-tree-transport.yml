name: E2 Exact Tree Transport

on:
  push:
    branches:
      - canon-v2/e2-template-learning-proof

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 2
      - name: Materialize verified exact tree
        shell: bash
        env:
          EXPECTED_PARENT: a0fe83959b44a36733e44aa2027e3d7c13f4ba58
          EXPECTED_TREE: 11b74a7f8db83ff32c4acd22e9112e6fa7cd08a4
          PATCH_GZ_SHA256: 7bfe693a8ade51e15a017140de964b13dae1e63e5141bf0fefcc77940ffda12b
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/e2-exact.patch.gz
          echo "$PATCH_GZ_SHA256  /tmp/e2-exact.patch.gz" | sha256sum -c -
          gzip -dc /tmp/e2-exact.patch.gz > /tmp/e2-exact.patch
          rm .github/workflows/e2-exact-tree-transport.yml
          git apply --check /tmp/e2-exact.patch
          git apply /tmp/e2-exact.patch
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name "Dokkomplekt CI"
          git config user.email "dokkomplekt-ci@users.noreply.github.com"
          git commit -m "feat: complete E2 repair and installed offline proof"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:"$GITHUB_REF_NAME"
