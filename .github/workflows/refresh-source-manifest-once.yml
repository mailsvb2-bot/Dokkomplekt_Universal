name: Refresh source manifest once

on:
  push:
    branches:
      - agent/core-offline-windows-installer
    paths:
      - '.github/workflows/refresh-source-manifest-once.yml'

permissions:
  contents: write

concurrency:
  group: refresh-source-manifest-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate manifest for the final tree without this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-source-manifest-once.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          mv /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.check.txt
      - name: Commit only the regenerated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mailsvb2-bot'
          git config user.email 'mailsvb2@gmail.com'
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          git commit -m 'Refresh source manifest after sidecar compatibility fix'
          git push origin HEAD:agent/core-offline-windows-installer
