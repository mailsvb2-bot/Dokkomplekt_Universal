name: Apply agent repair patch

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: agent-apply-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-plan-ui-postgres-maintainability'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply verified repair patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-patch-part-* | base64 --decode > /tmp/agent-repair.patch.gz
          echo "28c1c38f74b1bbd028277cf5c177b4cf21204717915aa654b2d6f79a90eee705  /tmp/agent-repair.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/agent-repair.patch.gz > /tmp/agent-repair.patch
          git apply --index /tmp/agent-repair.patch

          # Verify the complete intended tree before separating workflow publication.
          git diff --cached --check
          python scripts/static_quality_gate.py --source-only
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_v18_4_3_generation_plan_governance.py \
            tests/test_runtime_user_scenario_hardening.py \
            tests/test_installer_launch_liveness_contract.py \
            tests/test_linux_appimage_runtime_contract.py \
            tests/test_source_manifest_integrity.py

          # GITHUB_TOKEN cannot publish workflow changes. Keep workflow paths exactly
          # as they are on this branch; the GitHub App adds the verified final workflow
          # files atomically in the next commit.
          git reset HEAD -- .github/workflows/quality-gate.yml .github/workflows/macos-smoke.yml || true
          git checkout HEAD -- .github/workflows/quality-gate.yml
          rm -f .github/workflows/macos-smoke.yml
          git rm -f --ignore-unmatch .github/AGENT_WORK_IN_PROGRESS.md .github/agent-patch-part-*
          python scripts/verify_source_manifest.py --candidate /tmp/source-manifest.txt --json-report /tmp/source-manifest.json || true
          cp /tmp/source-manifest.txt SOURCE_MANIFEST_SHA256.txt
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: unify generation planning and close verification gaps"
          git push origin HEAD:agent/fix-plan-ui-postgres-maintainability
