name: Fix Windows Reparse Clippy

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fundamental-seven-critical-fixes'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Remove Windows-only needless return and verify Clippy
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/workspace_hygiene.rs')
          text = path.read_text(encoding='utf-8')
          old = '        return metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0;'
          new = '        metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Windows needless return, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          rm .github/workflows/fix-windows-reparse-clippy.yml
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name mailsvb2-bot
          git config user.email 254540704+mailsvb2-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Windows reparse-point Clippy gate"
          git push --force origin HEAD:refs/heads/agent/fundamental-seven-critical-fixes
