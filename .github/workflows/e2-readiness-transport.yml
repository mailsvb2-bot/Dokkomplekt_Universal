name: E2 readiness exact-tree transport

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 3
      - name: Materialize exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          expected_base='a3fdbbcf7f4682c5b48430c8f7b37be496eeb3f8'
          expected_tree='1c1df8cfc582daee831453283940b3241e2f189d'
          expected_payload_sha='51fe397be76be1c5f22cb97d8fe3ed9420cc39374b0e9cd84e73fede80036e90'
          transport_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$expected_base"
          printf '%s' '' | base64 -d > /tmp/payload.patch.gz
          test "$(sha256sum /tmp/payload.patch.gz | cut -d' ' -f1)" = "$expected_payload_sha"
          gzip -dc /tmp/payload.patch.gz > /tmp/payload.patch
          git reset --hard "$expected_base"
          git apply /tmp/payload.patch
          git add SOURCE_MANIFEST_SHA256.txt src/components/AdvancedToolsPanel.tsx src/components/AdvancedToolsPanel.test.tsx
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          git config user.name 'Dokkomplekt CI'
          git config user.email 'dokkomplekt-ci@users.noreply.github.com'
          new_commit="$(printf '%s\n' 'fix: expose E2 readiness to Windows UI automation' | git commit-tree "$expected_tree" -p "$transport_head")"
          test "$(git rev-parse "$new_commit^{tree}")" = "$expected_tree"
          git reset --hard "$new_commit"
          git push origin HEAD:canon-v2/e2-template-learning-proof
