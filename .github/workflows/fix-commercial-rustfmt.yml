name: Fix commercial Rust formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-commercial-rustfmt
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/fix-all-audit-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-all-audit-defects
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format excluded commercial crates and publish safely
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml --all
          cargo fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml --all -- --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/dokkomplekt-license-server/src/config.rs\ncrates/dokkomplekt-license-server/src/http/orders.rs'
          if [ -z "$changed" ]; then
            echo "Commercial Rust formatting is already clean."
            exit 0
          fi
          test "$changed" = "$expected"
          git add crates/dokkomplekt-license-server/src/config.rs crates/dokkomplekt-license-server/src/http/orders.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply rustfmt to commercial license server"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/fix-all-audit-defects
            git rebase origin/agent/fix-all-audit-defects
            if git push origin HEAD:agent/fix-all-audit-defects; then
              exit 0
            fi
            echo "Concurrent branch update during attempt ${attempt}; retrying."
            sleep 2
          done
          exit 1
