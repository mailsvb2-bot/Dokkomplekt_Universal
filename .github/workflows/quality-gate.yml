name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-compile-gate:
    name: REQUIRED Rust compile gate (non-bypassable)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Cargo lock must be committed
        run: test -f Cargo.lock
      - name: Install MSRV-compatible cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2 --quiet
      - name: Mandatory Rust compile gate
        run: bash scripts/prepackage_rust_gate.sh
      - name: Upload Rust gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-compile-gate-diagnostics
          path: .cargo-gate/**
          if-no-files-found: warn

  rust-dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install MSRV-compatible cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2 --quiet
      - name: Audit locked Rust dependencies
        shell: bash
        run: |
          set +e
          cargo audit --deny warnings --json > cargo-audit.json 2> cargo-audit.stderr
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("cargo-audit.json")
          if not path.exists() or not path.read_text(encoding="utf-8").strip():
              print("cargo-audit produced no JSON report")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              vulnerabilities = report.get("vulnerabilities", {}).get("list", [])
              warnings = report.get("warnings", {})
              print(f"RustSec vulnerabilities: {len(vulnerabilities)}")
              for item in vulnerabilities:
                  advisory = item.get("advisory", {})
                  package = item.get("package", {})
                  print(
                      f"VULNERABILITY {advisory.get('id', 'unknown')}: "
                      f"{package.get('name', 'unknown')} {package.get('version', '')} — "
                      f"{advisory.get('title', '')}"
                  )
              for category, entries in warnings.items():
                  print(f"RustSec {category} warnings: {len(entries)}")
                  for item in entries:
                      advisory = item.get("advisory", {})
                      package = item.get("package", {})
                      print(
                          f"WARNING {advisory.get('id', 'unknown')}: "
                          f"{package.get('name', 'unknown')} {package.get('version', '')} — "
                          f"{advisory.get('title', '')}"
                      )
          PY
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo audit failed with exit code $status"
            if [ -s cargo-audit.stderr ]; then
              tail -n 80 cargo-audit.stderr
            fi
            exit "$status"
          fi
      - name: Upload RustSec diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustsec-audit-diagnostics
          path: |
            cargo-audit.json
            cargo-audit.stderr
          if-no-files-found: warn

  python-contracts:
    name: Python regression contour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_python_contracts_sharded.py --report verification/ci/python-contracts.json
      - run: python scripts/verify_starter_content_packs.py
      - run: python scripts/static_quality_gate.py --source-only
      - run: python scripts/check_reference_data_freshness.py

  ui-thin-client:
    name: TypeScript thin UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [rust-compile-gate, python-contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  e2e:
    name: Browser UI e2e (mocked Tauri IPC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-compile-gate, python-contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run e2e

  tauri-build:
    name: Installer build after Rust gate
    needs: [rust-compile-gate, rust-dependency-audit, python-contracts, ui-thin-client, e2e]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: ubuntu-latest
            artifact: linux-bundles
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb dbus-x11
      - name: Install MSRV-compatible cargo-audit on packaging runner
        run: cargo install cargo-audit --locked --version 0.21.2 --quiet
      - name: Repeat mandatory Rust gate on packaging runner
        shell: bash
        run: bash scripts/prepackage_rust_gate.sh
      - run: npm ci
      - name: Build Windows NSIS bundle
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: npx tauri build --bundles appimage,deb,rpm
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/installer/windows_installer_contract.ps1
      - name: Linux installer smoke
        if: runner.os == 'Linux'
        run: bash tests/installer/linux_installer_contract.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/**
          if-no-files-found: error
