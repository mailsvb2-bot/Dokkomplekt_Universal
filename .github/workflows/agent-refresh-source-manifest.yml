name: Agent refresh source manifest

on:
  push:
    branches:
      - agent/fix-template-publication-18.4.4

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-template-publication-18.4.4
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize final clean manifest commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-refresh-source-manifest.yml
          rm -f .github/agent-refresh-source-manifest.trigger
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh source manifest after packaging gate pin'
          git push origin HEAD:agent/fix-template-publication-18.4.4
