name: E2 file accumulation exact-tree transport

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 2
      - name: Materialize exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='8961152f9b6f2b5144e9dc03e642e0386a4ed8d8'
          expected_tree='bbddb59b112fd8135a4c7461ebeb03f6e3845b4b'
          expected_payload_sha='6d3cf78197e15742ec727f0e9a0c9f7c9d20f8588f6fd305efeb195d986caa58'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          printf '%s' '' | base64 -d > /tmp/e2.patch.gz
          echo "$expected_payload_sha  /tmp/e2.patch.gz" | sha256sum -c -
          gzip -dc /tmp/e2.patch.gz > /tmp/e2.patch
          git apply --check /tmp/e2.patch
          git apply /tmp/e2.patch
          rm .github/workflows/e2-file-accumulation-transport.yml
          git add -A
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          git config user.name 'Dokkomplekt CI'
          git config user.email 'dokkomplekt-ci@users.noreply.github.com'
          git commit -m 'fix: accumulate E2 learning file selections'
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git push origin HEAD:canon-v2/e2-template-learning-proof
