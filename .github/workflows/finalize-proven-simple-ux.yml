name: Finalize proven simple UX

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Remove one-time workflow and regenerate provenance
        run: |
          rm .github/workflows/finalize-proven-simple-ux.yml
          python scripts/build_source_archive.py \
            --output /tmp/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json /tmp/source-report.json
          python scripts/verify_source_manifest.py
          python scripts/static_quality_gate.py --source-only
          python -m pytest -q \
            tests/test_frontend_runtime_contract_coverage.py \
            tests/test_source_manifest_integrity.py
          git diff --check

      - name: Commit verified clean result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Adopt proven simple document workflow'
          git push origin "HEAD:${{ github.head_ref }}"
