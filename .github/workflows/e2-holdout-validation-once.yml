name: E2 Holdout Validation Once

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]
    paths: [.github/workflows/e2-holdout-validation-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare structure-aware held-out patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          core = Path('crates/dokkomplekt-core/src/template_wizard.rs')
          text = core.read_text(encoding='utf-8')
          old = '            requires_confirmation: true,\n            warnings,'
          new = '            requires_confirmation: true,\n            validation: unavailable_learning_validation("Контрольная пара ещё не проверена."),\n            warnings,'
          if text.count(old) != 1:
              raise SystemExit(f'expected one indented empty-report constructor, found {text.count(old)}')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')

          patcher = Path('.github/scripts/e2_holdout_validation_once.py')
          script = patcher.read_text(encoding='utf-8')
          old_guard = 'if count != 2:\n    raise SystemExit(f"expected 2 report constructors, found {count}")'
          new_guard = 'if count != 1:\n    raise SystemExit(f"expected 1 remaining report constructor, found {count}")'
          if old_guard not in script:
              raise SystemExit('staged patcher constructor guard not found')
          patcher.write_text(script.replace(old_guard, new_guard, 1), encoding='utf-8')
          PY
      - name: Apply held-out validation contract
        run: python .github/scripts/e2_holdout_validation_once.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile core
        run: cargo check -p dokkomplekt-core --locked
      - name: Prove held-out and source-evidence regressions
        run: |
          cargo test -p dokkomplekt-core --locked holdout_validation_passes_only_on_unseen_source_value_transfer
          cargo test -p dokkomplekt-core --locked holdout_validation_fails_when_correct_output_does_not_follow_source
          cargo test -p dokkomplekt-core --locked three_pairs_can_learn_but_cannot_claim_independent_validation
          cargo test -p dokkomplekt-core --locked completed_only_learning_does_not_claim_source_evidence
          cargo test -p dokkomplekt-core --locked matched_source_examples_own_source_evidence
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted Vitest
        run: npx vitest run src/lib/pendingTemplateIntelligence.test.ts
      - name: Self-clean and commit product change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/e2-holdout-validation-once.yml
          rm .github/scripts/e2_holdout_validation_once.py
          git diff --check
          git config user.name "Dokkomplekt CI"
          git config user.email "dokkomplekt-ci@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/template_wizard.rs src/lib/types.ts src/lib/pendingTemplateIntelligence.ts src/components/TemplateSetupModal.tsx src/lib/pendingTemplateIntelligence.test.ts .github/workflows/e2-holdout-validation-once.yml .github/scripts/e2_holdout_validation_once.py
          git commit -m "feat: require held-out template learning proof"
          git push origin HEAD:canon-v2/e2-template-learning-proof
