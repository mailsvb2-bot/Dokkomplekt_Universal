name: Dokkomplekt Private Windows Hardware E2E
run-name: Dokkomplekt hardware ${{ inputs.release_sha }} ${{ inputs.reboot_phase }} ${{ inputs.request_id }} prepare-run-${{ inputs.prepare_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public source repository in owner/name form
        required: true
        default: mailsvb2-bot/Dokkomplekt_Universal
        type: string
      release_sha:
        description: Exact protected public main commit SHA
        required: true
        type: string
      reboot_phase:
        description: Prepare real reboot evidence first, then verify it after reboot
        required: true
        default: verify
        type: choice
        options: [prepare, verify]
      request_id:
        description: Correlation UUID generated by the public dispatcher
        required: true
        type: string
      prepare_run_id:
        description: Private workflow run ID that produced the exact signed handoff; required for verify
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dokkomplekt-private-windows-hardware-e2e
  cancel-in-progress: false

jobs:
  signed-runtime-build:
    name: Hosted signed runtime / installer handoff
    if: github.ref == 'refs/heads/main' && inputs.reboot_phase == 'prepare'
    runs-on: windows-latest
    environment: windows-production-signing
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    env:
      DOKKOMPLEKT_RUNTIME_BUNDLE_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_URL }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL }}
      DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL: ${{ vars.DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL }}
      DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64 }}
      DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64 }}
      DOKKOMPLEKT_GATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_GATE_PUBKEY_B64 }}
      DOKKOMPLEKT_LICENSE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_UPDATE_PUBKEY_B64 }}
      DOKKOMPLEKT_THRESHOLD_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_THRESHOLD_PUBKEY_B64 }}
      DOKKOMPLEKT_REFDATA_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_REFDATA_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_MANIFEST_URL: ${{ vars.DOKKOMPLEKT_UPDATE_MANIFEST_URL }}
      DOKKOMPLEKT_REFDATA_URL: ${{ vars.DOKKOMPLEKT_REFDATA_URL }}
      DOKKOMPLEKT_COMPONENTS_CATALOG_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_CATALOG_URL }}
      DOKKOMPLEKT_COMPONENTS_BASE_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_BASE_URL }}
      DOKKOMPLEKT_TIMESTAMP_SERVER: ${{ vars.DOKKOMPLEKT_TIMESTAMP_SERVER }}
      DOKKOMPLEKT_RELEASE_MODE: production
      DOKKOMPLEKT_WINDOWS_SIGNING_BACKEND: ${{ vars.DOKKOMPLEKT_WINDOWS_SIGNING_BACKEND }}
      DOKKOMPLEKT_WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.DOKKOMPLEKT_WINDOWS_SIGNING_CERT_THUMBPRINT }}
      DOKKOMPLEKT_WINDOWS_SIGNING_ALLOWED_PROVIDER: ${{ vars.DOKKOMPLEKT_WINDOWS_SIGNING_ALLOWED_PROVIDER }}
    steps:
      - name: Validate dispatch identity
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.source_repository }}' -ne 'mailsvb2-bot/Dokkomplekt_Universal') { throw 'unexpected source repository' }
          if ('${{ inputs.release_sha }}' -notmatch '^[0-9a-f]{40}$') { throw 'release_sha must be an exact lowercase SHA' }
          if ('${{ inputs.request_id }}' -notmatch '^[0-9a-f-]{36}$') { throw 'request_id must be a UUID' }
      - name: Checkout exact public source without private-repository credentials
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          git clone --filter=blob:none --no-checkout "https://github.com/${{ inputs.source_repository }}.git" source
          Set-Location source
          git fetch origin '${{ inputs.release_sha }}' --depth=1
          git checkout --detach '${{ inputs.release_sha }}'
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.release_sha }}') { throw 'source checkout mismatch' }
          git fetch origin main --no-tags
          git merge-base --is-ancestor '${{ inputs.release_sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release_sha is not reachable from public main' }
      - name: Pin audited signing implementation
        shell: pwsh
        env:
          EXPECTED_SIGNING_SCRIPT_SHA256: ${{ vars.DOKKOMPLEKT_SIGNING_SCRIPT_SHA256 }}
        run: |
          $expected = $env:EXPECTED_SIGNING_SCRIPT_SHA256.Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'DOKKOMPLEKT_SIGNING_SCRIPT_SHA256 is invalid' }
          $actual = (Get-FileHash scripts/sign_windows_release.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "signing script hash mismatch: expected $expected got $actual" }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prove ephemeral GitHub-hosted signing boundary
        shell: pwsh
        env:
          DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64: ${{ secrets.DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64 }}
          DOKKOMPLEKT_GATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_GATE_PRIVATE_KEY_B64 }}
        run: python scripts/verify_windows_hosted_signing_runner.py --require-handoff-signing-key --json-report verification/release/HOSTED_SIGNING_PREFLIGHT.json
      - name: Prove production signing key is operational before expensive work
        shell: pwsh
        run: scripts/sign_windows_release.ps1 -VerifyCertificateOnly
      - name: Fetch immutable pre-approved runtime bundle
        shell: pwsh
        run: |
          python scripts/fetch_hosted_runtime_bundle.py `
            --bundle-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_URL `
            --payload-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_PAYLOAD_URL `
            --signature-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_SIGNATURE_URL `
            --approval-signature-url $env:DOKKOMPLEKT_RUNTIME_BUNDLE_APPROVAL_SIGNATURE_URL `
            --out release-runtime-source `
            --json-report verification/release/HOSTED_RUNTIME_FETCH.json
      - name: Verify two independent runtime signatures and stage exact core bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          $approvalKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-approval-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($runtimeKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            [IO.File]::WriteAllBytes($approvalKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64))
            $bundle = (Resolve-Path release-runtime-source/Dokkomplekt-offline-runtime-windows-x86_64.zip).Path
            $payload = "$bundle.signing.json"
            python scripts/stage_signed_runtime_bundle.py $bundle `
              --payload $payload `
              --signature "$payload.sig" `
              --trusted-runtime-public-key $runtimeKey `
              --approval-signature "$payload.approval.sig" `
              --trusted-approval-public-key $approvalKey `
              --profile core `
              --clean `
              --json-report verification/release/HOSTED_RUNTIME_STAGE.json
            if ($LASTEXITCODE -ne 0) { throw 'hosted core runtime staging failed' }
          } finally {
            Remove-Item -LiteralPath $runtimeKey -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $approvalKey -Force -ErrorAction SilentlyContinue
          }
      - name: Prove staged production core runtime
        shell: pwsh
        run: |
          python scripts/assert_offline_runtime_ready.py --target windows-x86_64 --profile core --require-supply-chain --production
          if ($LASTEXITCODE -ne 0) { throw 'production core runtime verification failed' }
          python scripts/verify_windows_runtime_app_parity.py --target windows-x86_64 --profile core
          if ($LASTEXITCODE -ne 0) { throw 'runtime application parity verification failed' }
          tests/windows/verify_sidecar_authenticode.ps1 -RuntimeRoot src-tauri/resources/tools/windows-x86_64 -OutputPath verification/release/SIDECAR_AUTHENTICODE.json
          if ($LASTEXITCODE -ne 0) { throw 'sidecar Authenticode verification failed' }
          $output = & python scripts/probe_offline_runtime.py --target windows-x86_64 --profile core 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath verification/release/offline-runtime-probe.log
          if ($code -ne 0) { throw "offline runtime probe failed: $code" }
          python scripts/verify_scanned_pdf_fixture.py --runtime-root src-tauri/resources/tools/windows-x86_64 --output-json verification/release/scanned-pdf-ocr.json
          if ($LASTEXITCODE -ne 0) { throw 'staged OCR fixture failed' }
      - run: npm ci
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Execute signed Rust and RustSec release gate
        shell: cmd
        env:
          DOKKOMPLEKT_GATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_GATE_PRIVATE_KEY_B64 }}
        run: scripts\prepackage_rust_gate.bat
      - run: python scripts/assert_release_ready.py
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build deterministic signed core component overlay
        shell: pwsh
        env:
          DOKKOMPLEKT_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOKKOMPLEKT_UPDATE_PRIVATE_KEY_B64)) { throw 'Update signing key is required for components catalog.' }
          python scripts/build_component_packs.py --target windows-x86_64 --components ocr,office,archive --app-min-version 18.3.0 --base-url $env:DOKKOMPLEKT_COMPONENTS_BASE_URL --out release-components --require-trusted-public-key
          $catalog = Get-Content release-components/components-catalog.json -Raw | ConvertFrom-Json
          if ($catalog.payload.catalog_scope -ne 'partial') { throw 'Core component catalog must be a partial overlay.' }
          if ($catalog.payload.components.id -contains 'semantic') { throw 'Core release must not rebuild or embed the semantic component.' }
      - name: Require clean production release artifact boundary
        shell: pwsh
        run: |
          if (Test-Path 'target/release/dokkomplekt-tauri.exe') { throw 'release application binary existed before canonical Tauri build' }
      - name: Build unsigned application binary without bundling
        run: npx tauri build --no-bundle
      - name: Sign application binary
        shell: pwsh
        run: scripts/sign_windows_release.ps1 -ArtifactRoot target/release/dokkomplekt-tauri.exe
      - name: Bundle thin signed application into NSIS
        run: npx tauri bundle --bundles nsis --config src-tauri/tauri.thin.conf.json
      - name: Sign, smoke and preserve thin NSIS installer
        shell: pwsh
        run: |
          scripts/sign_windows_release.ps1 -ArtifactRoot target/release/bundle/nsis
          $env:DOKKOMPLEKT_REQUIRE_AUTHENTICODE = '1'
          tests/installer/windows_installer_contract.ps1 -TauriConfig src-tauri/tauri.thin.conf.json -ExpectedWebViewMode downloadBootstrapper
          New-Item -ItemType Directory -Force release-installers/thin | Out-Null
          Copy-Item target/release/bundle/nsis/* release-installers/thin/ -Recurse -Force
      - name: Bundle all-in-one offline NSIS from the same verified core runtime
        run: npx tauri bundle --bundles nsis --config src-tauri/tauri.offline.conf.json
      - name: Sign, smoke and preserve offline NSIS installer
        shell: pwsh
        run: |
          scripts/sign_windows_release.ps1 -ArtifactRoot target/release/bundle/nsis
          $env:DOKKOMPLEKT_REQUIRE_AUTHENTICODE = '1'
          tests/installer/windows_installer_contract.ps1 -TauriConfig src-tauri/tauri.offline.conf.json -ExpectedWebViewMode offlineInstaller
          New-Item -ItemType Directory -Force release-installers/offline | Out-Null
          Copy-Item target/release/bundle/nsis/* release-installers/offline/ -Recurse -Force
      - name: Preserve the independently approved runtime source
        shell: pwsh
        run: |
          if (Test-Path release-runtime) { Remove-Item release-runtime -Recurse -Force }
          Copy-Item release-runtime-source release-runtime -Recurse -Force
      - name: Bind signed release evidence
        shell: pwsh
        run: |
          $trustedKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-evidence-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            scripts/write_windows_release_evidence.ps1 -InstallerRoot release-installers -RuntimeRoot release-runtime -ApplicationPath target/release/dokkomplekt-tauri.exe -RuntimeTrustedPublicKey $trustedKey
          } finally {
            Remove-Item -LiteralPath $trustedKey -Force -ErrorAction SilentlyContinue
          }
      - name: Assemble cryptographically signed canonical release handoff
        shell: pwsh
        env:
          DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64: ${{ secrets.DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path (Get-Location) 'signed-handoff'
          Remove-Item -LiteralPath $handoff -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$handoff\application", "$handoff\release-installers", "$handoff\release-components", "$handoff\release-runtime", "$handoff\build-evidence" | Out-Null
          Copy-Item target/release/dokkomplekt-tauri.exe "$handoff\application\" -Force
          Copy-Item release-installers/* "$handoff\release-installers\" -Recurse -Force
          Copy-Item release-components/* "$handoff\release-components\" -Recurse -Force
          Copy-Item release-runtime/* "$handoff\release-runtime\" -Recurse -Force
          Copy-Item verification/release/* "$handoff\build-evidence\" -Recurse -Force
          $privateKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-handoff-private-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($privateKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64))
            python scripts/windows_signed_handoff.py build $handoff --release-sha '${{ inputs.release_sha }}' --request-id '${{ inputs.request_id }}' --signing-key $privateKey
            if ($LASTEXITCODE -ne 0) { throw 'signed handoff creation failed' }
          } finally {
            Remove-Item -LiteralPath $privateKey -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $privateKey) { throw 'handoff private-key cleanup failed' }
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-Signed-Handoff-${{ inputs.release_sha }}-${{ inputs.request_id }}
          path: source/signed-handoff/**
          if-no-files-found: error

  hardware-evidence:
    name: Word / printer / reboot evidence
    needs: signed-runtime-build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((inputs.reboot_phase == 'prepare' && needs.signed-runtime-build.result == 'success') ||
       inputs.reboot_phase == 'verify')
    runs-on: [self-hosted, Windows, X64, dokkomplekt-hardware]
    environment: windows-hardware-validation
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    env:
      DOKKOMPLEKT_RUN_HARDWARE_E2E: '1'
      DOKKOMPLEKT_TEST_PRINTER: ${{ vars.DOKKOMPLEKT_TEST_PRINTER }}
      DOKKOMPLEKT_TEST_DUPLEX: ${{ vars.DOKKOMPLEKT_TEST_DUPLEX }}
      DOKKOMPLEKT_TEST_TRAY: ${{ vars.DOKKOMPLEKT_TEST_TRAY }}
      DOKKOMPLEKT_REBOOT_EVIDENCE_PATH: ${{ vars.DOKKOMPLEKT_REBOOT_EVIDENCE_PATH }}
      DOKKOMPLEKT_REBOOT_SOURCE_DOCUMENT: ${{ vars.DOKKOMPLEKT_REBOOT_SOURCE_DOCUMENT }}
      DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64 }}
    steps:
      - name: Validate dispatch identity
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ('${{ inputs.source_repository }}' -ne 'mailsvb2-bot/Dokkomplekt_Universal') { throw 'unexpected source repository' }
          if ('${{ inputs.release_sha }}' -notmatch '^[0-9a-f]{40}$') { throw 'release_sha must be exact lowercase SHA' }
          if ('${{ inputs.request_id }}' -notmatch '^[0-9a-f-]{36}$') { throw 'request_id must be UUID' }
          if ('${{ inputs.reboot_phase }}' -eq 'verify' -and '${{ inputs.prepare_run_id }}' -notmatch '^[1-9][0-9]*$') { throw 'verify requires numeric prepare_run_id' }
          if ('${{ inputs.reboot_phase }}' -eq 'prepare' -and -not [string]::IsNullOrWhiteSpace('${{ inputs.prepare_run_id }}')) { throw 'prepare must not supply prepare_run_id' }
      - name: Checkout exact public source without private-repository credentials
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          git clone --filter=blob:none --no-checkout "https://github.com/${{ inputs.source_repository }}.git" source
          Set-Location source
          git fetch origin '${{ inputs.release_sha }}' --depth=1
          git checkout --detach '${{ inputs.release_sha }}'
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.release_sha }}') { throw 'source checkout mismatch' }
          git fetch origin main --no-tags
          git merge-base --is-ancestor '${{ inputs.release_sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release_sha is not reachable from public main' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Download exact handoff produced by this prepare run
        if: inputs.reboot_phase == 'prepare'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Dokkomplekt-Windows-Signed-Handoff-${{ inputs.release_sha }}-${{ inputs.request_id }}
          path: source/signed-handoff
      - name: Reuse exact handoff from the successful prepare run
        if: inputs.reboot_phase == 'verify'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Dokkomplekt-Windows-Signed-Handoff-${{ inputs.release_sha }}-${{ inputs.request_id }}
          path: source/signed-handoff
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - name: Prove hardware-only host
        shell: pwsh
        run: scripts/verify_windows_hardware_evidence_host.ps1 -PrinterName $env:DOKKOMPLEKT_TEST_PRINTER -RebootEvidencePath $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH -OutputPath verification/release/HARDWARE_RUNNER_HOST.json
      - name: Verify signed handoff before using any payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64)) { throw 'runtime trusted public key is required' }
          $trustedKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-handoff-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            python scripts/windows_signed_handoff.py verify signed-handoff --release-sha '${{ inputs.release_sha }}' --request-id '${{ inputs.request_id }}' --trusted-public-key $trustedKey --json-report verification/release/SIGNED_HANDOFF_VERIFICATION.json
            if ($LASTEXITCODE -ne 0) { throw 'signed handoff verification failed' }
          } finally {
            Remove-Item -LiteralPath $trustedKey -Force -ErrorAction SilentlyContinue
          }
      - name: Independently verify Authenticode and signed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thin = @(Get-ChildItem signed-handoff/release-installers/thin -Recurse -File -Filter '*.exe')
          $offline = @(Get-ChildItem signed-handoff/release-installers/offline -Recurse -File -Filter '*.exe')
          if ($thin.Count -ne 1) { throw "expected one thin installer; found $($thin.Count)" }
          if ($offline.Count -ne 1) { throw "expected one offline installer; found $($offline.Count)" }
          foreach ($installer in @($thin[0], $offline[0])) {
            if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw "installer Authenticode invalid: $($installer.Name)" }
          }
          $apps = @(Get-ChildItem signed-handoff/application -File -Filter '*.exe')
          if ($apps.Count -ne 1) { throw "expected one application; found $($apps.Count)" }
          if ((Get-AuthenticodeSignature $apps[0].FullName).Status -ne 'Valid') { throw 'application Authenticode invalid' }
          $bundles = @(Get-ChildItem signed-handoff/release-runtime -File -Filter '*.zip')
          if ($bundles.Count -ne 1) { throw "expected one runtime bundle; found $($bundles.Count)" }
          $trustedKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            $bundle = $bundles[0].FullName
            python scripts/verify_offline_runtime_bundle.py $bundle --payload "$bundle.signing.json" --signature "$bundle.signing.json.sig" --trusted-public-key $trustedKey --require-signature
            if ($LASTEXITCODE -ne 0) { throw 'runtime bundle signature invalid' }
          } finally {
            Remove-Item -LiteralPath $trustedKey -Force -ErrorAction SilentlyContinue
          }
      - name: Validate hardware-only trust boundary
        shell: pwsh
        run: python scripts/release_environment_preflight.py --mode windows-hardware --json-report verification/release/hardware-preflight.json
      - name: Prepare real reboot E2E state
        if: inputs.reboot_phase == 'prepare'
        shell: pwsh
        env:
          DOKKOMPLEKT_PREPARE_REBOOT_E2E: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DOKKOMPLEKT_REBOOT_SOURCE_DOCUMENT)) { throw 'reboot source document is required' }
          $persistentRoot = Join-Path $env:ProgramData 'DokkomplektE2E\prepare-${{ inputs.release_sha }}'
          if (Test-Path -LiteralPath $persistentRoot) { throw "reboot preparation already exists: $persistentRoot" }
          New-Item -ItemType Directory -Force -Path $persistentRoot | Out-Null
          $env:DOKKOMPLEKT_REBOOT_PREP_ROOT = $persistentRoot
          $env:RUNNER_TEMP = $persistentRoot
          $env:TEMP = $persistentRoot
          $env:TMP = $persistentRoot
          try {
            tests/windows/windows_hardware_e2e.ps1 -InstallerRoot signed-handoff/release-installers/offline
            throw 'prepare phase unexpectedly completed without requesting reboot'
          } catch {
            if ($_.Exception.Message -notlike 'Reboot evidence preparation completed.*') { throw }
            Write-Host $_.Exception.Message
          }
          $pending = Join-Path $env:ProgramData 'DokkomplektE2E\pending-reboot.json'
          if (-not (Test-Path -LiteralPath $pending -PathType Leaf)) { throw 'pending reboot plan not created' }
          [ordered]@{
            schema = 'dokkomplekt.windows-reboot-prepare-workflow.v2'
            release_sha = '${{ inputs.release_sha }}'
            request_id = '${{ inputs.request_id }}'
            signed_handoff_manifest_sha256 = (Get-FileHash signed-handoff/SIGNED_HANDOFF.json -Algorithm SHA256).Hash.ToLowerInvariant()
            prepared_at_utc = [DateTime]::UtcNow.ToString('o')
            persistent_root = $persistentRoot
            pending_reboot_plan = $pending
            reboot_evidence_path = $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH
          } | ConvertTo-Json -Depth 5 | Set-Content verification/release/WINDOWS_REBOOT_PREPARED.json -Encoding utf8
          Write-Host 'PREPARE PHASE PASSED. Perform a real Windows restart and log back into the dedicated hardware runner account.'
      - name: Execute hardware E2E and verify reboot evidence
        if: inputs.reboot_phase == 'verify'
        shell: pwsh
        run: tests/windows/windows_hardware_e2e.ps1 -InstallerRoot signed-handoff/release-installers/offline
      - name: Archive reboot evidence and clean preparation
        if: inputs.reboot_phase == 'verify'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verification/release | Out-Null
          Copy-Item -LiteralPath $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH -Destination verification/release/WINDOWS_REBOOT_E2E_RAW.json -Force
          scripts/cleanup_windows_reboot_preparation.ps1 -EvidencePath $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH -OutputPath verification/release/REBOOT_PREPARATION_CLEANUP.json -RemoveRawEvidence
      - name: Bind final hardware evidence to signed handoff
        if: inputs.reboot_phase == 'verify'
        shell: pwsh
        run: |
          $app = @(Get-ChildItem signed-handoff/application -File -Filter '*.exe')
          scripts/write_windows_hardware_evidence_index.ps1 -InstallerRoot signed-handoff/release-installers -RuntimeRoot signed-handoff/release-runtime -ApplicationPath $app[0].FullName
          Copy-Item signed-handoff/SIGNED_HANDOFF.json verification/release/SIGNED_HANDOFF.json -Force
          Copy-Item signed-handoff/SIGNED_HANDOFF.json.sig verification/release/SIGNED_HANDOFF.json.sig -Force
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-Hardware-E2E-${{ inputs.reboot_phase }}-${{ inputs.request_id }}-prepare-${{ inputs.prepare_run_id }}
          path: |
            source/verification/release/**
            source/.release-gate/**
          if-no-files-found: error
