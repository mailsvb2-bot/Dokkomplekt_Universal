name: Format semantic markup fix

on:
  push:
    branches:
      - agent/fix-static-medical-semantic-markup
    paths:
      - .github/workflows/format-semantic-markup-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format fix and refresh final manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-semantic-markup-fix.yml
          cargo fmt --all
          python3 scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-before-copy.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python3 scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-after-copy.json
          cargo fmt --all -- --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format semantic markup fix and refresh manifest"
          git push origin HEAD:agent/fix-static-medical-semantic-markup
