name: One-time rendered completeness verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-time-rendered-completeness-verification-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.head_ref == 'agent/full-functional-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Reproduce exact candidate product fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow = Path('.github/workflows/one-time-rust-diagnostic.yml').read_text(encoding='utf-8')
          match = re.search(r"python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('embedded product patch not found')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, '<embedded-product-patch>', 'exec'), {})
          PY
          cargo fmt --all
          git diff --check
      - name: Verify focused contracts
        run: |
          cargo test -p dokkomplekt-core required_blocks --lib
          cargo test -p dokkomplekt-core created_documents::tests::medical_document_with_all_blocks_is_created --lib
      - name: Verify clippy with production prerequisites
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify full Rust workspace
        run: cargo test --workspace --locked
      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/dokkomplekt-core/src/required_blocks.rs crates/dokkomplekt-core/src/created_documents.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Require medical completeness values in rendered documents'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.head_ref }}; then exit 0; fi
            git pull --rebase origin ${{ github.head_ref }}
          done
          git push origin HEAD:${{ github.head_ref }}
