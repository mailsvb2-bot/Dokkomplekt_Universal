name: Fix audit rustfmt

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-audit-rustfmt
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/fix-all-audit-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-all-audit-defects
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format validators and publish safely over concurrent manifest commits
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Rust formatting is already clean."
            exit 0
          fi
          test "$changed" = "crates/dokkomplekt-core/src/validators.rs"
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_v18_4_3_audit_closure.py')
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith('test_') and callable(value)
          )
          for name, function in tests:
              function()
              print(f'PASSED {name}')
          assert len(tests) == 7, len(tests)
          PY
          git add crates/dokkomplekt-core/src/validators.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply rustfmt to audit validators"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin agent/fix-all-audit-defects
            git rebase origin/agent/fix-all-audit-defects
            if git push origin HEAD:agent/fix-all-audit-defects; then
              exit 0
            fi
            echo "Concurrent branch update during attempt ${attempt}; retrying."
            sleep 2
          done
          echo "Unable to publish formatted validators after repeated concurrent updates." >&2
          exit 1
