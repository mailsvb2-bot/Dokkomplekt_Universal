## Watcher update handoff — donor parity restored

The late `Dokkomplekt` regression `test_intake_agent_update_handoff_v1494x.py` is now owned by the canonical Tauri/Rust watcher lifecycle. Each configured watcher has an explicit generation, executable path and SHA-256 binary identity. A replacement is published in two phases: `ready=false` cannot evict the current owner; only after durable OS autostart is written does `ready=true` make the handoff authoritative.

A stale handoff-aware watcher stops accepting new source files, drains all already-running document jobs, starts the published successor executable, and only then releases ownership. The binary SHA-256 makes same-path upgrades distinguishable instead of relying only on the executable name. Normal application startup reconciles an existing watcher plan to the newly installed binary automatically, so the user does not need to reopen watcher settings after an update. Legacy runtime JSON without handoff fields remains readable.

The user-created `Дневники` path is separately proven to use the existing canonical chain: template intelligence assigns the diary role, mandatory cadence controls are merged into effective popup fields, and the common `WorkflowPlan`/generation preflight owns the prompts. No donor-only diary wizard or second scheduling brain is introduced.
'''
