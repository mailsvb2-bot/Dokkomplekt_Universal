name: Apply reviewed offline runtime import patch

on:
  push:
    branches:
      - agent/offline-runtime-import
    paths:
      - '.github/offline-runtime-import.part*'
      - '.github/workflows/apply-offline-runtime-import.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/offline-runtime-import"
          echo 'becb40c22876738485eb5ba39dc60010f16fc2e1655e91e6281e6531e55bb7cf  .github/offline-runtime-import.part00' | sha256sum -c -
          echo '3bcae1149c91026fe1a0dbb4b92887ad7419e15d2fbc0323da909d607a832a69  .github/offline-runtime-import.part01' | sha256sum -c -
          echo 'da45c86b3475b9e271fdfb95f11a4f6bd48f905eb4b787d0eac32d5438b907d9  .github/offline-runtime-import.part02' | sha256sum -c -
          echo '5a4898aa1ab565eaee1225a0f68c82a36140747f7ed8d3805382f94da88cf0df  .github/offline-runtime-import.part03' | sha256sum -c -
          echo '41b6344ec1f908a676b8e31f0b454c97be42ca87089bc2374d12dbe3463e0410  .github/offline-runtime-import.part04' | sha256sum -c -
          cat .github/offline-runtime-import.part00 .github/offline-runtime-import.part01 .github/offline-runtime-import.part02 .github/offline-runtime-import.part03 .github/offline-runtime-import.part04 > /tmp/offline-runtime-import.patch.gz.b64
          echo '31360fe97b2de438a64e877659a7e6ef900ade607b688a7ea9f198e85bac327e  /tmp/offline-runtime-import.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/offline-runtime-import.patch.gz.b64 | gzip -d > /tmp/offline-runtime-import.patch
          echo '311ac35ce4169801259a0b8014400ed6ce78a114e2d4b6cc7a2462649af63335  /tmp/offline-runtime-import.patch' | sha256sum -c -
          git apply --check /tmp/offline-runtime-import.patch
          git apply --index /tmp/offline-runtime-import.patch
          git rm .github/offline-runtime-import.patch.gz.b64 .github/offline-runtime-import.part00 .github/offline-runtime-import.part01 .github/offline-runtime-import.part02 .github/offline-runtime-import.part03 .github/offline-runtime-import.part04 .github/workflows/apply-offline-runtime-import.yml
          git diff --cached --check
          tree="$(git write-tree)"
          test "$tree" = '2fd5f529db1b0b74c5e7d569569907f3352dea16'
          echo "Exact reviewed tree: $tree"
      - name: Commit clean reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add signed offline component import'
          git push origin HEAD:agent/offline-runtime-import
