name: One-time donor rustfmt

on:
  push:
    branches:
      - agent/donor-contract-audit-20260816

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-contract-audit-20260816
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Remove one-time workflow and verify diff
        run: |
          rm -f .github/workflows/one-time-donor-rustfmt.yml
          git diff --check
          git status --short
      - name: Commit and publish canonical formatting without force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical rustfmt to donor contract port"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/donor-contract-audit-20260816
            git rebase origin/agent/donor-contract-audit-20260816
            if git push origin HEAD:agent/donor-contract-audit-20260816; then
              exit 0
            fi
          done
          echo "Failed to publish formatting without force push" >&2
          exit 1
