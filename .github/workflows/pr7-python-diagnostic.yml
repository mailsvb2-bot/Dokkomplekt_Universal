name: PR7 Python diagnostic

on:
  pull_request:
  push:
    branches: [fix/simple-ui-button-creation]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Persist compact failure evidence
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e
          python scripts/run_python_contracts_sharded.py --report /tmp/python-contracts.json >/tmp/python-contracts.log 2>&1
          code=$?
          {
            echo '=== MACHINE REPORT ==='
            cat /tmp/python-contracts.json
            echo
            echo '=== FAILURE TAIL ==='
            tail -n 50 /tmp/python-contracts.log
          } > verification/ci/pr7-python-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/ci/pr7-python-failure.txt
          git commit -m "chore(ci): capture PR7 Python failure" || true
          git push origin "HEAD:${BRANCH}"
          exit $code
