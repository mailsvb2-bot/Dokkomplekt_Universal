name: E2 Windows nav exact-tree transport

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 2
      - name: Materialize exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='f8b99364b0f6f69c774d67d4c9cb05a3fcdc9086'
          expected_tree='72632f1e624e5295994f9f400eab9172ba2618ed'
          expected_payload_sha='c38fb7f635ca4655ec61a71653bb7a1faeb5ce23e7e894340da52a7d47212fb2'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          printf '%s' '' | base64 -d > /tmp/e2.patch.gz
          echo "$expected_payload_sha  /tmp/e2.patch.gz" | sha256sum -c -
          gzip -dc /tmp/e2.patch.gz > /tmp/e2.patch
          git rm .github/workflows/e2-win-nav-transport.yml
          git apply --index /tmp/e2.patch
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          git config user.name 'Dokkomplekt CI'
          git config user.email 'dokkomplekt-ci@users.noreply.github.com'
          git commit -m 'test: navigate to E2 tools after restart'
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git push origin HEAD:canon-v2/e2-template-learning-proof
