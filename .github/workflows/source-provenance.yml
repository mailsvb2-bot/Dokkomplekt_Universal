name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest matches tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and verify final frontend contract
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          root = Path.cwd()
          path = root / 'src' / 'App.scenarios.test.tsx'
          text = path.read_text('utf-8')
          old = "fireEvent.click(within(automation as HTMLElement).getByRole('button', { name: 'Создать комплект' }));"
          new = "fireEvent.click(within(automation as HTMLElement).getByRole('button', { name: 'Обработать указанный файл' }));"
          if text.count(old) != 1:
              raise RuntimeError(f'expected one automation button assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), 'utf-8')

          module_path = root / 'scripts' / 'build_source_archive.py'
          spec = importlib.util.spec_from_file_location('build_source_archive', module_path)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load build_source_archive')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          (root / module.SOURCE_MANIFEST).write_bytes(module.source_manifest_payload())
          PY
          npm ci
          npm run typecheck
          npm run test -- --run
          npm run e2e:install
          npm run e2e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: finalize one-click frontend scenarios"
          git push origin "HEAD:${BRANCH}"
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Upload source-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-candidate
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            playwright-report
            test-results
          if-no-files-found: warn
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
