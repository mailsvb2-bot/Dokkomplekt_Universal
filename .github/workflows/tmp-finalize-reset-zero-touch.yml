name: TEMP Finalize zero-touch reset ownership

on:
  push:
    branches:
      - ops/finalize-zero-touch-manifest-20260907

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: fix/user-scenario-integrity-20260907
      EXPECTED_HEAD: 7e8410903db4b9392c9edff897107d05c73facc7
      EXPECTED_APP_BLOB: fa37ce2e41c900fc1f5dc3d8b272217a54475f33
      EXPECTED_SCENARIO_BLOB: 7acda0195ee7359e3db6dc1c3042c9e4c35eba4e
      EXPECTED_WATCHER_TEST_BLOB: 32feb4ed9890b844128c1fad6cda9637af34b5a2
      EXPECTED_MANIFEST_BLOB: 6a2b69de84ff10069d31da9f2da248aa568e5621
    steps:
      - name: Apply, verify and publish exact reset fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          current="$(git ls-remote "$repo_url" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$current" = "$EXPECTED_HEAD"
          git clone --branch "$TARGET_BRANCH" --single-branch "$repo_url" target
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = "    setWebSourceUrl('');\n    setParsed(null);\n    clearSourceScopedUiState();\n"
          new = "    setWebSourceUrl('');\n    setIntakeSource('');\n    setParsed(null);\n    clearSourceScopedUiState();\n"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/App.scenarios.test.tsx')
          s = p.read_text(encoding='utf-8')
          old = "    fireEvent.click(screen.getByText('Расширенные инструменты'));\n    expect((screen.getByRole('button', { name: 'Показать значение в Word' }) as HTMLButtonElement).disabled).toBe(true);\n\n    await click(/Проверить и создать \\(2\\)/);\n"
          new = "    fireEvent.click(screen.getByText('Расширенные инструменты'));\n    expect((screen.getByRole('button', { name: 'Показать значение в Word' }) as HTMLButtonElement).disabled).toBe(true);\n\n    const zeroTouchPath = screen.getByPlaceholderText('Путь к файлу') as HTMLInputElement;\n    fireEvent.change(zeroTouchPath, { target: { value: 'C:/watch/старый-пациент.docx' } });\n    expect(zeroTouchPath.value).toBe('C:/watch/старый-пациент.docx');\n\n    await click(/Проверить и создать \\(2\\)/);\n"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = "    await waitFor(() => expect(calls.filter((call) => call.command === 'reset_case').length).toBeGreaterThan(0));\n    expect(screen.queryByRole('status', { name: 'Комплект готов' })).toBeNull();\n    expect(screen.getByRole('heading', { name: 'Добавьте исходный файл' })).toBeTruthy();\n"
          new = "    await waitFor(() => expect(calls.filter((call) => call.command === 'reset_case').length).toBeGreaterThan(0));\n    expect(zeroTouchPath.value).toBe('');\n    expect(screen.queryByRole('status', { name: 'Комплект готов' })).toBeNull();\n    expect(screen.getByRole('heading', { name: 'Добавьте исходный файл' })).toBeTruthy();\n"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          test "$(git hash-object src/App.tsx)" = "$EXPECTED_APP_BLOB"
          test "$(git hash-object src/App.scenarios.test.tsx)" = "$EXPECTED_SCENARIO_BLOB"
          test "$(git hash-object src/hooks/useWatcherResultIsolation.test.tsx)" = "$EXPECTED_WATCHER_TEST_BLOB"
          test "$(wc -l < src/App.tsx)" -lt 1550

          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST.generated.txt --json-report /tmp/source-manifest-before.json || true
          cp /tmp/SOURCE_MANIFEST.generated.txt SOURCE_MANIFEST_SHA256.txt
          test "$(git hash-object SOURCE_MANIFEST_SHA256.txt)" = "$EXPECTED_MANIFEST_BLOB"
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST.verify.txt --json-report /tmp/source-manifest-after.json

          npm ci
          npm run typecheck
          npx vitest run --config vitest.config.ts src/App.scenarios.test.tsx src/hooks/useWatcherResultIsolation.test.tsx
          npm run build
          git diff --check
          expected=$'SOURCE_MANIFEST_SHA256.txt\nsrc/App.scenarios.test.tsx\nsrc/App.tsx'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

          git config user.name "Dokkomplekt CI Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE_MANIFEST_SHA256.txt src/App.tsx src/App.scenarios.test.tsx
          git commit -m "Clear zero-touch ownership on case reset"
          remote_before="$(git ls-remote "$repo_url" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_before" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
