name: Apply simple UI patch

on:
  push:
    branches: [fix/simple-ui-button-creation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-ui-button-creation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          old = '''    const staticRows = rows.filter((row) => row.is_static_copy);
              if (staticRows.length) {
                setStatus(`Эти шаблоны пока не содержат мест для заполнения: ${staticRows.map((row) => row.detected_title).join(', ')}.`);
                return;
              }
          '''
          if old not in text:
              old = '''    const staticRows = rows.filter((row) => row.is_static_copy);
              if (staticRows.length) {
                setStatus(`Эти шаблоны пока не содержат мест для заполнения: ${staticRows.map((row) => row.detected_title).join(', ')}.`);
                return;
              }'''
          new = '''    const staticRows = rows.filter((row) => row.is_static_copy);
              if (staticRows.length) {
                setStatus(`Кнопки будут созданы. Шаблоны без полей будут копироваться без изменений: ${staticRows.map((row) => row.detected_title).join(', ')}.`);
              }
          '''
          if old not in text:
              raise SystemExit('static-template blocking block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'setStatus(`Подготовлено шаблонов: ${importedRows.length}. Проверьте названия документов и добавьте их в набор.`);',
              'setStatus(`Шаблоны выбраны: ${importedRows.length}. Проверьте названия и нажмите «Создать кнопки».`);',
              1,
          )
          text = text.replace(
              "setStatus('Добавьте шаблоны документов — программа запомнит их и подготовит рабочий набор.');",
              "setStatus('Нажмите «Создать свои кнопки» и выберите ваши шаблоны Word.');",
              1,
          )
          text = text.replace(
              'setStatus(`Добавлено документов: ${confirmedRows.length}. Шаблоны и правила сохранены.`);',
              'setStatus(`Кнопки созданы: ${confirmedRows.length}. Теперь добавьте исходный документ.`);',
              1,
          )
          app.write_text(text, encoding='utf-8')

          scenario = Path('src/App.scenarios.test.tsx')
          scenario_text = scenario.read_text(encoding='utf-8')
          scenario_text = scenario_text.replace("name: 'Добавить документы (2)'", "name: 'Создать кнопки (2)'")
          scenario_text = scenario_text.replace('/Создать комплект \\(1\\)/', '/Создать документы \\(1\\)/')
          scenario.write_text(scenario_text, encoding='utf-8')

          Path('.github/workflows/apply-simple-ui-patch.yml').unlink()
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/App.scenarios.test.tsx .github/workflows/apply-simple-ui-patch.yml
          git commit -m "fix(ui): allow simple templates to create buttons"
          git push origin HEAD:fix/simple-ui-button-creation
