name: One-time diary parity edge-case fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-time-diary-parity-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/full-functional-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply edge-case fixes and focused tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = Path('crates/dokkomplekt-docx/src/legacy_diary_table.rs')
          text = legacy.read_text(encoding='utf-8')
          old = '''    let existing_signatures = lines
                  .iter()
                  .copied()
                  .filter(|line| is_signature_line(line))
                  .collect::<Vec<_>>();

              let mut parts = structural
                  .iter()
                  .map(|line| (*line).to_string())
                  .collect::<Vec<_>>();
              if !body.trim().is_empty() {
                  parts.push(body.trim().to_string());
              }
              if existing_signatures.is_empty() {
                  if let Some(value) = atom_text(record, "treating_physician_signature") {
                      parts.push(value);
                  }
                  if let Some(value) = atom_text(record, "department_head_signature") {
                      parts.push(value);
                  }
              } else {
                  parts.extend(existing_signatures.into_iter().map(str::to_string));
              }
              parts.join("\\n")
          }

          fn is_signature_line(value: &str) -> bool {
              let normalized = normalize(value);
              (normalized.contains("лечащий врач")
                  || normalized.contains("зав. отдел")
                  || normalized.contains("зав отдел")
                  || normalized.contains("заведующ") && normalized.contains("отдел"))
                  && (value.contains("___") || normalized.contains("подпись") || value.contains("/____"))
          }
          '''
          new = '''    let existing_signatures = lines
                  .iter()
                  .copied()
                  .filter(|line| is_signature_line(line))
                  .collect::<Vec<_>>();
              let has_treating_signature = existing_signatures
                  .iter()
                  .any(|line| is_treating_signature(line));
              let has_department_head_signature = existing_signatures
                  .iter()
                  .any(|line| is_department_head_signature(line));

              let mut parts = structural
                  .iter()
                  .map(|line| (*line).to_string())
                  .collect::<Vec<_>>();
              if !body.trim().is_empty() {
                  parts.push(body.trim().to_string());
              }
              parts.extend(existing_signatures.into_iter().map(str::to_string));
              if !has_treating_signature {
                  if let Some(value) = atom_text(record, "treating_physician_signature") {
                      parts.push(value);
                  }
              }
              if !has_department_head_signature {
                  if let Some(value) = atom_text(record, "department_head_signature") {
                      parts.push(value);
                  }
              }
              parts.join("\\n")
          }

          fn has_signature_cue(value: &str) -> bool {
              let normalized = normalize(value);
              value.contains("___") || normalized.contains("подпись") || value.contains("/____")
          }

          fn is_treating_signature(value: &str) -> bool {
              normalize(value).contains("лечащий врач") && has_signature_cue(value)
          }

          fn is_department_head_signature(value: &str) -> bool {
              let normalized = normalize(value);
              (normalized.contains("зав. отдел")
                  || normalized.contains("зав отдел")
                  || normalized.contains("заведующ") && normalized.contains("отдел"))
                  && has_signature_cue(value)
          }

          fn is_signature_line(value: &str) -> bool {
              is_treating_signature(value) || is_department_head_signature(value)
          }
          '''
          if old not in text:
              raise SystemExit('signature completion anchor not found')
          text = text.replace(old, new, 1)
          test_anchor = '''    #[test]
              fn visible_text_preserves_paragraph_boundaries_and_split_runs() {'''
          test_insert = '''    #[test]
              fn missing_second_signature_is_added_without_replacing_existing_one() {
                  let mut record = SemanticRecord::new();
                  record.insert("text".into(), SemanticAtom::Text("Статус".into()));
                  record.insert(
                      "treating_physician_signature".into(),
                      SemanticAtom::Text("Лечащий врач GENERATED".into()),
                  );
                  record.insert(
                      "department_head_signature".into(),
                      SemanticAtom::Text("Заведующий отделением GENERATED".into()),
                  );
                  let result = diary_cell_content("Лечащий врач ___", "Статус", &record);
                  assert!(result.contains("Лечащий врач ___"));
                  assert!(!result.contains("Лечащий врач GENERATED"));
                  assert!(result.contains("Заведующий отделением GENERATED"));
              }

              #[test]
              fn visible_text_preserves_paragraph_boundaries_and_split_runs() {'''
          if test_anchor not in text:
              raise SystemExit('signature test anchor not found')
          text = text.replace(test_anchor, test_insert, 1)
          legacy.write_text(text, encoding='utf-8')

          pro = Path('crates/dokkomplekt-core/src/professional_records.rs')
          text = pro.read_text(encoding='utf-8')
          old = '''    let target = normalize_match(diagnosis);
              let matching = all
                  .iter()
                  .copied()
                  .filter(|row| {
                      atom_text(row, "diagnosis")
                          .map(|value| normalize_match(&value) == target)
                          .unwrap_or(false)
                  })
                  .collect::<Vec<_>>();
              let selected = if !matching.is_empty() {
                  matching
              } else {
                  // Unscoped rows are reusable within the active medical profile. Rows
                  // explicitly assigned to a different diagnosis must never leak across.
                  all.into_iter()
                      .filter(|row| atom_text(row, "diagnosis").is_none_or(|value| value.trim().is_empty()))
                      .collect::<Vec<_>>()
              };
          '''
          new = '''    let target = normalize_match(diagnosis);
              let exact = all
                  .iter()
                  .copied()
                  .filter(|row| {
                      atom_text(row, "diagnosis")
                          .map(|value| normalize_match(&value) == target)
                          .unwrap_or(false)
                  })
                  .collect::<Vec<_>>();
              let compatible = if exact.is_empty() {
                  unambiguous_compatible_rows(&all, &target)
              } else {
                  Vec::new()
              };
              let selected = if !exact.is_empty() {
                  exact
              } else if !compatible.is_empty() {
                  compatible
              } else {
                  // Unscoped rows are reusable within the active medical profile. Rows
                  // explicitly assigned to a different diagnosis must never leak across.
                  all.into_iter()
                      .filter(|row| atom_text(row, "diagnosis").is_none_or(|value| value.trim().is_empty()))
                      .collect::<Vec<_>>()
              };
          '''
          if old not in text:
              raise SystemExit('diagnosis row matching anchor not found')
          text = text.replace(old, new, 1)

          old = '''    let key = source_key(diagnosis);
              if result.regular.is_empty() {
                  let regular_id = format!("professional.medical.diary.regular.{key}");
                  if let Some(content) = case.blocks.get(&regular_id) {
                      result.regular = split_status_source(content);
                  }
              }
              if result.final_text.is_none() {
                  let final_id = format!("professional.medical.diary.final.{key}");
                  result.final_text = case
                      .blocks
                      .get(&final_id)
                      .map(|value| value.trim().to_string())
                      .filter(|value| !value.is_empty());
              }
              result
          }
          '''
          new = '''    let key = source_key(diagnosis);
              if result.regular.is_empty() {
                  if let Some(content) = persistent_source(
                      case,
                      "professional.medical.diary.regular.",
                      &key,
                  ) {
                      result.regular = split_status_source(content);
                  }
              }
              if result.final_text.is_none() {
                  result.final_text = persistent_source(
                      case,
                      "professional.medical.diary.final.",
                      &key,
                  )
                  .map(|value| value.trim().to_string())
                  .filter(|value| !value.is_empty());
              }
              result
          }

          fn unambiguous_compatible_rows<'a>(
              rows: &[&'a SemanticRecord],
              target: &str,
          ) -> Vec<&'a SemanticRecord> {
              let mut candidates = rows
                  .iter()
                  .copied()
                  .filter_map(|row| {
                      let diagnosis = atom_text(row, "diagnosis")?;
                      let normalized = normalize_match(&diagnosis);
                      diagnosis_compatible(&normalized, target).then_some((normalized, row))
                  })
                  .collect::<Vec<_>>();
              let mut keys = candidates
                  .iter()
                  .map(|(key, _)| key.as_str())
                  .collect::<Vec<_>>();
              keys.sort_unstable();
              keys.dedup();
              if keys.len() != 1 {
                  return Vec::new();
              }
              candidates.drain(..).map(|(_, row)| row).collect()
          }

          fn diagnosis_compatible(candidate: &str, target: &str) -> bool {
              let candidate = source_key(candidate);
              let target = source_key(target);
              candidate.len() >= 3
                  && target.len() >= 3
                  && (candidate.contains(&target) || target.contains(&candidate))
          }

          fn persistent_source<'a>(
              case: &'a SemanticCase,
              prefix: &str,
              key: &str,
          ) -> Option<&'a str> {
              let exact = format!("{prefix}{key}");
              if let Some(value) = case.blocks.get(&exact) {
                  return Some(value.as_str());
              }
              let mut candidates = case
                  .blocks
                  .iter()
                  .filter_map(|(id, value)| {
                      let suffix = id.strip_prefix(prefix)?;
                      diagnosis_compatible(suffix, key).then_some((suffix, value.as_str()))
                  })
                  .collect::<Vec<_>>();
              candidates.sort_by(|left, right| left.0.cmp(right.0));
              candidates.dedup_by(|left, right| left.0 == right.0);
              (candidates.len() == 1).then(|| candidates[0].1)
          }
          '''
          if old not in text:
              raise SystemExit('persistent source anchor not found')
          text = text.replace(old, new, 1)

          test_anchor = '''    #[test]
              fn persistent_clause_block_sources_feed_medical_diaries() {'''
          test_insert = '''    #[test]
              fn unambiguous_parent_diagnosis_source_matches_more_specific_code() {
                  let mut case = medical_case();
                  case.blocks.insert(
                      "professional.medical.diary.regular.f20".into(),
                      "Профессиональный статус для родительского кода диагноза.".into(),
                  );
                  case.blocks.insert(
                      "professional.medical.diary.final.f20".into(),
                      "Итоговый статус родительского кода.".into(),
                  );
                  let rendered = render_text_template(
                      "{{#each diaries}}{{diary.text}}\\n{{/each}}",
                      &case,
                      true,
                  );
                  assert!(rendered.output_text.contains("родительского кода"));
                  assert!(rendered.missing_fields.is_empty());
              }

              #[test]
              fn ambiguous_partial_diagnosis_sources_are_not_guessed() {
                  let mut case = medical_case();
                  case.values.get_mut("medical.diagnosis").unwrap().value = "F20".into();
                  case.blocks.insert(
                      "professional.medical.diary.regular.f200".into(),
                      "Статус F20.0".into(),
                  );
                  case.blocks.insert(
                      "professional.medical.diary.regular.f201".into(),
                      "Статус F20.1".into(),
                  );
                  let rendered = render_text_template(
                      "{{#each diaries}}{{diary.text}}{{/each}}",
                      &case,
                      true,
                  );
                  assert!(!rendered.missing_fields.is_empty() || !rendered.unknown_fields.is_empty());
              }

              #[test]
              fn persistent_clause_block_sources_feed_medical_diaries() {'''
          if test_anchor not in text:
              raise SystemExit('professional source test anchor not found')
          text = text.replace(test_anchor, test_insert, 1)
          pro.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p dokkomplekt-docx legacy_diary_table --lib
          cargo test -p dokkomplekt-core professional_records --lib
          git diff --check
      - name: Commit repaired product code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/dokkomplekt-docx/src/legacy_diary_table.rs crates/dokkomplekt-core/src/professional_records.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete legacy diary signatures and safe diagnosis matching'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.head_ref }}; then exit 0; fi
            git pull --rebase origin ${{ github.head_ref }}
          done
          git push origin HEAD:${{ github.head_ref }}
