name: One-shot Autopilot rerun refresh clean finalizer

on:
  push:
    branches:
      - agent/autopilot-rerun-attempt-refresh

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/autopilot-rerun-attempt-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply focused patch while preserving both authority guarantees
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-autopilot-rerun-refresh.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Run focused regressions"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          lines = src[start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          old = 'reuse exact-SHA main push runs for hosted gates; never replace a failed "\\n            "authoritative push run with a fresh dispatch; same-run rerun attempts remain authoritative'
          new = 'reuse exact-SHA main push runs for hosted gates; never retry a failed "\\n            "authoritative push run by dispatching a replacement; never replace a failed authoritative "\\n            "push run with a fresh dispatch; same-run rerun attempts remain authoritative'
          if old not in program:
              raise SystemExit('expected help-text patch fragment not found')
          program = program.replace(old, new, 1)
          Path('/tmp/apply_autopilot_fix.py').write_text(program, encoding='utf-8')
          PY
          python /tmp/apply_autopilot_fix.py
      - name: Run focused regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_autopilot_main_gate_reuse.py \
            tests/test_full_product_autopilot_contract.py
      - name: Remove all temporary workflows and regenerate source manifest
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-autopilot-rerun-refresh.yml \
            .github/workflows/one-shot-autopilot-rerun-refresh-retry.yml \
            .github/workflows/one-shot-autopilot-rerun-refresh-final.yml \
            .github/workflows/one-shot-autopilot-rerun-refresh-clean.yml
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt \
            --json-report /tmp/source-manifest-recheck.json
      - name: Commit only final production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          echo 'Final changed paths:'
          git diff --cached --name-only
          git commit -m "Fix Autopilot refresh after same-run rerun"
          git push origin HEAD:agent/autopilot-rerun-attempt-refresh
