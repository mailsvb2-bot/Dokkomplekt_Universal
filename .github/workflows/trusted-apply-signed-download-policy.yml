name: Trusted apply signed download policy

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-signed-download-endpoints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-signed-download-endpoints
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          gzip_path="$RUNNER_TEMP/signed-download-policy.patch.gz"
          patch_path="$RUNNER_TEMP/signed-download-policy.patch"
          cat \
            .github/patches/signed-download-policy.part00.b64 \
            .github/patches/signed-download-policy.part01.b64 \
            | base64 --decode > "$gzip_path"
          echo 'e516cd06a2e41c17af32996627669dc4566e142f62d268360718b2e0bb3eaff7  '"$gzip_path" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_path" > "$patch_path"
          echo '169143b106e1beb0f5f2d95b33cd1da3478245e57055f70ef793d87153c3e01b  '"$patch_path" | sha256sum --check --strict
          git apply --check --whitespace=error-all "$patch_path"
          git apply --whitespace=error-all "$patch_path"
          git rm \
            .github/patches/signed-download-policy.part00.b64 \
            .github/patches/signed-download-policy.part01.b64 \
            .github/patches/signed-download-policy.trigger
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt scripts src-tauri tests
      - name: Format and verify security/source contour
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          cargo +1.85.1 fmt --all
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest-formatted.txt" || true
          mv "$RUNNER_TEMP/source-manifest-formatted.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt scripts src-tauri tests
          cargo +1.85.1 fmt --all -- --check
          python -m py_compile scripts/generate_update_manifest.py
          python -m pytest -q \
            tests/test_update_manifest_policy.py \
            tests/test_v18_0_7_security_update_popup_license_contracts.py \
            tests/test_v18_1_2_grounding_distributed_release_contracts.py \
            tests/test_v18_1_3_pilot_expansion_contracts.py \
            tests/test_v18_2_0_component_delivery_contracts.py \
            tests/test_v18_2_1_resume_queue_modularization_contracts.py \
            tests/test_v18_2_2_adversarial_hardening_contracts.py \
            tests/test_source_manifest_integrity.py \
            tests/test_source_fingerprint.py
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Commit verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Harden signed download endpoints end to end'
          git push origin HEAD:agent/harden-signed-download-endpoints
