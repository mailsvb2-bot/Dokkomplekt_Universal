name: One-time donor date contract fix

on:
  push:
    branches:
      - agent/donor-contract-audit-20260816

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-contract-audit-20260816
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply focused donor date fixes
        run: python3 .agent_fix_donor_date_contract.py
      - name: Validate focused Rust contract
        run: |
          cargo fmt --all
          cargo clippy -p dokkomplekt-core --all-targets --locked -- -D warnings
          cargo test -p dokkomplekt-core --locked date_parser
          git diff --check
      - name: Remove delivery helpers
        run: |
          rm -f .agent_fix_donor_date_contract.py
          rm -f .github/workflows/one-time-donor-clippy-fix.yml
      - name: Commit without force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align compact date regression with donor contract"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/donor-contract-audit-20260816
            git rebase origin/agent/donor-contract-audit-20260816
            if git push origin HEAD:agent/donor-contract-audit-20260816; then
              exit 0
            fi
          done
          exit 1
