name: Apply Windows Clippy Source Fix

on:
  push:
    branches:
      - fix/ci-quality-gate-20260726

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove needless Windows-only return and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src-tauri/src/main.rs')
          text = source.read_text(encoding='utf-8')
          old = '''        return text
              .lines()
              .find(|line| line.contains("MachineGuid"))
              .and_then(|line| line.split_whitespace().last())
              .map(str::trim)
              .filter(|value| !value.is_empty())
              .map(str::to_string);
          '''
          new = '''        text
              .lines()
              .find(|line| line.contains("MachineGuid"))
              .and_then(|line| line.split_whitespace().last())
              .map(str::trim)
              .filter(|value| !value.is_empty())
              .map(str::to_string)
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Windows MachineGuid return block, found {count}')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-windows-clippy-source-fix.yml').unlink()
          PY
      - name: Commit the source-level fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/main.rs .github/workflows/apply-windows-clippy-source-fix.yml
          git commit -m "Fix Windows-only Clippy failure at the source"
          git push origin HEAD:fix/ci-quality-gate-20260726
