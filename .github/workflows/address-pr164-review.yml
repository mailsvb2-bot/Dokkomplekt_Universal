name: Address PR164 review

on:
  push:
    branches:
      - agent/fix-static-medical-semantic-markup
    paths:
      - .github/workflows/address-pr164-review.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply safe review fixes and verify
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/address-pr164-review.yml
          python3 - <<'PY'
          from pathlib import Path

          core = Path('crates/dokkomplekt-core/src/template_wizard.rs')
          text = core.read_text(encoding='utf-8')
          old = '                selected_by_default: semantic.confidence >= 0.80 && occurrences <= 5,\n'
          new = '                selected_by_default: semantic.confidence >= 0.80 && occurrences == 1,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one medical auto-selection rule, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''    #[test]\n    fn filled_medical_markup_does_not_auto_select_one_value_for_two_fields() {\n'''
          test = '''    #[test]\n    fn filled_medical_markup_does_not_auto_select_repeated_short_value() {\n        let text = "Выписной эпикриз\\nВозраст: 42\\nДиагноз: F20.0\\nЛабораторные исследования: показатель 42";\n        let candidates = suggest_filled_medical_template_markup(text, 2026);\n        let age = candidates\n            .iter()\n            .find(|candidate| candidate.field_id == "subject.age")\n            .expect("age candidate");\n        assert_eq!(age.occurrences, 2);\n        assert!(\n            !age.selected_by_default,\n            "a repeated short value must stay manual to avoid replacing unrelated text"\n        );\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('medical review test marker not unique')
          text = text.replace(marker, test + marker, 1)
          core.write_text(text, encoding='utf-8')

          docx = Path('crates/dokkomplekt-docx/src/lib.rs')
          text = docx.read_text(encoding='utf-8')
          old = '''                let needles = if compact_value != replacement.value && !compact_value.is_empty() {\n                    vec![replacement.value.as_str(), compact_value.as_str()]\n                } else {\n                    vec![replacement.value.as_str()]\n                };\n'''
          new = '''                let needles = if replacement.action == TemplateMarkupAction::Replace\n                    && compact_value != replacement.value\n                    && !compact_value.is_empty()\n                {\n                    vec![replacement.value.as_str(), compact_value.as_str()]\n                } else {\n                    vec![replacement.value.as_str()]\n                };\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one compact fallback, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''    #[test]\n    fn renders_and_extracts_headers_as_part_of_the_document_contract() {\n'''
          test = '''    #[test]\n    fn multiline_insert_after_does_not_flatten_word_structure() {\n        let dir = std::env::temp_dir().join(format!(\n            "dokkomplekt-filled-insert-after-{}",\n            std::process::id()\n        ));\n        let input = dir.join("filled.docx");\n        let marked = dir.join("marked.docx");\n        write_test_docx(\n            &input,\n            r#"<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Лечение: терапия 1</w:t></w:r></w:p><w:p><w:r><w:t>терапия 2</w:t></w:r></w:p></w:body></w:document>"#,\n            None,\n        );\n        let value = "терапия 1\\nтерапия 2";\n        let report = apply_template_markup_file(\n            &input,\n            &marked,\n            &[TemplateMarkupReplacement {\n                field_id: "medical.treatment".into(),\n                value: value.into(),\n                action: TemplateMarkupAction::InsertAfter,\n            }],\n        )\n        .expect("insert-after markup stays fail-closed");\n        assert_eq!(report.replacement_count, 0);\n        assert_eq!(report.skipped_values, vec![value.to_string()]);\n        let text = extract_docx_text(&marked).expect("marked text");\n        assert!(text.contains("терапия 1"));\n        assert!(text.contains("терапия 2"));\n        assert!(!text.contains("{{medical.treatment}}"));\n        let _ = std::fs::remove_dir_all(dir);\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('docx review test marker not unique')
          text = text.replace(marker, test + marker, 1)
          docx.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p dokkomplekt-core filled_medical_markup --locked
          cargo test -p dokkomplekt-docx filled_multiline --locked
          git diff --check
          python3 scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-before-copy.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python3 scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-after-copy.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden filled-template auto markup safety"
          git push origin HEAD:agent/fix-static-medical-semantic-markup
