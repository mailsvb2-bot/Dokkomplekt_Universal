name: Vitest Diagnostic

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vitest-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: vitest-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Exact Vitest failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: vitest
        continue-on-error: true
        run: npm run test -- --reporter=json --outputFile=verification/ci/vitest-diagnostic.json
      - id: summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report_path = Path('verification/ci/vitest-diagnostic.json')
          slug = 'report-missing'
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              failures = []
              for suite in report.get('testResults', []):
                  for assertion in suite.get('assertionResults', []):
                      if assertion.get('status') == 'failed':
                          failures.append(assertion)
              if not failures:
                  slug = 'success'
              else:
                  failure = failures[0]
                  message = '\n'.join(failure.get('failureMessages', []))
                  line_match = re.search(r'App\.scenarios\.test\.tsx:(\d+):', message)
                  line = line_match.group(1) if line_match else 'unknown-line'
                  if 'Unable to find role=' in message or 'Unable to find an accessible element' in message:
                      kind = 'missing-role'
                  elif 'Unable to find an element with the text' in message:
                      kind = 'missing-text'
                  elif 'Found multiple elements' in message:
                      kind = 'multiple-elements'
                  elif 'expected false to be true' in message or 'expected true to be false' in message:
                      kind = 'expected-boolean'
                  elif 'Timed out' in message or 'timeout' in message.lower():
                      kind = 'timeout'
                  else:
                      kind = 'assertion'
                  slug = f'L{line}-{kind}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'slug={slug}\n')
          PY
      - name: Upload exact diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ steps.summary.outputs.slug }}
          path: verification/ci/vitest-diagnostic.json
          if-no-files-found: error
      - name: Enforce Vitest result
        if: steps.vitest.outcome != 'success'
        run: exit 1
