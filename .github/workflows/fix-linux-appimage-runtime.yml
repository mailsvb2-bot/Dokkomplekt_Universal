name: Apply Linux AppImage Runtime Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-linux-appimage-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-linux-appimage-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-linux-appimage-runtime
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed product patch
        shell: bash
        run: |
          base64 -d > /tmp/appimage-runtime.patch <<'PATCH'

PATCH
          git apply --index /tmp/appimage-runtime.patch
          python -m pytest -q tests/test_linux_appimage_runtime_contract.py tests/test_linux_installer_smoke_contract.py
          python scripts/build_source_archive.py --output /tmp/dokkomplekt-source.zip --top-level Dokkomplekt_Universal --manifest-json /tmp/source-report.json
          rm -f .github/appimage-fix-trigger .github/appimage-fix-pr-ready* .github/workflows/fix-linux-appimage-runtime.yml
      - name: Commit clean product fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Linux AppImage graphics runtime portability"
          git push origin HEAD:agent/fix-linux-appimage-runtime
