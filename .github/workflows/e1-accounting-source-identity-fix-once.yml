name: E1 Accounting Source Identity Fix Once

on:
  push:
    branches: [canon-v2/e1-accounting-pipeline]

permissions:
  contents: write

concurrency:
  group: e1-accounting-source-identity-fix-once
  cancel-in-progress: false

jobs:
  fix-and-prove:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact profile fix, prove it, sync manifest, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='b12233a9ee65326bea9f91c7bcbd2d3774d19dc4'
          workflow='.github/workflows/e1-accounting-source-identity-fix-once.yml'
          popup='crates/dokkomplekt-core/src/popup_profiles.rs'
          engine='crates/dokkomplekt-core/src/workflow_engine.rs'

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"

          python3 - <<'PY'
          from pathlib import Path

          popup = Path('crates/dokkomplekt-core/src/popup_profiles.rs')
          text = popup.read_text()
          old = '''    if should_ask_fresh_each_run(&canonical, role_id) {\n        config.ask_mode = PromptAskMode::Always;\n    } else if should_confirm_each_run(&canonical, role_id) {\n        config.ask_mode = PromptAskMode::Confirm;\n    }\n    if is_document_date(&canonical) {\n'''
          new = '''    if should_ask_fresh_each_run(&canonical, role_id) {\n        config.ask_mode = PromptAskMode::Always;\n    } else if should_confirm_each_run(&canonical, role_id) {\n        config.ask_mode = PromptAskMode::Confirm;\n    }\n    // A service act selected from an Accounting source is the same logical\n    // document identity, not a newly-issued unrelated document. Keep the\n    // source number/date visible for explicit confirmation instead of clearing\n    // them through the generic Always policy. Other document roles retain the\n    // fail-safe fresh-identity behaviour.\n    if should_confirm_source_document_identity(category, role_id, &canonical) {\n        config.ask_mode = PromptAskMode::Confirm;\n    }\n    if is_document_date(&canonical) {\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          anchor = '''fn should_ask_fresh_each_run(field_id: &str, role_id: &str) -> bool {\n'''
          helper = '''fn should_confirm_source_document_identity(\n    category: &DomainKind,\n    role_id: &str,\n    field_id: &str,\n) -> bool {\n    if !matches!(category, DomainKind::Accounting)\n        || !matches!(field_id, "document.number" | "document.date")\n    {\n        return false;\n    }\n    let role = role_id.trim().to_lowercase();\n    role == "service_act" || role.ends_with(".service_act")\n}\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper + anchor, 1)
          test_anchor = '''    #[test]\n    fn referenced_contract_identity_is_confirmed_not_cleared_for_an_act() {\n'''
          test = '''    #[test]\n    fn accounting_service_act_source_identity_is_confirmed_not_cleared() {\n        for field_id in ["document.number", "document.date"] {\n            let field =\n                popup_config_for_field(field_id, true, &DomainKind::Accounting, "service_act");\n            assert_eq!(field.ask_mode, PromptAskMode::Confirm);\n        }\n\n        let unrelated = popup_config_for_field(\n            "document.number",\n            true,\n            &DomainKind::Accounting,\n            "reconciliation",\n        );\n        assert_eq!(unrelated.ask_mode, PromptAskMode::Always);\n    }\n\n'''
          assert text.count(test_anchor) == 1
          popup.write_text(text.replace(test_anchor, test + test_anchor, 1))

          engine = Path('crates/dokkomplekt-core/src/workflow_engine.rs')
          text = engine.read_text()
          test_anchor = '''    #[test]\n    fn always_prompt_is_shown_even_when_case_has_value() {\n'''
          test = '''    #[test]\n    fn accounting_service_act_prefills_scanned_identity_for_confirmation() {\n        let mut doc = document("service_act", "document.number");\n        doc.category = DomainKind::Accounting;\n        doc.role_id = "service_act".into();\n        doc.required_fields.push("document.date".into());\n        doc.placeholders.push("document.date".into());\n\n        let mut case = SemanticCase::default();\n        crate::set_scanner_value(&mut case, "document.number", "E1-17", 0.97);\n        crate::set_scanner_value(&mut case, "document.date", "13.09.2026", 0.97);\n\n        let plan = plan_workflow(&doc, &case, &WorkflowFlags::default());\n        for (field_id, expected) in [\n            ("document.number", "E1-17"),\n            ("document.date", "13.09.2026"),\n        ] {\n            let prompt = plan\n                .prompts\n                .iter()\n                .find(|prompt| prompt.field_id == field_id)\n                .unwrap_or_else(|| panic!("missing confirmation prompt for {field_id}"));\n            assert_eq!(prompt.ask_mode, PromptAskMode::Confirm);\n            assert_eq!(prompt.current_value.as_deref(), Some(expected));\n        }\n    }\n\n'''
          assert text.count(test_anchor) == 1
          engine.write_text(text.replace(test_anchor, test + test_anchor, 1))
          PY

          git diff --check
          test "$(git hash-object "$popup")" = '786ff7c205abb702fd656812ba724908e0d19a46'
          test "$(git hash-object "$engine")" = 'f126352cd82f8c6dc2826eed36d093f40224a2e1'
          cargo fmt --all -- --check
          cargo test -p dokkomplekt-core accounting_service_act_source_identity_is_confirmed_not_cleared
          cargo test -p dokkomplekt-core accounting_service_act_prefills_scanned_identity_for_confirmation
          cargo test -p dokkomplekt-core

          git rm "$workflow"
          actual_changed="$(git diff --name-only | sort)"
          expected_changed="$(printf '%s\n' "$popup" "$engine" "$workflow" | sort)"
          test "$actual_changed" = "$expected_changed"

          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add "$popup" "$engine" SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt \
            --json-report /tmp/source-manifest-recheck.json
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.recheck.txt

          final_changed="$(git diff HEAD --name-only | sort)"
          expected_final="$(printf '%s\n' SOURCE_MANIFEST_SHA256.txt "$popup" "$engine" "$workflow" | sort)"
          test "$final_changed" = "$expected_final"

          git config user.name 'Dokkomplekt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -u "$workflow"
          git commit -m 'fix: confirm Accounting service-act source identity'
          git push origin HEAD:refs/heads/canon-v2/e1-accounting-pipeline
