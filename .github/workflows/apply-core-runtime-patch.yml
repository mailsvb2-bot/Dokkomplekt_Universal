name: Apply verified core runtime patch

on:
  push:
    branches:
      - agent/core-offline-windows-installer
    paths:
      - '.github/core-runtime-patch.part00'
      - '.github/core-runtime-patch.part01'
      - '.github/core-runtime-patch.part02'
      - '.github/core-runtime-patch.part03a'
      - '.github/core-runtime-patch.part03b'
      - '.github/core-runtime-patch.part03c'
      - '.github/core-runtime-patch.part03d'
      - '.github/core-runtime-patch.part03e'
      - '.github/core-runtime-patch.part03f'
      - '.github/core-runtime-patch.part04'
      - '.github/workflows/apply-core-runtime-patch.yml'

permissions:
  contents: write

concurrency:
  group: apply-core-runtime-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact allowlisted patch payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          expected_sha = '7b497f141bfe5c331997c132c1fdcd2ac4ea5f43690a01616707ce316c82ec37'
          part_names = [
              '.github/core-runtime-patch.part00',
              '.github/core-runtime-patch.part01',
              '.github/core-runtime-patch.part02',
              '.github/core-runtime-patch.part03a',
              '.github/core-runtime-patch.part03b',
              '.github/core-runtime-patch.part03c',
              '.github/core-runtime-patch.part03d',
              '.github/core-runtime-patch.part03e',
              '.github/core-runtime-patch.part03f',
              '.github/core-runtime-patch.part04',
          ]
          encoded = ''.join(Path(name).read_text(encoding='utf-8') for name in part_names)
          payload = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(payload).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'patch archive digest mismatch: expected={expected_sha} actual={actual_sha}')

          allowed = {
              'scripts/_runtime_profile.py',
              'scripts/create_offline_runtime_bundle.py',
              'scripts/verify_windows_runtime_app_parity.py',
              'scripts/probe_offline_runtime.py',
              'scripts/assert_offline_runtime_ready.py',
              'scripts/prepare_sidecars.py',
              'scripts/create_runtime_lock.py',
              'scripts/build_windows_runtime_kit.py',
              'scripts/prepare_windows_production_runtime.ps1',
              '.github/workflows/build-installers.yml',
              'tests/test_windows_runtime_app_parity.py',
              'tests/test_runtime_probe_surface.py',
              'tests/test_windows_runtime_kit.py',
              'tests/test_v18_1_2_offline_runtime_bundle.py',
          }
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              names = {m.name for m in members}
              if names != allowed:
                  raise SystemExit(f'patch member set mismatch: missing={sorted(allowed-names)} extra={sorted(names-allowed)}')
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or not member.isfile():
                      raise SystemExit(f'unsafe patch member: {member.name!r}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read patch member: {member.name}')
                  target = Path(*pure.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY

          # GitHub Actions' token is not allowed to publish workflow-file changes.
          # Leave build-installers.yml for the authenticated repository connector,
          # but publish the entire non-workflow runtime implementation here.
          git checkout HEAD -- .github/workflows/build-installers.yml
          rm -f .github/core-runtime-patch.part00 \
                .github/core-runtime-patch.part01 \
                .github/core-runtime-patch.part02 \
                .github/core-runtime-patch.part03a \
                .github/core-runtime-patch.part03b \
                .github/core-runtime-patch.part03c \
                .github/core-runtime-patch.part03d \
                .github/core-runtime-patch.part03e \
                .github/core-runtime-patch.part03f \
                .github/core-runtime-patch.part04

      - name: Verify targeted runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_runtime_profile_contract.py \
            tests/test_v18_1_2_offline_runtime_bundle.py \
            tests/test_hosted_windows_signing_runtime.py \
            tests/test_windows_runtime_app_parity.py \
            tests/test_runtime_probe_surface.py \
            tests/test_windows_runtime_kit.py \
            tests/test_windows_runtime_lock_approval.py \
            tests/test_release_environment_preflight.py \
            tests/test_hardware_preflight_trust_order.py \
            tests/test_windows_signed_handoff.py

      - name: Commit non-workflow core runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mailsvb2-bot'
          git config user.email 'mailsvb2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete core offline runtime profile wiring'
          git push origin HEAD:agent/core-offline-windows-installer
