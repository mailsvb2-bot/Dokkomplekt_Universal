name: PR7 Vitest diagnostic

on:
  push:
    branches: [fix/simple-ui-button-creation]
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Persist compact Vitest failure
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e
          npm run test -- --reporter=json --outputFile=/tmp/vitest.json >/tmp/vitest.log 2>&1
          node - <<'NODE' > VITEST_FAILURE.txt
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/vitest.json', 'utf8'));
          for (const file of report.testResults || []) {
            for (const item of file.assertionResults || []) {
              if (item.status === 'failed') {
                console.log(`FILE: ${file.name}`);
                console.log(`TEST: ${[...(item.ancestorTitles || []), item.title].join(' > ')}`);
                for (const message of item.failureMessages || []) console.log(message);
              }
            }
          }
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git pull --rebase origin "${BRANCH}" || true
            git add VITEST_FAILURE.txt
            git commit -m "chore(ci): capture PR7 Vitest failure" || true
            git push origin "HEAD:${BRANCH}" && exit 0
            sleep 2
          done
          exit 1
