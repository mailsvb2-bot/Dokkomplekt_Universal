name: Fix Print Validation Regression

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fundamental-seven-critical-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Use a valid safe DOCX fixture and retain malformed-file rejection
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/main.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new)

          replace_once(
              '        let executable = root.join("payload.exe");',
              '        let malformed_docx = root.join("malformed.docx");\n        let executable = root.join("payload.exe");',
          )
          replace_once(
              '        std::fs::write(&docx, b"docx-placeholder").expect("docx");',
              '        dokkomplekt_docx::create_docx_from_text(&docx, "Безопасный документ")\n            .expect("create valid docx");\n        std::fs::write(&malformed_docx, b"not-a-zip").expect("malformed docx");',
          )
          replace_once(
              '        assert!(validate_printable_file(&docx).is_ok());',
              '        assert!(validate_printable_file(&docx).is_ok());\n        assert!(validate_printable_file(&malformed_docx).is_err());',
          )
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p dokkomplekt-tauri --all-targets -- -D warnings
          cargo test -p dokkomplekt-tauri --bin dokkomplekt-tauri print_validation_accepts_documents_and_rejects_unsafe_extensions
          rm .github/workflows/fix-print-validation-test.yml
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name mailsvb2-bot
          git config user.email 254540704+mailsvb2-bot@users.noreply.github.com
          git add -A
          git commit -m "Use valid DOCX fixture for hardened print validation"
          git push --force origin HEAD:refs/heads/agent/fundamental-seven-critical-fixes
