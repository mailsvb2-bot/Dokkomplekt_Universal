name: One-time donor date clippy fix

on:
  push:
    branches:
      - agent/donor-contract-audit-20260816

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-contract-audit-20260816
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply clippy fix and align the stale compact-date regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('crates/dokkomplekt-core/src/date_parser.rs')
          text = parser.read_text(encoding='utf-8')
          old_loop = 'for (day_len, month_len) in patterns {'
          new_loop = 'for &(day_len, month_len) in &patterns {'
          count = text.count(old_loop)
          if count != 2:
              raise SystemExit(f'expected exactly 2 date loops, found {count}')
          parser.write_text(text.replace(old_loop, new_loop), encoding='utf-8')

          regression = Path('crates/dokkomplekt-core/tests/behavior_regressions.rs')
          text = regression.read_text(encoding='utf-8')
          old = '''    // Ambiguous historical shorthand is intentionally rejected instead of
    // silently turning 1126 into 01.01.2026.
    assert_eq!(parse_flexible_date("1126", 2026), None);'''
          new = '''    // Donor compatibility is restored only after modern DDMM interpretation
    // fails: 1126 cannot be DDMM (month 26), so it is read as D/M/YY.
    assert_eq!(
        parse_flexible_date("1126", 2026).as_deref(),
        Some("01.01.2026")
    );'''
          if text.count(old) != 1:
              raise SystemExit('stale 1126 regression contract not found exactly once')
          regression.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          cargo clippy -p dokkomplekt-core --all-targets --locked -- -D warnings
          cargo test -p dokkomplekt-core --locked date_parser
          rm -f .github/workflows/one-time-donor-clippy-fix.yml
          git diff --check
      - name: Commit without force push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align compact date regression with donor contract"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/donor-contract-audit-20260816
            git rebase origin/agent/donor-contract-audit-20260816
            if git push origin HEAD:agent/donor-contract-audit-20260816; then
              exit 0
            fi
          done
          exit 1
