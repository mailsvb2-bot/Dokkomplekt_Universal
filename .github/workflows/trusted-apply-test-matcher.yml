name: Trusted apply frontend matcher fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-popup-skip-and-field-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-popup-skip-and-field-validation
          fetch-depth: 0
      - name: Verify, apply and remove transport
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patches/test-matcher-fix.b64 > "$RUNNER_TEMP/test-matcher-fix.patch"
          echo "57540e3e1790679dfe71b40111b1b650954505a64cd93b6503126dc04ea34cc9  $RUNNER_TEMP/test-matcher-fix.patch" | sha256sum --check -
          git apply --check "$RUNNER_TEMP/test-matcher-fix.patch"
          git apply --index "$RUNNER_TEMP/test-matcher-fix.patch"
          git rm .github/patches/test-matcher-fix.b64 .github/workflows/apply-test-matcher-fix.yml
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Use built-in Vitest assertions for popup skip scenario"
          git push origin HEAD:agent/fix-popup-skip-and-field-validation
