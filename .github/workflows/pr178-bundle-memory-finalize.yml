name: PR178 transactional review finalizer

on:
  push:
    branches:
      - ops/pr178-bundle-memory-finalize-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply guarded transactional fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          expected_head='8403d023209b5c8e4437c568447a133a9c874b38'
          test "$(git rev-parse HEAD)" = "$expected_head"

          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src-tauri/src/subsystems/source_intake_commands.rs')
          source = source_path.read_text(encoding='utf-8')

          marker = 'const SPECIALIST_KIT_RULES_STATE_KEY: &str = "specialist_kit_rules.v1";\n'
          assert source.count(marker) == 1
          source = source.replace(marker, marker + '''static SPECIALIST_KIT_RULES_LOCK: std::sync::Mutex<()> = std::sync::Mutex::new(());\n\nfn lock_specialist_kit_rules() -> Result<std::sync::MutexGuard<'static, ()>, String> {\n    SPECIALIST_KIT_RULES_LOCK\n        .lock()\n        .map_err(|_| "specialist kit rules lock failed".to_string())\n}\n''', 1)

          load_sig = '''fn load_specialist_kit_decision(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n) -> Result<Option<KitLearningDecision>, String> {\n    let repo = repository_for(&default_state_db_path(app)?)?;\n'''
          assert source.count(load_sig) == 1
          source = source.replace(load_sig, load_sig.replace('    let repo =', '    let _rules_guard = lock_specialist_kit_rules()?;\n    let repo ='), 1)

          persist_sig = '''fn persist_specialist_kit_rule(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n    confirmed_document_ids: &[String],\n) -> Result<(), String> {\n'''
          assert source.count(persist_sig) == 1
          persist_wrapper = '''fn persist_specialist_kit_rule(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n    confirmed_document_ids: &[String],\n) -> Result<(), String> {\n    let _rules_guard = lock_specialist_kit_rules()?;\n    persist_specialist_kit_rule_locked(app, key, pack, confirmed_document_ids)\n}\n\nfn persist_specialist_kit_rule_locked(\n    app: &tauri::AppHandle,\n    key: &KitRuleKey,\n    pack: &DocumentPack,\n    confirmed_document_ids: &[String],\n) -> Result<(), String> {\n'''
          source = source.replace(persist_sig, persist_wrapper, 1)

          insert_before = 'fn load_specialist_kit_decision(\n'
          assert source.count(insert_before) == 1
          helper = '''fn specialist_rule_key_from_exception_details(\n    details: &serde_json::Value,\n    pack: &DocumentPack,\n) -> Result<Option<KitRuleKey>, String> {\n    if let Some(value) = details.get("specialist_rule_key") {\n        if !value.is_null() {\n            return serde_json::from_value::<KitRuleKey>(value.clone())\n                .map(Some)\n                .map_err(|error| format!("Ключ подтверждённого комплекта повреждён: {error}"));\n        }\n    }\n    let cluster_id = details\n        .get("cluster_id")\n        .and_then(serde_json::Value::as_str)\n        .map(str::trim)\n        .filter(|value| !value.is_empty())\n        .ok_or_else(|| "В подтверждении отсутствует структурный тип дела.".to_string())?;\n    if cluster_id == "unclassified" {\n        return Ok(None);\n    }\n    let domain = details\n        .get("domain")\n        .cloned()\n        .ok_or_else(|| "В подтверждении отсутствует профессиональная область.".to_string())\n        .and_then(|value| {\n            serde_json::from_value::<DomainKind>(value)\n                .map_err(|error| format!("Профессиональная область подтверждения повреждена: {error}"))\n        })?;\n    Ok(Some(KitRuleKey {\n        domain,\n        cluster_id: cluster_id.to_string(),\n        pack_id: (!pack.pack_id.trim().is_empty()).then(|| pack.pack_id.clone()),\n    }))\n}\n\n'''
          source = source.replace(insert_before, helper + insert_before, 1)

          old_ret = ') -> Result<(DocumentRoutingRecommendation, BundleDecision), String> {'
          new_ret = ') -> Result<(DocumentRoutingRecommendation, BundleDecision, Option<KitRuleKey>), String> {'
          assert source.count(old_ret) == 1
          source = source.replace(old_ret, new_ret, 1)
          assert source.count('    Ok((routing, decision))\n') == 1
          source = source.replace('    Ok((routing, decision))\n', '    Ok((routing, decision, key))\n', 1)
          caller = 'let (routing, bundle_decision) = resolve_document_bundle_for_case('
          assert source.count(caller) == 3
          source = source.replace(caller, 'let (routing, bundle_decision, _specialist_rule_key) = resolve_document_bundle_for_case(')
          source_path.write_text(source, encoding='utf-8')

          automation_path = Path('src-tauri/src/subsystems/automation_runtime.rs')
          automation = automation_path.read_text(encoding='utf-8')
          old = 'let (routing_recommendation, bundle_decision) = resolve_document_bundle_for_case('
          assert automation.count(old) == 1
          automation = automation.replace(old, 'let (routing_recommendation, bundle_decision, specialist_rule_key) = resolve_document_bundle_for_case(', 1)

          detail_block = '''            "cluster_id": &routing_recommendation.cluster_id,\n            "domain": &routing_recommendation.domain,\n            "confidence": bundle_decision.confidence,\n'''
          assert automation.count(detail_block) == 1
          automation = automation.replace(detail_block, '''            "cluster_id": &routing_recommendation.cluster_id,\n            "domain": &routing_recommendation.domain,\n            "specialist_rule_key": &specialist_rule_key,\n            "confidence": bundle_decision.confidence,\n''', 1)

          snapshot_old = '''        .map(|document| {\n            template_snapshot::TemplateSnapshot::capture(\n                app,\n                &document.template_path,\n                &document.button_label,\n            )\n            .map(|snapshot| (document.id.clone(), snapshot))\n        })\n'''
          assert automation.count(snapshot_old) == 1
          snapshot_new = '''        .map(|document| {\n            let effective_path = effective_generation_template_path(app, document)?;\n            template_snapshot::TemplateSnapshot::capture(\n                app,\n                &effective_path.display().to_string(),\n                &document.button_label,\n            )\n            .map(|snapshot| (document.id.clone(), snapshot))\n        })\n'''
          automation = automation.replace(snapshot_old, snapshot_new, 1)

          fn_start = automation.index('fn confirm_bundle_exception_and_retry(')
          fn_end = automation.index('\n#[tauri::command]\nfn get_automation_metrics', fn_start)
          confirm = automation[fn_start:fn_end]
          repo_line = '    let repo = repository_for(&default_state_db_path(&app)?)?;\n'
          assert confirm.count(repo_line) == 1
          confirm = confirm.replace(repo_line, repo_line + '    let _rules_guard = lock_specialist_kit_rules()?;\n', 1)

          key_start = confirm.index('    let cluster_id = details')
          key_end = confirm.index('    let record = repo', key_start)
          confirm = confirm[:key_start] + '    let specialist_rule_key = specialist_rule_key_from_exception_details(&details, &pack)?;\n' + confirm[key_end:]

          resolved_block = '''    if !resolved {\n        return Err("Исключение уже закрыто другим процессом.".into());\n    }\n'''
          assert confirm.count(resolved_block) == 1
          persist_after_claim = resolved_block + '''    if let Some(key) = specialist_rule_key.as_ref() {\n        if let Err(error) = persist_specialist_kit_rule_locked(&app, key, &pack, &selected) {\n            let restore = create_automation_exception(\n                &app,\n                "bundle_decision",\n                &exception.source_path,\n                "Подтверждённый комплект не удалось сохранить; требуется повторное подтверждение.",\n                &details,\n            );\n            return Err(match restore {\n                Ok(_) => format!("Подтверждение не сохранено: {error}. Создано новое открытое исключение."),\n                Err(restore_error) => format!(\n                    "Подтверждение не сохранено: {error}; восстановить открытое исключение также не удалось: {restore_error}"\n                ),\n            });\n        }\n    }\n'''
          confirm = confirm.replace(resolved_block, persist_after_claim, 1)
          automation = automation[:fn_start] + confirm + automation[fn_end:]
          automation_path.write_text(automation, encoding='utf-8')

          snapshot_path = Path('src-tauri/src/template_snapshot.rs')
          snapshots = snapshot_path.read_text(encoding='utf-8')
          old_capture = '''        let configured_live_path = resolve_user_path(app, configured_path)?;\n        let live_path =\n            Self::effective_registered_generation_path(app, &configured_live_path, label)?;\n'''
          assert snapshots.count(old_capture) == 1
          snapshots = snapshots.replace(old_capture, '        let live_path = resolve_user_path(app, configured_path)?;\n', 1)
          pattern = re.compile(r'\n    fn effective_registered_generation_path\(.*?\n    fn capture_path\(', re.S)
          snapshots, count = pattern.subn('\n    fn capture_path(', snapshots, count=1)
          assert count == 1
          snapshot_path.write_text(snapshots, encoding='utf-8')

          document_path = Path('src-tauri/src/subsystems/document_commands.rs')
          document = document_path.read_text(encoding='utf-8')
          single_old = '''    let template_snapshot = template_snapshot::TemplateSnapshot::capture(\n        &app,\n        &doc.template_path,\n        &doc.button_label,\n    )?;\n'''
          assert document.count(single_old) == 1
          single_new = '''    let effective_template_path = effective_generation_template_path(&app, &doc)?;\n    let template_snapshot = template_snapshot::TemplateSnapshot::capture(\n        &app,\n        &effective_template_path.display().to_string(),\n        &doc.button_label,\n    )?;\n'''
          document = document.replace(single_old, single_new, 1)
          document_path.write_text(document, encoding='utf-8')

          diary_test_path = Path('tests/test_donor_diary_output_parity.py')
          diary_test = diary_test_path.read_text(encoding='utf-8')
          marker = 'def test_generation_override_is_explicit_and_candidate_snapshots_remain_literal() -> None:'
          assert marker not in diary_test
          diary_test += '''\n\n\ndef test_generation_override_is_explicit_and_candidate_snapshots_remain_literal() -> None:\n    snapshots = read("src-tauri/src/template_snapshot.rs")\n    automation = read("src-tauri/src/subsystems/automation_runtime.rs")\n    document = read("src-tauri/src/subsystems/document_commands.rs")\n\n    assert "effective_registered_generation_path" not in snapshots\n    assert "let live_path = resolve_user_path(app, configured_path)?;" in snapshots\n    assert "let effective_path = effective_generation_template_path(app, document)?;" in automation\n    assert "let effective_template_path = effective_generation_template_path(&app, &doc)?;" in document\n''' 
          diary_test_path.write_text(diary_test, encoding='utf-8')

          privacy_test_path = Path('tests/test_learning_privacy_retention_contract.py')
          privacy_test = privacy_test_path.read_text(encoding='utf-8')
          marker = 'def test_specialist_bundle_rule_updates_are_serialized_and_claim_precedes_persist() -> None:'
          assert marker not in privacy_test
          privacy_test += '''\n\n\ndef test_specialist_bundle_rule_updates_are_serialized_and_claim_precedes_persist() -> None:\n    source = read("src-tauri/src/subsystems/source_intake_commands.rs")\n    automation = read("src-tauri/src/subsystems/automation_runtime.rs")\n\n    assert "static SPECIALIST_KIT_RULES_LOCK: std::sync::Mutex<()>" in source\n    assert "fn lock_specialist_kit_rules()" in source\n    assert "fn persist_specialist_kit_rule_locked(" in source\n    assert "specialist_rule_key_from_exception_details" in source\n    assert "Option<KitRuleKey>), String>" in source\n    assert '"specialist_rule_key": &specialist_rule_key' in automation\n\n    start = automation.index("fn confirm_bundle_exception_and_retry(")\n    end = automation.index("fn get_automation_metrics", start)\n    confirm = automation[start:end]\n    assert "let _rules_guard = lock_specialist_kit_rules()?;" in confirm\n    assert confirm.index(".resolve_exception(") < confirm.index("persist_specialist_kit_rule_locked")\n    assert "Создано новое открытое исключение" in confirm\n''' 
          privacy_test_path.write_text(privacy_test, encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core

          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q \
            tests/test_donor_diary_output_parity.py \
            tests/test_donor_patient_folder_watcher_parity.py \
            tests/test_source_manifest_integrity.py \
            tests/test_learning_privacy_retention_contract.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          test "$(wc -l < src-tauri/src/subsystems/automation_runtime.rs)" -lt 3000

          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add \
            SOURCE_MANIFEST_SHA256.txt \
            src-tauri/src/subsystems/source_intake_commands.rs \
            src-tauri/src/subsystems/automation_runtime.rs \
            src-tauri/src/template_snapshot.rs \
            src-tauri/src/subsystems/document_commands.rs \
            tests/test_donor_diary_output_parity.py \
            tests/test_learning_privacy_retention_contract.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'Serialize bundle confirmations and isolate generation snapshots'
          git push origin HEAD:fix/real-user-workflow-20260907
