name: One-time donor contract applicator

on:
  push:
    branches:
      - agent/donor-contract-audit-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-contract-audit-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply audited donor behavior contracts
        run: python .agent_apply_donor_contracts.py
      - name: Verify patch hygiene
        run: |
          git diff --check
          git status --short
      - name: Commit audited donor contract port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore remaining universal donor behavior contracts"
          git push origin HEAD:agent/donor-contract-audit-20260816
