name: One-shot source manifest resync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-and-remove-self:
    if: github.head_ref == 'agent/exhaustive-donor-parity-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Remove helper before calculating the final tree manifest
        shell: bash
        run: git rm .github/workflows/manifest-resync-once.yml
      - name: Regenerate canonical source manifest from final tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_archive.py \
            --output "$RUNNER_TEMP/Dokkomplekt_Universal-source.zip" \
            --top-level Dokkomplekt_Universal \
            --manifest-json "$RUNNER_TEMP/source-archive-report.json"
          python scripts/verify_source_manifest.py
      - name: Commit only the self-removal and generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git add SOURCE_MANIFEST_SHA256.txt .github/workflows/manifest-resync-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
