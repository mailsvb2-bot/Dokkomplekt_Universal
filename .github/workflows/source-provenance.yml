name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Apply reported default-output regression fix once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/default-output-root-20260818'
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).lstrip('\n')

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          rust_path = 'src-tauri/src/subsystems/document_commands.rs'
          replace_once(
              rust_path,
              block('''
              #[derive(Debug, Serialize)]
              struct FirstRunStateResponse {
                  pack: DocumentPack,
                  has_user_buttons: bool,
                  message: String,
              }

              #[tauri::command]
              fn first_run_state(state: State<'_, AppState>) -> Result<FirstRunStateResponse, String> {
                  let pack = state.pack.lock().map_err(|_| "state lock failed")?.clone();
              '''),
              block('''
              const DEFAULT_OUTPUT_FOLDER_NAME: &str = "Выписанные пациенты";

              fn ensure_default_output_root_under(desktop: &Path) -> Result<PathBuf, String> {
                  let output_root = desktop.join(DEFAULT_OUTPUT_FOLDER_NAME);
                  std::fs::create_dir_all(&output_root).map_err(|error| {
                      format!(
                          "Не удалось создать стандартную папку готовых документов «{}»: {error}",
                          output_root.display()
                      )
                  })?;
                  Ok(output_root)
              }

              fn ensure_default_output_root(app: &tauri::AppHandle) -> Result<PathBuf, String> {
                  let desktop = app
                      .path()
                      .desktop_dir()
                      .map_err(|error| format!("Не удалось определить Рабочий стол пользователя: {error}"))?;
                  ensure_default_output_root_under(&desktop)
              }

              #[derive(Debug, Serialize)]
              struct FirstRunStateResponse {
                  pack: DocumentPack,
                  has_user_buttons: bool,
                  message: String,
                  default_output_root: String,
              }

              #[tauri::command]
              fn first_run_state(
                  state: State<'_, AppState>,
                  app: tauri::AppHandle,
              ) -> Result<FirstRunStateResponse, String> {
                  let pack = state.pack.lock().map_err(|_| "state lock failed")?.clone();
              ''')
          )
          replace_once(
              rust_path,
              block('''
                  Ok(FirstRunStateResponse {
                      has_user_buttons,
                      pack,
                      message,
                  })
              }

              #[derive(Debug, Deserialize)]
              struct AnalyzeTemplateRequest {
              '''),
              block('''
                  let (default_output_root, output_warning) = match ensure_default_output_root(&app) {
                      Ok(path) => (path.display().to_string(), None),
                      Err(error) => (String::new(), Some(error)),
                  };
                  let message = match output_warning {
                      Some(warning) => format!(
                          "{message} Стандартная папка готовых документов не создана: {warning}. Выберите папку вручную."
                      ),
                      None => message,
                  };
                  Ok(FirstRunStateResponse {
                      has_user_buttons,
                      pack,
                      message,
                      default_output_root,
                  })
              }

              #[cfg(test)]
              mod default_output_root_tests {
                  use super::*;

                  #[test]
                  fn creates_default_output_root_idempotently() {
                      let desktop = std::env::temp_dir().join(format!(
                          "dkk-default-output-root-{}",
                          Uuid::new_v4()
                      ));
                      let expected = desktop.join(DEFAULT_OUTPUT_FOLDER_NAME);
                      let first = ensure_default_output_root_under(&desktop).unwrap();
                      let second = ensure_default_output_root_under(&desktop).unwrap();
                      assert_eq!(first, expected);
                      assert_eq!(second, expected);
                      assert!(expected.is_dir());
                      let _ = std::fs::remove_dir_all(desktop);
                  }
              }

              #[derive(Debug, Deserialize)]
              struct AnalyzeTemplateRequest {
              ''')
          )
          replace_once(
              rust_path,
              block('''
                  first_run_state(state)
              }

              #[derive(Debug, Deserialize)]
              struct ProductAccessRequest {
              '''),
              block('''
                  first_run_state(state, app)
              }

              #[derive(Debug, Deserialize)]
              struct ProductAccessRequest {
              ''')
          )

          replace_once(
              'src/lib/types.ts',
              block('''
              export interface FirstRunStateResponse {
                pack: DocumentPack;
                has_user_buttons: boolean;
                message: string;
              }
              '''),
              block('''
              export interface FirstRunStateResponse {
                pack: DocumentPack;
                has_user_buttons: boolean;
                message: string;
                default_output_root: string;
              }
              ''')
          )

          app_path = 'src/App.tsx'
          replace_once(
              app_path,
              "        const res = await firstRunState();\n        if (!alive) return;\n        if (res?.pack?.documents?.length) {",
              "        const res = await firstRunState();\n        if (!alive) return;\n        const defaultOutputRoot = res?.default_output_root?.trim();\n        if (defaultOutputRoot) {\n          setOutputRoot((current) => current.trim() || defaultOutputRoot);\n        }\n        if (res?.pack?.documents?.length) {"
          )
          replace_once(
              app_path,
              "  async function chooseExistingOutputPolicy(documentIds: string[]) {\n    const labels = documentIds.map(id => documents.find(document => document.id === id)?.button_label).filter((value): value is string => Boolean(value));\n    return chooseExistingOutputPolicyFlow({\n      outputRoot, folderParts, labels,",
              "  async function resolveOutputRootForGeneration(): Promise<string> {\n    const configured = outputRoot.trim();\n    if (configured) return configured;\n    const startup = await run('first_run_state', () => firstRunState());\n    const fallback = startup?.default_output_root?.trim() ?? '';\n    if (!fallback) {\n      setFolderNamingConfirmed(false);\n      setStatus('Не удалось создать стандартную папку «Выписанные пациенты». Выберите папку готовых документов вручную.');\n      return '';\n    }\n    setOutputRoot(fallback);\n    return fallback;\n  }\n\n  async function chooseExistingOutputPolicy(documentIds: string[], resolvedOutputRoot = outputRoot.trim()) {\n    const labels = documentIds.map(id => documents.find(document => document.id === id)?.button_label).filter((value): value is string => Boolean(value));\n    return chooseExistingOutputPolicyFlow({\n      outputRoot: resolvedOutputRoot, folderParts, labels,"
          )
          replace_once(
              app_path,
              "  async function performGenerateSelectedDocuments(documentIds: string[]) {\n    const existingOutputPolicy = await chooseExistingOutputPolicy(documentIds);\n    if (!existingOutputPolicy) return;\n    const explicitOutputRoot = outputRoot.trim();\n    if (!explicitOutputRoot) return;\n    const res = await run('render_docx_batch', () => renderDocxBatch(documentIds, explicitOutputRoot, folderParts, true, existingOutputPolicy));",
              "  async function performGenerateSelectedDocuments(documentIds: string[]) {\n    const explicitOutputRoot = await resolveOutputRootForGeneration();\n    if (!explicitOutputRoot) return;\n    const existingOutputPolicy = await chooseExistingOutputPolicy(documentIds, explicitOutputRoot);\n    if (!existingOutputPolicy) return;\n    const res = await run('render_docx_batch', () => renderDocxBatch(documentIds, explicitOutputRoot, folderParts, true, existingOutputPolicy));"
          )

          test_path = 'src/App.test.tsx'
          replace_once(
              test_path,
              "    if (name === 'first_run_state') return { pack: { pack_id: 'default', name: 'Набор', documents: [] }, has_user_buttons: false, message: 'Создайте свои кнопки' } as never;\n",
              "    if (name === 'first_run_state') return { pack: { pack_id: 'default', name: 'Набор', documents: [] }, has_user_buttons: false, message: 'Создайте свои кнопки', default_output_root: 'C:/Users/Test/Desktop/Выписанные пациенты' } as never;\n"
          )
          replace_once(
              test_path,
              "  afterEach(() => {\n    vi.restoreAllMocks();\n    __resetInvokeForTests();\n  });\n\n  it('starts without built-in examples and shows one clear create-buttons action', async () => {",
              "  afterEach(() => {\n    vi.restoreAllMocks();\n    __resetInvokeForTests();\n    localStorage.clear();\n  });\n\n  it('adopts the backend-created default output folder on first run', async () => {\n    installTemplateMock(false);\n    render(<App />);\n    await waitFor(() => expect(localStorage.getItem('dokkomplekt.output-root.v1')).toBe('C:/Users/Test/Desktop/Выписанные пациенты'));\n  });\n\n  it('starts without built-in examples and shows one clear create-buttons action', async () => {"
          )
          PY

          git checkout origin/main -- .github/workflows/source-provenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/subsystems/document_commands.rs src/App.tsx src/App.test.tsx src/lib/types.ts .github/workflows/source-provenance.yml
          git diff --cached --check
          git commit -m "fix: restore canonical default output folder"
          git push origin "HEAD:${BRANCH}"
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
