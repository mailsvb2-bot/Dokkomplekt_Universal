name: Apply simple button creation fix

on:
  push:
    branches:
      - agent/fix-simple-button-creation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply focused product fix
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one match, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src-tauri/src/subsystems/document_commands.rs",
              '''    let message = if has_user_buttons {
                  "Рабочий комплект загружен. Можно положить первичный документ в папку автоматизации."
              } else {
                  "Первоначальная настройка: выберите процесс, загрузите пустой шаблон и 3–10 заполненных примеров, проверьте предложенную карту и включите автоматизацию."
              };''',
              '''    let message = if has_user_buttons {
                  "Рабочий комплект загружен. Добавьте исходный документ и выберите нужные кнопки."
              } else {
                  "Нажмите «Создать свои кнопки», выберите DOCX/DOCM и подтвердите названия."
              };''',
          )

          replace_once(
              "src-tauri/src/subsystems/document_commands.rs",
              '''    if req.rows.iter().any(|row| row.is_static_copy) {
                  return Err("Шаблон не содержит размеченных полей {{field.id}}. Он не добавлен, чтобы примерный текст и чужие смыслы не переносились в новые документы.".into());
              }
              let incoming = create_pack_from_confirmations("incoming", "Новые шаблоны", &req.rows).pack;''',
              '''    // An ordinary DOCX/DOCM is a valid user-owned document button.
              // Without placeholders it is intentionally kept as a static copy;
              // scanner markup remains an optional enhancement, not an onboarding gate.
              let incoming = create_pack_from_confirmations("incoming", "Новые шаблоны", &req.rows).pack;''',
          )

          replace_once(
              "src/lib/api.ts",
              '''  'prepare_template_setup',
            'import_learning_example_file',''',
              '''  'prepare_template_setup',
            'import_template_file',
            'import_learning_example_file',''',
          )

          replace_once(
              "src/App.tsx",
              '''    setPendingTemplates([]);
              setDraftPopupFields([]);
              setSetupOpen(true);''',
              '''    setPendingTemplates([]);
              setDraftPopupFields([]);
              setStatus('Выберите шаблоны Word. Проверьте названия и нажмите «Создать кнопки».');
              setSetupOpen(true);''',
          )

          replace_once(
              "src/App.tsx",
              '    <div className="appRoot">',
              "    <div className={documents.length ? 'appRoot' : 'appRoot firstRunMode'}>",
          )

          replace_once(
              "src/App.tsx",
              '''        <TemplateSetupModal
                    templateText={templateText}''',
              '''        <TemplateSetupModal
                    busy={busy}
                    status={status}
                    templateText={templateText}''',
          )

          replace_once(
              "src/components/TemplateSetupModal.tsx",
              '''interface TemplateSetupModalProps {
            templateText: string;''',
              '''interface TemplateSetupModalProps {
            busy: boolean;
            status: string;
            templateText: string;''',
          )

          replace_once(
              "src/components/TemplateSetupModal.tsx",
              '''        </datalist>

                  <div className="modalActions">''',
              '''        </datalist>

                  <div className="readyMessage templateSetupStatus" role="status" aria-live="polite">
                    <i className={props.busy ? 'ti ti-loader-2' : 'ti ti-info-circle'} aria-hidden="true" />
                    <div><span>{props.status}</span></div>
                  </div>

                  <div className="modalActions">''',
          )

          replace_once(
              "src/components/TemplateSetupModal.tsx",
              '''          <button className="primaryBtn" onClick={props.onConfirm} disabled={!hasBatch && !props.templateText.trim()}>
                      {confirmLabel}
                    </button>''',
              '''          <button className="primaryBtn" onClick={props.onConfirm} disabled={props.busy || (!hasBatch && !props.templateText.trim())}>
                      {props.busy ? 'Создаём кнопки…' : confirmLabel}
                    </button>''',
          )

          css_path = ROOT / "src/styles.css"
          css = css_path.read_text(encoding="utf-8")
          marker = ".firstRunMode .clientWorkspace"
          if marker not in css:
              css += '''

          /* First launch follows the proven Dokkomplekt rule: one clear action,
             then the working document flow appears after buttons are created. */
          .firstRunMode .clientGrid {
            grid-template-columns: minmax(320px, 760px);
            justify-content: center;
          }

          .firstRunMode .clientWorkspace,
          .firstRunMode .headerSettings {
            display: none;
          }

          .firstRunMode .packagePanel {
            width: 100%;
            max-width: 760px;
          }

          .templateSetupStatus {
            margin-top: 16px;
          }
          '''
              css_path.write_text(css, encoding="utf-8")

          replace_once(
              "tests/test_v18_0_3_regression_contracts.py",
              '''class VersionContractTest(unittest.TestCase):''',
              '''class SimpleButtonCreationContractTest(unittest.TestCase):
              def test_real_tauri_command_accepts_ordinary_docx(self) -> None:
                  backend = text("src-tauri/src/subsystems/document_commands.rs")
                  start = backend.index("fn confirm_template_setup(")
                  end = backend.index("struct RenameDocumentButtonRequest", start)
                  command = backend[start:end]
                  self.assertNotIn("any(|row| row.is_static_copy)", command)
                  self.assertIn("create_pack_from_confirmations", command)

              def test_first_run_is_focused_and_modal_reports_backend_errors(self) -> None:
                  app = text("src/App.tsx")
                  modal = text("src/components/TemplateSetupModal.tsx")
                  self.assertIn("appRoot firstRunMode", app)
                  self.assertIn("status={status}", app)
                  self.assertIn('role="status"', modal)
                  self.assertIn("Создаём кнопки…", modal)

              def test_frontend_command_registry_includes_template_import(self) -> None:
                  api = text("src/lib/api.ts")
                  registry = api[api.index("export const rustCommandNames"):]
                  self.assertIn("'import_template_file'", registry)


          class VersionContractTest(unittest.TestCase):''',
          )

          changed_paths = {
              "src-tauri/src/subsystems/document_commands.rs",
              "src/lib/api.ts",
              "src/App.tsx",
              "src/components/TemplateSetupModal.tsx",
              "src/styles.css",
              "tests/test_v18_0_3_regression_contracts.py",
          }

          # Keep any repository SHA-256 source manifest synchronized without
          # guessing its filename. Only exact "<hash>  <path>" entries are touched.
          manifest_line = re.compile(r"^([0-9a-f]{64})  (.+)$")
          for candidate in ROOT.rglob("*"):
              if not candidate.is_file() or ".git" in candidate.parts or "node_modules" in candidate.parts:
                  continue
              try:
                  if candidate.stat().st_size > 2_000_000:
                      continue
                  raw = candidate.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              lines = raw.splitlines()
              touched = False
              for index, line in enumerate(lines):
                  match = manifest_line.fullmatch(line)
                  if not match:
                      continue
                  relative = match.group(2)
                  if relative not in changed_paths:
                      continue
                  digest = hashlib.sha256((ROOT / relative).read_bytes()).hexdigest()
                  lines[index] = f"{digest}  {relative}"
                  touched = True
              if touched:
                  candidate.write_text("\n".join(lines) + ("\n" if raw.endswith("\n") else ""), encoding="utf-8")
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          python tests/test_v18_0_3_regression_contracts.py
          npm ci
          npm run typecheck
          npm test -- src/App.test.tsx

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/apply-simple-button-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/subsystems/document_commands.rs \
                  src/lib/api.ts \
                  src/App.tsx \
                  src/components/TemplateSetupModal.tsx \
                  src/styles.css \
                  tests/test_v18_0_3_regression_contracts.py \
                  .github/workflows/apply-simple-button-fix.yml
          git add -u
          git commit -m "Fix simple document button creation"
          git push
