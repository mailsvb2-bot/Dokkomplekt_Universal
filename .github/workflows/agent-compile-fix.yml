name: Apply compile visibility fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: agent-compile-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/fix-plan-ui-postgres-maintainability'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Repair sibling-module visibility and compile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/universal_intake/archive.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "struct ExternalArchiveEntry {": "pub(super) struct ExternalArchiveEntry {",
              "    size: u64,": "    pub(super) size: u64,",
              "    link_like: bool,": "    pub(super) link_like: bool,",
              "fn prefix_layout_source(items: &mut [NormalizedLayoutItem], prefix: &str) {":
                  "pub(super) fn prefix_layout_source(items: &mut [NormalizedLayoutItem], prefix: &str) {",
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected source fragment not found: {before}")
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/universal_intake/archive.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose archive helpers to parent module"
          git push origin HEAD:agent/fix-plan-ui-postgres-maintainability
