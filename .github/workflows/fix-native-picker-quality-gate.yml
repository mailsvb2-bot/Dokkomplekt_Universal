name: Fix Native Picker Quality Gate

on:
  pull_request_target:
    types: [reopened, edited]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: ${{ github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SERVICE_ISSUE: '48'
    steps:
      - name: Mark repair start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': f"Native picker quality-gate repair run {os.environ['RUN_ID']} started."}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-native-template-picker
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Remove panic shortcuts and refresh manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/subsystems/template_picker.rs')
          lines = path.read_text(encoding='utf-8').splitlines()

          expect_indexes = [index for index, line in enumerate(lines) if '.expect("paths");' in line]
          if len(expect_indexes) != 1:
              raise SystemExit(f'expected one paths expect, found {len(expect_indexes)}')
          expect_index = expect_indexes[0]
          if not lines[expect_index - 1].rstrip().endswith('.as_bytes())'):
              raise SystemExit('unexpected parse_picker_paths call shape')
          lines[expect_index - 1] = lines[expect_index - 1] + ';'
          del lines[expect_index]

          assertion_indexes = [index for index, line in enumerate(lines) if line.strip() == 'assert_eq!(paths.len(), 2);']
          if len(assertion_indexes) != 1:
              raise SystemExit(f'expected one paths length assertion, found {len(assertion_indexes)}')
          assertion_index = assertion_indexes[0]
          lines[assertion_index:assertion_index + 3] = [
              '        assert_eq!(paths.as_ref().map(Vec::len), Ok(2));',
              '        assert!(paths.as_ref().is_ok_and(|items| {',
              '            items.first().is_some_and(|path| path.ends_with("Акт работ.docx"))',
              '                && items.get(1).is_some_and(|path| path.ends_with("Счёт.docm"))',
              '        }));',
          ]

          error_indexes = [index for index, line in enumerate(lines) if '.expect_err("must reject")' in line]
          if len(error_indexes) != 1:
              raise SystemExit(f'expected one rejection expect, found {len(error_indexes)}')
          error_index = error_indexes[0]
          if lines[error_index + 1].strip() != 'assert!(error.contains("неподдерживаемый"));':
              raise SystemExit('unexpected rejection assertion shape')
          lines[error_index:error_index + 2] = [
              '        let result = parse_picker_paths(b"C:/tmp/template.pdf\\n");',
              '        assert!(result.as_ref().is_err_and(|error| error.contains("неподдерживаемый")));',
          ]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
      - name: Verify repaired quality-gate contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q tests/test_source_manifest_integrity.py tests/test_v18_1_2_rust_panic_audit.py tests/test_v18_4_4_native_template_picker.py
      - name: Publish repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/subsystems/template_picker.rs SOURCE_MANIFEST_SHA256.txt
          git commit -m "Remove native picker panic shortcuts"
          git push origin HEAD:agent/fix-native-template-picker
      - name: Mark repair failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': f"Native picker quality-gate repair run {os.environ['RUN_ID']} failed; inspect the Actions log."}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
