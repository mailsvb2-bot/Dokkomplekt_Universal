name: Trusted format standalone license server

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trusted-format-standalone-license-server
  cancel-in-progress: true

jobs:
  format-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-license-public-url'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-license-public-url
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Format excluded crate, verify and publish
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          git rm .github/patches/license-public-url-format-v2.trigger
          cargo +1.97.1 fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml
          cargo +1.97.1 generate-lockfile --manifest-path crates/dokkomplekt-license-server/Cargo.toml
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt crates/dokkomplekt-license-server
          cargo +1.97.1 fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml -- --check
          cargo +1.97.1 test --locked --manifest-path crates/dokkomplekt-license-server/Cargo.toml -- --test-threads=1
          python -m pytest -q \
            tests/test_v18_0_7_security_update_popup_license_contracts.py \
            tests/test_v18_3_0_license_database_transport.py \
            tests/test_source_manifest_integrity.py \
            tests/test_source_fingerprint.py
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Format standalone license-server policy'
          git push --force origin HEAD:agent/harden-license-public-url
