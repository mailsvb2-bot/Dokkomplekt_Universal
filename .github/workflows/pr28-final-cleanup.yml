name: PR28 Final Cleanup

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/pr28-final-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: pr28-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-verify-publish:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-security-privacy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux, Python and audit dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          python -m pip install -r requirements-dev.txt
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2
      - name: Remove one-use transport and fix commercial gate
        shell: python
        run: |
          from pathlib import Path
          import shutil

          verifier = Path('scripts/verify_source_manifest.py')
          text = verifier.read_text(encoding='utf-8')
          transport = 'from pr28_followup import apply_followup\n\napply_followup()\n\n'
          if transport in text:
              text = text.replace(transport, '', 1)
          verifier.write_text(text, encoding='utf-8')

          memory = Path('crates/dokkomplekt-license-server/src/memory_store.rs')
          text = memory.read_text(encoding='utf-8')
          text = text.replace(
              '    PaymentEventStatus, PaymentEventWriteOutcome, PaymentProvider, StoreError,\n',
              '    PaymentEventWriteOutcome, PaymentProvider, StoreError,\n',
              1,
          )
          marker = 'use uuid::Uuid;\n'
          test_import = '\n#[cfg(test)]\nuse crate::storage::PaymentEventStatus;\n'
          if test_import not in text:
              if marker not in text:
                  raise SystemExit('uuid import marker was not found')
              text = text.replace(marker, marker + test_import, 1)

          test_name = '    fn concurrent_legacy_recovery_produces_exactly_one_winner() {'
          start = text.index(test_name)
          end = text.index('\n    #[test]', start + len(test_name))
          block = text[start:end]
          if '        let winners = (0..16)\n' not in block:
              raise SystemExit('concurrent recovery iterator start was not found')
          block = block.replace(
              '        let winners = (0..16)\n',
              '        let handles = (0..16)\n',
              1,
          )
          join_tail = (
              '            })\n'
              '            .map(|thread| thread.join().unwrap())\n'
          )
          collected_tail = (
              '            })\n'
              '            .collect::<Vec<_>>();\n'
              '        let winners = handles\n'
              '            .into_iter()\n'
              '            .map(|thread| thread.join().unwrap())\n'
          )
          if join_tail not in block:
              raise SystemExit('concurrent recovery join tail was not found')
          block = block.replace(join_tail, collected_tail, 1)
          text = text[:start] + block + text[end:]
          memory.write_text(text, encoding='utf-8')

          Path('scripts/pr28_followup.py').unlink(missing_ok=True)
          shutil.rmtree('.github/pr28-followup', ignore_errors=True)
      - name: Format every Rust workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          cargo fmt --manifest-path crates/dokkomplekt-license-server/Cargo.toml
          cargo fmt --manifest-path crates/dokkomplekt-license-python/Cargo.toml
      - name: Regenerate source manifest before gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_source_manifest.py --candidate /tmp/source-manifest.txt || true
          test -s /tmp/source-manifest.txt
          cp /tmp/source-manifest.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
      - name: Run official Rust release gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/prepackage_rust_gate.sh
      - name: Run complete Python contract wall
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/run_python_contracts_sharded.py --report verification/ci/python-contracts.json
          python scripts/verify_starter_content_packs.py
          python scripts/check_reference_data_freshness.py
          python scripts/audit_rust_production_panics.py
          python scripts/static_quality_gate.py --source-only
      - name: Remove cleanup workflow and finalize manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/pr28-final-cleanup.yml
          python scripts/verify_source_manifest.py --candidate /tmp/source-manifest-final.txt || true
          test -s /tmp/source-manifest-final.txt
          cp /tmp/source-manifest-final.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          test ! -e scripts/pr28_followup.py
          test ! -e .github/pr28-followup
          git diff --check
      - name: Publish clean product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize commercial gates and remove one-use transport'
          git push origin HEAD:agent/fix-critical-security-privacy
