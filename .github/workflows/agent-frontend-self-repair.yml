name: Diagnose frontend batch-plan scenario

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-diagnostic-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-plan-ui-postgres-maintainability'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose scenario without publishing changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          source = app.read_text(encoding='utf-8')
          source = source.replace(
              "import { ensurePopupField } from './components/PopupFieldEditor';",
              "import { ensurePopupField, newPopupField } from './components/PopupFieldEditor';",
              1,
          )
          app.write_text(source, encoding='utf-8')

          test = Path('src/App.scenarios.test.tsx')
          source = test.read_text(encoding='utf-8')
          needle = "    await screen.findByDisplayValue('7701234567');"
          replacement = """    await waitFor(() => expect(calls.some((c) => c.command === 'get_workflow_plan_batch')).toBe(true));
    console.log('FINAL_PLAN_CALLS', JSON.stringify(calls.filter((c) => c.command.includes('workflow_plan'))));
    console.log('REVIEW_STAGE_TEXT', document.querySelector('.reviewStage')?.textContent ?? 'NO_REVIEW_STAGE');
    await screen.findByDisplayValue('7701234567');"""
          if needle not in source:
              raise SystemExit('scenario assertion not found')
          test.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY
          npm run typecheck
          npm run test -- --reporter=verbose
