[package]
name = "dokkomplekt-license-server"
version = "18.4.4"
edition = "2021"
rust-version = "1.97.1"
license = "Proprietary"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
dokkomplekt-license-core = { path = "../dokkomplekt-license-core" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = ">=0.3.47, <0.4", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.postgres]
version = "0.19"
features = ["with-time-0_3", "with-uuid-1"]
