name: PR178 review fix finalizer
on:
  push:
    branches:
      - ops/pr178-review-fix-20260908
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply review fixes and validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_head='c16d9de0a05f141d0f34102a06366acdd6250da3'
          test "$(git rev-parse HEAD)" = "$expected_head"
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/subsystems/profile_sources.rs')
          s = p.read_text(encoding='utf-8')
          old = '''const MEDICAL_DIARY_PROGRAM_TEMPLATE_TEXT: &str =
              dokkomplekt_core::MEDICAL_PROGRAM_CALENDAR_DIARY_TEMPLATE_TEXT;
          '''
          new = '''const MEDICAL_DIARY_PROGRAM_TEMPLATE_TEXT: &str =
              dokkomplekt_core::MEDICAL_PROGRAM_CALENDAR_DIARY_TEMPLATE_TEXT;
          static MEDICAL_DIARY_TEMPLATE_LOCK: std::sync::OnceLock<std::sync::Mutex<()>> =
              std::sync::OnceLock::new();
          '''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    std::fs::create_dir_all(&root)
              .map_err(|error| format!("Не удалось подготовить локальный генератор дневников: {error}"))?;
              let path = root.join(format!(
          '''
          new = '''    std::fs::create_dir_all(&root)
              .map_err(|error| format!("Не удалось подготовить локальный генератор дневников: {error}"))?;
              let _template_guard = MEDICAL_DIARY_TEMPLATE_LOCK
                  .get_or_init(|| std::sync::Mutex::new(()))
                  .lock()
                  .map_err(|_| "Блокировка локального шаблона дневников повреждена.".to_string())?;
              let path = root.join(format!(
          '''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    Ok(PathBuf::from(&document.template_path))
          '''
          new = '''    resolve_user_path(app, &document.template_path)
          '''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_donor_diary_output_parity.py')
          s = t.read_text(encoding='utf-8')
          needle = '''    assert "medical_diary_template_override(&app, &base_case, document)?" in manual
              assert "TemplateSnapshot::capture(" in automation
          '''
          repl = '''    assert "medical_diary_template_override(&app, &base_case, document)?" in manual
              assert "TemplateSnapshot::capture(" in automation
              assert "MEDICAL_DIARY_TEMPLATE_LOCK" in profile_sources
              assert ".get_or_init(|| std::sync::Mutex::new(()))" in profile_sources
              assert "resolve_user_path(app, &document.template_path)" in profile_sources
              assert "Ok(PathBuf::from(&document.template_path))" not in profile_sources
          '''
          assert needle in s
          t.write_text(s.replace(needle, repl, 1), encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          python -m pytest -q tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py tests/test_learning_privacy_retention_contract.py
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py tests/test_learning_privacy_retention_contract.py tests/test_source_manifest_integrity.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          test "$(wc -l < src-tauri/src/subsystems/automation_runtime.rs)" -lt 3000
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add SOURCE_MANIFEST_SHA256.txt src-tauri/src/subsystems/profile_sources.rs tests/test_donor_diary_output_parity.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Fix template path and diary cache races'
          git push origin HEAD:fix/real-user-workflow-20260907
