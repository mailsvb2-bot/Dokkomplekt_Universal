name: Native MSG Migration

on:
  push:
    branches: [agent/native-msg-parser]
    paths:
      - '.github/workflows/native-msg-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/native-msg-parser
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply native MSG migration and pin dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          intake_path = Path('src-tauri/src/universal_intake.rs')
          intake = intake_path.read_text(encoding='utf-8')

          if 'mod msg;' not in intake:
              intake = intake.replace('mod archive;\n', 'mod archive;\nmod msg;\n', 1)
          intake = intake.replace('    let msgconvert = command_available("msgconvert");\n', '')
          old_capability = '        capability("MSG", &["msg"], msgconvert, "msgconvert", if msgconvert { "Готово." } else { "Нужен msgconvert/libemail-outlook-perl либо предварительный экспорт в EML." }),'
          new_capability = '        capability("MSG", &["msg"], true, "встроенно", "Outlook MSG читается нативно в Rust без внешнего конвертера; поддерживаемые вложения проходят тот же безопасный recursive intake."),'
          if old_capability in intake:
              intake = intake.replace(old_capability, new_capability, 1)
          elif new_capability not in intake:
              raise SystemExit('expected MSG capability contract not found')
          intake = intake.replace('        ("msgconvert", "чтение Outlook MSG"),\n', '')
          intake = intake.replace('        "msg" => normalize_msg(path, workspace, depth)?,', '        "msg" => msg::normalize_msg(path, workspace, depth)?,')

          pattern = re.compile(
              r'\nfn normalize_msg\(path: &Path, workspace: &Path, depth: usize\) -> Result<NormalizedSource, String> \{.*?\n\}\n\n(?=fn normalize_office_via_libreoffice)',
              re.S,
          )
          intake, count = pattern.subn('\n', intake, count=1)
          if count != 1 and 'run_command_in(\n        &output_dir,\n        "msgconvert"' in intake:
              raise SystemExit('failed to remove legacy external normalize_msg implementation')
          intake_path.write_text(intake, encoding='utf-8')

          cargo_path = Path('src-tauri/Cargo.toml')
          cargo = cargo_path.read_text(encoding='utf-8')
          if 'msg_parser = "=0.3.6"' not in cargo:
              cargo = cargo.replace('quick-xml = "0.41.0"\n', 'quick-xml = "0.41.0"\nmsg_parser = "=0.3.6"\n', 1)
          cargo_path.write_text(cargo, encoding='utf-8')

          kit_path = Path('scripts/build_windows_runtime_kit.py')
          kit = kit_path.read_text(encoding='utf-8')
          kit = kit.replace('PRODUCTION_REQUIRED_TOOLS = set(REQUIRED_TOOLS) | {"msgconvert"}', 'PRODUCTION_REQUIRED_TOOLS = set(REQUIRED_TOOLS)')
          kit_path.write_text(kit, encoding='utf-8')

          msg_path = Path('src-tauri/src/universal_intake/msg.rs')
          msg = msg_path.read_text(encoding='utf-8')
          msg = msg.replace('.map(|rtf| rtf_to_text(&rtf))', '.map(|rtf| rtf_to_text(rtf.as_bytes()))')
          msg_path.write_text(msg, encoding='utf-8')
          PY
      - name: Add immutable real Outlook MSG fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/fixtures/outlook-msg
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib

          url = 'https://raw.githubusercontent.com/marirs/msg-parser-rs/a5579ed5d1379c794392f4e01891f35f9d25aa8e/data/ascii.msg'
          data = urlopen(url, timeout=30).read()
          if len(data) != 9728:
              raise SystemExit(f'unexpected ascii.msg size: {len(data)}')
          git_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if git_blob != 'ded03f131eb0fc0774da77ccd19d687cf36ac6f5':
              raise SystemExit(f'unexpected ascii.msg git blob: {git_blob}')
          Path('tests/fixtures/outlook-msg/ascii.msg').write_bytes(data)
          Path('tests/fixtures/outlook-msg/README.md').write_text(
              '# Outlook MSG regression fixture\n\n'
              '- Upstream: `marirs/msg-parser-rs`\n'
              '- Upstream commit: `a5579ed5d1379c794392f4e01891f35f9d25aa8e`\n'
              '- Upstream path: `data/ascii.msg`\n'
              '- Git blob SHA-1: `ded03f131eb0fc0774da77ccd19d687cf36ac6f5`\n'
              '- Size: `9728` bytes\n'
              '- License of upstream project: MIT\n\n'
              'This real OLE Outlook file is used only to prove that Dokkomplekt parses `.msg` natively without `msgconvert`, Perl, or a mocked converter.\n',
              encoding='utf-8',
          )
          PY
      - name: Update lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p msg_parser --precise 0.3.6 || cargo check -p dokkomplekt-tauri --tests
          cargo fmt --all
      - name: Prove external MSG converter is gone from production path
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'msgconvert' src-tauri/src/universal_intake.rs; then
            echo 'legacy msgconvert reference remains in native intake' >&2
            exit 1
          fi
          if grep -n 'PRODUCTION_REQUIRED_TOOLS.*msgconvert' scripts/build_windows_runtime_kit.py; then
            echo 'runtime kit still requires msgconvert' >&2
            exit 1
          fi
          grep -n 'msg_parser = "=0.3.6"' src-tauri/Cargo.toml
          test -s tests/fixtures/outlook-msg/ascii.msg
      - name: Compile and run native MSG regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p dokkomplekt-tauri --tests --locked
          cargo test -p dokkomplekt-tauri --locked universal_intake::msg::tests -- --nocapture
          cargo fmt --all -- --check
      - name: Commit verified migration to working branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src-tauri/Cargo.toml src-tauri/src/universal_intake.rs src-tauri/src/universal_intake/msg.rs scripts/build_windows_runtime_kit.py tests/fixtures/outlook-msg/ascii.msg tests/fixtures/outlook-msg/README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Parse Outlook MSG natively in Rust'
          git push origin HEAD:agent/native-msg-parser
