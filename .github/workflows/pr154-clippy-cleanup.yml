name: PR154 clippy cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 154 && github.event.pull_request.head.ref == 'agent/exhaustive-donor-parity-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/exhaustive-donor-parity-20260819
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact clippy cleanups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/subsystems/watcher_commands.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    Ok(PathBuf::from(&owner.executable) == current\n        && current_sha256.eq_ignore_ascii_case(&owner.executable_sha256))\n'''
          new = '''    Ok(Path::new(&owner.executable) == current.as_path()\n        && current_sha256.eq_ignore_ascii_case(&owner.executable_sha256))\n'''
          if old not in s:
              raise SystemExit('cmp_owned pattern not found exactly once')
          s = s.replace(old, new, 1)
          old = '''                    if active == 0 {\n                        if handoff_watcher_to_successor(&app, &latest_owner).is_ok() {\n                            if terminate_app_when_disabled {\n                                app.exit(0);\n                            }\n                            return;\n                        }\n                    }\n'''
          new = '''                    if active == 0\n                        && handoff_watcher_to_successor(&app, &latest_owner).is_ok()\n                    {\n                        if terminate_app_when_disabled {\n                            app.exit(0);\n                        }\n                        return;\n                    }\n'''
          if old not in s:
              raise SystemExit('collapsible_if pattern not found exactly once')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
      - name: Targeted donor lifecycle contracts
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pytest -q tests/test_donor_patient_folder_watcher_parity.py tests/test_v18_0_6_scanner_watcher_print_contracts.py
          python scripts/static_quality_gate.py --source-only
      - name: Regenerate and verify source manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.verify.txt
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.verify.txt
      - name: Commit clean final tree and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr154-clippy-cleanup.yml
          git add src-tauri/src/subsystems/watcher_commands.rs SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          git config user.name 'BusinesMetro'
          git config user.email 'mailsvb2@gmail.com'
          git commit -m 'fix: satisfy canonical Rust clippy gate for watcher handoff'
          git push origin HEAD:agent/exhaustive-donor-parity-20260819
