name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest matches tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Keep profile dictionaries out of neutral UI scenario
        if: github.head_ref == 'ui/client-first-neutral'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.scenarios.test.tsx')
          text = path.read_text(encoding='utf-8')
          block = """    // dictionary search -> icd10_suggest, chip shown
    fireEvent.change(screen.getByPlaceholderText('Введите код или значение'), { target: { value: 'A-101' } });
    await click('Найти');
    await screen.findByRole('button', { name: /A-101 — Типовое значение/ });
    expect(parsePayload(calls, 'icd10_suggest')).toMatchObject({ query: 'A-101' });

"""
          if text.count(block) != 1:
              raise SystemExit(f'expected one profile-dictionary block, found {text.count(block)}')
          text = text.replace(block, "    // Profile-specific dictionaries are tested separately and appear only when a template requests them.\n\n", 1)
          old = "const internalOrProfileOnly = new Set(['get_diary_plan',"
          new = "const internalOrProfileOnly = new Set(['icd10_suggest', 'get_diary_plan',"
          if text.count(old) != 1:
              raise SystemExit(f'profile-only command set anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git show origin/main:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep profile dictionaries out of neutral UI scenario'
          git push origin HEAD:ui/client-first-neutral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Upload source-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-candidate
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
