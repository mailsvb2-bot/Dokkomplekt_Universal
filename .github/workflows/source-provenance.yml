name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Install Linux Tauri compile dependencies
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Integrate remaining predecessor contracts atomically
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/finalize_predecessor_parity.py || exit 0

          # Bring only the six canonical product owners from the previously
          # audited salvage branch. Exclude its stale source manifest and history.
          git fetch origin agent/exhaustive-donor-parity-20260818
          git diff b5847f118512b1fb9d08caf7cfc1e28bf106d591..665e467a514f5500e2944def25e1fcb51bd7a8d9 -- \
            crates/dokkomplekt-core/src/document_generation.rs \
            crates/dokkomplekt-core/src/domains/medical_semantics.rs \
            crates/dokkomplekt-core/src/field_registry.rs \
            crates/dokkomplekt-core/src/source_parser.rs \
            crates/dokkomplekt-core/src/template_intelligence.rs \
            crates/dokkomplekt-core/src/validators.rs > /tmp/pr153-salvage.patch
          git apply --3way /tmp/pr153-salvage.patch
          python scripts/finalize_predecessor_parity.py
          cargo fmt --all

          npm ci
          npm run typecheck
          npm test -- --run src/components/PrintPreferencesControl.test.tsx
          cargo test -p dokkomplekt-core --test donor_labs_legacy_parity
          cargo test -p dokkomplekt-core --test donor_exhaustive_parity
          cargo test -p dokkomplekt-core donor_salvage
          cargo check --workspace --all-targets

          rm scripts/finalize_predecessor_parity.py
          git show origin/main:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json || true
          test -s verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          rm -f verification/ci/SOURCE_MANIFEST_SHA256.generated.txt verification/ci/source-manifest-report.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete predecessor donor parity closure"
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || { echo "Expected ${GITHUB_SHA}, got $actual" >&2; exit 1; }
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py --output verification/ci/Dokkomplekt_Universal-source.zip --top-level Dokkomplekt_Universal --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat verification/ci/source-manifest-report.json
          echo "SOURCE_MANIFEST_SHA256.txt is stale." >&2
          exit 1
