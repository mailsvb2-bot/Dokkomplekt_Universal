name: Trusted apply installed generation command

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trusted-installed-generation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/add-installed-generation-command' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/add-installed-generation-command
          fetch-depth: 0
      - id: gate
        name: Detect trusted trigger
        shell: bash
        run: |
          if [[ -f .github/ci-sync/installed-generation.trigger ]]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Verified product head contains no applicator trigger.'
          fi
      - if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: steps.gate.outputs.apply == 'true'
        name: Install pinned Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - if: steps.gate.outputs.apply == 'true'
        name: Apply and verify exact product tree
        shell: bash
        run: |
          set -euo pipefail
          applicator="$RUNNER_TEMP/apply_installed_generation_command.py"
          git show origin/main:.github/scripts/apply_installed_generation_command.py > "$applicator"
          python "$applicator"
      - if: steps.gate.outputs.apply == 'true'
        name: Publish verified product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add installed application generation and print command'
          echo "PRODUCT_TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          git push --force origin HEAD:agent/add-installed-generation-command
