name: macOS Build Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-publication-validator:
    name: Workspace publication crash consistency validator
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/harden-workspace-publication'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-workspace-publication
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply workspace publication hardening
        run: python .github/patches/agent-workspace-publication.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Run workspace hygiene regressions
        run: cargo test -p dokkomplekt-tauri workspace_hygiene::tests -- --nocapture
      - name: Run workspace publication source contract
        run: python -m pytest -q tests/test_v18_4_8_workspace_publication.py
      - name: Compile all Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests
      - name: Clippy Tauri tests
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/workspace-publication-clippy.log
          set +e
          cargo clippy -p dokkomplekt-tauri --tests -- -D warnings >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            mkdir -p .github/diagnostics
            cp "$log" .github/diagnostics/workspace-publication-clippy.log
            git config user.name "openai-agent"
            git config user.email "openai-agent@users.noreply.github.com"
            git add .github/diagnostics/workspace-publication-clippy.log
            git commit -m "Record workspace publication clippy failure"
            git pull --rebase origin agent/harden-workspace-publication
            git push origin HEAD:agent/harden-workspace-publication
            exit "$rc"
          fi
      - name: Run source architecture gate
        run: python scripts/static_quality_gate.py --source-only
      - name: Check patch whitespace
        run: git diff --check
      - name: Publish validated product changes and self-clean validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main agent/harden-workspace-publication
          git checkout origin/main -- .github/workflows/macos-smoke.yml
          rm -f .github/patches/agent-workspace-publication.py
          rm -f .github/diagnostics/workspace-publication-clippy.log
          git add -A
          git commit -m "Harden workspace archive publication"
          git pull --rebase origin agent/harden-workspace-publication
          git push origin HEAD:agent/harden-workspace-publication

  macos-build-smoke:
    name: macOS app and DMG build smoke
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Rust formatting and macOS compilation
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
      - name: Check and test frontend
        run: |
          npm run typecheck
          npm run test
          npm run build
      - name: Build native macOS application and DMG
        run: |
          set -o pipefail
          npx tauri build --bundles app,dmg 2>&1 | tee macos-tauri-build.log
      - name: Validate application bundle structure and signature envelope
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path" && test -d "$app_path"
          test -n "$dmg_path" && test -f "$dmg_path"
          plutil -lint "$app_path/Contents/Info.plist"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          test -x "$app_path/Contents/MacOS/$executable_name"
          signature_state="unsigned-preview"
          signature_details="$(codesign --display --verbose=4 "$app_path" 2>&1 || true)"
          if grep -q '^Authority=' <<<"$signature_details"; then
            codesign --verify --deep --strict "$app_path"
            signature_state="verified-identity-envelope"
          elif grep -q '^Signature=adhoc$' <<<"$signature_details"; then
            signature_state="ad-hoc-preview"
          elif grep -q 'code object is not signed at all' <<<"$signature_details"; then
            signature_state="unsigned-preview"
          elif [[ -n "$signature_details" ]]; then
            printf 'Unexpected codesign state:\n%s\n' "$signature_details" >&2
            exit 1
          fi
          hdiutil verify "$dmg_path"
          printf 'app=%s\ndmg=%s\nsignature=%s\n' "$app_path" "$dmg_path" "$signature_state" > macos-bundle-evidence.txt
      - name: Upload macOS smoke evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: macos-build-smoke-evidence
          path: |
            macos-tauri-build.log
            macos-bundle-evidence.txt
            target/release/bundle/macos/**
            target/release/bundle/dmg/**
          if-no-files-found: warn
