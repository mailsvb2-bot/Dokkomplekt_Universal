name: E2 Learning Pairs Apply Once

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]
    paths: [.github/workflows/e2-learning-pairs-apply-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply matched Source to Correct Output learning contract
        shell: python
        run: |
          from pathlib import Path
          import re

          handler = Path('src/lib/pendingTemplateIntelligence.ts')
          text = handler.read_text(encoding='utf-8')
          marker = "export function createPendingTemplateIntelligenceHandlers(context: PendingTemplateIntelligenceContext) {"
          helper = '''export interface TemplateLearningPair {\n  source: File;\n  completed: File;\n}\n\nexport function sourceEvidencedLearningFields<T extends { source_matches: string[] }>(fields: T[]): T[] {\n  return fields.filter((field) => field.source_matches.some((value) => value.trim().length > 0));\n}\n\n'''
          if 'sourceEvidencedLearningFields' not in text:
              if marker not in text:
                  raise SystemExit('pending handler marker not found')
              text = text.replace(marker, helper + marker, 1)

          replacement = '''  async function learnPendingTemplateFromExamples(documentId: string, pairs: TemplateLearningPair[]) {\n    const current = context.pendingTemplates.find((item) => item.document_id === documentId);\n    if (!current) return;\n    if (pairs.length < 3 || pairs.length > 10) {\n      context.setStatus('Для обучения подготовьте от 3 до 10 пар: исходник → правильный готовый документ.');\n      return;\n    }\n\n    const sourceExamplePaths: string[] = [];\n    const completedExamplePaths: string[] = [];\n    for (const pair of pairs) {\n      const sourceBuffer = await readFileBytes(pair.source);\n      const importedSource = await context.run('import_learning_example_file', () =>\n        importLearningExampleFile(pair.source.name, arrayBufferToBase64(sourceBuffer)));\n      if (!importedSource) return;\n      sourceExamplePaths.push(importedSource.source_path);\n\n      const completedBuffer = await readFileBytes(pair.completed);\n      const importedCompleted = await context.run('import_learning_example_file', () =>\n        importLearningExampleFile(pair.completed.name, arrayBufferToBase64(completedBuffer)));\n      if (!importedCompleted) return;\n      completedExamplePaths.push(importedCompleted.source_path);\n    }\n\n    const learned = await context.run('learn_template_from_examples_command', () => learnTemplateFromExamples({\n      blankTemplatePath: current.template_path,\n      completedExamplePaths,\n      sourceExamplePaths,\n      defaultYear: currentDefaultYear(),\n    }));\n    if (!learned) return;\n\n    const evidencedFields = sourceEvidencedLearningFields(learned.fields);\n    if (!evidencedFields.length) {\n      context.setStatus('Пары изучены, но ни одно поле не подтверждено исходниками. Шаблон не изменён — добавьте более показательные пары или используйте ручную разметку.');\n      return;\n    }\n    const previewFields = evidencedFields\n      .slice(0, 8)\n      .map((field) => `${field.field_id} (${field.source_matches.length} совпад.; оценка ${Math.round(field.confidence * 100)}%)`)\n      .join(', ');\n    const accepted = await context.confirm({\n      title: 'Применить карту, подтверждённую примерами?',\n      message: `Парами источник → правильный результат подтверждено полей: ${evidencedFields.length}. ${previewFields}${evidencedFields.length > 8 ? '…' : ''}. Процент — только оценка приоритета, не доказательство. Будет создана новая размеченная копия; исходный Word останется неизменным.`,\n      confirmLabel: 'Применить подтверждённую карту',\n    });\n    if (!accepted) {\n      context.setStatus('Обучение отменено на этапе явного подтверждения. Исходный шаблон не изменён.');\n      return;\n    }\n\n    const outputPath = cursorMarkedTemplatePath(current.template_path, `${documentId}-learned`);\n    const applied = await context.run('apply_template_learning_map', () => applyTemplateLearningMap(\n      current.template_path,\n      outputPath,\n      evidencedFields.map((field) => ({\n        field_id: field.field_id,\n        line_index: field.line_index,\n        blank_line: field.blank_line,\n        common_prefix: field.common_prefix,\n        common_suffix: field.common_suffix,\n      })),\n    ));\n    if (!applied) return;\n    if (!applied.applied_field_ids.length) {\n      context.setStatus('Подтверждённая карта не смогла однозначно примениться к шаблону. Исходный файл не изменён.');\n      return;\n    }\n    const analyzed = await context.run('analyze_template_file', () =>\n      analyzeTemplateFile(applied.output_path, current.document_id, current.button_label));\n    if (!analyzed) return;\n    context.setPendingTemplates((previous) => previous.map((item) => item.document_id === documentId\n      ? {\n          ...item,\n          template_path: applied.output_path,\n          extracted_text: analyzed.extracted_text,\n          popup_fields: analyzed.document.popup_fields ?? item.popup_fields,\n        }\n      : item));\n    if (context.importedTemplatePath === current.template_path) context.setImportedTemplatePath(applied.output_path);\n    if (context.templateText === current.extracted_text) context.setTemplateText(analyzed.extracted_text);\n    context.setStatus(`Шаблон обучен на ${pairs.length} парах: явно подтверждено и размечено полей — ${applied.applied_field_ids.length}. Исходный Word сохранён без изменений.`);\n  }\n\n  return { markupPendingTemplate, learnPendingTemplateFromExamples };'''
          pattern = re.compile(r"  async function learnPendingTemplateFromExamples\(documentId: string, files: File\[\]\) \{.*?\n  \}\n\n  return \{ markupPendingTemplate, learnPendingTemplateFromExamples \};", re.S)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one learning handler, replaced {count}')
          handler.write_text(text, encoding='utf-8')

          modal = Path('src/components/TemplateSetupModal.tsx')
          text = modal.read_text(encoding='utf-8')
          old_prop = "  onLearnPendingTemplate(documentId: string, files: File[]): Promise<void>;"
          new_prop = "  onLearnPendingTemplate(documentId: string, pairs: Array<{ source: File; completed: File }>): Promise<void>;"
          if old_prop not in text:
              raise SystemExit('modal learning prop not found')
          text = text.replace(old_prop, new_prop, 1)

          old_state = "  const [marking, setMarking] = useState(false);"
          new_state = "  const [marking, setMarking] = useState(false);\n  const [learningSources, setLearningSources] = useState<File[]>([]);\n  const [learningOutputs, setLearningOutputs] = useState<File[]>([]);"
          if old_state not in text:
              raise SystemExit('modal marking state not found')
          text = text.replace(old_state, new_state, 1)

          effect_anchor = "  }, [activePendingId, props.pendingTemplates]);\n\n  useEffect(() => {\n    for (const item of props.pendingTemplates) {"
          effect_replacement = "  }, [activePendingId, props.pendingTemplates]);\n\n  useEffect(() => {\n    setLearningSources([]);\n    setLearningOutputs([]);\n  }, [activePending?.document_id]);\n\n  useEffect(() => {\n    for (const item of props.pendingTemplates) {"
          if effect_anchor not in text:
              raise SystemExit('modal active pending effect anchor not found')
          text = text.replace(effect_anchor, effect_replacement, 1)

          old_picker = '''                    <label className="softBtn fileBtn">\n                      <i className="ti ti-school" aria-hidden="true" /> Обучить по 3–10 примерам\n                      <input\n                        type="file"\n                        multiple\n                        accept=".docx,.docm,.pdf,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp"\n                        onChange={(event) => {\n                          const files = Array.from(event.currentTarget.files ?? []);\n                          event.currentTarget.value = '';\n                          if (files.length) void props.onLearnPendingTemplate(activePending.document_id, files);\n                        }}\n                        style={{ display: 'none' }}\n                      />\n                    </label>'''
          new_picker = '''                    <div className="templateLearningPairs">\n                      <label className="softBtn fileBtn">\n                        <i className="ti ti-file-input" aria-hidden="true" /> 1. Источники (3–10)\n                        <input\n                          type="file"\n                          multiple\n                          accept=".docx,.docm,.pdf,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp"\n                          onChange={(event) => {\n                            setLearningSources(Array.from(event.currentTarget.files ?? []));\n                            event.currentTarget.value = '';\n                          }}\n                          style={{ display: 'none' }}\n                        />\n                      </label>\n                      <label className="softBtn fileBtn">\n                        <i className="ti ti-file-check" aria-hidden="true" /> 2. Правильные результаты (3–10)\n                        <input\n                          type="file"\n                          multiple\n                          accept=".docx,.docm,.pdf,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp"\n                          onChange={(event) => {\n                            setLearningOutputs(Array.from(event.currentTarget.files ?? []));\n                            event.currentTarget.value = '';\n                          }}\n                          style={{ display: 'none' }}\n                        />\n                      </label>\n                      <button\n                        className="softBtn"\n                        type="button"\n                        disabled={learningSources.length < 3 || learningSources.length > 10 || learningSources.length !== learningOutputs.length}\n                        onClick={() => void props.onLearnPendingTemplate(\n                          activePending.document_id,\n                          learningSources.map((source, index) => ({ source, completed: learningOutputs[index] })),\n                        )}\n                      >\n                        <i className="ti ti-school" aria-hidden="true" /> Обучить на {learningSources.length} паре(ах)\n                      </button>\n                      <small className="hint">Выберите одинаковое число исходников и правильных результатов в одинаковом порядке. Программа сопоставляет каждую пару Source → Correct Output; одна высокая «уверенность» сама по себе ничего не публикует.</small>\n                    </div>'''
          if old_picker not in text:
              raise SystemExit('old learning picker not found')
          text = text.replace(old_picker, new_picker, 1)
          modal.write_text(text, encoding='utf-8')

          test = Path('src/lib/pendingTemplateIntelligence.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport { sourceEvidencedLearningFields } from './pendingTemplateIntelligence';\n\ndescribe('template learning evidence boundary', () => {\n  it('keeps low-confidence fields when matched source evidence exists', () => {\n    const fields = sourceEvidencedLearningFields([\n      { field_id: 'document.number', confidence: 0.41, source_matches: ['A-17'] },\n      { field_id: 'amount.total', confidence: 0.99, source_matches: [] },\n    ]);\n    expect(fields.map((field) => field.field_id)).toEqual(['document.number']);\n  });\n\n  it('rejects whitespace-only source evidence regardless of confidence', () => {\n    const fields = sourceEvidencedLearningFields([\n      { field_id: 'document.date', confidence: 0.99, source_matches: ['   '] },\n    ]);\n    expect(fields).toEqual([]);\n  });\n});\n""", encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted Vitest
        run: npx vitest run src/lib/pendingTemplateIntelligence.test.ts
      - name: Self-clean and commit product change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/e2-learning-pairs-apply-once.yml
          git diff --check
          git config user.name "Dokkomplekt CI"
          git config user.email "dokkomplekt-ci@users.noreply.github.com"
          git add src/lib/pendingTemplateIntelligence.ts src/components/TemplateSetupModal.tsx src/lib/pendingTemplateIntelligence.test.ts .github/workflows/e2-learning-pairs-apply-once.yml
          git commit -m "feat: require matched source-output learning pairs"
          git push origin HEAD:canon-v2/e2-template-learning-proof
