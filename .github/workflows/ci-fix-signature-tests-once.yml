name: CI Fix Signature Tests Once

on:
  push:
    branches: [fix/ci-quality-gate-20260726]

permissions:
  contents: write

jobs:
  repair-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
      - name: Align assertions with the stricter signature block titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('crates/dokkomplekt-core/src/required_blocks.rs'),
              Path('crates/dokkomplekt-core/src/created_documents.rs'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              old = 'contains("подписи")'
              new = 'contains("Подпись лечащего врача")'
              if old not in text:
                  raise SystemExit(f'expected old assertion not found in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/ci-fix-signature-tests-once.yml
      - name: Commit the focused repair and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/dokkomplekt-core/src/required_blocks.rs crates/dokkomplekt-core/src/created_documents.rs .github/workflows/ci-fix-signature-tests-once.yml
          git commit -m "test(rust): align signature assertions with strict block titles"
          git push origin HEAD:fix/ci-quality-gate-20260726
