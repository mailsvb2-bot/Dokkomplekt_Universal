name: E1 Physical Completion Receipt Recovery Once

on:
  push:
    branches: [canon-v2/e1-accounting-pipeline]

permissions:
  contents: write

concurrency:
  group: e1-physical-completion-receipt-recovery-once
  cancel-in-progress: false

jobs:
  fix-and-prove:
    if: github.repository == 'mailsvb2-bot/Dokkomplekt_Universal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover physical-output receipt proof and self-delete both probes
        shell: bash
        run: |
          set -euo pipefail
          clean_parent='ea190f743ec983382bef9e7d222e8a1341e6121c'
          failed_probe='4fd43be909dfcc40f9a22ba24b46f6c5e522d362'
          old_workflow='.github/workflows/e1-physical-completion-receipt-fix-once.yml'
          recovery_workflow='.github/workflows/e1-physical-completion-receipt-recovery-once.yml'
          publication='src-tauri/src/generation_publication.rs'
          commands='src-tauri/src/subsystems/document_commands.rs'
          receipt_contract='tests/test_e1_generation_completion_receipt_contract.py'
          installed_contract='tests/installer/windows_e1_accounting_contract.ps1'
          installed_static='tests/test_e1_windows_installed_accounting_contract.py'

          test "$(git rev-parse HEAD^)" = "$failed_probe"
          test "$(git rev-parse HEAD^^)" = "$clean_parent"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$old_workflow"
          test "$(git diff --name-only HEAD^ HEAD)" = "$recovery_workflow"
          test "$(git hash-object "$publication")" = '6bd3ff2cc2bcf4bb913771248c7fb1c598fc64f6'
          test "$(git hash-object "$commands")" = '5b4776a589391cb7124293617f579d88889ebbd7'
          test "$(git hash-object "$receipt_contract")" = '74a56a6b8e7d0b31e4bc9160ec8349c233a442bf'
          test "$(git hash-object "$installed_contract")" = 'f837b30bcfcfbef56e405231373ac7d3961dfc07'
          test "$(git hash-object "$installed_static")" = '60eabc78dc69ded9710d0ac625ba52714d36bb20'

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/e1-physical-completion-receipt-fix-once.yml').read_text()
          marker = "python3 - <<'PY'\n"
          assert source.count(marker) == 1
          patcher = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          patcher = textwrap.dedent(patcher)

          start = patcher.index("old = '''                    if let Err(error) = persist_generation_completion_receipt(&app_data, &receipt) {")
          end = patcher.index("old = '''                        let generation_completion = persist_generation_completion_receipt(app_data, &receipt);", start)
          robust_finalize = '''assert text.count("persist_generation_completion_receipt(&app_data, &receipt)") == 1
          text = text.replace(
              "persist_generation_completion_receipt(&app_data, &receipt)",
              "replay_generation_completion_receipts(app, &app_data, &receipt)",
              1,
          )
          assert text.count("повторная проверка записи не удалась") == 1
          text = text.replace(
              "повторная проверка записи не удалась",
              "повторная проверка physical-output proof не удалась",
              1,
          )

          '''
          patcher = patcher[:start] + robust_finalize + patcher[end:]

          fragile = '''assert text.count(old) == 1
          text = text.replace(old, new, 1)

          test_start = text.index('    #[test]\\n    fn committed_generation_receipt_is_non_pii_and_bound_to_output()')'''
          robust = '''assert text.count(old) == 2
          text = text.replace(old, new)

          test_start = text.index('    #[test]\\n    fn committed_generation_receipt_is_non_pii_and_bound_to_output()')'''
          assert patcher.count(fragile) == 1
          patcher = patcher.replace(fragile, robust, 1)

          exec(compile(patcher, '<recovered-physical-receipt-patcher>', 'exec'), {})
          PY

          cargo fmt --all
          git diff --check

          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cargo check --manifest-path src-tauri/Cargo.toml

          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_e1_generation_completion_receipt_contract.py \
            tests/test_e1_windows_installed_accounting_contract.py
          python scripts/static_quality_gate.py --source-only

          git rm "$old_workflow" "$recovery_workflow"
          changed_before_manifest="$(git diff HEAD --name-only | sort)"
          expected_before_manifest="$(printf '%s\n' "$old_workflow" "$recovery_workflow" "$publication" "$commands" "$receipt_contract" "$installed_contract" "$installed_static" | sort)"
          test "$changed_before_manifest" = "$expected_before_manifest"

          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git add "$publication" "$commands" "$receipt_contract" "$installed_contract" "$installed_static" SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.recheck.txt \
            --json-report /tmp/source-manifest-recheck.json
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.recheck.txt

          git config user.name 'Dokkomplekt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind completion receipts to physical outputs'
          git push origin HEAD:refs/heads/canon-v2/e1-accounting-pipeline
