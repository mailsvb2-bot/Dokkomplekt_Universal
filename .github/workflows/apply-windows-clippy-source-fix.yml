name: Apply Windows Clippy Source Fix

on:
  push:
    branches:
      - fix/ci-quality-gate-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate-20260726
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove needless Windows-only return and self-delete
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('src-tauri/src/main.rs')
          text = source.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)return text\n'
              r'(?P=indent)    \.lines\(\)\n'
              r'(?P=indent)    \.find\(\|line\| line\.contains\("MachineGuid"\)\)\n'
              r'(?P=indent)    \.and_then\(\|line\| line\.split_whitespace\(\)\.last\(\)\)\n'
              r'(?P=indent)    \.map\(str::trim\)\n'
              r'(?P=indent)    \.filter\(\|value\| !value\.is_empty\(\)\)\n'
              r'(?P=indent)    \.map\(str::to_string\);$'
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('Windows MachineGuid return block was not found exactly as Rust source')
          indent = match.group('indent')
          replacement = '\n'.join([
              f'{indent}text',
              f'{indent}    .lines()',
              f'{indent}    .find(|line| line.contains("MachineGuid"))',
              f'{indent}    .and_then(|line| line.split_whitespace().last())',
              f'{indent}    .map(str::trim)',
              f'{indent}    .filter(|value| !value.is_empty())',
              f'{indent}    .map(str::to_string)',
          ])
          corrected, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one Windows MachineGuid replacement, got {count}')
          source.write_text(corrected, encoding='utf-8')
          Path('.github/workflows/apply-windows-clippy-source-fix.yml').unlink()
          PY
      - name: Commit the source-level fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/main.rs .github/workflows/apply-windows-clippy-source-fix.yml
          git commit -m "Fix Windows-only Clippy failure at the source"
          git push origin HEAD:fix/ci-quality-gate-20260726
