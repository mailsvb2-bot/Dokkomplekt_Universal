name: One-time Rustfmt Repair

on:
  push:
    branches:
      - fix/ci-quality-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustfmt-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-gate
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply canonical rustfmt"
          git push origin HEAD:fix/ci-quality-gate
