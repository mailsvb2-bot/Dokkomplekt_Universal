name: PR178 review fixes finalizer v2
on:
  push:
    branches:
      - ops/pr178-review-fixes-finalize-20260908
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply atomic review fixes and validate
        env:
          PATCH_B64: ""
          EXPECTED_HEAD: "c16d9de0a05f141d0f34102a06366acdd6250da3"
          PATCH_SHA256: "ffe3f046a0c3099afbef8c4612248e2995f029c75a315297af7aed77f6a8f550"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/review-fixes.patch
          echo "$PATCH_SHA256  /tmp/review-fixes.patch" | sha256sum -c -
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch
          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          cargo test --manifest-path src-tauri/Cargo.toml concurrent_diary_template_creation_atomically_publishes_complete_docx -- --nocapture
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q tests/test_donor_diary_output_parity.py tests/test_donor_patient_folder_watcher_parity.py tests/test_source_manifest_integrity.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add src-tauri/src/subsystems/profile_sources.rs SOURCE_MANIFEST_SHA256.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Close template path and diary publication races'
          git push origin HEAD:fix/real-user-workflow-20260907
