name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN ONE-TIME FRONTEND SELF-REPAIR
  frontend-self-repair:
    name: One-time verified frontend self-repair
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-plan-ui-postgres-maintainability'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch product, remove transport, and verify frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          source = app.read_text(encoding='utf-8')
          old_import = "import { ensurePopupField } from './components/PopupFieldEditor';"
          new_import = "import { ensurePopupField, newPopupField } from './components/PopupFieldEditor';"
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit('expected PopupFieldEditor import not found')
              source = source.replace(old_import, new_import, 1)

          old_select = """  async function selectDocument(doc: DocumentTemplateSpec) {
    setActiveDoc(doc.id);
    setPreview(null);
    const [workflow, template] = await Promise.all([
      run('get_workflow_plan', () => getWorkflowPlan(doc.id, sickLeave)),
      run('get_document_template_text', () => getDocumentTemplateText(doc.id)),
    ]);
    if (template) setActiveTemplateText(template.template_text);
    if (!workflow) return;
    setPlan(workflow);
    setStatus(workflow.prompts.length ? `Требуется уточнить полей: ${workflow.prompts.length}.` : 'Все поля распознаны — документ готов.');
  }"""
          new_select = """  async function selectDocument(doc: DocumentTemplateSpec) {
    setActiveDoc(doc.id);
    setPreview(null);
    const finalPlanPromise = selectedDocIds.length && (sourceFileName || parsed)
      ? loadWorkflowPlan(selectedDocIds)
      : Promise.resolve(null);
    const [workflow, template, finalWorkflow] = await Promise.all([
      run('get_workflow_plan', () => getWorkflowPlan(doc.id, sickLeave)),
      run('get_document_template_text', () => getDocumentTemplateText(doc.id)),
      finalPlanPromise,
    ]);
    if (template) setActiveTemplateText(template.template_text);
    if (!workflow) return;
    setPlan(workflow);
    if (finalWorkflow) {
      setPreflightPlan(finalWorkflow);
      setAnswers((previous) => Object.fromEntries(
        finalWorkflow.prompts.map((prompt) => [prompt.field_id, previous[prompt.field_id] ?? prompt.current_value ?? '']),
      ));
    }
    const displayedPlan = finalWorkflow ?? workflow;
    setStatus(displayedPlan.prompts.length
      ? `Требуется уточнить полей в выбранном комплекте: ${displayedPlan.prompts.length}.`
      : 'Финальный план выбранного комплекта подтверждён — обязательных уточнений нет.');
  }"""
          if new_select not in source:
              if old_select not in source:
                  raise SystemExit('expected selectDocument block not found')
              source = source.replace(old_select, new_select, 1)
          app.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/quality-gate.yml')
          text = workflow.read_text(encoding='utf-8')
          start = text.index('  # BEGIN ONE-TIME FRONTEND SELF-REPAIR\n')
          end_marker = '  # END ONE-TIME FRONTEND SELF-REPAIR\n\n'
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          workflow.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/agent-frontend-self-repair.yml
          rm -f .github/workflows/agent-frontend-final-repair.yml
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          npm run typecheck
          npm run test
          npm run build
      - name: Publish clean verified tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          TREE_SHA="$(git write-tree)"
          git commit -m 'Fix final plan refresh and frontend compile' -m "tree-sha: ${TREE_SHA}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.head_ref }}"; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
  # END ONE-TIME FRONTEND SELF-REPAIR

  rust-compile-gate:
    name: REQUIRED Rust compile gate (non-bypassable)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Restore Rust build and audit cache
        id: rust-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2
          restore-keys: |
            rust-compile-${{ runner.os }}-
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cargo lock must be committed
        run: test -f Cargo.lock
      - name: Install current CVSS-4-compatible cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2
      - name: Mandatory Rust compile gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/prepackage_rust_gate.sh 2>&1 | tee rust-compile-gate.log
      - name: Upload Rust compile diagnostics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: rust-compile-gate-diagnostics
          path: rust-compile-gate.log
          if-no-files-found: error
      - name: Save Rust build and audit cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2

  rust-dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Restore cargo-audit cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-audit-${{ runner.os }}-0.22.2
      - name: Install current CVSS-4-compatible cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked Rust dependencies
        shell: bash
        run: |
          set -o pipefail
          cargo audit --deny warnings 2>&1 | tee rustsec-audit.log
      - name: Upload RustSec diagnostics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: rustsec-audit-diagnostics
          path: rustsec-audit.log
          if-no-files-found: error

  python-contracts:
    name: Python regression contour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run isolated Python contracts
        run: python scripts/run_python_contracts_sharded.py --report verification/ci/python-contracts.json
      - name: Upload Python contract evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: python-contract-evidence
          path: verification/ci/python-contracts.json
          if-no-files-found: error
      - run: python scripts/verify_starter_content_packs.py
      - run: python scripts/static_quality_gate.py --source-only
      - run: python scripts/check_reference_data_freshness.py

  postgres-integration:
    name: REQUIRED PostgreSQL multi-connection and HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dokkomplekt
          POSTGRES_PASSWORD: dokkomplekt_ci
          POSTGRES_DB: dokkomplekt_license_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokkomplekt -d dokkomplekt_license_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dokkomplekt:dokkomplekt_ci@127.0.0.1:5432/dokkomplekt_license_ci
      DOKKOMPLEKT_REQUIRE_POSTGRES_TESTS: '1'
      DKK_LICENSE_POSTGRES_POOL_SIZE: '4'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Prove PostgreSQL is reachable before tests
        run: |
          python - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 5432), timeout=10):
              print("PostgreSQL TCP endpoint is reachable")
          PY
      - name: Run real PostgreSQL backend, concurrency and HTTP tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path crates/dokkomplekt-license-server/Cargo.toml -- --test-threads=1 2>&1 | tee postgres-integration.log
      - name: Upload PostgreSQL integration evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: postgres-integration-evidence
          path: postgres-integration.log
          if-no-files-found: error

  ui-thin-client:
    name: TypeScript thin UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [rust-compile-gate, python-contracts]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run Vitest with JSON evidence
        run: npm run test -- --reporter=json --outputFile=verification/ci/vitest.json
      - name: Upload Vitest evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: vitest-evidence
          path: verification/ci/vitest.json
          if-no-files-found: error
      - run: npm run build
      - run: npm audit --audit-level=moderate

  e2e:
    name: Browser UI e2e (mocked Tauri IPC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-compile-gate, python-contracts]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run e2e

  tauri-build:
    name: Installer build after Rust gate
    needs: [rust-compile-gate, rust-dependency-audit, python-contracts, postgres-integration, ui-thin-client, e2e]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: ubuntu-latest
            artifact: linux-bundles
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore packaging Rust cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-package-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-audit-0.22.2
          restore-keys: |
            rust-package-${{ runner.os }}-
            rust-compile-${{ runner.os }}-
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb dbus-x11
      - name: Install current CVSS-4-compatible cargo-audit on packaging runner
        shell: bash
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2
      - name: Repeat mandatory Rust gate on packaging runner
        shell: bash
        run: |
          set -o pipefail
          bash scripts/prepackage_rust_gate.sh 2>&1 | tee "packaging-rust-${{ runner.os }}.log"
      - run: npm ci
      - name: Build Windows NSIS bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx tauri build --bundles nsis 2>&1 | Tee-Object -FilePath "tauri-build-${{ runner.os }}.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -o pipefail
          npx tauri build --bundles appimage,deb,rpm 2>&1 | tee "tauri-build-${{ runner.os }}.log"
      - name: Record final AppImage runtime integrity
        if: runner.os == 'Linux'
        run: python scripts/write_linux_appimage_runtime_manifest.py --bundle-dir target/release/bundle
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tests/installer/windows_installer_contract.ps1 2>&1 | Tee-Object -FilePath "installer-smoke-${{ runner.os }}.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux installer smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          bash tests/installer/linux_installer_contract.sh 2>&1 | tee "installer-smoke-${{ runner.os }}.log"
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: packaging-diagnostics-${{ runner.os }}
          path: |
            packaging-rust-${{ runner.os }}.log
            tauri-build-${{ runner.os }}.log
            installer-smoke-${{ runner.os }}.log
            verification/ci/webkit-*.ppm
            verification/ci/webkit-*-golden.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/**
          if-no-files-found: error