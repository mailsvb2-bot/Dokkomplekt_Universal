name: Rust gate clippy fix once

on:
  push:
    branches: [fix/rust-gate-diary-clippy]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/rust-gate-diary-clippy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply exact clippy cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/dokkomplekt-core/src/professional_records.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    match (
              medical_diary_severity(&candidate),
              medical_diary_severity(&target),
          ) {
              (Some(left), Some(right)) if left != right => false,
              _ => true,
          }
          '''
          new = '''    !matches!(
              (
                  medical_diary_severity(&candidate),
                  medical_diary_severity(&target),
              ),
              (Some(left), Some(right)) if left != right
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one clippy target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          rm .github/workflows/rust-gate-clippy-fix-once.yml

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install cargo audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2

      - name: Run exact mandatory Rust gate
        shell: bash
        run: bash scripts/prepackage_rust_gate.sh

      - name: Synchronize and verify source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verification/ci
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.recheck.txt

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/rust-gate-clippy-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: satisfy mandatory Rust lint gate"
          git push origin HEAD:fix/rust-gate-diary-clippy
