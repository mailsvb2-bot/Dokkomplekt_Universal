name: PR154 manifest cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 154 && github.event.pull_request.head.ref == 'agent/exhaustive-donor-parity-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/exhaustive-donor-parity-20260819
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Remove helper before manifest generation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr154-manifest-cleanup.yml
      - name: Regenerate manifest from clean working tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.verify.txt
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.verify.txt
          if grep -Fq '.github/workflows/pr154-manifest-cleanup.yml' SOURCE_MANIFEST_SHA256.txt; then
            echo 'helper leaked into manifest' >&2
            exit 1
          fi
          if grep -Fq '.github/workflows/pr154-clippy-cleanup.yml' SOURCE_MANIFEST_SHA256.txt; then
            echo 'old helper remains in manifest' >&2
            exit 1
          fi
      - name: Verify source-only architecture gate
        run: python scripts/static_quality_gate.py --source-only
      - name: Commit clean manifest and helper deletion
        shell: bash
        run: |
          set -euo pipefail
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          git config user.name 'BusinesMetro'
          git config user.email 'mailsvb2@gmail.com'
          git commit -m 'fix: align source manifest with clean donor parity tree'
          git push origin HEAD:agent/exhaustive-donor-parity-20260819
