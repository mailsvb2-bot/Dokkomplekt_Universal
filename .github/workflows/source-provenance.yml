name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Extract default-output orchestration from App once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/default-output-root-20260818'
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'App.tsx: expected one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { chooseExistingOutputPolicyFlow } from './lib/outputFlow';",
              "import { prepareGenerationOutputFlow } from './lib/outputFlow';",
          )
          replace_once(
              "        const defaultOutputRoot = res?.default_output_root?.trim();\n        if (defaultOutputRoot) {\n          setOutputRoot((current) => current.trim() || defaultOutputRoot);\n        }",
              "        const defaultOutputRoot = res?.default_output_root?.trim();\n        if (defaultOutputRoot) setOutputRoot((current) => current.trim() || defaultOutputRoot);",
          )
          replace_once(
              """  async function resolveOutputRootForGeneration(): Promise<string> {
    const configured = outputRoot.trim();
    if (configured) return configured;
    const startup = await run('first_run_state', () => firstRunState());
    const fallback = startup?.default_output_root?.trim() ?? '';
    if (!fallback) {
      setFolderNamingConfirmed(false);
      setStatus('Не удалось создать стандартную папку «Выписанные пациенты». Выберите папку готовых документов вручную.');
      return '';
    }
    setOutputRoot(fallback);
    return fallback;
  }

  async function chooseExistingOutputPolicy(documentIds: string[], resolvedOutputRoot = outputRoot.trim()) {
    const labels = documentIds.map(id => documents.find(document => document.id === id)?.button_label).filter((value): value is string => Boolean(value));
    return chooseExistingOutputPolicyFlow({
      outputRoot: resolvedOutputRoot, folderParts, labels,
      getPlan: (root, parts, names) => run('get_output_plan', () => getOutputPlan(root, parts, names)),
      confirm: (options) => dialogs.confirm(options),
      openFolder: (path) => run('open_in_file_manager', () => openInFileManager(path)),
      onStatus: setStatus,
      onMissingRoot: () => setFolderNamingConfirmed(false),
    });
  }

""",
              "",
          )
          replace_once(
              """  async function performGenerateSelectedDocuments(documentIds: string[]) {
    const explicitOutputRoot = await resolveOutputRootForGeneration();
    if (!explicitOutputRoot) return;
    const existingOutputPolicy = await chooseExistingOutputPolicy(documentIds, explicitOutputRoot);
    if (!existingOutputPolicy) return;
    const res = await run('render_docx_batch', () => renderDocxBatch(documentIds, explicitOutputRoot, folderParts, true, existingOutputPolicy));""",
              """  async function performGenerateSelectedDocuments(documentIds: string[]) {
    const prepared = await prepareGenerationOutputFlow({
      outputRoot, folderParts,
      labels: documentIds.map(id => documents.find(document => document.id === id)?.button_label).filter((value): value is string => Boolean(value)),
      getDefaultRoot: async () => (await run('first_run_state', () => firstRunState()))?.default_output_root ?? '',
      getPlan: (root, parts, names) => run('get_output_plan', () => getOutputPlan(root, parts, names)),
      confirm: (options) => dialogs.confirm(options),
      openFolder: (path) => run('open_in_file_manager', () => openInFileManager(path)),
      onResolvedRoot: setOutputRoot, onStatus: setStatus, onMissingRoot: () => setFolderNamingConfirmed(false),
    });
    if (!prepared) return;
    const { outputRoot: explicitOutputRoot, existingOutputPolicy } = prepared;
    const res = await run('render_docx_batch', () => renderDocxBatch(documentIds, explicitOutputRoot, folderParts, true, existingOutputPolicy));""",
          )
          path.write_text(text, encoding='utf-8')
          PY

          test "$(wc -l < src/App.tsx)" -lt 1550
          git checkout origin/main -- .github/workflows/source-provenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx .github/workflows/source-provenance.yml
          git diff --cached --check
          git commit -m "refactor: keep output orchestration out of App"
          git push origin "HEAD:${BRANCH}"
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
