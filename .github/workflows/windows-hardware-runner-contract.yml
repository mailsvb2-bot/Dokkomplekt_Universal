name: Windows Hardware Runner Contract

on:
  pull_request:
    paths:
      - '.github/workflows/windows-hardware-e2e.yml'
      - '.github/workflows/windows-hardware-runner-contract.yml'
      - 'scripts/bootstrap_windows_hardware_runner.ps1'
      - 'scripts/register_windows_hardware_runner.ps1'
      - 'scripts/verify_windows_hardware_runner.ps1'
      - 'scripts/cleanup_windows_reboot_preparation.ps1'
      - 'tests/windows/windows_hardware_e2e.ps1'
      - 'tests/windows/prepare_reboot_evidence.ps1'
      - 'tests/windows/verify_reboot_evidence.ps1'
      - 'tests/test_windows_hardware_runner_bootstrap_contract.py'
      - 'docs/WINDOWS_HARDWARE_RUNNER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-contract:
    name: Parse hardware PowerShell and governance contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Parse every hardware-runner PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/bootstrap_windows_hardware_runner.ps1',
            'scripts/register_windows_hardware_runner.ps1',
            'scripts/verify_windows_hardware_runner.ps1',
            'scripts/cleanup_windows_reboot_preparation.ps1',
            'tests/windows/windows_hardware_e2e.ps1',
            'tests/windows/prepare_reboot_evidence.ps1',
            'tests/windows/verify_reboot_evidence.ps1'
          )
          $failed = $false
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $path" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            } else {
              Write-Host "PowerShell parse PASS: $path"
            }
          }
          if ($failed) { throw 'Hardware runner PowerShell parser contract failed.' }
      - name: Run hardware runner governance regression
        shell: pwsh
        run: python -m pytest -q tests/test_windows_hardware_runner_bootstrap_contract.py
