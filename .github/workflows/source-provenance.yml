name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest and clean archive match tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply one-time exact E2 WebView2 harness correction
        if: github.event_name == 'pull_request' && github.head_ref == 'canon-v2/e2-template-learning-proof'
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          harness = Path("tests/installer/windows_installer_contract.ps1")
          raw = harness.read_bytes()
          bom = raw.startswith(b"\xef\xbb\xbf")
          text = raw.decode("utf-8-sig")
          eol = "\r\n" if "\r\n" in text else "\n"
          old = """  Activate-LiveAppWindow -Window $currentAppWindow
  $currentAppWindow.SetFocus()
  [System.Windows.Forms.SendKeys]::SendWait('{PGDN}')
""".replace("\n", eol)
          new = """  Activate-LiveAppWindow -Window $currentAppWindow
  # The top-level WebView2 UIA root may be non-focusable. Foreground activation of
  # its native HWND is sufficient for real keyboard routing and avoids a false UIA failure.
  Start-Sleep -Milliseconds 100
  [System.Windows.Forms.SendKeys]::SendWait('{PGDN}')
""".replace("\n", eol)
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one E2 PageDown focus sequence, found {count}")
          text = text.replace(old, new, 1)
          encoded = text.encode("utf-8")
          if bom:
              encoded = b"\xef\xbb\xbf" + encoded
          harness.write_bytes(encoded)

          digest = hashlib.sha256(encoded).hexdigest()
          manifest = Path("SOURCE_MANIFEST_SHA256.txt")
          manifest_raw = manifest.read_bytes()
          manifest_bom = manifest_raw.startswith(b"\xef\xbb\xbf")
          manifest_text = manifest_raw.decode("utf-8-sig")
          target = "tests/installer/windows_installer_contract.ps1"
          lines = manifest_text.splitlines()
          indexes = [i for i, line in enumerate(lines) if line.endswith("  " + target)]
          if len(indexes) != 1:
              raise SystemExit(f"expected exactly one manifest entry for {target}, found {len(indexes)}")
          lines[indexes[0]] = f"{digest}  {target}"
          manifest_eol = "\r\n" if b"\r\n" in manifest_raw else "\n"
          manifest_bytes = (manifest_eol.join(lines) + manifest_eol).encode("utf-8")
          if manifest_bom:
              manifest_bytes = b"\xef\xbb\xbf" + manifest_bytes
          manifest.write_bytes(manifest_bytes)
          print(f"updated harness sha256={digest}")

          subprocess.run([
              "git", "checkout", "3cdd881fe5b92ce6e56974feb3427a3d13077791", "--",
              ".github/workflows/source-provenance.yml"
          ], check=True)
          bootstrap = Path(".github/workflows/e2-harness-self-patch.yml")
          if bootstrap.exists():
              bootstrap.unlink()

      - name: Publish one-time E2 harness correction
        if: github.event_name == 'pull_request' && github.head_ref == 'canon-v2/e2-template-learning-proof'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          printf '%s\n' "$changed" | grep -F 'SOURCE_MANIFEST_SHA256.txt'
          printf '%s\n' "$changed" | grep -F 'tests/installer/windows_installer_contract.ps1'
          printf '%s\n' "$changed" | grep -F '.github/workflows/source-provenance.yml'
          printf '%s\n' "$changed" | grep -F '.github/workflows/e2-harness-self-patch.yml'
          git config user.name 'mailsvb2-bot'
          git config user.email '254540704+mailsvb2-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'test: avoid focusing non-focusable WebView2 root'
          git push origin HEAD:canon-v2/e2-template-learning-proof

      - name: Verify immutable dispatch checkout identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "Expected dispatched SHA ${GITHUB_SHA}, checked out $actual" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Build and verify deterministic clean source ZIP
        run: |
          python scripts/build_source_archive.py \
            --output verification/ci/Dokkomplekt_Universal-source.zip \
            --top-level Dokkomplekt_Universal \
            --manifest-json verification/ci/source-archive-report.json
          rm -rf verification/ci/extracted
          unzip -q verification/ci/Dokkomplekt_Universal-source.zip -d verification/ci/extracted
          cargo metadata --locked --no-deps \
            --manifest-path verification/ci/extracted/Dokkomplekt_Universal/Cargo.toml \
            > verification/ci/source-archive-cargo-metadata.json
      - name: Create portable Git history bundle
        run: |
          git bundle create verification/ci/Dokkomplekt_Universal-history.bundle --all
          git bundle verify verification/ci/Dokkomplekt_Universal-history.bundle
      - name: Upload source provenance evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-provenance-evidence
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
            verification/ci/Dokkomplekt_Universal-source.zip
            verification/ci/Dokkomplekt_Universal-source.zip.sha256
            verification/ci/source-archive-report.json
            verification/ci/source-archive-cargo-metadata.json
            verification/ci/Dokkomplekt_Universal-history.bundle
          if-no-files-found: error
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat verification/ci/source-manifest-report.json
          echo "SOURCE_MANIFEST_SHA256.txt is stale. Download source-provenance-evidence, replace it with SOURCE_MANIFEST_SHA256.generated.txt, and commit that change from the PR branch." >&2
          exit 1
