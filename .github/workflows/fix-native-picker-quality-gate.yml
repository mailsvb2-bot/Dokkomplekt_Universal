name: Fix Native Picker Quality Gate

on:
  pull_request_target:
    types: [reopened, edited]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: ${{ github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SERVICE_ISSUE: '48'
    steps:
      - name: Mark repair start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': f"Native picker quality-gate repair run {os.environ['RUN_ID']} started."}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-native-template-picker
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Remove panic shortcuts and refresh manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/subsystems/template_picker.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let paths = parse_picker_paths("C:/Шаблоны/Акт работ.docx\\r\\nC:/Шаблоны/Счёт.docm\\r\\n".as_bytes())
              .expect("paths");
          assert_eq!(paths.len(), 2);
          assert!(paths[0].ends_with("Акт работ.docx"));
          assert!(paths[1].ends_with("Счёт.docm"));
          '''.replace('          ', '        ')
          new = '''        let paths = parse_picker_paths("C:/Шаблоны/Акт работ.docx\\r\\nC:/Шаблоны/Счёт.docm\\r\\n".as_bytes());
          assert_eq!(paths.as_ref().map(Vec::len), Ok(2));
          assert!(paths.as_ref().is_ok_and(|items| {
              items.first().is_some_and(|path| path.ends_with("Акт работ.docx"))
                  && items.get(1).is_some_and(|path| path.ends_with("Счёт.docm"))
          }));
          '''.replace('          ', '        ')
          if text.count(old) != 1:
              raise SystemExit(f'expected parser test block count=1, actual={text.count(old)}')
          text = text.replace(old, new, 1)

          old_error = '''        let error = parse_picker_paths(b"C:/tmp/template.pdf\\n").expect_err("must reject");
          assert!(error.contains("неподдерживаемый"));
          '''.replace('          ', '        ')
          new_error = '''        let result = parse_picker_paths(b"C:/tmp/template.pdf\\n");
          assert!(result.as_ref().is_err_and(|error| error.contains("неподдерживаемый")));
          '''.replace('          ', '        ')
          if text.count(old_error) != 1:
              raise SystemExit(f'expected rejection test block count=1, actual={text.count(old_error)}')
          path.write_text(text.replace(old_error, new_error, 1), encoding='utf-8')
          PY
          python scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt
      - name: Verify repaired quality-gate contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q tests/test_source_manifest_integrity.py tests/test_v18_1_2_rust_panic_audit.py tests/test_v18_4_4_native_template_picker.py
      - name: Publish repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/subsystems/template_picker.rs SOURCE_MANIFEST_SHA256.txt
          git commit -m "Remove native picker panic shortcuts"
          git push origin HEAD:agent/fix-native-template-picker
      - name: Mark repair failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['SERVICE_ISSUE']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': f"Native picker quality-gate repair run {os.environ['RUN_ID']} failed; inspect the Actions log."}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(request).read()
          PY
