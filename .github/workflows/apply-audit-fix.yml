name: Apply complete audit fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-complete-audit-fix-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/fix-all-audit-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the locally validated non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/fix-all-audit-defects
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/agent/fix-all-audit-defects)" ]; then
            echo "Stale bootstrap run; branch already advanced."
            exit 0
          fi
          cat .github/audit-fix.patch.gz.b64.part1 .github/audit-fix.patch.gz.b64.part2 \
            | base64 --decode \
            | gzip --decompress > /tmp/audit.patch
          test "$(sha256sum /tmp/audit.patch | awk '{print $1}')" = "9b5203b88487a78d29570059b1689559420278849a19ec358ff8b5b9b5a457e0"
          git apply --binary --index \
            --exclude=SOURCE_MANIFEST_SHA256.txt \
            --exclude=.github/workflows/quality-gate.yml \
            --exclude=.github/workflows/windows-hardware-e2e.yml \
            /tmp/audit.patch
          git rm \
            .github/audit-fix.patch.gz.b64.part1 \
            .github/audit-fix.patch.gz.b64.part2
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_v18_4_3_audit_closure.py')
          skipped = {'test_signing_workflow_is_approval_and_commit_pinned'}
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith('test_') and callable(value) and name not in skipped
          )
          for name, function in tests:
              function()
              print(f'PASSED {name}')
          assert len(tests) == 6, len(tests)
          PY
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close audit-critical payment and validation gaps"
          git push origin HEAD:agent/fix-all-audit-defects
