name: One-time donor frontend CI fixes

on:
  push:
    branches:
      - agent/donor-contract-audit-20260816

permissions:
  contents: write

concurrency:
  group: donor-frontend-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/donor-contract-audit-20260816

      - name: Apply exact fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_support = Path('src/lib/appSupport.ts')
          text = app_support.read_text(encoding='utf-8')
          marker = '// Migration contract: a user who already chose and persisted naming parts'
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit('obsolete naming block marker not found')
          block_start = text.rfind('export function loadOutputNamingConfirmed()', 0, marker_pos)
          block_end_anchor = text.find('export function loadAutoPrintPreference()', marker_pos)
          if block_start < 0 or block_end_anchor < 0:
              raise SystemExit('obsolete naming block boundaries not found')
          if text.find('export function loadOutputNamingConfirmed()', block_start + 1, marker_pos) >= 0:
              raise SystemExit('ambiguous obsolete naming block start')
          text = text[:block_start] + text[block_end_anchor:]
          app_support.write_text(text, encoding='utf-8')

          workspace = Path('src/components/Workspace.tsx')
          text = workspace.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?ms)^  const entries = Array\.from\(dataTransfer\.items \?\? \[\]\)\s*"
              r"\.map\(\(item\) => \(item as DataTransferItem & \{ webkitGetAsEntry\?: \(\) => DroppedEntry \| null \}\)\.webkitGetAsEntry\?\.\(\)\)\s*"
              r"\.filter\(\(entry\): entry is DroppedEntry => Boolean\(entry\)\);"
          )
          replacement = '''  const entries = Array.from(dataTransfer.items ?? [])
            .map((item) => {
              const getter = (item as DataTransferItem & { webkitGetAsEntry?: () => unknown }).webkitGetAsEntry;
              return getter?.call(item) as DroppedEntry | null | undefined;
            })
            .filter((entry): entry is DroppedEntry => entry != null);'''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'expected one dropped-entry block, got {count}')
          workspace.write_text(text, encoding='utf-8')

          dialog = Path('src/components/AppDialogProvider.tsx')
          text = dialog.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?m)^(\s*)type=\"button\"\n(\s*)className=\{option\.danger \? 'appDialogChoice danger' : 'appDialogChoice'\}"
          )
          replacement = r'''\1type="button"
\2aria-label={option.label}
\2className={option.danger ? 'appDialogChoice danger' : 'appDialogChoice'}'''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'expected one choice-button block, got {count}')
          dialog.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Validate frontend completely
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Commit clean product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-donor-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close donor frontend CI regressions"
          for attempt in 1 2 3 4 5; do
            git fetch origin agent/donor-contract-audit-20260816
            if git rebase origin/agent/donor-contract-audit-20260816 && git push origin HEAD:agent/donor-contract-audit-20260816; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
