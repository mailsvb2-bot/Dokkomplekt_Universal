name: Agent repair PR 9

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/fix-simple-button-creation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-simple-button-creation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove duplicate command registry entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/api.ts')
          text = path.read_text(encoding='utf-8')
          needle = "  'import_template_file'"
          if text.count(needle) != 2:
              raise SystemExit(f'expected exactly two registry occurrences, found {text.count(needle)}')
          old = "  'get_process_blueprints',\n  'select_process_blueprint',\n  'import_template_file'\n] as const;"
          new = "  'get_process_blueprints',\n  'select_process_blueprint',\n] as const;"
          if old not in text:
              raise SystemExit('trailing duplicate registry block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify complete TypeScript test suite
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Commit focused repair and remove helper workflow
        run: |
          rm .github/workflows/agent-repair-pr9.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts .github/workflows/agent-repair-pr9.yml
          git commit -m "Fix duplicate Tauri command registry entry"
          git push origin HEAD:agent/fix-simple-button-creation
