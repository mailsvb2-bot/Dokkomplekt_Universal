name: PR178 review fix finalizer

on:
  push:
    branches:
      - ops/pr178-bundle-memory-finalize-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply guarded review fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          expected_head='c16d9de0a05f141d0f34102a06366acdd6250da3'
          test "$(git rev-parse HEAD)" = "$expected_head"

          python - <<'PY'
          from pathlib import Path

          profile_path = Path('src-tauri/src/subsystems/profile_sources.rs')
          text = profile_path.read_text(encoding='utf-8')

          old = '''const MEDICAL_DIARY_PROGRAM_TEMPLATE_TEXT: &str =
              dokkomplekt_core::MEDICAL_PROGRAM_CALENDAR_DIARY_TEMPLATE_TEXT;
          '''
          new = '''const MEDICAL_DIARY_PROGRAM_TEMPLATE_TEXT: &str =
              dokkomplekt_core::MEDICAL_PROGRAM_CALENDAR_DIARY_TEMPLATE_TEXT;
          static MEDICAL_DIARY_TEMPLATE_LOCK: std::sync::Mutex<()> = std::sync::Mutex::new(());
          '''
          assert text.count(old) == 1, 'unexpected diary constants owner'
          text = text.replace(old, new, 1)

          old = '''fn program_calendar_diary_template(app: &tauri::AppHandle) -> Result<PathBuf, String> {
              let root = app
          '''
          new = '''fn program_calendar_diary_template(app: &tauri::AppHandle) -> Result<PathBuf, String> {
              let _template_guard = MEDICAL_DIARY_TEMPLATE_LOCK
                  .lock()
                  .map_err(|_| "Не удалось заблокировать локальный шаблон дневников.".to_string())?;
              let root = app
          '''
          assert text.count(old) == 1, 'unexpected diary template constructor'
          text = text.replace(old, new, 1)

          old = '    Ok(PathBuf::from(&document.template_path))\n'
          new = '    resolve_user_path(app, &document.template_path)\n'
          assert text.count(old) == 1, 'unexpected non-diary effective path branch'
          text = text.replace(old, new, 1)
          profile_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_donor_diary_output_parity.py')
          test_text = test_path.read_text(encoding='utf-8')
          marker = 'def test_effective_template_path_preserves_resolved_paths_and_serializes_diary_cache() -> None:'
          assert marker not in test_text, 'review regression already present unexpectedly'
          test_text += '''\n\n\ndef test_effective_template_path_preserves_resolved_paths_and_serializes_diary_cache() -> None:\n    profile_sources = read("src-tauri/src/subsystems/profile_sources.rs")\n\n    assert "static MEDICAL_DIARY_TEMPLATE_LOCK: std::sync::Mutex<()>" in profile_sources\n    assert "let _template_guard = MEDICAL_DIARY_TEMPLATE_LOCK" in profile_sources\n    assert ".lock()" in profile_sources\n    assert "resolve_user_path(app, &document.template_path)" in profile_sources\n    assert "Ok(PathBuf::from(&document.template_path))" not in profile_sources\n''' 
          test_path.write_text(test_text, encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core

          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q \
            tests/test_donor_diary_output_parity.py \
            tests/test_donor_patient_folder_watcher_parity.py \
            tests/test_source_manifest_integrity.py \
            tests/test_learning_privacy_retention_contract.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          test "$(wc -l < src-tauri/src/subsystems/automation_runtime.rs)" -lt 3000

          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add \
            SOURCE_MANIFEST_SHA256.txt \
            src-tauri/src/subsystems/profile_sources.rs \
            tests/test_donor_diary_output_parity.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Fix effective template path and diary cache race'
          git push origin HEAD:fix/real-user-workflow-20260907
