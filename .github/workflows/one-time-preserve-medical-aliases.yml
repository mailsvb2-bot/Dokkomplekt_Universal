name: One-time preserve medical aliases

on:
  push:
    branches:
      - agent/donor-medical-source-parity-20260817

permissions:
  contents: write

concurrency:
  group: preserve-medical-aliases-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-medical-source-parity-20260817
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore pre-existing medical aliases
        run: python .github/agent-fixes/preserve_medical_aliases.py
      - name: Format and verify alias superset
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p dokkomplekt-core --test donor_medical_source_parity
          cargo test --locked -p dokkomplekt-core source_parser::tests
          python scripts/static_quality_gate.py --source-only
      - name: Commit canonical alias preservation on latest branch head
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-preserve-medical-aliases.yml
          rm -f .github/agent-fixes/preserve_medical_aliases.py
          git config user.name "BusinesMetro"
          git config user.email "mailsvb2@gmail.com"
          git add -A
          git commit -m "Preserve existing medical source aliases"
          git fetch origin agent/donor-medical-source-parity-20260817
          git rebase origin/agent/donor-medical-source-parity-20260817
          git push origin HEAD:agent/donor-medical-source-parity-20260817
