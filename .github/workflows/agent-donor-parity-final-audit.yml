name: Agent Donor Parity Final Audit

on:
  push:
    branches:
      - agent/donor-parity-final-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-parity-final-audit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply audited donor parity patches
        run: |
          python3 .agent_patch_bootstrap.py
          python3 .agent_patch_general.py
          python3 .agent_patch_diary.py
          python3 .agent_patch_followup.py
          cargo fmt --all
          git diff --check

      - name: Focused Rust regression
        run: |
          cargo test -p dokkomplekt-core --locked
          cargo clippy -p dokkomplekt-core --all-targets --locked -- -D warnings

      - name: Thin UI regression
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/components/Workspace.test.tsx src/components/UtilityPanel.test.tsx src/App.test.tsx --passWithNoTests

      - name: Publish tested product commit and self-clean
        run: |
          git rm -f .github/workflows/agent-donor-parity-final-audit.yml .agent_patch_bootstrap.py .agent_patch_general.py .agent_patch_diary.py .agent_patch_followup.py
          git config user.name "mailsvb2-bot"
          git config user.email "mailsvb2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore donor popup, diary, and folder parity"
          git push origin HEAD:agent/donor-parity-final-audit
