name: Dokkomplekt Private Windows Hardware E2E
run-name: Dokkomplekt hardware ${{ inputs.release_sha }} ${{ inputs.reboot_phase }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public source repository in owner/name form
        required: true
        default: mailsvb2-bot/Dokkomplekt_Universal
        type: string
      release_sha:
        description: Exact protected public main commit SHA
        required: true
        type: string
      reboot_phase:
        description: Prepare real reboot evidence first, then verify it after reboot
        required: true
        default: verify
        type: choice
        options: [prepare, verify]
      request_id:
        description: Correlation id generated by the public dispatcher
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dokkomplekt-private-windows-hardware-e2e
  cancel-in-progress: false

jobs:
  signed-runtime-build:
    name: Signed runtime / installer handoff
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, dokkomplekt-runtime]
    environment: windows-production-signing
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    env:
      DOKKOMPLEKT_SIDECAR_MANIFEST_PATH: ${{ vars.DOKKOMPLEKT_SIDECAR_MANIFEST_PATH }}
      DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64 }}
      DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64 }}
      DOKKOMPLEKT_GATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_GATE_PUBKEY_B64 }}
      DOKKOMPLEKT_LICENSE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_LICENSE_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_UPDATE_PUBKEY_B64 }}
      DOKKOMPLEKT_THRESHOLD_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_THRESHOLD_PUBKEY_B64 }}
      DOKKOMPLEKT_REFDATA_PUBKEY_B64: ${{ vars.DOKKOMPLEKT_REFDATA_PUBKEY_B64 }}
      DOKKOMPLEKT_UPDATE_MANIFEST_URL: ${{ vars.DOKKOMPLEKT_UPDATE_MANIFEST_URL }}
      DOKKOMPLEKT_REFDATA_URL: ${{ vars.DOKKOMPLEKT_REFDATA_URL }}
      DOKKOMPLEKT_COMPONENTS_CATALOG_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_CATALOG_URL }}
      DOKKOMPLEKT_COMPONENTS_BASE_URL: ${{ vars.DOKKOMPLEKT_COMPONENTS_BASE_URL }}
      DOKKOMPLEKT_TIMESTAMP_SERVER: ${{ vars.DOKKOMPLEKT_TIMESTAMP_SERVER }}
    steps:
      - name: Validate dispatch identity
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.source_repository }}' -ne 'mailsvb2-bot/Dokkomplekt_Universal') { throw 'unexpected source repository' }
          if ('${{ inputs.release_sha }}' -notmatch '^[0-9a-f]{40}$') { throw 'release_sha must be exact lowercase SHA' }
          if ('${{ inputs.request_id }}' -notmatch '^[0-9a-f-]{36}$') { throw 'request_id must be UUID-like' }
      - name: Checkout exact public source without private credentials
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          git clone --filter=blob:none --no-checkout "https://github.com/${{ inputs.source_repository }}.git" source
          Set-Location source
          git fetch origin '${{ inputs.release_sha }}' --depth=1
          git checkout --detach '${{ inputs.release_sha }}'
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.release_sha }}') { throw 'source checkout mismatch' }
          git fetch origin main --no-tags
          git merge-base --is-ancestor '${{ inputs.release_sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release_sha is not reachable from public main' }
      - name: Pin audited signing implementation
        shell: pwsh
        env:
          EXPECTED_SIGNING_SCRIPT_SHA256: ${{ vars.DOKKOMPLEKT_SIGNING_SCRIPT_SHA256 }}
        run: |
          $expected = $env:EXPECTED_SIGNING_SCRIPT_SHA256.Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'signing script SHA256 pin is required' }
          $actual = (Get-FileHash scripts/sign_windows_release.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "signing script hash mismatch: expected $expected, got $actual" }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prove isolated runtime/signing host
        shell: pwsh
        run: scripts/verify_windows_runtime_signing_host.ps1 -SidecarManifestPath $env:DOKKOMPLEKT_SIDECAR_MANIFEST_PATH -OutputPath verification/release/RUNTIME_RUNNER_HOST.json
      - name: Verify offline-approved runner-owned runtime lock before staging
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64)) { throw 'runtime lock approval public key is required' }
          $manifest = $env:DOKKOMPLEKT_SIDECAR_MANIFEST_PATH
          $signature = "$manifest.sig"
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) { throw "Offline approval signature is missing: $signature" }
          New-Item -ItemType Directory -Force verification/release | Out-Null
          $trustedKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-lock-approval-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_LOCK_APPROVAL_PUBKEY_PEM_B64))
            python scripts/windows_runtime_lock_approval.py verify $manifest --signature $signature --trusted-public-key $trustedKey --json-report verification/release/RUNTIME_LOCK_APPROVAL.json
            if ($LASTEXITCODE -ne 0) { throw 'runtime lock offline approval verification failed' }
          } finally { Remove-Item -LiteralPath $trustedKey -Force -ErrorAction SilentlyContinue }
      - name: Validate production and runtime trust boundaries
        shell: pwsh
        env:
          DOKKOMPLEKT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.DOKKOMPLEKT_WINDOWS_SIGNING_PFX_B64 }}
          DOKKOMPLEKT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DOKKOMPLEKT_WINDOWS_SIGNING_PFX_PASSWORD }}
          DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64: ${{ secrets.DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64 }}
          DOKKOMPLEKT_UPDATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          python scripts/release_environment_preflight.py --mode production-build --json-report verification/release/production-build-preflight.json
          python scripts/release_environment_preflight.py --mode windows-runtime --json-report verification/release/windows-runtime-preflight.json
      - name: Stage exact runner-owned offline runtime
        shell: pwsh
        run: |
          python scripts/prepare_sidecars.py $env:DOKKOMPLEKT_SIDECAR_MANIFEST_PATH --clean
          if ($LASTEXITCODE -ne 0) { throw 'Sidecar staging failed.' }
          Copy-Item src-tauri/resources/tools/windows-x86_64/sidecar-status.json verification/release/sidecar-status.json -Force
      - run: npm ci
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Execute signed Rust and RustSec release gate
        shell: cmd
        env:
          DOKKOMPLEKT_GATE_PRIVATE_KEY_B64: ${{ secrets.DOKKOMPLEKT_GATE_PRIVATE_KEY_B64 }}
        run: scripts\prepackage_rust_gate.bat
      - run: python scripts/assert_offline_runtime_ready.py --target windows-x86_64 --require-semantic-model --require-supply-chain --production
      - name: Verify Authenticode signatures of staged PE sidecars
        shell: pwsh
        run: tests/windows/verify_sidecar_authenticode.ps1 -RuntimeRoot src-tauri/resources/tools/windows-x86_64 -OutputPath verification/release/SIDECAR_AUTHENTICODE.json
      - name: Probe staged offline runtime
        shell: pwsh
        run: |
          $output = & python scripts/probe_offline_runtime.py --target windows-x86_64 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath verification/release/offline-runtime-probe.log
          if ($exitCode -ne 0) { throw "Offline runtime probe failed: $exitCode" }
      - run: python scripts/verify_scanned_pdf_fixture.py --runtime-root src-tauri/resources/tools/windows-x86_64 --output-json verification/release/scanned-pdf-ocr.json
      - name: Create signed offline runtime bundle and SBOM
        shell: pwsh
        env:
          DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64: ${{ secrets.DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64 }}
        run: |
          if ($null -eq (Get-Command openssl -ErrorAction SilentlyContinue)) { throw 'OpenSSL is required on runtime runner.' }
          $privateKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-private-" + [Guid]::NewGuid().ToString('N') + '.pem')
          $trustedKey = (Resolve-Path verification/release).Path + '\runtime-trusted-public.pem'
          try {
            [IO.File]::WriteAllBytes($privateKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64))
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            python scripts/create_offline_runtime_bundle.py --target windows-x86_64 --output-dir release-runtime --require-semantic-model --require-supply-chain --production --signing-key $privateKey --trusted-public-key $trustedKey --require-signature
            if ($LASTEXITCODE -ne 0) { throw 'Signed offline runtime bundle creation failed.' }
          } finally { Remove-Item -LiteralPath $privateKey -Force -ErrorAction SilentlyContinue }
          "DOKKOMPLEKT_RUNTIME_TRUSTED_KEY_PATH=$trustedKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npx tauri build --no-bundle
      - name: Sign application binary
        shell: pwsh
        env:
          DOKKOMPLEKT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.DOKKOMPLEKT_WINDOWS_SIGNING_PFX_B64 }}
          DOKKOMPLEKT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DOKKOMPLEKT_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: scripts/sign_windows_release.ps1 -ArtifactRoot target/release/dokkomplekt-tauri.exe
      - run: npx tauri bundle --bundles nsis
      - name: Sign NSIS installer
        shell: pwsh
        env:
          DOKKOMPLEKT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.DOKKOMPLEKT_WINDOWS_SIGNING_PFX_B64 }}
          DOKKOMPLEKT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DOKKOMPLEKT_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: scripts/sign_windows_release.ps1 -ArtifactRoot target/release/bundle/nsis
      - name: Bind signed release evidence
        shell: pwsh
        run: scripts/write_windows_release_evidence.ps1 -InstallerRoot target/release/bundle/nsis -RuntimeRoot release-runtime -ApplicationPath target/release/dokkomplekt-tauri.exe -RuntimeTrustedPublicKey $env:DOKKOMPLEKT_RUNTIME_TRUSTED_KEY_PATH
      - name: Assemble cryptographically signed handoff
        shell: pwsh
        env:
          DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64: ${{ secrets.DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64 }}
        run: |
          $handoff = Join-Path (Get-Location) 'signed-handoff'
          Remove-Item -LiteralPath $handoff -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$handoff\application", "$handoff\installer", "$handoff\runtime", "$handoff\build-evidence" | Out-Null
          Copy-Item target/release/dokkomplekt-tauri.exe "$handoff\application\" -Force
          Copy-Item target/release/bundle/nsis/* "$handoff\installer\" -Recurse -Force
          Copy-Item release-runtime/* "$handoff\runtime\" -Recurse -Force
          Copy-Item verification/release/* "$handoff\build-evidence\" -Recurse -Force
          $runtimeHost = Get-Content verification/release/RUNTIME_RUNNER_HOST.json -Raw | ConvertFrom-Json
          $producerHostId = [string]$runtimeHost.machine_fingerprint_sha256
          if ($producerHostId -notmatch '^[0-9a-f]{64}$') { throw 'runtime host fingerprint evidence is invalid' }
          $privateKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-handoff-private-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($privateKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_SIGNING_KEY_PEM_B64))
            python scripts/windows_signed_handoff.py build $handoff --release-sha '${{ inputs.release_sha }}' --request-id '${{ inputs.request_id }}' --producer-host-id $producerHostId --producer-runner-name $env:RUNNER_NAME --signing-key $privateKey
            if ($LASTEXITCODE -ne 0) { throw 'Signed handoff creation failed.' }
          } finally { Remove-Item -LiteralPath $privateKey -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-Signed-Handoff-${{ inputs.release_sha }}-${{ inputs.request_id }}
          path: source/signed-handoff/**
          if-no-files-found: error

  hardware-evidence:
    name: Word / printer / reboot evidence
    needs: signed-runtime-build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, dokkomplekt-hardware]
    environment: windows-hardware-validation
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    env:
      DOKKOMPLEKT_RUN_HARDWARE_E2E: '1'
      DOKKOMPLEKT_TEST_PRINTER: ${{ vars.DOKKOMPLEKT_TEST_PRINTER }}
      DOKKOMPLEKT_TEST_DUPLEX: ${{ vars.DOKKOMPLEKT_TEST_DUPLEX }}
      DOKKOMPLEKT_TEST_TRAY: ${{ vars.DOKKOMPLEKT_TEST_TRAY }}
      DOKKOMPLEKT_REBOOT_EVIDENCE_PATH: ${{ vars.DOKKOMPLEKT_REBOOT_EVIDENCE_PATH }}
      DOKKOMPLEKT_REBOOT_SOURCE_DOCUMENT: ${{ vars.DOKKOMPLEKT_REBOOT_SOURCE_DOCUMENT }}
      DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64: ${{ vars.DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64 }}
    steps:
      - name: Validate dispatch identity
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ('${{ inputs.source_repository }}' -ne 'mailsvb2-bot/Dokkomplekt_Universal') { throw 'unexpected source repository' }
          if ('${{ inputs.release_sha }}' -notmatch '^[0-9a-f]{40}$') { throw 'release_sha must be exact lowercase SHA' }
          if ('${{ inputs.request_id }}' -notmatch '^[0-9a-f-]{36}$') { throw 'request_id must be UUID-like' }
      - name: Checkout exact public source without private credentials
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          git clone --filter=blob:none --no-checkout "https://github.com/${{ inputs.source_repository }}.git" source
          Set-Location source
          git fetch origin '${{ inputs.release_sha }}' --depth=1
          git checkout --detach '${{ inputs.release_sha }}'
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.release_sha }}') { throw 'source checkout mismatch' }
          git fetch origin main --no-tags
          git merge-base --is-ancestor '${{ inputs.release_sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release_sha is not reachable from public main' }
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Dokkomplekt-Windows-Signed-Handoff-${{ inputs.release_sha }}-${{ inputs.request_id }}
          path: source/signed-handoff
      - name: Prove interactive hardware evidence host
        shell: pwsh
        run: scripts/verify_windows_hardware_evidence_host.ps1 -PrinterName $env:DOKKOMPLEKT_TEST_PRINTER -RebootEvidencePath $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH -OutputPath verification/release/HARDWARE_RUNNER_HOST.json
      - name: Verify signed handoff, payload hashes, and physical host separation
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64)) { throw 'runtime trusted public key is required' }
          $hardwareHost = Get-Content verification/release/HARDWARE_RUNNER_HOST.json -Raw | ConvertFrom-Json
          $consumerHostId = [string]$hardwareHost.machine_fingerprint_sha256
          if ($consumerHostId -notmatch '^[0-9a-f]{64}$') { throw 'hardware host fingerprint evidence is invalid' }
          $trustedKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-handoff-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            python scripts/windows_signed_handoff.py verify signed-handoff --release-sha '${{ inputs.release_sha }}' --request-id '${{ inputs.request_id }}' --consumer-host-id $consumerHostId --trusted-public-key $trustedKey --json-report verification/release/SIGNED_HANDOFF_VERIFICATION.json
            if ($LASTEXITCODE -ne 0) { throw 'Signed handoff verification failed.' }
          } finally { Remove-Item -LiteralPath $trustedKey -Force -ErrorAction SilentlyContinue }
      - name: Independently verify Authenticode and runtime signature
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem signed-handoff/installer -Recurse -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)." }
          if ((Get-AuthenticodeSignature $installers[0].FullName).Status -ne 'Valid') { throw 'Handoff installer signature is invalid.' }
          $apps = @(Get-ChildItem signed-handoff/application -File -Filter '*.exe')
          if ($apps.Count -ne 1) { throw "Expected exactly one application, found $($apps.Count)." }
          if ((Get-AuthenticodeSignature $apps[0].FullName).Status -ne 'Valid') { throw 'Handoff application signature is invalid.' }
          $bundles = @(Get-ChildItem signed-handoff/runtime -File -Filter '*.zip')
          if ($bundles.Count -ne 1) { throw "Expected exactly one runtime bundle, found $($bundles.Count)." }
          $trustedKey = Join-Path $env:RUNNER_TEMP ("dokkomplekt-runtime-public-" + [Guid]::NewGuid().ToString('N') + '.pem')
          try {
            [IO.File]::WriteAllBytes($trustedKey, [Convert]::FromBase64String($env:DOKKOMPLEKT_RUNTIME_TRUSTED_PUBKEY_PEM_B64))
            $bundle = $bundles[0].FullName
            python scripts/verify_offline_runtime_bundle.py $bundle --payload "$bundle.signing.json" --signature "$bundle.signing.json.sig" --public-key "$bundle.signing.json.public.pem" --trusted-public-key $trustedKey --require-signature
            if ($LASTEXITCODE -ne 0) { throw 'Offline runtime handoff signature verification failed.' }
          } finally { Remove-Item -LiteralPath $trustedKey -Force -ErrorAction SilentlyContinue }
      - name: Validate hardware-only trust boundary
        shell: pwsh
        run: python scripts/release_environment_preflight.py --mode windows-hardware --json-report verification/release/hardware-preflight.json
      - name: Prepare real reboot E2E state
        if: inputs.reboot_phase == 'prepare'
        shell: pwsh
        env:
          DOKKOMPLEKT_PREPARE_REBOOT_E2E: '1'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOKKOMPLEKT_REBOOT_SOURCE_DOCUMENT)) { throw 'stable reboot source document is required' }
          $persistentRoot = Join-Path $env:ProgramData 'DokkomplektE2E\prepare-${{ inputs.release_sha }}'
          if (Test-Path -LiteralPath $persistentRoot) { throw "Persistent reboot preparation already exists: $persistentRoot" }
          New-Item -ItemType Directory -Force -Path $persistentRoot | Out-Null
          $env:DOKKOMPLEKT_REBOOT_PREP_ROOT = $persistentRoot
          $env:RUNNER_TEMP = $persistentRoot
          $env:TEMP = $persistentRoot
          $env:TMP = $persistentRoot
          try {
            tests/windows/windows_hardware_e2e.ps1 -InstallerRoot signed-handoff/installer
            throw 'Prepare phase unexpectedly completed without requesting a reboot.'
          } catch {
            if ($_.Exception.Message -notlike 'Reboot evidence preparation completed.*') { throw }
            Write-Host $_.Exception.Message
          }
          $pending = Join-Path $env:ProgramData 'DokkomplektE2E\pending-reboot.json'
          if (-not (Test-Path -LiteralPath $pending -PathType Leaf)) { throw 'Prepare phase did not create pending reboot plan.' }
          [ordered]@{
            schema='dokkomplekt.windows-reboot-prepare-workflow.v3'
            release_sha='${{ inputs.release_sha }}'
            request_id='${{ inputs.request_id }}'
            signed_handoff_manifest_sha256=(Get-FileHash signed-handoff/SIGNED_HANDOFF.json -Algorithm SHA256).Hash.ToLowerInvariant()
            signed_handoff_verification_sha256=(Get-FileHash verification/release/SIGNED_HANDOFF_VERIFICATION.json -Algorithm SHA256).Hash.ToLowerInvariant()
            prepared_at_utc=[DateTime]::UtcNow.ToString('o')
            persistent_root=$persistentRoot
            pending_reboot_plan=$pending
            reboot_evidence_path=$env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH
          } | ConvertTo-Json -Depth 5 | Set-Content verification/release/WINDOWS_REBOOT_PREPARED.json -Encoding utf8
          Write-Host 'PREPARE PHASE PASSED. Perform a real Windows restart and log back into the hardware runner account.'
      - name: Execute hardware E2E and verify reboot evidence
        if: inputs.reboot_phase == 'verify'
        shell: pwsh
        run: tests/windows/windows_hardware_e2e.ps1 -InstallerRoot signed-handoff/installer
      - name: Archive reboot evidence and clean prepared installation
        if: inputs.reboot_phase == 'verify'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH -Destination verification/release/WINDOWS_REBOOT_E2E_RAW.json -Force
          scripts/cleanup_windows_reboot_preparation.ps1 -EvidencePath $env:DOKKOMPLEKT_REBOOT_EVIDENCE_PATH -OutputPath verification/release/REBOOT_PREPARATION_CLEANUP.json -RemoveRawEvidence
      - name: Bind final hardware evidence index to signed handoff
        if: inputs.reboot_phase == 'verify'
        shell: pwsh
        run: |
          $app = @(Get-ChildItem signed-handoff/application -File -Filter '*.exe')
          if ($app.Count -ne 1) { throw 'signed handoff application count mismatch' }
          scripts/write_windows_hardware_evidence_index.ps1 -InstallerRoot signed-handoff/installer -RuntimeRoot signed-handoff/runtime -ApplicationPath $app[0].FullName
          Copy-Item signed-handoff/SIGNED_HANDOFF.json verification/release/SIGNED_HANDOFF.json -Force
          Copy-Item signed-handoff/SIGNED_HANDOFF.json.sig verification/release/SIGNED_HANDOFF.json.sig -Force
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: Dokkomplekt-Windows-Hardware-E2E-${{ inputs.reboot_phase }}-${{ inputs.request_id }}
          path: |
            source/verification/release/**
            source/.release-gate/**
          if-no-files-found: error
