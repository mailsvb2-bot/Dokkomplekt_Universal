name: Trusted apply production config example hardening

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trusted-production-config-example-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-production-config-examples'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-production-config-examples
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          transport='.github/patches/config-example-hardening.patch.gz.b64'
          gzip_path="$RUNNER_TEMP/config-example-hardening.patch.gz"
          patch_path="$RUNNER_TEMP/config-example-hardening.patch"
          base64 --decode "$transport" > "$gzip_path"
          echo 'd377f146d946fbc7ad085a0875e2998823bf870b398b292910c9281c28b1a6c3  '"$gzip_path" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_path" > "$patch_path"
          echo '06c5111f5df1a2c5887baa00d97ce3f0bccb6c0d11a86305d5cda6046620f513  '"$patch_path" | sha256sum --check --strict
          git apply --check --whitespace=error-all "$patch_path"
          git apply --whitespace=error-all "$patch_path"
          git rm \
            .github/patches/config-example-hardening.patch.gz.b64 \
            .github/patches/config-example-hardening.trigger
          python scripts/generate_source_manifest.py
      - name: Verify contracts and regression wall
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_component_content_policy.py \
            tests/test_release_environment_preflight.py \
            tests/test_source_manifest_integrity.py \
            tests/test_source_fingerprint.py
          python scripts/run_python_contracts_sharded.py --report verification/ci/config-example-hardening-contracts.json
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Publish verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .env.example \
            SOURCE_MANIFEST_SHA256.txt \
            components/components-catalog.example.json \
            docs/PRODUCTION_RELEASE_BOOTSTRAP.md \
            docs/QUEUE_SERVICE_DEPLOYMENT.md \
            tests/test_component_content_policy.py \
            tests/test_release_environment_preflight.py
          git commit -m 'Harden production configuration examples'
          echo "PRODUCT_TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          git push --force origin HEAD:agent/harden-production-config-examples
