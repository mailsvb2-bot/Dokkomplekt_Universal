name: One-shot apply real-user parity

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/real-user-parity-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct and apply product patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/one-shot-real-user-parity/part-* > /tmp/real-user-parity.patch
          git apply --exclude=SOURCE_MANIFEST_SHA256.txt --check /tmp/real-user-parity.patch
          git apply --exclude=SOURCE_MANIFEST_SHA256.txt /tmp/real-user-parity.patch

      - name: Remove one-shot transport from final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/one-shot-apply-real-user-parity.yml .github/one-shot-real-user-parity/part-*

      - name: Regenerate and verify canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --json-report /tmp/source-manifest.json
          python scripts/static_quality_gate.py --source-only

      - name: Stage intended product changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            SOURCE_MANIFEST_SHA256.txt \
            crates/dokkomplekt-core/src/created_documents.rs \
            crates/dokkomplekt-core/src/output_engine.rs \
            crates/dokkomplekt-core/src/output_naming.rs \
            crates/dokkomplekt-core/src/popup_engine.rs \
            src-tauri/src/subsystems/document_commands.rs \
            src-tauri/src/subsystems/generation_preflight.rs \
            src-tauri/src/universal_intake.rs \
            src/App.scenarios.test.tsx \
            src/App.tsx \
            src/components/GenerationPreflightModal.tsx \
            src/hooks/useGenerationPreflight.test.tsx \
            src/hooks/useGenerationPreflight.ts \
            src/lib/api.contract.test.ts \
            src/lib/api.ts \
            src/lib/workflowPromptVisibility.ts
          git diff --cached --check
          git status --short

      - name: Commit final product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align real-user generation workflow'
          git push origin HEAD:agent/real-user-parity-20260820
