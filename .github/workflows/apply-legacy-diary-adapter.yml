name: Apply Legacy Diary Adapter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-legacy-diary-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/full-functional-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply and format functional-parity integration
        run: |
          python scripts/apply_legacy_diary_adapter_patch.py
          python scripts/apply_professional_sources_patch.py
          python scripts/apply_output_folder_parity_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/dokkomplekt-docx/src/lib.rs crates/dokkomplekt-docx/src/legacy_diary_table.rs crates/dokkomplekt-core/src/professional_records.rs crates/dokkomplekt-core/src/output_naming.rs src/components/AdvancedToolsPanel.tsx src/components/UtilityPanel.tsx src/lib/types.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'UX: restore professional sources and output-folder parity'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.head_ref }}; then exit 0; fi
            git pull --rebase origin ${{ github.head_ref }}
          done
          git push origin HEAD:${{ github.head_ref }}
