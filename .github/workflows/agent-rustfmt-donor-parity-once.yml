name: Format donor parity Rust once

on:
  push:
    branches:
      - agent/restore-diary-output-parity

permissions:
  contents: write

concurrency:
  group: format-donor-parity-rust-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/restore-diary-output-parity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-rustfmt-donor-parity-once.yml
      - name: Commit only canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format donor diary parity Rust"
          git push origin HEAD:agent/restore-diary-output-parity
