name: Apply filled medical template fix

on:
  push:
    branches:
      - agent/fix-static-medical-semantic-markup
    paths:
      - .github/workflows/apply-filled-medical-template-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply reviewed patch atomically
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fix.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/fix.patch.gz.b64 | gzip -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          python3 scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt --json-report /tmp/source-manifest-report.json
          git rm .github/workflows/apply-filled-medical-template-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dokkomplekt-core/src/template_wizard.rs crates/dokkomplekt-docx/src/lib.rs src-tauri/src/subsystems/legacy_template_runtime.rs SOURCE_MANIFEST_SHA256.txt
          git commit -m "Fix filled medical template semantic markup"
          git push origin HEAD:agent/fix-static-medical-semantic-markup
