name: Fix Critical Clippy Findings

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fundamental-seven-critical-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply Clippy fixes and verify whole workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          intake = Path('src-tauri/src/universal_intake.rs')
          replace_once(
              intake,
              '    let mut file = File::open(path).map_err(|error| error.to_string())?;\n    let mut bytes = Vec::new();\n    file.take(limit as u64 + 1)',
              '    let file = File::open(path).map_err(|error| error.to_string())?;\n    let mut bytes = Vec::new();\n    file.take(limit as u64 + 1)',
          )

          storage = Path('crates/dokkomplekt-storage/src/lib.rs')
          replace_once(
              storage,
              '        let mut pack = DocumentPack::default();\n        pack.pack_id = "atomic-pack".into();',
              '        let pack = DocumentPack {\n            pack_id: "atomic-pack".into(),\n            ..DocumentPack::default()\n        };',
          )
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p dokkomplekt-storage
          rm .github/workflows/fix-clippy-critical.yml
          mkdir -p verification/ci
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git config user.name mailsvb2-bot
          git config user.email 254540704+mailsvb2-bot@users.noreply.github.com
          git add -A
          git commit -m "Resolve strict Clippy findings in critical fixes"
          git push --force origin HEAD:refs/heads/agent/fundamental-seven-critical-fixes
