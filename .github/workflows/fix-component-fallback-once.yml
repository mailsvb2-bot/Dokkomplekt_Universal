name: Fix bundled component fallback once

on:
  push:
    branches:
      - agent/core-offline-windows-installer
    paths:
      - '.github/workflows/fix-component-fallback-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-component-fallback-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Route fallback availability through the canonical sidecar resolver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/component_manager.rs')
          text = path.read_text(encoding='utf-8')

          old_external = '''    let relevant = descriptor
              .unlocks
              .iter()
              .filter_map(|tool| sidecars.iter().find(|status| status.tool == *tool))
              .collect::<Vec<_>>();
          let externally_available = relevant.len() == descriptor.unlocks.len()
              && relevant.iter().all(|status| status.available);
          let external_state =
              if externally_available && relevant.iter().all(|status| status.state == "bundled") {
                  Some("bundled")
              } else if externally_available {
                  Some("system")
              } else {
                  None
              };
          '''
          new_external = '''    let external_state = external_component_state(&descriptor.unlocks, sidecars);
          '''
          if text.count(old_external) != 1:
              raise SystemExit('status_for_descriptor external availability block drifted')
          text = text.replace(old_external, new_external, 1)

          marker = '''fn status_for_descriptor(
          '''
          helper = '''fn external_component_state(
              unlocks: &[String],
              sidecars: &[crate::universal_intake::SidecarToolStatus],
          ) -> Option<&'static str> {
              let relevant = unlocks
                  .iter()
                  .filter_map(|tool| sidecars.iter().find(|status| status.tool == *tool))
                  .collect::<Vec<_>>();
              let available = relevant.len() == unlocks.len()
                  && relevant.iter().all(|status| status.available);
              if !available {
                  None
              } else if relevant.iter().all(|status| status.state == "bundled") {
                  Some("bundled")
              } else {
                  Some("system")
              }
          }

          fn status_for_descriptor(
          '''
          if text.count(marker) != 1:
              raise SystemExit('status_for_descriptor marker drifted')
          text = text.replace(marker, helper, 1)

          start = text.index('fn fallback_statuses(message: &str) -> Vec<ComponentStatus> {')
          end = text.index('\n#[cfg(any(unix, test))]\nfn sanitized_component_file_mode', start)
          old_fallback = text[start:end]
          if 'available: false' not in old_fallback or 'state: "missing".into()' not in old_fallback:
              raise SystemExit('fallback implementation drifted from expected fail-closed legacy form')
          new_fallback = '''fn fallback_statuses(message: &str) -> Vec<ComponentStatus> {
              let sidecars = crate::universal_intake::sidecar_tool_statuses();
              fallback_statuses_with_sidecars(message, &sidecars)
          }

          fn fallback_statuses_with_sidecars(
              message: &str,
              sidecars: &[crate::universal_intake::SidecarToolStatus],
          ) -> Vec<ComponentStatus> {
              [
                  (
                      "ocr",
                      "Распознавание сканов (OCR)",
                      vec!["tesseract", "pdftotext", "pdftoppm"],
                  ),
                  (
                      "office",
                      "Конвертация и печать",
                      vec!["soffice", "sumatrapdf"],
                  ),
                  (
                      "semantic",
                      "Локальная модель понимания текста",
                      vec!["llama_cpp", "semantic_model"],
                  ),
                  ("archive", "Распаковка входящих архивов", vec!["7z"]),
              ]
              .into_iter()
              .map(|(id, label, unlocks)| {
                  let unlocks = unlocks.into_iter().map(str::to_string).collect::<Vec<_>>();
                  let external_state = external_component_state(&unlocks, sidecars);
                  let available = external_state.is_some();
                  let state = external_state.unwrap_or("missing");
                  ComponentStatus {
                      id: id.into(),
                      label: label.into(),
                      description: String::new(),
                      target: crate::current_update_platform().into(),
                      size_bytes: 0,
                      size_label: "размер появится после проверки каталога".into(),
                      unlocks,
                      state: state.into(),
                      installed: false,
                      available,
                      catalog_available: false,
                      message: if state == "bundled" {
                          "Все инструменты компонента уже встроены в установщик и доступны.".into()
                      } else if state == "system" {
                          "Все инструменты компонента найдены в системе; отдельная загрузка не требуется.".into()
                      } else {
                          message.into()
                      },
                  }
              })
              .collect()
          }
          '''
          text = text[:start] + new_fallback + text[end:]

          test_marker = '''    #[test]
              fn component_paths_reject_traversal_and_absolute_paths() {
          '''
          regression = '''    #[test]
              fn fallback_component_statuses_honor_bundled_runtime_without_catalog() {
                  use crate::universal_intake::SidecarToolStatus;
                  use super::fallback_statuses_with_sidecars;

                  let bundled = |tool: &str| SidecarToolStatus {
                      tool: tool.into(),
                      available: true,
                      bundled: true,
                      state: "bundled".into(),
                      component_id: None,
                      resolved_path: format!("C:/Dokkomplekt/{tool}.exe"),
                      purpose: "test".into(),
                  };
                  let sidecars = vec![bundled("soffice"), bundled("sumatrapdf")];
                  let statuses = fallback_statuses_with_sidecars("catalog unavailable", &sidecars);
                  let office = statuses.iter().find(|status| status.id == "office").unwrap();
                  assert!(office.available);
                  assert!(!office.installed);
                  assert!(!office.catalog_available);
                  assert_eq!(office.state, "bundled");
                  assert!(office.message.contains("встроены в установщик"));

                  let ocr = statuses.iter().find(|status| status.id == "ocr").unwrap();
                  assert!(!ocr.available);
                  assert_eq!(ocr.state, "missing");
                  assert_eq!(ocr.message, "catalog unavailable");
              }

              #[test]
              fn component_paths_reject_traversal_and_absolute_paths() {
          '''
          if text.count(test_marker) != 1:
              raise SystemExit('component test insertion marker drifted')
          text = text.replace(test_marker, regression, 1)
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p dokkomplekt-tauri fallback_component_statuses_honor_bundled_runtime_without_catalog
      - name: Regenerate source manifest for the final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-component-fallback-once.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          mv /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.check.txt
      - name: Commit runtime fallback fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mailsvb2-bot'
          git config user.email 'mailsvb2@gmail.com'
          git add src-tauri/src/component_manager.rs SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          git commit -m 'Make offline component fallback honor bundled runtime'
          git push origin HEAD:agent/core-offline-windows-installer
