name: Source manifest candidate once

on:
  push:
    branches:
      - agent/core-offline-windows-installer
    paths:
      - '.github/workflows/source-manifest-candidate-once.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate manifest for final tree without this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/source-manifest-candidate-once.yml
          python scripts/verify_source_manifest.py --candidate generated-SOURCE_MANIFEST_SHA256.txt || true
          test -s generated-SOURCE_MANIFEST_SHA256.txt
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: source-manifest-candidate-${{ github.run_id }}
          path: generated-SOURCE_MANIFEST_SHA256.txt
          if-no-files-found: error
          retention-days: 1
