              '        "labs.results"\n        | "labs.block"\n        | "labs_block"\n        | "LAB_BLOCK"\n        | "laboratory.results"\n        | "analysis.results"\n        | "analyses.results" => "medical.labs".into(),'
          )
          replace(
              'crates/dokkomplekt-core/src/field_aliases.rs',
              '            "labs.results",\n            "labs.block",\n            "analysis.results",',
              '            "labs.results",\n            "labs.block",\n            "labs_block",\n            "LAB_BLOCK",\n            "laboratory.results",\n            "analysis.results",'
          )
          replace(
              'crates/dokkomplekt-core/src/field_registry.rs',
              '                "labs.results",\n                "labs.block",\n                "analysis.results",',
              '                "labs.results",\n                "labs.block",\n                "labs_block",\n                "LAB_BLOCK",\n                "laboratory.results",\n                "analysis.results",'
          )

          # A template that asks for labs must expose the donor-compatible explicit
          # "no analyses" decision, but only in Medical and only for that document.
          replace(
              'crates/dokkomplekt-core/src/popup_profiles.rs',
              '''    for field_id in &document.required_fields {
        if !is_valid_field_id(field_id) {
            continue;
        }
        let canonical = canonical_storage_field_id(field_id);
        if merged.contains_key(&canonical) {
            continue;
        }
        let mut config =
            popup_config_for_field(&canonical, true, &document.category, &document.role_id);
        apply_profession_defaults(&mut config, &document.category, &document.role_id);
        merged.insert(canonical, config);
    }
    let mut fields = merged.into_values().collect::<Vec<_>>();''',
              '''    for field_id in &document.required_fields {
        if !is_valid_field_id(field_id) {
            continue;
        }
        let canonical = canonical_storage_field_id(field_id);
        if merged.contains_key(&canonical) {
