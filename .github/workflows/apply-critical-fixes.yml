name: Apply Critical Fixes

on:
  push:
    branches: [agent/fix-critical-security-privacy]
    paths:
      - '.github/critical-fixes/**'
      - '.github/workflows/apply-critical-fixes.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/critical-fixes/**'
      - '.github/workflows/apply-critical-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-critical-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'agent/fix-critical-security-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-security-privacy
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and authenticate patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/critical-fixes/part-* | base64 --decode | gzip --decompress > /tmp/critical-fixes.patch
          actual="$(sha256sum /tmp/critical-fixes.patch | awk '{print $1}')"
          expected='33b7fdba410fdd50c4439fbc38c8c371b2016fe99e949ed6d1a6b667b6269060'
          test "$actual" = "$expected"
          git apply --check /tmp/critical-fixes.patch
          git apply /tmp/critical-fixes.patch
      - name: Remove one-use staging mechanism
        shell: bash
        run: |
          rm -rf .github/critical-fixes
          rm -f .github/workflows/apply-critical-fixes.yml
      - name: Install contract-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete local contract wall
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q
          python scripts/verify_starter_content_packs.py
          python scripts/check_reference_data_freshness.py
          python scripts/audit_rust_production_panics.py
      - name: Regenerate and verify source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_source_manifest.py \
            --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report /tmp/source-manifest-report.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python scripts/static_quality_gate.py --source-only
      - name: Commit verified product changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close critical security and privacy defects'
          git push origin HEAD:agent/fix-critical-security-privacy
