name: PR178 bundle memory finalizer

on:
  push:
    branches:
      - ops/pr178-bundle-memory-finalize-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply guarded product patch and validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_head='e316b36671c315cb9202795ced1654bbcf4cc669'
          test "$(git rev-parse HEAD)" = "$expected_head"

          : > /tmp/pr178.patch.b64
          for blob in \
            2f6b260e673ad5c9158af4230506400ba4c25a29 \
            c29dd89448728df1ef3fbcf4ad8da44476b0bba9 \
            3b1e05f913fbc1fbd7fd8f39c1d0640020b1dba6 \
            53c32c544b225c76e986414b87bde8dc514d702f \
            f2d9e55d9c130b32550cc256fd512778f6e71aa9 \
            6f24fa028f3c1c01b35cbb0ab8b3f025d3ba95b6 \
            5fbfce96a17a7c71c601967a787cc566a2ed264f
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/mailsvb2-bot/Dokkomplekt_Universal/git/blobs/$blob" \
              | python -c 'import sys,json,base64; data=json.load(sys.stdin); sys.stdout.write(base64.b64decode(data["content"]).decode("utf-8"))' \
              >> /tmp/pr178.patch.b64
          done
          base64 -d /tmp/pr178.patch.b64 > /tmp/pr178.patch
          echo 'e924bd7add8a85de5b2a5da8fceeb8647a99365799f852293d62fbb2570bf9a7  /tmp/pr178.patch' | sha256sum -c -
          git apply --check /tmp/pr178.patch
          git apply /tmp/pr178.patch

          cargo fmt --all
          cargo fmt --all -- --check
          python -m pip install -r requirements-dev.txt
          cargo test -p dokkomplekt-core
          python -m pytest -q \
            tests/test_donor_diary_output_parity.py \
            tests/test_donor_patient_folder_watcher_parity.py \
            tests/test_source_manifest_integrity.py \
            tests/test_learning_privacy_retention_contract.py || test "$?" = 1

          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python -m pytest -q \
            tests/test_donor_diary_output_parity.py \
            tests/test_donor_patient_folder_watcher_parity.py \
            tests/test_source_manifest_integrity.py \
            tests/test_learning_privacy_retention_contract.py
          python scripts/static_quality_gate.py --source-only
          git diff --check
          test "$(wc -l < src-tauri/src/subsystems/automation_runtime.rs)" -lt 3000

          git status --short
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add \
            SOURCE_MANIFEST_SHA256.txt \
            crates/dokkomplekt-core/src/bundle_decision.rs \
            crates/dokkomplekt-core/src/document_routing.rs \
            crates/dokkomplekt-core/src/kit_learning.rs \
            src-tauri/src/subsystems/automation_runtime.rs \
            src-tauri/src/subsystems/source_intake_commands.rs \
            src-tauri/src/template_snapshot.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'Remember confirmed bundles independently of corpus'
          git push origin HEAD:fix/real-user-workflow-20260907
