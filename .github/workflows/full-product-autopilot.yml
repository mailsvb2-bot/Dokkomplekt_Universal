name: FULL DOKKOMPLEKT AUTOPILOT

on:
  workflow_dispatch:
    inputs:
      scope:
        description: software = hosted full contour; production-hardware = plus signed Windows/Word/printer/reboot gate
        required: true
        default: software
        type: choice
        options:
          - software
          - production-hardware
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-product-autopilot.yml'
      - 'scripts/full_product_autopilot.py'
      - 'verification/autopilot/**'
      - 'tests/test_full_product_autopilot_contract.py'
      - 'docs/FULL_PRODUCT_AUTOPILOT.md'
  pull_request:
    paths:
      - '.github/workflows/full-product-autopilot.yml'
      - 'scripts/full_product_autopilot.py'
      - 'verification/autopilot/**'
      - 'tests/test_full_product_autopilot_contract.py'
      - 'docs/FULL_PRODUCT_AUTOPILOT.md'

permissions:
  contents: read

concurrency:
  group: full-product-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-contract:
    name: Capability coverage contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate that no mandatory capability is manual-only or unmapped
        run: >-
          python scripts/full_product_autopilot.py validate
          --json-report verification/autopilot/coverage-report.json
          --markdown-report verification/autopilot/coverage-report.md
      - name: Run Autopilot governance regression
        run: python -m pytest -q tests/test_full_product_autopilot_contract.py
      - name: Publish coverage report to job summary
        shell: bash
        run: cat verification/autopilot/coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: full-autopilot-coverage
          path: |
            verification/autopilot/coverage-report.json
            verification/autopilot/coverage-report.md
            verification/autopilot/feature-matrix.json
          if-no-files-found: error

  document-oracles:
    name: Document visual oracle and synthetic corpus
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Install controlled document-render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Render DOCX corpus and enforce visual golden pages
        run: python scripts/verify_docx_visual_goldens.py
      - name: Generate 500 semantic cases through the real Rust corpus builder
        shell: bash
        run: |
          mkdir -p verification/autopilot/oracles
          # Use the already-installed named toolchain explicitly. A bare `cargo` makes
          # rustup re-process rust-toolchain.toml components and can conflict with
          # pre-existing cargo-fmt/clippy files on GitHub-hosted runner images.
          cargo +1.97.1 run --locked -p dokkomplekt-core --example corpus_simulation -- 100 > verification/autopilot/oracles/synthetic-corpus.json
      - name: Measure every domain and enforce corpus sanity
        shell: bash
        run: |
          set -euo pipefail
          for domain in accounting hr legal medical education; do
            python scripts/measure_domain.py \
              verification/autopilot/oracles/synthetic-corpus.json \
              --domain "$domain" \
              --output "verification/autopilot/oracles/${domain}-metrics.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('verification/autopilot/oracles')
          corpus = json.loads((root / 'synthetic-corpus.json').read_text(encoding='utf-8'))
          assert corpus['schema'] == 'dokkomplekt.ground-truth-corpus.v1'
          assert len(corpus['entries']) == 500, len(corpus['entries'])
          for domain in ('accounting', 'hr', 'legal', 'medical', 'education'):
              report = json.loads((root / f'{domain}-metrics.json').read_text(encoding='utf-8'))
              assert report['entry_count'] == 100, (domain, report['entry_count'])
              assert report['field_observations'] > 0, domain
              assert report['high_risk_observations'] > 0, domain
              assert report['field_accuracy'] is not None and report['field_accuracy'] >= 0.75, (domain, report['field_accuracy'])
              assert report['kit_completeness'] == 1.0, (domain, report['kit_completeness'])
          print('SYNTHETIC CORPUS ORACLE PASSED: 500 cases across 5 domains')
          PY
      - name: Upload document and corpus oracle evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: full-autopilot-document-oracles
          path: verification/autopilot/oracles/**
          if-no-files-found: warn

  full-autopilot:
    name: Dispatch, wait and aggregate full product verification
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: [coverage-contract, document-oracles]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run complete automated contour
        id: autopilot
        continue-on-error: true
        shell: bash
        run: >-
          python scripts/full_product_autopilot.py dispatch
          --repository "${GITHUB_REPOSITORY}"
          --ref "${GITHUB_REF_NAME}"
          --sha "${GITHUB_SHA}"
          --scope "${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'software' }}"
          --json-report verification/autopilot/FULL_AUTOPILOT_REPORT.json
          --markdown-report verification/autopilot/FULL_AUTOPILOT_REPORT.md
      - name: Always publish unified verdict
        if: always()
        shell: bash
        run: |
          if [[ -f verification/autopilot/FULL_AUTOPILOT_REPORT.md ]]; then
            cat verification/autopilot/FULL_AUTOPILOT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# FULL DOKKOMPLEKT AUTOPILOT' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '❌ Autopilot terminated before a report could be produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: FULL-DOKKOMPLEKT-AUTOPILOT-${{ github.run_number }}
          path: |
            verification/autopilot/FULL_AUTOPILOT_REPORT.json
            verification/autopilot/FULL_AUTOPILOT_REPORT.md
            verification/autopilot/feature-matrix.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce final verdict
        if: steps.autopilot.outcome != 'success'
        run: exit 1
