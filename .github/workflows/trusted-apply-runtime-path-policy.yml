name: Trusted apply runtime path policy

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/unify-runtime-path-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/unify-runtime-path-policy
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact guarded transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/patches/apply_runtime_path_policy.py')
          text = path.read_text('utf-8')
          old = "new_test = '''"
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated-test marker, found {text.count(old)}')
          path.write_text(text.replace(old, "new_test = r'''", 1), encoding='utf-8')
          PY
          python .github/patches/apply_runtime_path_policy.py
          git rm -f \
            .github/patches/apply_runtime_path_policy.py \
            .github/patches/runtime-policy.retry
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git add SOURCE_MANIFEST_SHA256.txt scripts tests
      - name: Verify targeted regression wall
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m py_compile \
            scripts/_release_policy.py \
            scripts/assert_offline_runtime_ready.py \
            scripts/create_offline_runtime_bundle.py \
            scripts/create_runtime_lock.py \
            scripts/prepare_sidecars.py \
            scripts/probe_offline_runtime.py \
            scripts/release_environment_preflight.py
          python -m pytest -q \
            tests/test_runtime_path_policy.py \
            tests/test_release_environment_preflight.py \
            tests/test_v18_3_0_hardening_contracts.py
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Commit verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Unify runtime path and provenance validation"
          git push origin HEAD:agent/unify-runtime-path-policy
