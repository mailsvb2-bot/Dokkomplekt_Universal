name: Apply critical crash-consistency fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-critical-crash-consistency
  cancel-in-progress: true

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-crash-consistency
          fetch-depth: 0

      - name: Apply focused source patch
        run: python .github/patches/agent-critical-crash-fix.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format Rust
        run: cargo fmt --all

      - name: Test storage crash accounting
        run: cargo test -p dokkomplekt-storage

      - name: Test hidden-until-commit publication
        run: cargo test -p dokkomplekt-tauri unique_file_reservation_hides_incomplete_output_until_commit

      - name: Compile Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated fixes and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .agent-critical-fix-trigger
          rm -f .github/patches/agent-critical-crash-fix.py
          rm -f .github/workflows/agent-critical-crash-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix crash-safe document publication and usage accounting"
          git fetch origin agent/fix-critical-crash-consistency
          git rebase origin/agent/fix-critical-crash-consistency
          git push origin HEAD:agent/fix-critical-crash-consistency
