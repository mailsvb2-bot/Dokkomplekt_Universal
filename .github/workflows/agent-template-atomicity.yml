name: Apply atomic template publication fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: agent-template-atomicity
  cancel-in-progress: true

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-crash-consistency
          fetch-depth: 0

      - name: Apply atomic publication patch
        run: |
          python .github/patches/agent-template-atomicity.py
          python .github/patches/agent-template-atomicity-fixture-fix.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format Rust
        run: cargo fmt --all

      - name: Test storage transaction invariants
        run: cargo test -p dokkomplekt-storage

      - name: Compile Tauri tests
        run: cargo check -p dokkomplekt-tauri --tests

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated fix and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/agent-template-atomicity.py
          rm -f .github/patches/agent-template-atomicity-fixture-fix.py
          rm -f .github/workflows/agent-template-atomicity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish template packs and versions atomically"
          git fetch origin agent/fix-critical-crash-consistency
          git rebase origin/agent/fix-critical-crash-consistency
          git push origin HEAD:agent/fix-critical-crash-consistency
