name: Branch Hygiene

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-hygiene.yml
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          branches=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            branches+=("$MERGED_HEAD")
          else
            branches+=(
              "fix/ci-quality-gate"
              "fix/ci-quality-gate-20260726"
            )
          fi

          for branch in "${branches[@]}"; do
            [ -n "$branch" ] || continue
            [ "$branch" != "main" ] || continue
            if gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleted branch: $branch"
            else
              echo "Branch already absent or not deletable: $branch"
            fi
          done

          echo "Remaining branches:"
          gh api --paginate "repos/$REPOSITORY/branches?per_page=100" --jq '.[].name'

          if [ "$EVENT_NAME" = "push" ]; then
            unexpected="$(
              gh api --paginate "repos/$REPOSITORY/branches?per_page=100" --jq '.[].name' \
                | grep -vx 'main' || true
            )"
            if [ -n "$unexpected" ]; then
              echo "Unexpected branches remain:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          fi
