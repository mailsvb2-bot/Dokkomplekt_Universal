name: PR154 RustSec pin refresh

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 154 && github.event.pull_request.head.ref == 'agent/exhaustive-donor-parity-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/exhaustive-donor-parity-20260819
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Pin newly validated upstream RustSec database revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('verification/security/rustsec-advisory-db.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['commit'] = '2f08fbb85332687b721f2f22706d07448369451b'
          data['committed_at_utc'] = '2026-08-18T08:23:07Z'
          data['reason'] = ('The previously blocked upstream revision contained an inconsistent gettext-rs advisory. '
                            'RustSec advisory-db main has advanced to 2f08fbb85332687b721f2f22706d07448369451b, '
                            'which includes the assigned RUSTSEC-2026-0258 h2 advisory; this exact revision is '
                            'validated against the locked Dokkomplekt dependency graph with cargo-audit --deny warnings '
                            'before commit and remains short-lived with the existing fail-closed expiry.')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/verify_rustsec_advisory_pin.py verification/security/rustsec-advisory-db.json
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2
      - name: Validate exact new advisory DB against locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_rustsec_audit.py --pin-report /tmp/rustsec-advisory-db-pin.json
      - name: Remove helper before provenance regeneration
        run: git rm .github/workflows/pr154-rustsec-pin-refresh.yml
      - name: Regenerate source manifest from final clean working tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.verify.txt
          cmp -s SOURCE_MANIFEST_SHA256.txt /tmp/SOURCE_MANIFEST_SHA256.verify.txt
          ! grep -Fq '.github/workflows/pr154-rustsec-pin-refresh.yml' SOURCE_MANIFEST_SHA256.txt
          ! grep -Fq '.github/workflows/pr154-manifest-cleanup.yml' SOURCE_MANIFEST_SHA256.txt
          ! grep -Fq '.github/workflows/pr154-clippy-cleanup.yml' SOURCE_MANIFEST_SHA256.txt
      - name: Preserve source architecture gate
        run: python scripts/static_quality_gate.py --source-only
      - name: Commit validated RustSec rotation
        shell: bash
        run: |
          set -euo pipefail
          git add verification/security/rustsec-advisory-db.json SOURCE_MANIFEST_SHA256.txt
          git diff --cached --check
          git config user.name 'BusinesMetro'
          git config user.email 'mailsvb2@gmail.com'
          git commit -m 'security: refresh validated RustSec advisory DB pin'
          git push origin HEAD:agent/exhaustive-donor-parity-20260819
