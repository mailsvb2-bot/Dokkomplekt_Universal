name: Repair filled medical fix manifest

on:
  push:
    branches:
      - agent/fix-static-medical-semantic-markup
    paths:
      - .github/workflows/repair-filled-medical-manifest.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Remove one-shot workflow and regenerate manifest from final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-filled-medical-manifest.yml
          python3 scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-before-copy.json || true
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python3 scripts/verify_source_manifest.py --candidate SOURCE_MANIFEST_SHA256.txt --json-report /tmp/source-manifest-after-copy.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git commit -m "Refresh source manifest after semantic markup fix"
          git push origin HEAD:agent/fix-static-medical-semantic-markup
