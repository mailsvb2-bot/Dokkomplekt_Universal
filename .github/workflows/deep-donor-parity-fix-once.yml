name: Deep donor parity fix once

on:
  push:
    branches: [fix/medical-diary-source-parity-20260815]

permissions:
  contents: write

concurrency:
  group: deep-donor-parity-fix-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/medical-diary-source-parity-20260815
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply audited parity fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Render-only projection for ambiguous legacy medical aliases.
          path = 'crates/dokkomplekt-core/src/domains/medical_semantics.rs'
          marker = "pub fn title_for_role_scoped_field(field_id: &str) -> Option<&'static str> {"
          helper = '''/// Prepare one template render without leaking ambiguous medical aliases across roles.
          /// Non-medical and medical roles without scoped bindings remain semantically unchanged.
          pub fn case_for_role_scoped_template_render(
              case: &SemanticCase,
              template_text: &str,
          ) -> SemanticCase {
              let analysis = crate::analyze_template_text(template_text);
              if role_scoped_bindings(&analysis.role_id).is_empty() {
                  case.clone()
              } else {
                  case_for_medical_document_render(case, &analysis.role_id)
              }
          }

          '''
          replace_once(path, marker, helper + marker)

          test_marker = '''    #[test]
              fn legacy_generic_value_is_not_destroyed_when_scoped_value_is_missing() {'''
          # The source indentation is four spaces; keep exact marker after dedenting below.
          test_marker = test_marker.replace('              fn ', '    fn ')
          tests = '''    #[test]
          fn template_render_projects_only_the_role_that_owns_legacy_vk_aliases() {
              let mut case = SemanticCase::default();
              put(&mut case, VK_MSE_PROTOCOL_NUMBER, "MSE-10");
              put(&mut case, SICK_LEAVE_VK_PROTOCOL_NUMBER, "SL-20");

              let mse = case_for_role_scoped_template_render(
                  &case,
                  "ВК на МСЭ\nНомер протокола {{medical.protocol_number}}",
              );
              let sick = case_for_role_scoped_template_render(
                  &case,
                  "ВК по больничному листу\nНомер протокола {{medical.protocol_number}}",
              );

              assert_eq!(mse.get("medical.protocol_number"), Some("MSE-10"));
              assert_eq!(sick.get("medical.protocol_number"), Some("SL-20"));
              assert_eq!(case.get("medical.protocol_number"), None);
          }

          #[test]
          fn template_render_does_not_apply_medical_scoping_to_other_professions() {
              let mut case = SemanticCase::default();
              put(&mut case, VK_MSE_PROTOCOL_NUMBER, "MSE-10");
              put(&mut case, "medical.protocol_number", "LEGACY-KEEP");

              let legal = case_for_role_scoped_template_render(
                  &case,
                  "Юридическое заключение\nНомер дела {{case.number}}",
              );
              assert_eq!(legal.get("medical.protocol_number"), Some("LEGACY-KEEP"));
          }

          '''
          # YAML indentation adds ten spaces to here-doc content; cargo fmt normalizes Rust itself.
          tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in tests.splitlines()) + '\n'
          replace_once(path, test_marker, tests + test_marker)

          # 2. Common DOCX seam: text placeholders and image fields use the same projected case.
          path = 'src-tauri/src/subsystems/desktop_io.rs'
          old = '''    let template_text = extract_docx_text(template_path).map_err(|e| e.to_string())?;
              let image_fields = resolve_template_image_fields(app, &template_text, case)?;
              let result =
                  render_docx_file_with_watermark(template_path, output_path, case, strict, watermark)
                      .map_err(|e| e.to_string())?;'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    let template_text = extract_docx_text(template_path).map_err(|e| e.to_string())?;
              let render_case =
                  dokkomplekt_core::domains::medical_semantics::case_for_role_scoped_template_render(
                      case,
                      &template_text,
                  );
              let image_fields = resolve_template_image_fields(app, &template_text, &render_case)?;
              let result = render_docx_file_with_watermark(
                  template_path,
                  output_path,
                  &render_case,
                  strict,
                  watermark,
              )
              .map_err(|e| e.to_string())?;'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          replace_once(path, old, new)
          replace_once(
              path,
              "        let value = case\n            .values\n            .get(field_id)",
              "        let value = render_case\n            .values\n            .get(field_id)",
          )

          # 3. Zero-touch must verify the actual written DOCX exactly like manual batch.
          path = 'src-tauri/src/subsystems/document_commands.rs'
          replace_once(
              path,
              "fn ensure_rendered_document_complete(\n",
              "pub(super) fn ensure_rendered_document_complete(\n",
          )

          path = 'src-tauri/src/subsystems/automation_runtime.rs'
          needle = '''                        .map_err(|e| format!("Не создан «{}»: {e}", doc.button_label))?;
                                  rerendered_documents = rerendered_documents.saturating_add(1);'''
          needle = '\n'.join(line[10:] if line.startswith('          ') else line for line in needle.splitlines())
          replacement = '''                        .map_err(|e| format!("Не создан «{}»: {e}", doc.button_label))?;
                                  super::document_commands::ensure_rendered_document_complete(
                                      doc,
                                      &template_text,
                                      &hydrated.case,
                                      &out_path,
                                  )?;
                                  rerendered_documents = rerendered_documents.saturating_add(1);'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          replace_once(path, needle, replacement)

          # 4. Persist the profession-neutral user output root.
          path = 'src/lib/appSupport.ts'
          replace_once(
              path,
              "export const OUTPUT_PREFS_KEY = 'dokkomplekt.output-folder-parts.v1';\n",
              "export const OUTPUT_PREFS_KEY = 'dokkomplekt.output-folder-parts.v1';\nexport const OUTPUT_ROOT_KEY = 'dokkomplekt.output-root.v1';\n",
          )
          marker = 'export function loadOutputFolderParts(): FolderNamePartDto[] {'
          helper = '''export function loadOutputRoot(): string {
            try {
              const value = localStorage.getItem(OUTPUT_ROOT_KEY)?.trim();
              if (value) return value;
            } catch { /* use generic local default */ }
            return 'output/Готовые документы';
          }

          export function saveOutputRoot(value: string): void {
            const normalized = value.trim();
            if (!normalized) return;
            try { localStorage.setItem(OUTPUT_ROOT_KEY, normalized); } catch { /* storage may be unavailable */ }
          }

          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          replace_once(path, marker, helper + marker)

          path = 'src/App.tsx'
          replace_once(
              path,
              "  errorMessage, fileLabel, inferGuidedMarkupAction, loadAutoPrintPreference, loadOutputFolderParts,\n",
              "  errorMessage, fileLabel, inferGuidedMarkupAction, loadAutoPrintPreference, loadOutputFolderParts, loadOutputRoot,\n",
          )
          replace_once(
              path,
              "  loadPrintCopyPreferences, newDocumentId, normalizeCopyCount, promptToPopupField, readFileBytes,\n",
              "  loadPrintCopyPreferences, newDocumentId, normalizeCopyCount, promptToPopupField, readFileBytes, saveOutputRoot,\n",
          )
          replace_once(
              path,
              "  const [outputRoot, setOutputRoot] = useState('output/Готовые документы');\n",
              "  const [outputRoot, setOutputRoot] = useState(loadOutputRoot);\n",
          )
          marker = '''  useEffect(() => {
              void updateBackgroundWatcherPreferences(autoPrint, printCopies).catch(() => {'''
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines())
          insertion = '''  useEffect(() => {
              saveOutputRoot(outputRoot);
            }, [outputRoot]);

          '''
          insertion = '\n'.join(line[10:] if line.startswith('          ') else line for line in insertion.splitlines()) + '\n'
          replace_once(path, marker, insertion + marker)

          path = 'src/lib/appSupport.selection.test.ts'
          replace_once(
              path,
              "import { shouldSelectDocumentByDefault } from './appSupport';\n",
              "import { loadOutputRoot, OUTPUT_ROOT_KEY, saveOutputRoot, shouldSelectDocumentByDefault } from './appSupport';\n",
          )
          marker = "describe('default document selection', () => {"
          output_tests = '''describe('output root persistence', () => {
            it('remembers the user-selected generic output folder across restarts', () => {
              localStorage.removeItem(OUTPUT_ROOT_KEY);
              expect(loadOutputRoot()).toBe('output/Готовые документы');

              saveOutputRoot('  D:/Работа/Готовые документы  ');
              expect(loadOutputRoot()).toBe('D:/Работа/Готовые документы');
            });

            it('does not replace a remembered folder with an empty edit', () => {
              localStorage.setItem(OUTPUT_ROOT_KEY, 'C:/Documents/Ready');
              saveOutputRoot('   ');
              expect(loadOutputRoot()).toBe('C:/Documents/Ready');
            });
          });

          '''
          output_tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in output_tests.splitlines()) + '\n'
          replace_once(path, marker, output_tests + marker)
          PY

          cargo fmt --all
          rm .github/workflows/deep-donor-parity-fix-once.yml

      - name: Targeted Rust regression
        run: cargo test -p dokkomplekt-core medical_semantics
      - name: Targeted UI regression
        run: |
          npm ci
          npx vitest run --config vitest.config.ts src/lib/appSupport.selection.test.ts
      - name: Commit audited fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/dokkomplekt-core/src/domains/medical_semantics.rs \
                  src-tauri/src/subsystems/desktop_io.rs \
                  src-tauri/src/subsystems/document_commands.rs \
                  src-tauri/src/subsystems/automation_runtime.rs \
                  src/lib/appSupport.ts src/lib/appSupport.selection.test.ts src/App.tsx \
                  .github/workflows/deep-donor-parity-fix-once.yml
          git diff --cached --check
          git commit -m "fix: preserve donor document completion contracts"
          git push origin HEAD:fix/medical-diary-source-parity-20260815
