name: Agent Universal Preflight Popup UI

on:
  push:
    branches:
      - agent/donor-parity-final-audit

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/donor-parity-final-audit
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply universal preflight popup
        run: python3 scripts/agent_preflight_popup_patch.py
      - name: Verify UI contract
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
      - name: Commit product changes and clean helpers
        shell: bash
        run: |
          rm .github/workflows/agent-preflight-popup-ui.yml scripts/agent_preflight_popup_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore blocking preflight popup for selected document sets"
          git push origin HEAD:agent/donor-parity-final-audit
