name: Legacy static template integration v2 (one-shot)

on:
  push:
    branches: [fix/legacy-static-template-intelligence-20260815]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Implement legacy static template intelligence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/legacy-static-template-intelligence-20260815
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Patch audited runtime and UI seams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          # Same-module include: no fake child module and no duplicate state.
          p = Path('src-tauri/src/main.rs')
          text = p.read_text(encoding='utf-8')
          legacy_include = 'include!("subsystems/legacy_template_runtime.rs");'
          document_include = 'include!("subsystems/document_commands.rs");'
          if legacy_include not in text:
              if text.count(document_include) != 1:
                  raise SystemExit('document_commands include is not unique')
              text = text.replace(document_include, legacy_include + '\n' + document_include, 1)
          write(str(p), text)

          # Tauri analysis must return the exact re-extracted text of a derived template.
          p = Path('src-tauri/src/subsystems/document_commands.rs')
          text = p.read_text(encoding='utf-8')
          if 'extracted_text: String,' not in text.split('struct AnalyzeTemplateResponse', 1)[1].split('}', 1)[0]:
              anchor = '    core_pipeline_json: serde_json::Value,\n'
              pos = text.find(anchor, text.find('struct AnalyzeTemplateResponse'))
              if pos < 0:
                  raise SystemExit('AnalyzeTemplateResponse anchor not found')
              pos += len(anchor)
              text = text[:pos] + '    extracted_text: String,\n' + text[pos:]
          constructor_anchor = '        core_pipeline_json: serde_json::to_value(core_pipeline).map_err(|e| e.to_string())?,\n'
          constructor_start = text.find('Ok(AnalyzeTemplateResponse {')
          if constructor_start < 0:
              raise SystemExit('AnalyzeTemplateResponse constructor not found')
          constructor_end = text.find('    })', constructor_start)
          if 'extracted_text:' not in text[constructor_start:constructor_end]:
              pos = text.find(constructor_anchor, constructor_start, constructor_end)
              if pos < 0:
                  raise SystemExit('AnalyzeTemplateResponse constructor anchor not found')
              pos += len(constructor_anchor)
              text = text[:pos] + '        extracted_text: template_text.to_string(),\n' + text[pos:]

          start_marker = '#[derive(Debug, Deserialize)]\nstruct ConfirmTemplatesRequest {'
          end_marker = '#[derive(Debug, Deserialize)]\nstruct RenameDocumentButtonRequest {'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('confirm_template_setup markers not found')
          replacement = textwrap.dedent(r'''#[derive(Debug, Deserialize)]
          struct ConfirmTemplatesRequest {
              rows: Vec<TemplateConfirmationRow>,
              #[serde(default)]
              auto_infer_static_templates: bool,
          }

          #[tauri::command]
          fn confirm_template_setup(
              req: ConfirmTemplatesRequest,
              state: State<'_, AppState>,
              app: tauri::AppHandle,
          ) -> Result<DocumentPack, String> {
              if req.rows.is_empty() {
                  return Err("Выберите хотя бы один шаблон Word.".into());
              }
              if req
                  .rows
                  .iter()
                  .any(|row| row.editable_button_label.trim().is_empty())
              {
                  return Err("У каждого шаблона должно быть название кнопки.".into());
              }

              let requested_rows = req.rows;
              let (rows, _inference_workspace, _inference_summary) = if req.auto_infer_static_templates {
                  infer_static_template_rows(&app, &requested_rows)?
              } else {
                  (
                      requested_rows,
                      None,
                      LegacyTemplateInferenceSummary::default(),
                  )
              };
              let mut incoming =
                  create_pack_from_confirmations("incoming", "Новые шаблоны", &rows).pack;
              let template_snapshots = rows
                  .iter()
                  .map(|row| {
                      template_snapshot::TemplateSnapshot::capture(
                          &app,
                          &row.template_path,
                          &row.editable_button_label,
                      )
                      .map(|snapshot| (row.document_id.clone(), snapshot))
                  })
                  .collect::<Result<BTreeMap<_, _>, _>>()?;
              let mut drafts = Vec::with_capacity(rows.len());
              for row in &rows {
                  let snapshot = template_snapshots
                      .get(&row.document_id)
                      .ok_or_else(|| format!("Не найден snapshot шаблона {}.", row.document_id))?;
                  drafts.push(prepare_template_version_draft(
                      &app,
                      &row.document_id,
                      snapshot.path(),
                      snapshot.sha256(),
                      "Первичная публикация пользовательского шаблона.",
                  )?);
              }
              template_snapshot::ensure_all_current(&template_snapshots)?;
              for draft in &drafts {
                  let document = incoming
                      .documents
                      .iter_mut()
                      .find(|document| document.id == draft.document_id)
                      .ok_or_else(|| {
                          format!(
                              "Не найден документ {} для привязки опубликованной версии.",
                              draft.document_id
                          )
                      })?;
                  document.template_path = draft.template_path.clone();
              }
              let (result, _) = publish_pack_with_template_versions(&app, &state, &drafts, |pack| {
                  merge_document_pack(pack, incoming);
                  Ok(())
              })?;
              Ok(result)
          }

          ''')
          text = text[:start] + replacement + text[end:]
          write(str(p), text)

          # Thin API: only transport the explicit inference choice and re-extracted text.
          p = Path('src/lib/api.ts')
          text = p.read_text(encoding='utf-8')
          api_type_start = text.find('export type AnalyzeTemplateResponse = {')
          api_type_end = text.find('};', api_type_start)
          if api_type_start < 0 or api_type_end < 0:
              raise SystemExit('AnalyzeTemplateResponse TS type not found')
          if 'extracted_text:' not in text[api_type_start:api_type_end]:
              anchor = '  core_pipeline_json?: unknown;\n'
              pos = text.find(anchor, api_type_start, api_type_end)
              if pos < 0:
                  raise SystemExit('TS AnalyzeTemplateResponse anchor not found')
              pos += len(anchor)
              text = text[:pos] + '  extracted_text: string;\n' + text[pos:]
          confirm_start = text.find('export async function confirmTemplateSetup(')
          confirm_end = text.find('\n}\n', confirm_start)
          if confirm_start < 0 or confirm_end < 0:
              raise SystemExit('confirmTemplateSetup TS function not found')
          confirm_end += 3
          text = text[:confirm_start] + textwrap.dedent('''
          export async function confirmTemplateSetup(rows: TemplateConfirmationRowDto[], autoInferStaticTemplates = false): Promise<DocumentPack> {
            return callRust('confirm_template_setup', { req: { rows, auto_infer_static_templates: autoInferStaticTemplates } });
          }
          ''').lstrip('\n') + text[confirm_end:]
          write(str(p), text)

          # Real setup flow: existing learning commands become user-visible.
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')
          if 'applyTemplateLearningMap' not in text.split("from './lib/api';", 1)[0]:
              text = text.replace(
                  'applyScanner, applyTemplateMarkup, applyWordScannerSelection',
                  'applyScanner, applyTemplateLearningMap, applyTemplateMarkup, applyWordScannerSelection',
                  1,
              )
          if 'importLearningExampleFile' not in text.split("from './lib/api';", 1)[0]:
              text = text.replace(
                  'getPrintTriage, importTemplateFile, listLearnedScannerRules',
                  'getPrintTriage, importLearningExampleFile, importTemplateFile, learnTemplateFromExamples, listLearnedScannerRules',
                  1,
              )

          static_start = text.find('    const staticRows = rows.filter((row) => row.is_static_copy);')
          if static_start < 0:
              raise SystemExit('static template setup block start not found')
          pack_line = "    const pack = await run('confirm_template_setup', () => confirmTemplateSetup(confirmedRows));"
          static_end = text.find(pack_line, static_start)
          if static_end < 0:
              raise SystemExit('static template setup block end not found')
          static_end += len(pack_line)
          static_replacement = textwrap.dedent('''
              const confirmedRows = buildTemplateConfirmationRows(rows, pendingTemplates, buttonLabel, draftPopupFields, draftDomainOverride);
              const staticRows = confirmedRows.filter((row) => row.is_static_copy);
              let autoInferStaticTemplates = false;
              if (staticRows.length) {
                autoInferStaticTemplates = await dialogs.confirm({
                  title: 'Разметить старые шаблоны автоматически?',
                  message: `В ${staticRows.length} шаблон(ах) нет {{полей}}. Программа разметит только однозначные подписи с явным пустым местом, например «ФИО ____». Исходные Word-файлы не изменяются; неоднозначные места останутся нетронутыми.`,
                  confirmLabel: 'Найти и разметить',
                });
                if (!autoInferStaticTemplates) {
                  setStatus(`Кнопки будут созданы. Неразмеченные шаблоны останутся точными статическими копиями: ${staticRows.map((row) => row.detected_title).join(', ')}.`);
                }
              }
              const pack = await run('confirm_template_setup', () => confirmTemplateSetup(confirmedRows, autoInferStaticTemplates));
          ''').strip('\n')
          # Restore function indentation removed by dedent.
          static_replacement = '\n'.join('    ' + line if line else line for line in static_replacement.splitlines())
          text = text[:static_start] + static_replacement + text[static_end:]

          if 'async function learnPendingTemplateFromExamples' not in text:
              insert_before = "  async function startGuidedSourceScanner(preselectedFieldId = '') {"
              pos = text.find(insert_before)
              if pos < 0:
                  raise SystemExit('guided scanner insertion point not found')
              learning_function = textwrap.dedent(r'''  async function learnPendingTemplateFromExamples(documentId: string, files: File[]) {
                const current = pendingTemplates.find((item) => item.document_id === documentId);
                if (!current) return;
                if (files.length < 3 || files.length > 10) {
                  setStatus('Для обучения выберите от 3 до 10 заполненных примеров одного и того же шаблона.');
                  return;
                }

                const completedExamplePaths: string[] = [];
                for (const file of files) {
                  const buffer = await readFileBytes(file);
                  const imported = await run('import_learning_example_file', () =>
                    importLearningExampleFile(file.name, arrayBufferToBase64(buffer)));
                  if (!imported) return;
                  completedExamplePaths.push(imported.source_path);
                }
                const learned = await run('learn_template_from_examples_command', () => learnTemplateFromExamples({
                  blankTemplatePath: current.template_path,
                  completedExamplePaths,
                  defaultYear: DEFAULT_YEAR,
                }));
                if (!learned) return;
                const confidentFields = learned.fields.filter((field) => field.confidence >= 0.9);
                if (!confidentFields.length) {
                  setStatus('Примеры изучены, но однозначных полей не найдено. Шаблон не изменён — используйте ручную разметку или покажите место в Word.');
                  return;
                }
                const previewFields = confidentFields
                  .slice(0, 8)
                  .map((field) => `${field.field_id} (${Math.round(field.confidence * 100)}%)`)
                  .join(', ');
                const accepted = await dialogs.confirm({
                  title: 'Применить найденную карту шаблона?',
                  message: `Найдено надёжных полей: ${confidentFields.length}. ${previewFields}${confidentFields.length > 8 ? '…' : ''}. Будет создана новая размеченная копия; исходный Word останется неизменным.`,
                  confirmLabel: 'Применить карту',
                });
                if (!accepted) {
                  setStatus('Обучение отменено на этапе подтверждения. Исходный шаблон не изменён.');
                  return;
                }

                const outputPath = cursorMarkedTemplatePath(current.template_path, `${documentId}-learned`);
                const applied = await run('apply_template_learning_map', () => applyTemplateLearningMap(
                  current.template_path,
                  outputPath,
                  confidentFields.map((field) => ({
                    field_id: field.field_id,
                    line_index: field.blank_line_index,
                    blank_line: field.blank_line,
                    common_prefix: field.common_prefix,
                    common_suffix: field.common_suffix,
                  })),
                ));
                if (!applied) return;
                if (!applied.applied_field_ids.length) {
                  setStatus('Карта не смогла однозначно примениться к шаблону. Исходный файл не изменён.');
                  return;
                }
                const analyzed = await run('analyze_template_file', () =>
                  analyzeTemplateFile(applied.output_path, current.document_id, current.button_label));
                if (!analyzed) return;
                setPendingTemplates((previous) => previous.map((item) => item.document_id === documentId
                  ? {
                      ...item,
                      template_path: applied.output_path,
                      extracted_text: analyzed.extracted_text,
                      popup_fields: analyzed.document.popup_fields ?? item.popup_fields,
                    }
                  : item));
                if (importedTemplatePath === current.template_path) setImportedTemplatePath(applied.output_path);
                if (templateText === current.extracted_text) setTemplateText(analyzed.extracted_text);
                setStatus(`Шаблон обучен: подтверждено и размечено полей — ${applied.applied_field_ids.length}. Исходный Word сохранён без изменений.`);
              }

          ''')
              text = text[:pos] + learning_function + text[pos:]
          modal_prop_anchor = '          onMarkupPendingTemplate={markupPendingTemplate}\n'
          if 'onLearnPendingTemplate={learnPendingTemplateFromExamples}' not in text:
              pos = text.find(modal_prop_anchor)
              if pos < 0:
                  raise SystemExit('TemplateSetupModal App prop anchor not found')
              pos += len(modal_prop_anchor)
              text = text[:pos] + '          onLearnPendingTemplate={learnPendingTemplateFromExamples}\n' + text[pos:]
          write(str(p), text)

          p = Path('src/components/TemplateSetupModal.tsx')
          text = p.read_text(encoding='utf-8')
          if 'onLearnPendingTemplate(documentId: string, files: File[])' not in text:
              anchor = "  onMarkupPendingTemplate(documentId: string, selectedText: string, fieldId: string, action: 'replace' | 'insert_after'): Promise<void>;\n"
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('TemplateSetupModal prop anchor not found')
              pos += len(anchor)
              text = text[:pos] + '  onLearnPendingTemplate(documentId: string, files: File[]): Promise<void>;\n' + text[pos:]
          if 'Обучить по 3–10 примерам' not in text:
              lines = text.splitlines(keepends=True)
              button_index = next((i for i, line in enumerate(lines) if 'onStartGuidedPendingScanner(activePending.document_id)' in line), None)
              if button_index is None:
                  raise SystemExit('guided template button line not found')
              addition = textwrap.dedent('''
                  <label className="softBtn fileBtn">
                    <i className="ti ti-school" aria-hidden="true" /> Обучить по 3–10 примерам
                    <input
                      type="file"
                      multiple
                      accept=".docx,.docm,.pdf,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp"
                      onChange={(event) => {
                        const files = Array.from(event.currentTarget.files ?? []);
                        event.currentTarget.value = '';
                        if (files.length) void props.onLearnPendingTemplate(activePending.document_id, files);
                      }}
                      style={{ display: 'none' }}
                    />
                  </label>
              ''')
              indent = lines[button_index][:len(lines[button_index]) - len(lines[button_index].lstrip())]
              addition = ''.join(indent + line if line.strip() else line for line in addition.splitlines(keepends=True))
              lines.insert(button_index + 1, addition)
              text = ''.join(lines)
          write(str(p), text)
          PY

      - name: Prove exact donor F-code parity and pin it offline
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import textwrap
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              'https://raw.githubusercontent.com/mailsvb2-bot/Dokkomplekt/main/icd10_f_data.py',
              headers={'User-Agent': 'dokkomplekt-parity-gate'},
          )
          with urlopen(request, timeout=30) as response:
              donor_source = response.read().decode('utf-8')
          tree = ast.parse(donor_source)
          donor_rows = None
          for node in tree.body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == '_BASE_ROWS':
                  donor_rows = ast.literal_eval(node.value)
                  break
              if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '_BASE_ROWS' for target in node.targets):
                  donor_rows = ast.literal_eval(node.value)
                  break
          if donor_rows is None:
              raise SystemExit('donor _BASE_ROWS not found')
          donor = {}
          for code, title in donor_rows:
              if code in donor:
                  raise SystemExit(f'duplicate donor code: {code}')
              donor[code] = title

          universal = {}
          for raw in Path('resources/icd10_f.tsv').read_text(encoding='utf-8').splitlines():
              if not raw or raw.startswith('#'):
                  continue
              parts = raw.split('\t')
              if len(parts) < 4:
                  raise SystemExit(f'malformed universal F row: {raw!r}')
              code, title, _kind, source = parts[:4]
              if source != 'icd10_f_data.py' or '-' in code:
                  continue
              if code in universal:
                  raise SystemExit(f'duplicate universal donor-sourced code: {code}')
              universal[code] = title

          missing = sorted(set(donor) - set(universal))
          extra = sorted(set(universal) - set(donor))
          mismatched = sorted(code for code in donor.keys() & universal.keys() if donor[code] != universal[code])
          if missing or extra or mismatched:
              print('missing:', missing[:30])
              print('extra:', extra[:30])
              print('mismatched:', [(code, donor[code], universal[code]) for code in mismatched[:20]])
              raise SystemExit('Universal F catalog is not an exact donor _BASE_ROWS mirror')

          canonical = ''.join(f'{code}\t{donor[code]}\n' for code in sorted(donor))
          digest = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          count = len(donor)
          print(f'Exact donor F parity: {count} rows, sha256={digest}')
          test = f'''from __future__ import annotations

          import hashlib
          from pathlib import Path

          EXPECTED_DONOR_F_ROW_COUNT = {count}
          EXPECTED_DONOR_F_SHA256 = "{digest}"

          def _donor_sourced_rows() -> dict[str, str]:
              rows: dict[str, str] = {{}}
              path = Path(__file__).resolve().parents[1] / "resources" / "icd10_f.tsv"
              for raw in path.read_text(encoding="utf-8").splitlines():
                  if not raw or raw.startswith("#"):
                      continue
                  parts = raw.split("\\t")
                  assert len(parts) >= 4, raw
                  code, title, _kind, source = parts[:4]
                  if source != "icd10_f_data.py" or "-" in code:
                      continue
                  assert code not in rows, f"duplicate donor-sourced F code: {{code}}"
                  rows[code] = title
              return rows

          def test_icd10_f_catalog_is_exact_pinned_donor_mirror() -> None:
              rows = _donor_sourced_rows()
              assert len(rows) == EXPECTED_DONOR_F_ROW_COUNT
              canonical = "".join(f"{{code}}\\t{{rows[code]}}\\n" for code in sorted(rows))
              assert hashlib.sha256(canonical.encode("utf-8")).hexdigest() == EXPECTED_DONOR_F_SHA256
          '''
          Path('tests/test_icd10_f_donor_parity.py').write_text(textwrap.dedent(test), encoding='utf-8')
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Targeted core inference tests
        run: cargo test -p dokkomplekt-core legacy_template_inference

      - name: Tauri compile seam
        run: cargo check -p dokkomplekt-tauri

      - name: Frontend tests and typecheck
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Offline donor parity regression
        run: python -m pytest -q tests/test_icd10_f_donor_parity.py

      - name: Remove one-shot workflow and commit verified sources
        shell: bash
        run: |
          git rm .github/workflows/legacy-static-template-inference-once-v2.yml
          git status --short
          git config user.name "mailsvb2-bot"
          git config user.email "mailsvb2@gmail.com"
          git add crates/dokkomplekt-core/src/legacy_template_inference.rs \
                  crates/dokkomplekt-core/src/lib.rs \
                  src-tauri/src/subsystems/legacy_template_runtime.rs \
                  src-tauri/src/subsystems/document_commands.rs \
                  src-tauri/src/main.rs \
                  src/lib/api.ts \
                  src/App.tsx \
                  src/components/TemplateSetupModal.tsx \
                  tests/test_icd10_f_donor_parity.py
          git diff --cached --check
          git commit -m "Implement legacy static template intelligence"
          git push origin HEAD:fix/legacy-static-template-intelligence-20260815
