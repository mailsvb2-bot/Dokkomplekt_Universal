name: Trusted apply standalone license lock enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trusted-standalone-license-lock-enforcement
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/enforce-standalone-license-lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/enforce-standalone-license-lock
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          transport='.github/patches/standalone-lock-enforcement.patch.gz.b64'
          gzip_path="$RUNNER_TEMP/standalone-lock-enforcement.patch.gz"
          patch_path="$RUNNER_TEMP/standalone-lock-enforcement.patch"
          base64 --decode "$transport" > "$gzip_path"
          echo '61b0cd4c6f500ac6845d9b755b7919076c00a2ce251603dfc62054417c54ff16  '"$gzip_path" | sha256sum --check --strict
          gzip --decompress --stdout "$gzip_path" > "$patch_path"
          echo 'f40d63928ece0a43a4c2e9b105f8c381e0b308c44b507ef86e43f32c8bc303cf  '"$patch_path" | sha256sum --check --strict
          git apply --check --whitespace=error-all "$patch_path"
          git apply --whitespace=error-all "$patch_path"
          git rm \
            .github/patches/standalone-lock-enforcement.patch.gz.b64 \
            .github/patches/standalone-lock-enforcement.trigger
      - name: Verify governance and regression wall
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_v18_4_3_generation_plan_governance.py \
            tests/test_source_manifest_integrity.py \
            tests/test_source_fingerprint.py
          python scripts/run_python_contracts_sharded.py --report verification/ci/standalone-lock-contracts.json
          python scripts/static_quality_gate.py --source-only
          python scripts/verify_source_manifest.py
          git diff --check
      - name: Publish verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/quality-gate.yml SOURCE_MANIFEST_SHA256.txt tests/test_v18_4_3_generation_plan_governance.py
          git commit -m 'Enforce standalone license-server lock in CI'
          git push --force origin HEAD:agent/enforce-standalone-license-lock
