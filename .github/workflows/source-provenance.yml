name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest matches tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Humanize advanced UI language
        if: github.head_ref == 'ui/client-first-neutral'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/AutomationControlCenter.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "execute('пакетное подтверждение risk-gate'": "execute('подтверждение спорных данных'",
              "execute('настройки локальной SemanticModel'": "execute('настройки локального анализа'",
              "Настройки локальной SemanticModel сохранены. Разрешены только loopback-адреса; документы не отправляются во внешнюю сеть.": "Настройки локального анализа сохранены. Документы обрабатываются только на этом компьютере и не отправляются во внешнюю сеть.",
              "execute('проверка локальной SemanticModel'": "execute('проверка локального анализа'",
              "Калибровка домена «${status.domain}» проверена. Автопечать использует только подписанные held-out метрики.": "Настройки автопечати для набора «${status.domain}» проверены. Используются только подписанные контрольные показатели.",
              "<strong>Локальная SemanticModel</strong>": "<strong>Локальное понимание документов</strong>",
              "<small>Ollama или llama.cpp на этом компьютере. Модель предлагает структурированные факты, а Rust-ядро проверяет типы, форматы и контрольные суммы перед применением.</small>": "<small>Подключите локальный модуль анализа текста. Программа перепроверит найденные значения, форматы и контрольные суммы перед применением.</small>",
              "<label>Провайдер<select": "<label>Способ подключения<select",
              "<small>Для high-risk полей при 2–3 проходах принимается только значение, на котором независимо сошлись минимум два ответа.</small>": "<small>Для важных полей значение принимается только тогда, когда минимум две независимые проверки дали одинаковый результат.</small>",
              "shadow-mode: сравнивать с deterministic-парсером, но не влиять на документы": "Режим наблюдения: сравнивать результаты, но не изменять документы",
              "с согласия пилота сохранять обезличенный корпус «предложение → финал специалиста → фактический комплект»": "с согласия пользователя сохранять обезличенную историю проверок и исправлений",
              "использовать модель в zero-touch; сомнительные значения всё равно блокируются risk-gate": "использовать локальный анализ при автоматической обработке; сомнительные значения всё равно потребуют проверки",
              ">Экспортировать корпус</button>": ">Экспортировать историю проверок</button>",
              "<b>Корпус: {corpusStatus.entry_count} дел</b>": "<b>История проверок: {corpusStatus.entry_count} записей</b>",
              "<strong>Доказанная автопечать</strong>": "<strong>Безопасная автопечать</strong>",
              "<small>Без подписанного доменного порога комплект создаётся только для review. Порог принимается лишь после сравнения с финалом специалиста и отдельной held-out проверки; интернет не нужен.</small>": "<small>Автопечать включается только после подтверждённой проверки качества. Пока такой проверки нет, комплект создаётся для просмотра перед печатью.</small>",
              "Подписанные пороги не установлены — автоматическая печать заблокирована fail-closed.": "Подтверждённые настройки качества не установлены — автоматическая печать пока недоступна.",
              "<span><b>{item.domain}</b> · auto ≥ {(item.auto_min_confidence * 100).toFixed(1)}%<small>{item.message}</small><small>Обучение: {item.training_observations}; held-out: {item.holdout_observations}; предельная ошибка: {(item.max_auto_error_rate * 100).toFixed(2)}%</small></span>": "<span><b>{item.domain}</b> · порог автопечати ≥ {(item.auto_min_confidence * 100).toFixed(1)}%<small>{item.message}</small><small>Проверено примеров: {item.training_observations}; контрольных примеров: {item.holdout_observations}; допустимая ошибка: {(item.max_auto_error_rate * 100).toFixed(2)}%</small></span>",
              "<small>Календарь обновляется только подписанным Ed25519-пакетом. Неподтверждённые годы по-прежнему блокируются fail-closed.</small>": "<small>Календарь обновляется только проверенным подписанным пакетом. Неподтверждённые годы не используются в расчётах.</small>",
              "<small>Паки проверяются тем же встроенным Ed25519-ключом, что и обновления. Докачанные инструменты хранятся в пользовательской папке, проверяются по SHA-256 и после установки работают офлайн.</small>": "<small>Дополнительные компоненты проверяются встроенной цифровой подписью и контрольной суммой. После установки они работают без интернета.</small>",
              "<small>Каждый zero-touch запуск проходит явные состояния. Незавершённое дело можно повторить, а завершённый комплект — безопасно переиздать новой атомарной попыткой без удаления прежнего результата.</small>": "<small>Каждая автоматическая обработка имеет понятный статус. Незавершённую задачу можно повторить, а готовый комплект — создать заново без удаления прежнего результата.</small>",
              "<span>Zero-touch <b>{metrics.zero_touch_sources}</b></span><span>Доля zero-touch <b>{percent(metrics.zero_touch_sources, metrics.processed_sources)}</b></span>": "<span>Автоматически обработано <b>{metrics.zero_touch_sources}</b></span><span>Доля автоматической обработки <b>{percent(metrics.zero_touch_sources, metrics.processed_sources)}</b></span>",
              "<span>Измеренное машинное время <b>{formatMinutes((metrics.processing_milliseconds ?? 0)/60000)}</b></span><span>В очередь ревью печати <b>{metrics.print_review_queued ?? 0}</b></span>": "<span>Время автоматической обработки <b>{formatMinutes((metrics.processing_milliseconds ?? 0)/60000)}</b></span><span>На проверку перед печатью <b>{metrics.print_review_queued ?? 0}</b></span>",
              "Горизонт подтверждён до ${last} года. Feed проверяется при запуске.": "Календарь подтверждён до ${last} года и проверяется при запуске.",
              "Расчёты будущих рабочих сроков будут остановлены fail-closed.": "Расчёты будущих рабочих сроков будут остановлены до обновления календаря.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing UI phrase: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          scenario = Path('src/App.scenarios.test.tsx')
          text = scenario.read_text(encoding='utf-8')
          for old, new in {
              "screen.getByText('Локальная SemanticModel')": "screen.getByText('Локальное понимание документов')",
              "/Экспортировать корпус/": "/Экспортировать историю проверок/",
              "screen.getByText('Доказанная автопечать')": "screen.getByText('Безопасная автопечать')",
          }.items():
              if old not in text:
                  raise SystemExit(f'missing scenario phrase: {old}')
              text = text.replace(old, new)
          scenario.write_text(text, encoding='utf-8')

          contract = Path('tests/test_v18_1_2_grounding_distributed_release_contracts.py')
          text = contract.read_text(encoding='utf-8')
          old = 'self.assertIn("shadow-mode: сравнивать", ui)'
          new = 'self.assertIn("Режим наблюдения: сравнивать результаты, но не изменять документы", ui)'
          if old not in text:
              raise SystemExit('legacy shadow-mode contract not found')
          contract.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git show origin/main:.github/workflows/source-provenance.yml > .github/workflows/source-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace technical jargon with client language'
          git push origin HEAD:ui/client-first-neutral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Upload source-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-candidate
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
