fn current_watcher_handoff_owner(exe: &Path, ready: bool) -> Result<WatcherHandoffOwner, String> {
    let (_, _, executable_sha256) = file_content_signature(exe)?;
    Ok(WatcherHandoffOwner {
        generation: Uuid::new_v4().to_string(),
        executable: exe.display().to_string(),
        executable_sha256,
        ready,
    })
}

fn watcher_handoff_owner_matches_current(
    owner: &WatcherHandoffOwner,
    exe: &Path,
    executable_sha256: &str,
) -> bool {
    owner.ready
        && watcher_executable_path_matches(&owner.executable, exe)
        && owner.executable_sha256.eq_ignore_ascii_case(executable_sha256)
}

fn watcher_handoff_owner_is_retired(
    captured: Option<&WatcherHandoffOwner>,
    latest: Option<&WatcherHandoffOwner>,
) -> bool {
    match (captured, latest) {
        (Some(captured), Some(latest)) => {
            latest.ready
                && !latest.generation.trim().is_empty()
                && latest.generation != captured.generation
        }
        _ => false,
    }
}

fn stop_in_process_watcher(app: &tauri::AppHandle) {
    let state = app.state::<AppState>();
    if let Ok(mut guard) = state.watcher.lock() {
        if let Some(handle) = guard.take() {
            handle.stop.store(true, Ordering::SeqCst);
        }
    }
}

fn spawn_watcher_handoff_owner(owner: &WatcherHandoffOwner) -> Result<(), String> {
    if !owner.ready || owner.generation.trim().is_empty() {
        return Err("Новый владелец фонового агента ещё не опубликован.".into());
    }
    let exe = PathBuf::from(&owner.executable);
    if !exe.is_file() {
        return Err(format!(
            "Новый исполняемый файл фонового агента не найден: {}",
            exe.display()
        ));
    }
    let mut command = std::process::Command::new(&exe);
    command
        .arg("--background-watch")
        .arg(format!("--watcher-handoff={}", owner.generation))
        .stdin(std::process::Stdio::null())
        .stdout(std::process::Stdio::null())
        .stderr(std::process::Stdio::null());
    #[cfg(target_os = "windows")]
    {
        use std::os::windows::process::CommandExt;
        const CREATE_NO_WINDOW: u32 = 0x0800_0000;
        command.creation_flags(CREATE_NO_WINDOW);
    }
    command
        .spawn()
        .map(|_| ())
        .map_err(|error| format!("Не удалось запустить нового владельца фонового агента: {error}"))
}

fn reconcile_watcher_owner_after_update(app: &tauri::AppHandle) -> Result<bool, String> {
    let config_path = watcher_config_path(app)?;
    if !config_path.is_file() {
        return Ok(false);
    }
    let previous_bytes = std::fs::read(&config_path)
        .map_err(|error| format!("Не удалось прочитать настройки фонового агента: {error}"))?;
    let mut runtime: WatcherRuntimeConfig = serde_json::from_slice(&previous_bytes)
        .map_err(|error| format!("Настройки фонового агента повреждены: {error}"))?;
    let exe = std::env::current_exe().map_err(|error| error.to_string())?;
    let (_, _, current_sha256) = file_content_signature(&exe)?;
    if runtime
        .handoff_owner
        .as_ref()
        .is_some_and(|owner| watcher_handoff_owner_matches_current(owner, &exe, &current_sha256))
    {
        return Ok(false);
    }

    let mut owner = current_watcher_handoff_owner(&exe, false)?;
    runtime.handoff_owner = Some(owner.clone());
    atomic_write_file(
        &config_path,
        &serde_json::to_vec_pretty(&runtime).map_err(|error| error.to_string())?,
    )?;

    if let Err(error) = write_autostart_entries(&exe) {
        atomic_write_file(&config_path, &previous_bytes).map_err(|rollback| {
            format!("{error}; не удалось восстановить прежние настройки watcher: {rollback}")
        })?;
        return Err(error);
    }

    owner.ready = true;
    runtime.handoff_owner = Some(owner.clone());
    if let Err(error) = atomic_write_file(
        &config_path,
        &serde_json::to_vec_pretty(&runtime).map_err(|serialization| serialization.to_string())?,
    ) {
        let rollback = atomic_write_file(&config_path, &previous_bytes);
        return match rollback {
            Ok(()) => Err(error),
            Err(rollback_error) => Err(format!(
                "{error}; не удалось восстановить прежние настройки watcher: {rollback_error}"
            )),
        };
    }

    // If no old watcher is alive, this process becomes owner immediately. If an
    // old handoff-aware watcher still owns the singleton, this attempt exits and
    // that old watcher starts the successor itself after its in-flight work drains.
    let _ = spawn_watcher_handoff_owner(&owner);
    let _ = append_audit_event(
        app,
        "watcher_update_handoff_published",
        "",
        &serde_json::json!({
            "generation": owner.generation,
            "executable": owner.executable,
            "executable_sha256": owner.executable_sha256,
        }),
    );
    Ok(true)
}

fn start_configured_background_watcher(
    app: tauri::AppHandle,
    expected_generation: Option<&str>,
) -> Result<(), String> {
    let config_path = watcher_config_path(&app)?;
    let bytes = std::fs::read(&config_path).map_err(|error| error.to_string())?;
    let config: WatcherRuntimeConfig = serde_json::from_slice(&bytes)
        .map_err(|error| format!("Настройки фонового агента повреждены: {error}"))?;
    if let Some(expected) = expected_generation {
        let owner = config
            .handoff_owner
            .as_ref()
            .ok_or_else(|| "Handoff-владелец не опубликован.".to_string())?;
        if !owner.ready || owner.generation != expected {
            return Err("Запуск устаревшего поколения фонового агента отменён.".into());
        }
    }
    start_watcher_thread(app, config, true).map(|_| ())
}

