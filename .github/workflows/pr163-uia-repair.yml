name: PR 163 one-shot UIA repair

on:
  push:
    branches:
      - agent/final-adversarial-windows-hardening

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch stale WebView2 UIA probe
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('tests/installer/windows_installer_contract.ps1')
          s = p.read_text(encoding='utf-8')
          start_marker = "  try {\n    $recoveryAlert = Wait-UiElement -Description 'visible output-root recovery alert'"
          end_marker = "  Write-Host 'ADVERSARIAL OK: output-root collision stayed fail-closed and visible.'"
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('repair anchors are not unique')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = base64.b64decode('').decode('utf-8')
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8', newline='\n')
          assert p.read_text(encoding='utf-8').count('$currentBlockedWindow') == 3
          assert p.read_text(encoding='utf-8').count('$diagnosticWindow') == 3
          PY
      - name: Remove one-shot workflow and refresh provenance
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr163-uia-repair.yml
          rm -f verification/ci/SOURCE_MANIFEST_SHA256.generated.txt verification/ci/source-manifest-report.json
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json || true
          test -s verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          rm -f verification/ci/SOURCE_MANIFEST_SHA256.generated.txt verification/ci/source-manifest-report.json
          python scripts/verify_source_manifest.py --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt --json-report verification/ci/source-manifest-report.json
          rm -f verification/ci/SOURCE_MANIFEST_SHA256.generated.txt verification/ci/source-manifest-report.json
          git diff --check
          test "$(git hash-object tests/installer/windows_installer_contract.ps1)" = "80991e58962a1ba6d85be163d12d020497699fb0"
          test "$(git hash-object SOURCE_MANIFEST_SHA256.txt)" = "02e869bb12654a92e62259040f6cfad001d8d057"
      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/installer/windows_installer_contract.ps1 SOURCE_MANIFEST_SHA256.txt
          git status --short
          git commit -m 'Stabilize Windows output-root recovery UIA probe'
          git push origin HEAD:agent/final-adversarial-windows-hardening
