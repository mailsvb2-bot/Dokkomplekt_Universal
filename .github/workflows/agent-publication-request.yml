name: Validate atomic publication API

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-publication-request
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/fix-critical-crash-consistency
          fetch-depth: 0
      - run: python .github/patches/agent-publication-request.py
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all
      - run: cargo test -p dokkomplekt-storage
      - run: cargo clippy -p dokkomplekt-storage --all-targets -- -D warnings
      - run: git diff --check
      - name: Commit validated API
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/agent-publication-request.py .github/workflows/agent-publication-request.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine atomic template publication API"
          git fetch origin agent/fix-critical-crash-consistency
          git rebase origin/agent/fix-critical-crash-consistency
          git push origin HEAD:agent/fix-critical-crash-consistency
