name: PR178 mail-merge contract finalizer

on:
  push:
    branches:
      - ops/pr178-bundle-memory-finalize-20260908

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/real-user-workflow-20260907
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update stale mail-merge snapshot contract and run full Python contour
        shell: bash
        run: |
          set -euo pipefail
          expected_head='4276c82205763915f542fb86c3f76bac8b532c7c'
          test "$(git rev-parse HEAD)" = "$expected_head"

          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v18_4_6_mail_merge_snapshot_consistency.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert "TemplateSnapshot::capture(app, configured_path, button_label)" in helper\n    assert "extract_docx_text(snapshot.path())" in helper\n    assert "resolve_user_path" not in helper\n'''
          new = '''    assert "TemplateSnapshot::capture_generation(app, document)" in helper\n    assert "extract_docx_text(snapshot.path())" in helper\n    assert "TemplateSnapshot::capture(app, configured_path, button_label)" not in helper\n    assert "resolve_user_path" not in helper\n'''
          assert text.count(old) == 1, 'mail-merge snapshot contract changed unexpectedly'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python -m pip install -r requirements-dev.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt || true
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          python scripts/run_python_contracts_sharded.py --report /tmp/python-contracts.json
          python scripts/static_quality_gate.py --source-only
          git diff --check

          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git add SOURCE_MANIFEST_SHA256.txt tests/test_v18_4_6_mail_merge_snapshot_consistency.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Update mail merge snapshot contract for generation templates'
          git push origin HEAD:fix/real-user-workflow-20260907
