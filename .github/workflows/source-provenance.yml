name: Source Provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-manifest:
    name: Source manifest matches tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply atomic catastrophic hardening patch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dokkomplekt-patch
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          shas = [
              "2c43a9946162e5e5cac25fd709d4bc796d8c50c4",
              "5c73b92c402220f8d8b44c48122a2ef71b85a846",
              "ff9f307d4a37d8b92a59b3499b9c6d89f981d9b9",
              "8f38cea823356f2cf85bb251738ad115882000c8",
              "78733911375b38a9ffb739a005eb3d8c074f052b",
              "e01fd54048b35e909c353d3134248da065ab8b01",
          ]
          root = Path('/tmp/dokkomplekt-patch')
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          chunks = []
          for index, sha in enumerate(shas):
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              chunk = base64.b64decode(payload['content'])
              path = root / f'chunk-{index:02d}'
              path.write_bytes(chunk)
              chunks.append(chunk)
          (root / 'product.patch.gz.b64').write_bytes(b''.join(chunks))
          PY
          base64 -d /tmp/dokkomplekt-patch/product.patch.gz.b64 | gzip -dc > /tmp/dokkomplekt-patch/product.patch
          git apply --check /tmp/dokkomplekt-patch/product.patch
          git apply /tmp/dokkomplekt-patch/product.patch
          python scripts/audit_rust_production_panics.py
          python -m pytest -q tests/test_v18_0_3_regression_contracts.py tests/test_source_archive_virtualenv_exclusion.py
          python scripts/static_quality_gate.py --source-only
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          module_path = root / 'scripts' / 'build_source_archive.py'
          spec = importlib.util.spec_from_file_location('build_source_archive', module_path)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load build_source_archive')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          (root / module.SOURCE_MANIFEST).write_bytes(module.source_manifest_payload())
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/dokkomplekt-docx/src/lib.rs \
            crates/dokkomplekt-storage/src/lib.rs \
            src-tauri/Cargo.toml \
            src-tauri/src/main.rs \
            src-tauri/src/subsystems/automation_runtime.rs \
            src-tauri/src/subsystems/document_commands.rs \
            src-tauri/src/subsystems/watcher_commands.rs \
            src-tauri/src/universal_intake.rs \
            src/App.tsx \
            src/App.test.tsx \
            src/lib/types.ts \
            tests/test_v18_0_3_regression_contracts.py \
            SOURCE_MANIFEST_SHA256.txt
          python - <<'PY'
          import subprocess
          expected = {
              'SOURCE_MANIFEST_SHA256.txt',
              'crates/dokkomplekt-docx/src/lib.rs',
              'crates/dokkomplekt-storage/src/lib.rs',
              'src-tauri/Cargo.toml',
              'src-tauri/src/main.rs',
              'src-tauri/src/subsystems/automation_runtime.rs',
              'src-tauri/src/subsystems/document_commands.rs',
              'src-tauri/src/subsystems/watcher_commands.rs',
              'src-tauri/src/universal_intake.rs',
              'src/App.tsx',
              'src/App.test.tsx',
              'src/lib/types.ts',
              'tests/test_v18_0_3_regression_contracts.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged files: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}')
          PY
          git commit -m "fix: fail closed on catastrophic input and state failures"
          git push origin "HEAD:${BRANCH}"
      - name: Generate candidate and compare with checked-in manifest
        id: manifest
        continue-on-error: true
        run: |
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json
      - name: Upload source-manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-candidate
          path: |
            verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
            verification/ci/source-manifest-report.json
          if-no-files-found: error
      - name: Synchronize manifest on same-repository pull request
        if: >-
          steps.manifest.outcome != 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(provenance): regenerate source manifest"
          git push origin "HEAD:${BRANCH}"
      - name: Enforce source-manifest integrity
        if: steps.manifest.outcome != 'success'
        run: |
          cat verification/ci/source-manifest-report.json
          exit 1
