name: E2 observed selection exact-tree transport

on:
  push:
    branches: [canon-v2/e2-template-learning-proof]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: canon-v2/e2-template-learning-proof
          fetch-depth: 2
      - name: Materialize exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='2b09c10a5a0e521d63be24e7a55ca3d7a071148d'
          expected_tree='239457b398c57dce8827daa1c912c5b801791474'
          expected_payload_sha='41a5e9d5d9a3d694b29ef2a84b7539c149012d4caa498c6b4481bc4aaa8be391'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          printf '%s' '' | base64 -d > /tmp/payload.patch.gz
          test "$(sha256sum /tmp/payload.patch.gz | cut -d' ' -f1)" = "$expected_payload_sha"
          gzip -dc /tmp/payload.patch.gz > /tmp/payload.patch
          git reset --hard HEAD^
          git apply /tmp/payload.patch
          git add SOURCE_MANIFEST_SHA256.txt tests/installer/windows_installer_contract.ps1 tests/test_windows_installed_generation_contract.py
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"
          git config user.name 'Dokkomplekt CI'
          git config user.email 'dokkomplekt-ci@users.noreply.github.com'
          git commit -m 'test: observe E2 learning file acceptance'
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          git push origin HEAD:canon-v2/e2-template-learning-proof
