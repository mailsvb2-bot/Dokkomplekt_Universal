name: Deep donor parity fix once

on:
  push:
    branches: [fix/medical-diary-source-parity-20260815]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/medical-diary-source-parity-20260815
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply audited parity fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if n != 1: raise SystemExit(f'{path}: literal matches={n}: {old[:90]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          def sub_once(path, pattern, repl):
              p=Path(path); text=p.read_text(encoding='utf-8')
              out,n=re.subn(pattern,repl,text,count=1,flags=re.MULTILINE)
              if n != 1: raise SystemExit(f'{path}: regex matches={n}: {pattern[:90]!r}')
              p.write_text(out,encoding='utf-8')

          path='crates/dokkomplekt-core/src/domains/mod.rs'
          marker='pub mod medical_semantics;\n'
          addition=dedent('''

          /// Build an ephemeral case for one document render. Profession-specific legacy
          /// compatibility remains behind the domain boundary and never rewrites stored data.
          pub fn case_for_document_render(
              case: &crate::SemanticCase,
              category: &crate::DomainKind,
              role_id: &str,
          ) -> crate::SemanticCase {
              match category {
                  crate::DomainKind::Medical =>
                      medical_semantics::case_for_medical_document_render(case, role_id),
                  _ => case.clone(),
              }
          }

          #[cfg(test)]
          mod render_case_tests {
              use super::*;
              use crate::{SemanticCase, SemanticValue, ValueSource};
              fn put(case: &mut SemanticCase, field_id: &str, value: &str) {
                  case.values.insert(field_id.to_string(),
                      SemanticValue::new(field_id, value, ValueSource::UserConfirmed, 1.0));
              }
              #[test]
              fn document_render_scopes_medical_role_without_medicalizing_other_domains() {
                  let mut case=SemanticCase::default();
                  put(&mut case, medical_semantics::VK_MSE_PROTOCOL_NUMBER, "MSE-10");
                  let medical=case_for_document_render(&case,&crate::DomainKind::Medical,"vk_mse");
                  let legal=case_for_document_render(&case,&crate::DomainKind::Legal,"vk_mse");
                  assert_eq!(medical.get("medical.protocol_number"),Some("MSE-10"));
                  assert_eq!(legal.get("medical.protocol_number"),None);
                  assert_eq!(case.get("medical.protocol_number"),None);
              }
          }
          ''').lstrip('\n')
          replace_once(path,marker,marker+addition)

          path='src-tauri/src/subsystems/document_commands.rs'
          pattern=r'''(?m)^(?P<i>\s*)let render_result = render_docx_with_assets\(\n(?P=i)    &app,\n(?P=i)    template_snapshot\.path\(\),\n(?P=i)    &reservation\.path,\n(?P=i)    &hydrated\.case,\n(?P=i)    req\.strict,\n(?P=i)    permit\.watermark\.as_deref\(\),\n(?P=i)\);'''
          def single(m):
              i=m.group('i')
              return (f'{i}let render_case = dokkomplekt_core::domains::case_for_document_render(\n'
                      f'{i}    &hydrated.case,\n{i}    &doc.category,\n{i}    &doc.role_id,\n{i});\n'
                      f'{i}let render_result = render_docx_with_assets(\n{i}    &app,\n{i}    template_snapshot.path(),\n'
                      f'{i}    &reservation.path,\n{i}    &render_case,\n{i}    req.strict,\n{i}    permit.watermark.as_deref(),\n{i});')
          p=Path(path); text=p.read_text(encoding='utf-8'); out,n=re.subn(pattern,single,text,count=1)
          if n != 1: raise SystemExit(f'{path}: single seam matches={n}')
          p.write_text(out,encoding='utf-8')

          pattern=r'''(?m)^(?P<i>\s*)if let Err\(error\) = render_docx_with_assets\(\n(?P=i)    &app,\n(?P=i)    template_snapshot\.path\(\),\n(?P=i)    &reservation\.path,\n(?P=i)    &hydrated\.case,\n(?P=i)    req\.strict,\n(?P=i)    permit\.watermark\.as_deref\(\),\n(?P=i)\) \{'''
          def batch(m):
              i=m.group('i')
              return (f'{i}let render_case = dokkomplekt_core::domains::case_for_document_render(\n'
                      f'{i}    &hydrated.case,\n{i}    &document.category,\n{i}    &document.role_id,\n{i});\n'
                      f'{i}if let Err(error) = render_docx_with_assets(\n{i}    &app,\n{i}    template_snapshot.path(),\n'
                      f'{i}    &reservation.path,\n{i}    &render_case,\n{i}    req.strict,\n{i}    permit.watermark.as_deref(),\n{i}) {{')
          p=Path(path); text=p.read_text(encoding='utf-8'); out,n=re.subn(pattern,batch,text,count=1)
          if n != 1: raise SystemExit(f'{path}: batch seam matches={n}')
          p.write_text(out,encoding='utf-8')
          sub_once(path,r'(?m)^fn ensure_rendered_document_complete\(','pub(super) fn ensure_rendered_document_complete(')

          path='src-tauri/src/subsystems/automation_runtime.rs'
          pattern=r'''(?m)^(?P<i>\s*)render_docx_with_assets\(\n(?P=i)    app,\n(?P=i)    template_snapshot\.path\(\),\n(?P=i)    &out_path,\n(?P=i)    &hydrated\.case,\n(?P=i)    true,\n(?P=i)    permit\.watermark\.as_deref\(\),\n(?P=i)\)\n(?P=i)\.map_err\(\|e\| format!\("Не создан «\{\}»: \{e\}", doc\.button_label\)\)\?;\n(?P=i)rerendered_documents = rerendered_documents\.saturating_add\(1\);'''
          def zero(m):
              i=m.group('i')
              return (f'{i}let render_case = dokkomplekt_core::domains::case_for_document_render(\n'
                      f'{i}    &hydrated.case,\n{i}    &doc.category,\n{i}    &doc.role_id,\n{i});\n'
                      f'{i}render_docx_with_assets(\n{i}    app,\n{i}    template_snapshot.path(),\n{i}    &out_path,\n'
                      f'{i}    &render_case,\n{i}    true,\n{i}    permit.watermark.as_deref(),\n{i})\n'
                      f'{i}.map_err(|e| format!("Не создан «{{}}»: {{e}}", doc.button_label))?;\n'
                      f'{i}super::document_commands::ensure_rendered_document_complete(\n'
                      f'{i}    doc,\n{i}    &template_text,\n{i}    &hydrated.case,\n{i}    &out_path,\n{i})?;\n'
                      f'{i}rerendered_documents = rerendered_documents.saturating_add(1);')
          p=Path(path); text=p.read_text(encoding='utf-8'); out,n=re.subn(pattern,zero,text,count=1)
          if n != 1: raise SystemExit(f'{path}: zero-touch seam matches={n}')
          p.write_text(out,encoding='utf-8')

          path='src/lib/appSupport.ts'
          replace_once(path,"export const OUTPUT_PREFS_KEY = 'dokkomplekt.output-folder-parts.v1';\n",
              "export const OUTPUT_PREFS_KEY = 'dokkomplekt.output-folder-parts.v1';\nexport const OUTPUT_ROOT_KEY = 'dokkomplekt.output-root.v1';\n")
          marker='export function loadOutputFolderParts(): FolderNamePartDto[] {'
          helper=dedent('''
          export function loadOutputRoot(): string {
            try {
              const value = localStorage.getItem(OUTPUT_ROOT_KEY)?.trim();
              if (value) return value;
            } catch { /* use generic local default */ }
            return 'output/Готовые документы';
          }
          export function saveOutputRoot(value: string): void {
            const normalized = value.trim();
            if (!normalized) return;
            try { localStorage.setItem(OUTPUT_ROOT_KEY, normalized); } catch { /* storage may be unavailable */ }
          }

          ''').lstrip('\n')
          replace_once(path,marker,helper+marker)

          path='src/App.tsx'
          sub_once(path,r'loadOutputFolderParts,\n','loadOutputFolderParts, loadOutputRoot,\n')
          sub_once(path,r'readFileBytes,\n','readFileBytes, saveOutputRoot,\n')
          replace_once(path,"  const [outputRoot, setOutputRoot] = useState('output/Готовые документы');\n",
                            "  const [outputRoot, setOutputRoot] = useState(loadOutputRoot);\n")
          sub_once(path,r'(?m)^  useEffect\(\(\) => \{\n    void updateBackgroundWatcherPreferences\(autoPrint, printCopies\)\.catch',
              '  useEffect(() => {\n    saveOutputRoot(outputRoot);\n  }, [outputRoot]);\n\n  useEffect(() => {\n    void updateBackgroundWatcherPreferences(autoPrint, printCopies).catch')

          path='src/lib/appSupport.selection.test.ts'
          replace_once(path,"import { shouldSelectDocumentByDefault } from './appSupport';\n",
              "import { loadOutputRoot, OUTPUT_ROOT_KEY, saveOutputRoot, shouldSelectDocumentByDefault } from './appSupport';\n")
          marker="describe('default document selection', () => {"
          tests=dedent('''
          describe('output root persistence', () => {
            it('remembers the user-selected generic output folder across restarts', () => {
              localStorage.removeItem(OUTPUT_ROOT_KEY);
              expect(loadOutputRoot()).toBe('output/Готовые документы');
              saveOutputRoot('  D:/Работа/Готовые документы  ');
              expect(loadOutputRoot()).toBe('D:/Работа/Готовые документы');
            });
            it('does not replace a remembered folder with an empty edit', () => {
              localStorage.setItem(OUTPUT_ROOT_KEY, 'C:/Documents/Ready');
              saveOutputRoot('   ');
              expect(loadOutputRoot()).toBe('C:/Documents/Ready');
            });
          });

          ''').lstrip('\n')
          replace_once(path,marker,tests+marker)
          PY
          cargo fmt --all
          rm .github/workflows/deep-donor-parity-fix-once.yml
      - name: Targeted Rust regression
        run: cargo test -p dokkomplekt-core document_render_scopes_medical_role_without_medicalizing_other_domains
      - name: Targeted UI regression
        run: |
          npm ci
          npx vitest run --config vitest.config.ts src/lib/appSupport.selection.test.ts
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Compile Tauri runtime paths
        run: cargo check -p dokkomplekt-tauri
      - name: Commit audited fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve donor document completion contracts"
          git push origin HEAD:fix/medical-diary-source-parity-20260815
