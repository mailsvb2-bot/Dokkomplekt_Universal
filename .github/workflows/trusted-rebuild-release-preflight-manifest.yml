name: Trusted rebuild release preflight manifest

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-production-release-preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/harden-production-release-preflight
          fetch-depth: 0
      - name: Rebuild source manifest and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/patches/rebuild-release-preflight-manifest.trigger
          python scripts/verify_source_manifest.py --candidate "$RUNNER_TEMP/source-manifest.txt" || true
          mv "$RUNNER_TEMP/source-manifest.txt" SOURCE_MANIFEST_SHA256.txt
          git rm .github/patches/rebuild-release-preflight-manifest.trigger
          git add SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Rebuild source manifest for release preflight hardening"
          git push origin HEAD:agent/harden-production-release-preflight
