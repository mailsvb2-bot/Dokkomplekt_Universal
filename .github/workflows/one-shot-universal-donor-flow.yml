name: One-shot Universal Donor User Flow

on:
  push:
    branches:
      - agent/universal-donor-user-flow-20260819

permissions:
  contents: write

concurrency:
  group: one-shot-universal-donor-user-flow
  cancel-in-progress: true

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: agent/universal-donor-user-flow-20260819
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Linux Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Apply donor user-flow closure
        run: python scripts/apply_universal_donor_user_flow.py
      - name: Format Rust
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Frontend regression
        run: |
          npm ci
          npm run typecheck
          npm test -- --run src/App.test.tsx
      - name: Rust source-copy regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml retained_uploaded_source_tests -- --nocapture
      - name: Compile the complete Rust workspace
        run: cargo check --workspace --all-targets --locked
      - name: Source-quality gate
        run: python scripts/static_quality_gate.py --source-only
      - name: Remove one-shot machinery and regenerate provenance
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_universal_donor_user_flow.py
          rm .github/workflows/one-shot-universal-donor-flow.yml
          python scripts/verify_source_manifest.py \
            --candidate verification/ci/SOURCE_MANIFEST_SHA256.generated.txt \
            --json-report verification/ci/source-manifest-report.json || true
          test -s verification/ci/SOURCE_MANIFEST_SHA256.generated.txt
          cp verification/ci/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          rm -f verification/ci/SOURCE_MANIFEST_SHA256.generated.txt verification/ci/source-manifest-report.json
          python scripts/verify_source_manifest.py
      - name: Publish integrated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Restore universal donor user-flow invariants"
          git push origin HEAD:agent/universal-donor-user-flow-20260819
