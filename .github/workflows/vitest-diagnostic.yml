name: Apply Vitest Fix

on:
  pull_request:
    paths:
      - '.github/workflows/vitest-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ui/client-first-neutral'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update neutral table placeholder test and remove diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.scenarios.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "getByPlaceholderText(/ФИО;contract\\.number/)"
          new = "getByPlaceholderText(/Наименование;document\\.number/)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy table placeholder selector, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/vitest-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.scenarios.test.tsx .github/workflows/vitest-diagnostic.yml
          git commit -m 'test(ui): use neutral table placeholder'
          git push origin "HEAD:${{ github.head_ref }}"
