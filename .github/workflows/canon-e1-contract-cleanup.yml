name: Canon E1 contract cleanup one-shot

on:
  push:
    branches:
      - canon-v2/e1-accounting-pipeline
    paths:
      - .github/workflows/canon-e1-contract-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact E1 contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo '3b36d5f1417d089206e21825560beca4a198d304efbd59da55f0e5308d829481  .github/e1-contract-cleanup.patch' | sha256sum -c -
          git apply --check .github/e1-contract-cleanup.patch
          git apply .github/e1-contract-cleanup.patch
          cargo fmt --all
          git diff --check
      - name: Verify production panic audit and receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_rust_production_panics.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_e1_generation_completion_receipt_contract.py')
          for name, value in ns.items():
              if name.startswith('test_') and callable(value):
                  value()
          print('E1 receipt static contract PASS')
          PY
      - name: Canonicalize source manifest, self-delete, and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/e1-contract-cleanup.patch .github/workflows/canon-e1-contract-cleanup.yml
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.generated.txt --json-report /tmp/source-manifest-before.json || true
          test -s /tmp/SOURCE_MANIFEST_SHA256.generated.txt
          cp /tmp/SOURCE_MANIFEST_SHA256.generated.txt SOURCE_MANIFEST_SHA256.txt
          python scripts/verify_source_manifest.py --candidate /tmp/SOURCE_MANIFEST_SHA256.check.txt --json-report /tmp/source-manifest-check.json
          python - <<'PY'
          import subprocess
          allowed = {
              'SOURCE_MANIFEST_SHA256.txt',
              'src-tauri/src/subsystems/process_blueprints.rs',
              'tests/test_e1_generation_completion_receipt_contract.py',
              '.github/e1-contract-cleanup.patch',
              '.github/workflows/canon-e1-contract-cleanup.yml',
          }
          changed = {line[3:] for line in subprocess.check_output(['git','status','--short'], text=True).splitlines() if line.strip()}
          extra = changed - allowed
          assert not extra, f'unexpected files changed: {sorted(extra)}'
          missing = allowed - changed
          assert not missing, f'expected changes missing: {sorted(missing)}'
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E1: align receipt contracts with hardened publication'
          git push origin HEAD:canon-v2/e1-accounting-pipeline
