          )

          # Plain-text intake keeps UTF-8/UTF-16 but restores predecessor CP1251
          # compatibility instead of mojibake Latin-1 byte widening.
          replace(
              'src-tauri/src/universal_intake.rs',
              '''fn decode_text_bytes(bytes: &[u8]) -> String {
    if bytes.starts_with(&[0xFF, 0xFE]) {''',
              '''fn decode_text_bytes(bytes: &[u8]) -> String {
    if let Some(without_bom) = bytes.strip_prefix(&[0xEF, 0xBB, 0xBF]) {
        if let Ok(text) = std::str::from_utf8(without_bom) {
            return text.to_string();
        }
    }
    if bytes.starts_with(&[0xFF, 0xFE]) {'''
          )
          replace(
              'src-tauri/src/universal_intake.rs',
              '''    String::from_utf8(bytes.to_vec())
        .unwrap_or_else(|_| bytes.iter().map(|byte| *byte as char).collect())
}''',
              '''    if let Ok(text) = std::str::from_utf8(bytes) {
